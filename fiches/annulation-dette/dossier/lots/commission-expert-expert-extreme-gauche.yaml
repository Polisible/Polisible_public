  sourcées si besoin). Tu peux contester une fois l''examen de tes thèses (contestations : these, critere, nature
  fait|raisonnement, contenu, sources). Pas de contestation de valeur.'
relances:
- these: T19
  partis:
  - NPA
  question_posee: Votre thèse T19 présuppose que la dette française a été construite par des cadeaux fiscaux, ce
    que le dossier n'établit pas (F43 est une valeur). Avez-vous une source officielle ou universitaire ? Que répondez-vous
    à T15 (A50) ?
  id: R18
  statut: posee
- these: T26
  partis:
