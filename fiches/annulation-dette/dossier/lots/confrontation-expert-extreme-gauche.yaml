- id: A13
  auteur: expert-extreme-droite
  question: Q43
  position: contre
  enonce: 'Annuler ou geler cette dette ne réduirait pas durablement la charge nette de l''État : ce que l''État
    économise en intérêts, il le perd en recettes versées par la Banque de France.'
  raisonnement: 'L''État est à la fois débiteur (intérêts payés) et bénéficiaire du résultat de la Banque de France
    (dividende, impôt sur les bénéfices). Si les intérêts disparaissent, le résultat de la Banque de France baisse
    d''autant, donc ses versements à l''État aussi : sur l''ensemble État plus Banque de France, le gain serait
    faible ou nul. La Banque de France verse déjà à l''État des montants importants (36,8 Md€ depuis 2015), qui
    seraient réduits.'
  porte_par:
  - qui: Jordan Bardella, président du RN, réponse publiée sur X à Matthieu Pigasse (23 août 2026, rapportée par
      la presse)
    parti: RN
    source: S29
  repond_a: null
  statut: ouvert
  affirmations:
  - id: F41
    enonce: Les intérêts que l'État paie à la Banque de France sur les titres qu'elle détient contribuent à son
      résultat, dont une part revient à l'État (dividende et impôt).
    type: estimation
    verdict: Pas d'estimation fiable
    explication: 'La seule source (site de niveau 4, analyse assistée par IA, 24 août 2026) est non conforme : elle
      rapporte un argument de Jordan Bardella sans établir le mécanisme ni mentionner l''impôt. Les documents de
      la Banque de France au dossier (F19, F20, F21) établissent que la Banque verse un impôt et des dividendes
      à l''État et que son revenu monétaire est partagé dans l''Eurosystème, mais aucune source rattachée n''isole
      la part due aux intérêts sur les titres de l''État.'
    sources:
    - source: S29
      extrait: Il a argué que la Banque de France étant détenue par l'État, les intérêts versés sont reversés sous
        forme de dividendes.
      statut_source: non-conforme
  - id: F19
    enonce: Pour l'exercice 2025, la Banque de France verse un impôt sur les bénéfices de 1,5 milliard d'euros avant
      d'atteindre un résultat net de 8,1 milliards (Q43).
    type: fait
    verdict: Vrai
    explication: Le document de la Banque de France sur les comptes annuels de l'exercice 2025 (mars 2026) indique
      un impôt sur les bénéfices de 1,5 Md€ et un résultat net de 8,1 Md€ ; il concorde avec le communiqué du 24
      mars 2026 (F18).
    sources:
    - source: S7
      extrait: Après paiement de l'impôt sur les bénéfices (1,5 milliard d'euros), le résultat net ressort à 8,1
        milliards d'euros.
      statut_source: conforme
  - id: F20
    enonce: 'La Banque de France est un contributeur au budget de l''État : 36,8 milliards d''euros versés depuis
      2015 (Q43).'
    type: fait
    verdict: Vrai
    explication: 'Le document de la Banque de France sur l''exercice 2025 (mars 2026) indique 36,8 Md€ versés au
      budget de l''État depuis 2015. Ce total couvre 2015-2025 et réunit impôt sur les sociétés, dividendes et restitution
      d''excédents : la fiche doit préciser cette composition.'
    sources:
    - source: S7
      extrait: avec un total de 36,8 milliards d'euros versés depuis 2015
      statut_source: conforme
- id: A14
  auteur: expert-extreme-droite
  question: Q47
  position: contre
  enonce: 'Pour dégager des marges budgétaires, l''annulation de dette n''est pas préférable : la voie retenue par
    le RN est la réduction des dépenses, dont l''immigration, jointe à une règle d''or votée par référendum.'
  raisonnement: La charge de la dette (65,7 Md€ en 2025) pèse sur le budget parce que le déficit continue d'alimenter
    la dette ; seule une baisse durable du déficit la stabilise. Le plan du RN fait des économies la condition du
    retour de la dette sous 112 % du PIB en 2032, et la règle d'or vise à rendre cet effort contraignant. Une annulation
    de la part détenue par l'Eurosystème ne traiterait pas la cause du déficit.
  porte_par:
  - qui: Marine Le Pen, candidate du RN à la présidentielle 2027
    parti: RN
    source: S31
  - qui: Marine Le Pen, tribune sur la règle d'or (1er octobre 2026)
    parti: RN
    source: S32
  repond_a: null
  statut: ouvert
  affirmations:
  - id: F22
    enonce: En 2025, la charge de la dette de l'ensemble des administrations publiques atteint 65,7 milliards d'euros,
      soit 2,2 points de PIB (Cour des comptes, juin 2026) (Q43).
    type: fait
    verdict: Vrai
    explication: La synthèse du rapport de la Cour des comptes sur la situation et les perspectives des finances
      publiques (juin 2026) chiffre la charge de la dette de l'ensemble des administrations publiques à 65,7 Md€
      en 2025, soit 2,2 points de PIB, en hausse de plus de 9 % par rapport à 2024.
    sources:
    - source: S11
      extrait: 65,7 Md€ (2,2 points de PIB), soit une
      statut_source: conforme
  - id: F37
    enonce: Le RN propose, dans son plan présenté le 6 octobre 2026, 140 milliards d'euros d'économies d'ici 2032,
      pour ramener la dette de 121 % du PIB en 2027 à 112 % en 2032.
    type: fait
    verdict: Vrai
    explication: 'Déclaration vérifiée : Public Sénat (Stéphane Duguet, 6 octobre 2026) rapporte que le plan présenté
