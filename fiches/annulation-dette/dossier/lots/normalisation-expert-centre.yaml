consigne: 'Mets tes éléments au format de docs/format-fiche.md (§ 3, 5, 10) par des `corrections` : position oui/non/nuance
  par rapport à la question ; porte_par complet (personne, fonction au moment de la déclaration, parti en sigle,
  date, source, appartenance si la source ne l''établit pas) ; valeurs : « Priorité à… » + porte_par, sinon retirer.
  Mets normalise: true dans chaque correction.'
questions:
  Q41: Les traités européens permettent-ils d'annuler, ou de convertir en dette perpétuelle à taux nul, la dette
    française détenue par la Banque de France pour l'Eurosystème ?
  Q42: Annuler ou geler cette dette ferait-il monter les taux auxquels la France emprunte ?
  Q43: L'opération réduirait-elle durablement la charge d'intérêts de l'État, compte tenu des intérêts que la Banque
    de France reverse à l'État ?
  Q44: Annuler ou geler cette dette affaiblirait-il la crédibilité de l'euro ou l'indépendance de la BCE ?
  Q45: Un État doit-il rembourser intégralement sa dette, y compris quand le créancier est sa propre banque centrale
    ?
  Q46: Les décisions sur la dette publique doivent-elles relever de la seule décision nationale plutôt que des règles
    européennes ?
  Q47: Pour dégager des marges budgétaires, l'annulation d'une partie de la dette est-elle préférable aux économies,
    à la hausse des recettes ou à la recherche de croissance ?
arguments:
- id: A1
  question: Q41
  position: non
  enonce: 'Selon Renaissance, les traités ne permettent pas cette opération : effacer ou geler à taux nul des titres
    que l''Eurosystème a rachetés reviendrait à faire financer l''État par sa banque centrale, ce que l''article
    123 interdit. Aucun texte ni arrêt n''a tranché ce cas précis (la contrariété aux traités reste une interprétation
    juridique disputée), et la décision ne relèverait de toute façon pas du gouvernement mais du conseil des gouverneurs.'
  raisonnement: 'L''article 123 interdit crédits et achats directs de dette aux États (F1, F2). La Cour a validé
    les rachats sur le marché secondaire (F8, F10), mais à condition de garanties contre le financement monétaire
    (F9) : les titres ont été achetés à des investisseurs (F24) et non offerts à l''État. Les annuler ou les convertir
    en perpétuel à taux nul reviendrait à donner à l''État, après coup, un avantage que le traité lui refuse au
    départ. Enfin, les décisions du SEBC appartiennent au conseil des gouverneurs (F5), qui ne peut recevoir d''instructions
    des gouvernements (F3) : un État ne peut ni l''ordonner ni modifier seul le cadre (F4).'
  porte_par:
  - parti: RE
    source: S16
    personne_ou_groupe_ancien: Roland Lescure, ministre de l'Économie (déclaration du 24 août 2026, BFMTV/RMC)
  a_normaliser:
  - position à confirmer (ancienne échelle pour/contre)
  - porteur à reformater (personne, fonction, date)
- id: A2
  question: Q42
  position: oui
  enonce: 'Les taux risquent de monter. Un État qui renonce unilatéralement à une part de sa dette, par une voie
    juridiquement contestée, signale aux prêteurs qu''il peut changer les règles ; ils demanderaient selon Renaissance
    et Horizons un taux plus élevé. Il s''agit d''une estimation sans chiffrage publié : aucune institution n''a
    estimé l''ampleur de la hausse.'
  raisonnement: La France emprunte à un taux déjà au plus haut depuis 2008 (F25) ; toute hausse supplémentaire se
    répercute sur l'ensemble de la dette renouvelée. L'opération, juridiquement contestée (F27), serait lue comme
    un défaut partiel ou un risque de rupture avec les règles de la zone euro. Les prêteurs, qui n'ont aucune raison
    de croire que le précédent ne se reproduira pas, réclameraient une prime de risque (F26), et l'accès aux marchés
    pourrait se compliquer. Le gain sur les intérêts de la dette gelée serait ainsi rogné par le surcoût sur la
    dette future.
  porte_par:
  - parti: RE
    source: S16
    personne_ou_groupe_ancien: Roland Lescure, ministre de l'Économie (déclaration du 24 août 2026, BFMTV/RMC)
  - parti: HOR
    source: S17
    personne_ou_groupe_ancien: Édouard Philippe (débat du Medef, 27 août 2026)
  a_normaliser:
  - position à confirmer (ancienne échelle pour/contre)
  - porteur à reformater (personne, fonction, date)
  - porteur à reformater (personne, fonction, date)
- id: A3
  question: Q44
  position: oui
  enonce: Selon Renaissance, oui. L'indépendance de la BCE repose sur l'interdiction faite aux gouvernements de
    lui donner des instructions ; lui imposer d'effacer ses actifs serait une instruction, et la crédibilité de
    l'euro repose sur le respect des règles communes. La compatibilité de l'opération avec les traités est disputée,
    mais une décision prise sans le conseil des gouverneurs poserait de toute façon la question de l'indépendance.
  raisonnement: Le traité interdit à la BCE et aux banques centrales nationales de solliciter ou d'accepter des
    instructions des gouvernements (F3) et oblige chaque État à rendre ses lois compatibles avec les traités (F4).
    Un État qui déciderait seul d'effacer des titres de l'Eurosystème, sans accord du conseil des gouverneurs (F5),
    afficherait que l'indépendance peut être levée par un gouvernement. Une monnaie commune n'a de valeur que si
    chaque membre applique les mêmes règles ; l'opération, jugée contraire aux traités (F27), reviendrait à n'en
    plus respecter les règles, avec un risque de défiance envers la signature des États et la monnaie.
  porte_par:
  - parti: RE
    source: S16
    personne_ou_groupe_ancien: Roland Lescure, ministre de l'Économie (déclaration du 24 août 2026, BFMTV/RMC)
  a_normaliser:
  - position à confirmer (ancienne échelle pour/contre)
  - porteur à reformater (personne, fonction, date)
- id: A4
  question: Q45
  position: oui
  enonce: 'Oui. Les titres détenus par la banque centrale sont des titres de l''État comme les autres : ils arrivent
    à échéance et sont remboursés, et les effacer unilatéralement porterait atteinte à la signature de la France.'
  raisonnement: 'Les titres ont été achetés sur le marché secondaire (F24) : la banque centrale a payé les vendeurs,
    et ses engagements envers eux demeurent. Distinguer les créanciers que l''on rembourse de ceux que l''on ne
    rembourse pas ferait de la parole de l''État un choix variable. Le respect intégral des engagements est ce qui
    permet à la France d''emprunter durablement (F25 : le coût de l''emprunt est déjà élevé).'
  porte_par:
  - parti: HOR
    source: S17
    personne_ou_groupe_ancien: 'Édouard Philippe (débat du Medef, 27 août 2026 : refus de toute annulation de dette)'
  - parti: RE
    source: S16
    personne_ou_groupe_ancien: Roland Lescure, ministre de l'Économie (déclaration du 24 août 2026)
  a_normaliser:
  - position à confirmer (ancienne échelle pour/contre)
  - porteur à reformater (personne, fonction, date)
  - porteur à reformater (personne, fonction, date)
- id: A5
  question: Q46
  position: non
  enonce: Non, selon Renaissance. Dans une union monétaire, la dette en euros et la banque centrale sont des biens
    communs ; les règles européennes limitent la décision nationale, et décider seul sur des titres détenus par
    l'Eurosystème reviendrait à s'affranchir des règles communes, ce que le gouvernement juge contraire aux traités
    (interprétation contestée par les signataires de la tribune de 2021).
  raisonnement: 'L''État a lui-même accepté les traités : il doit veiller à la compatibilité de sa législation avec
    eux (F4) et ne peut pas donner d''instructions à la banque centrale (F3). Une décision nationale unilatérale
    sur des titres détenus par l''Eurosystème engagerait les autres membres, qui supportent leur part du bilan commun.
    S''en affranchir sur ce sujet, c''est dire qu''on ne respecte plus les règles communes (F27).'
  porte_par:
  - parti: RE
    source: S16
    personne_ou_groupe_ancien: Roland Lescure, ministre de l'Économie (déclaration du 24 août 2026, BFMTV/RMC)
  a_normaliser:
  - position à confirmer (ancienne échelle pour/contre)
  - porteur à reformater (personne, fonction, date)
- id: A6
  question: Q47
  position: non
  enonce: 'Non. Le gain net de l''annulation pour l''État est incertain : la Banque de France lui verse déjà des
    bénéfices (impôt et dividendes) qui reposent en partie sur les intérêts qu''elle perçoit, sans qu''aucune source
    n''en chiffre la part. Équilibrer les comptes, alléger le coût du travail et soutenir la compétitivité sont
    les leviers retenus.'
  raisonnement: 'La Banque de France verse des sommes à l''État (F20, F19 : impôt de 1,5 milliard d''euros et résultat
    net de 8,1 milliards en 2025, F18). Si l''opération réduit les intérêts payés par l''État, elle réduit aussi
    ce que la banque lui verse, de sorte que la marge nette est inférieure au gain brut (voir Q43). Pour dégager
    une marge durable, les leviers sont les économies, un budget équilibré, et la croissance par la baisse du coût
    du travail.'
  porte_par:
  - parti: HOR
    source: S17
    personne_ou_groupe_ancien: 'Édouard Philippe (débat du Medef, 27 août 2026 : équilibrer les comptes, sans annulation)'
  - parti: RE
    source: S17
    personne_ou_groupe_ancien: 'Gabriel Attal (débat du Medef, 27 août 2026 : annuler les hausses du coût du travail
      depuis 2024)'
  a_normaliser:
  - position à confirmer (ancienne échelle pour/contre)
  - porteur à reformater (personne, fonction, date)
  - porteur à reformater (personne, fonction, date)
- id: A37
  question: Q41
  position: non
  enonce: 'L''absence du mot « annulation » dans les traités ne vaut pas autorisation : l''article 123 est appliqué
    selon son objet (éviter le financement monétaire des États), et les arrêts cités pour la compatibilité portent
    sur les achats, pas sur le sort ultérieur des titres.'
  raisonnement: 'F45 (le texte ne mentionne pas l''annulation) établit seulement un silence. F10 porte sur la validité
    de la décision 2015/774, donc sur les achats, et F9 montre que la Cour valide ces achats à condition de garanties
    contre le financement monétaire : elle raisonne par l''effet, non par la liste des actes interdits. Rien dans
    F8-F10 ne dit qu''effacer ou geler à taux nul des titres déjà détenus, au profit d''un État, respecte ces garanties.
    Enfin l''argument suppose une décision du conseil des gouverneurs (F5), alors que la proposition en débat est
    portée par un gouvernement et un parlement nationaux (F3).'
  porte_par:
  - parti: RE
    source: S16
    personne_ou_groupe_ancien: Roland Lescure, ministre de l'Économie (déclaration du 24 août 2026)
  a_normaliser:
  - position à confirmer (ancienne échelle pour/contre)
  - porteur à reformater (personne, fonction, date)
- id: A38
  question: Q42
  position: oui
  enonce: 'Limiter l''opération à la part de l''Eurosystème ne suffit pas à conclure que les taux ne bougent pas
    : un prêteur évalue aussi la fiabilité des règles, pas seulement le risque de non-paiement sur ses propres titres.'
  raisonnement: 'A22 passe de F46 (périmètre limité aux titres de l''Eurosystème) à F47 (aucun effet sur le coût
    d''emprunt). Or F46 décrit le périmètre, pas la réaction des prêteurs à un précédent juridiquement disputé,
    et F47 est une estimation sans chiffrage ni institution : la prémisse qui porte la conclusion n''est pas établie.
    A22 reconnaît elle-même que des économistes la contestent.'
  porte_par:
  - parti: RE
    source: S16
    personne_ou_groupe_ancien: Roland Lescure, ministre de l'Économie (déclaration du 24 août 2026)
  a_normaliser:
  - position à confirmer (ancienne échelle pour/contre)
  - porteur à reformater (personne, fonction, date)
- id: A39
  question: Q43
  position: non
  enonce: 'Supprimer le service des titres de l''Eurosystème ne produit pas des marges « immédiates » égales aux
    intérêts : la Banque de France reverse déjà des sommes à l''État, dont le montant dépend de son résultat.'
  raisonnement: 'A24 tire des marges immédiates de F22 (charge totale de 65,7 Md€ en 2025). Mais F22 porte sur l''ensemble
    des créanciers, pas sur la part de la banque centrale, et F19 et F20 établissent que la Banque de France verse
    impôt et dividendes à l''État. La part de ces versements due aux intérêts sur les titres de l''État n''est chiffrée
    par aucune source (F41, F49 sans estimation) : le gain net est donc inconnu, non démontré positif.'
  porte_par:
  - parti: HOR
    source: S17
    personne_ou_groupe_ancien: Édouard Philippe (débat du Medef, 27 août 2026)
  a_normaliser:
  - position à confirmer (ancienne échelle pour/contre)
  - porteur à reformater (personne, fonction, date)
- id: A40
  question: Q44
  position: oui
  enonce: Que la banque centrale puisse fonctionner avec des fonds propres négatifs ne répond qu'à la question de
    sa solvabilité, pas à celle de la crédibilité de l'euro, qui dépend aussi de la perception d'un financement
    monétaire des États.
  raisonnement: 'A33 conclut que la capacité d''action et l''indépendance sont préservées en s''appuyant sur F58,
    qualifiée par le vérificateur de « Débat entre experts » : la BCE y dit pouvoir remplir son mandat malgré des
    pertes, sans dire que des fonds propres durablement négatifs seraient sans effet. Surtout, la crédibilité tient
    à l''interdiction du financement monétaire (F9) : un effacement au profit d''États peut être lu comme un contournement,
    que la solvabilité de la BCE ne dissipe pas. A33 le reconnaît en limitant son argument à un effacement décidé
    par la BCE elle-même.'
  porte_par:
  - parti: RE
    source: S16
    personne_ou_groupe_ancien: Roland Lescure, ministre de l'Économie (déclaration du 24 août 2026)
  a_normaliser:
  - position à confirmer (ancienne échelle pour/contre)
  - porteur à reformater (personne, fonction, date)
- id: A50
  question: Q45
  position: oui
  enonce: 'Les vendeurs des titres ont bien été payés, mais cela ne fait pas de la part détenue par l''Eurosystème
    une dette qui ne serait jamais remboursée : ces titres arrivent à échéance comme les autres et l''État les rembourse.'
  raisonnement: 'A43 et A49 ont raison sur un point : les vendeurs n''ont plus de créance, et le créancier actuel
    est la banque centrale. Mais A43 en conclut que cette part est à part. Or l''Eurosystème ne réinvestit plus
    les titres arrivés à échéance depuis la fin de 2024 pour le PEPP (F48), et son stock baisse au fil de 2026 (F31)
    : cette part est déjà remboursée par l''État à chaque échéance, au même titre que les autres. Un titre de dette
    garde les mêmes conditions quel que soit son détenteur ; ne pas honorer celles-ci pour une seule catégorie de
    détenteurs modifie le contrat après coup. Que le marché assimile ou non cette part aux autres reste une estimation,
    pas une certitude (voir Q42).'
  porte_par:
  - parti: HOR
    source: S17
    personne_ou_groupe_ancien: 'Édouard Philippe (débat du Medef, 27 août 2026 : refus de toute annulation de dette)'
  a_normaliser:
  - position à confirmer (ancienne échelle pour/contre)
  - porteur à reformater (personne, fonction, date)
- id: A51
  question: Q42
  position: oui
  enonce: 'A44 et A47 supposent que la décision serait prise par le conseil des gouverneurs de la BCE. Or la proposition
    débattue en 2026 vient d''un acteur politique national, et la présidente de la BCE juge l''opération contraire
    aux traités : le scénario sans signal de rupture n''est pas celui qui est proposé.'
  raisonnement: 'Si le conseil des gouverneurs décidait lui-même (F5), le signal serait différent, comme le disent
    A44 et A47. Mais ce scénario suppose que la BCE change de position : sa présidente affirme l''inverse (F27,
    F11, F13, F14), et la proposition est portée par un parti national (F46). Tant que la décision dépend d''un
    gouvernement ou d''une loi nationale, les prêteurs évaluent le scénario qui est sur la table, pas celui qui
    supposerait l''accord de la BCE. Même dans le scénario où la BCE déciderait, il reste à savoir si les prêteurs
    y verraient un contournement de l''interdiction du financement monétaire (F9) ; aucune estimation n''existe
    dans un sens ou dans l''autre (F26).'
  porte_par:
  - parti: RE
    source: S16
    personne_ou_groupe_ancien: Roland Lescure, ministre de l'Économie (déclaration du 24 août 2026)
  a_normaliser:
  - position à confirmer (ancienne échelle pour/contre)
  - porteur à reformater (personne, fonction, date)
- id: A52
  question: Q44
  position: oui
  enonce: 'Une demande politique que la BCE serait libre de refuser n''est pas une instruction. Mais si l''effacement
    passe par une loi nationale visant les titres de la Banque de France, il ne s''agit plus d''une demande : l''État
    impose, et le traité interdit à une banque centrale nationale d''accepter des instructions de son gouvernement.'
  raisonnement: 'A45 distingue demande et instruction (F3) ; la distinction vaut tant que le conseil des gouverneurs
    reste libre (F5). Elle ne vaut pas pour une loi : F4 oblige chaque État à rendre sa législation compatible avec
    les statuts de sa banque centrale et du SEBC, de sorte qu''une loi qui modifierait le bilan de la Banque de
    France relèverait de ce contrôle de compatibilité. A45 ne dit pas quelle voie suit la proposition ; l''atteinte
    à l''indépendance dépend donc de la voie choisie, et non de la seule existence d''une demande.'
  porte_par:
  - parti: RE
    source: S16
    personne_ou_groupe_ancien: Roland Lescure, ministre de l'Économie (déclaration du 24 août 2026)
  a_normaliser:
  - position à confirmer (ancienne échelle pour/contre)
  - porteur à reformater (personne, fonction, date)
- id: A53
  question: Q44
  position: oui
  enonce: A48 conditionne l'atteinte à la crédibilité à la contrariété aux traités, jugée invérifiable (F27). Mais
    la crédibilité d'une monnaie dépend de ce que les marchés croient, et une légalité contestée suffit à créer
    un doute tant qu'aucun juge n'a tranché.
  raisonnement: 'F27 est invérifiable : aucune décision de la CJUE n''a tranché, et une telle décision n''interviendrait
    qu''après l''opération. Pour la crédibilité, ce qui compte est la perception de ceux qui détiennent des euros
    ou des titres, pas le verdict final d''un juge. Entre l''annonce et l''arrêt, le doute porte sur le respect
    de l''interdiction du financement monétaire (F9), qui fonde la confiance dans la monnaie commune. A48 a raison
    de dire que l''atteinte n''est pas établie ; elle n''est pas non plus écartée.'
  porte_par:
  - parti: RE
    source: S16
    personne_ou_groupe_ancien: Roland Lescure, ministre de l'Économie (déclaration du 24 août 2026)
  a_normaliser:
  - position à confirmer (ancienne échelle pour/contre)
  - porteur à reformater (personne, fonction, date)
