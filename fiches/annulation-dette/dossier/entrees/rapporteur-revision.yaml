- id: T27
  question: Q47
  position: oui
  enonce: "L'annulation ou le gel de la dette détenue par la banque centrale est préférable à un nouveau cycle d'austérité, car elle ne coûte rien à personne. Elle permet de financer services publics et investissements sans économies."
  arguments: [A30]
  repond_a: []
