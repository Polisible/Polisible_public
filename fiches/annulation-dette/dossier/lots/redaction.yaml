        statut_source: conforme
    - id: F34
      enonce: En juin 2020, le parti Les Verts (EELV) a présenté un plan de reconstruction écologique financé par
        une annulation de la dette française auprès de la BCE et par une fiscalité plus juste, dont le rétablissement
