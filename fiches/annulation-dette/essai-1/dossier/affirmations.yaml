    ne mentionne pas l'annulation de titres déjà détenus.
  type: fait
  sources:
  - source: S16
    extrait: l'acquisition directe, auprès d'eux, par la Banque centrale européenne ou les banques centrales nationales,
      des instruments de leur dette est également interdite.
  auteur: expert-gauche-radicale
  passage: 1
  verdict: Vrai
  explication: Le texte de l'article 123 (S16, JO C 202 du 7 juin 2016) contient les deux interdictions et ne mentionne
    pas l'annulation de titres déjà détenus.
  statut: verifiee
- id: F26
