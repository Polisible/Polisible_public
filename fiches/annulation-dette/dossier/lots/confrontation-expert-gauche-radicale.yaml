questions:
- Q41 (fait) Les traités européens permettent-ils d'annuler, ou de convertir en dette perpétuelle à taux nul, la
  dette française détenue par la Banque de France pour l'Eurosystème ?
- Q42 (estimation) Annuler ou geler cette dette ferait-il monter les taux auxquels la France emprunte ?
- Q43 (estimation) L'opération réduirait-elle durablement la charge d'intérêts de l'État, compte tenu des intérêts
  que la Banque de France reverse à l'État ?
- Q44 (estimation) Annuler ou geler cette dette affaiblirait-il la crédibilité de l'euro ou l'indépendance de la
  BCE ?
- Q45 (valeur) Un État doit-il rembourser intégralement sa dette, y compris quand le créancier est sa propre banque
  centrale ?
- Q46 (valeur) Les décisions sur la dette publique doivent-elles relever de la seule décision nationale plutôt que
  des règles européennes ?
- Q47 (valeur) Pour dégager des marges budgétaires, l'annulation d'une partie de la dette est-elle préférable aux
  économies, à la hausse des recettes ou à la recherche de croissance ?
tes_arguments:
- id: A20
  auteur: gauche-radicale
  question: Q41
  position: pour
  enonce: 'Aucun texte des traités n''interdit expressément le gel en dette perpétuelle à taux nul de titres que
    l''Eurosystème détient déjà : l''article 123 interdit crédits et achats directs aux États, pas le sort ultérieur
    de titres achetés sur le marché. La Cour de justice n''a pas tranché ce cas et des responsables publics le jugent
    contraire aux traités : la compatibilité est une interprétation juridique, que LFI soutient.'
  raisonnement: 'Les titres ont été achetés sur le marché secondaire (F44), pratique que la Cour de justice a jugée
    compatible avec l''article 123 sous garanties (F8, F9, F10). Le texte interdit le crédit et l''acquisition directe
    (F1, F2) mais ne vise pas expressément la conversion de titres déjà au bilan (F45). La décision serait prise
    par le conseil des gouverneurs de la BCE (F5), donc sans instruction d''un gouvernement (F3) : la mesure relève
    de la politique du bilan de la banque centrale, pas d''un crédit à l''État.'
  porte_par: Jean-Luc Mélenchon et les députés LFI signataires de la proposition de résolution n° 2914 (11 mai 2020)
    (LFI, S39); Jean-Luc Mélenchon, livret Dette (6 juin 2022) (LFI, S40)
  repond_a: null
  affirmations:
  - F44 [fait, Vrai] Les titres de dette française détenus par l'Eurosystème au titre de la politique monétaire
    ont été achetés sur le marché secondaire, auprès d'institutions financières, et non directement auprès de l'État.
    (sources S19)
  - F45 [fait, Vrai] L'article 123 TFUE et l'article 21 du protocole n° 4 interdisent les crédits et l'acquisition
    directe de titres auprès des États ; ils ne mentionnent pas expressément l'annulation ou la conversion en dette
    perpétuelle de titres déjà inscrits au bilan d'une banque centrale. (sources S1)
  - F1 [fait, Vrai] Le traité interdit à la BCE et aux banques centrales nationales d'accorder des découverts ou
    crédits aux administrations publiques (Q41). (sources S1)
  - F2 [fait, Vrai] Le traité interdit l'acquisition directe, auprès des États, de leurs titres de dette par la
    BCE ou les banques centrales nationales (Q41). (sources S1)
  - F3 [fait, Vrai] Le traité dispose que ni la BCE, ni une banque centrale nationale, ni un membre de leurs organes
    de décision ne peuvent solliciter ni accepter d'instructions des gouvernements (Q41, Q44). (sources S1)
  - F5 [fait, Vrai] Le conseil des gouverneurs de la BCE arrête les orientations et prend les décisions nécessaires
    aux missions du SEBC (qui décide, Q41). (sources S1)
  - F8 [fait, Vrai] Dans l'arrêt Gauweiler (C-62/14, 16 juin 2015), la Cour dit pour droit que le SEBC est autorisé
    à adopter un programme d'achat d'obligations souveraines sur les marchés secondaires (Q41). (sources S2)
  - F9 [fait, Vrai] Dans l'arrêt Weiss (C-493/17, 11 décembre 2018), la Cour rappelle que le SEBC doit concilier
    ses interventions avec l'interdiction du financement monétaire de l'article 123 TFUE (Q41). (sources S3)
  - F10 [fait, Vrai] Dans l'arrêt Weiss (C-493/17), la Cour dit pour droit que l'examen des questions n'a révélé
    aucun élément affectant la validité de la décision (UE) 2015/774 de la BCE (Q41). (sources S3)
- id: A21
  auteur: gauche-radicale
  question: Q41
  position: contre
  enonce: 'Le PCF juge que l''annulation de la part détenue par la banque centrale passe par une démarche auprès
    des institutions et des autres pays européens et par un changement des règles européennes, plutôt que par une
    décision française seule. Que les traités actuels l''interdisent n''est pas un fait établi (aucun texte ne la
    mentionne, la Cour ne l''a pas tranché) : c''est la raison pour laquelle le PCF demande de les faire évoluer.'
  raisonnement: 'Les traités interdisent à la BCE de financer directement les États (F1, F2) ; c''est pourquoi elle
    a racheté la dette auprès des banques et des assurances (F44), ce qui maintient la dépendance aux marchés. L''annulation
    partielle se heurte donc aux traités : les élus communistes demandent de les changer et de saisir la Commission
    européenne et les autres États, plutôt que d''agir seul.'
  porte_par: Fabien Roussel, groupe GDR, débat à l'Assemblée nationale du 22 mars 2021 (PCF, S41)
  repond_a: null
  affirmations:
  - F1 [fait, Vrai] Le traité interdit à la BCE et aux banques centrales nationales d'accorder des découverts ou
    crédits aux administrations publiques (Q41). (sources S1)
  - F2 [fait, Vrai] Le traité interdit l'acquisition directe, auprès des États, de leurs titres de dette par la
    BCE ou les banques centrales nationales (Q41). (sources S1)
  - F44 [fait, Vrai] Les titres de dette française détenus par l'Eurosystème au titre de la politique monétaire
    ont été achetés sur le marché secondaire, auprès d'institutions financières, et non directement auprès de l'État.
    (sources S19)
- id: A22
  auteur: gauche-radicale
  question: Q42
  position: contre
  enonce: Selon LFI, l'opération ne ferait pas monter les taux, puisqu'elle ne vise que la part de l'Eurosystème
    et que les créanciers privés sont remboursés intégralement. Il s'agit d'une estimation de ses auteurs, contestée
    par des économistes cités par la presse ; aucune institution n'a chiffré l'effet sur les taux.
  raisonnement: Le taux demandé à la France rémunère le risque de non-remboursement pour les investisseurs de marché.
    La proposition ne vise que la part de l'Eurosystème (F46, F16, F17) et exclut explicitement un défaut de paiement
    envers les autres créanciers, jugé par ses auteurs désastreux. Ce risque n'étant pas modifié, le coût d'emprunt
    ne bouge pas (F47).
  porte_par: Jean-Luc Mélenchon, universités d'été de LFI et déclarations d'août 2026 (LFI, S19); Jean-Luc Mélenchon
    et les députés LFI signataires de la proposition de résolution n° 2914 (défaut de paiement écarté) (LFI, S39)
  repond_a: null
  affirmations:
  - F46 [fait, Plutôt vrai] La proposition vise la part de la dette française détenue par la Banque de France pour
    le compte de l'Eurosystème ; elle laisse inchangés les titres détenus par les autres créanciers. — Public Sénat
    (25 août 2026) établit que la proposition de Jean-Luc Mélenchon vise les titres détenus par la Banque de France
    pour le compte de la BCE (18 % dans le texte, 20 % dans le chapeau). Que les autres créanciers ne soient pas
    concernés n'est que sous-entendu, par un économiste cité dans l'article. (sources S19)
  - F47 [estimation, Pas d'estimation fiable] L'annulation ou le gel en dette perpétuelle de la dette détenue par
    l'Eurosystème n'aurait pas d'effet sur le coût auquel la France emprunte. — La seule source rapporte l'avis
    de Jean-Luc Mélenchon (« aucun impact économique et aucun impact financier »), que l'article (Public Sénat,
    25 août 2026) dit contesté par des économistes. Aucune institution n'a publié d'estimation chiffrée de l'effet
    sur le coût d'emprunt dans le dossier. (sources S19)
  - 'F16 [fait, Plutôt vrai] L''Eurosystème détient près d''un quart des OAT au titre de la politique monétaire
    (données du premier trimestre 2025, rapport du Sénat) (Q41). — Le rapport d''information de la commission des
    finances du Sénat (24 septembre 2025) écrit au conditionnel que l''Eurosystème « détiendrait » près d''un quart
    des OAT, en commentant la détention au premier trimestre 2025. Le chiffre sous-jacent (24,4 %) porte sur une
    catégorie « autres français » qui inclut la Banque de France pour le compte de la BCE mais n''est pas limitée
    à elle : l''ordre de grandeur est sourcé, la précision est moindre que ne le suggère l''énoncé. (sources S10)'
  - F17 [fait, Vrai] Au premier trimestre 2025, la catégorie « autres français », dont la Banque de France pour
    le compte de la BCE, représentait 24,4 % de la dette négociable de l'État (Q41). (sources S10)
- id: A23
  auteur: gauche-radicale
  question: Q43
  position: nuance
  enonce: 'L''intérêt de l''opération tient d''abord à l''allègement du stock de dette et du besoin de refinancement
    sur les marchés, plus qu''à une économie annuelle d''intérêts : la Banque de France reverse une partie de ses
    bénéfices à l''État.'
  raisonnement: 'Les intérêts versés à la Banque de France reviennent en partie à l''État par ses bénéfices (F18,
    F19, F20), flux variable (F21) : l''économie nette d''intérêts est donc moindre que l''économie brute. Mais
    l''Eurosystème ne réinvestit plus les titres arrivés à échéance (F48) ; sans conversion, l''État devrait remplacer
    ces titres par de la dette de marché au taux du moment, alors que la charge de la dette est déjà de 65,7 milliards
    en 2025 (F22). Le gel en dette perpétuelle vise à soulager les États de cette charge (F50).'
  porte_par: Jean-Luc Mélenchon et les députés LFI signataires de la proposition de résolution n° 2914 (11 mai 2020)
    (LFI, S39); Jean-Luc Mélenchon, déclarations d'août 2026 (opération sans coût pour personne) (LFI, S19)
  repond_a: null
  affirmations:
  - F48 [fait, Vrai] Les réinvestissements des titres arrivant à échéance au titre du programme d'achats d'urgence
    pandémique (PEPP) de l'Eurosystème ont pris fin à la fin de 2024. (sources S42)
  - F50 [fait, Vrai] Le gel en dette perpétuelle de titres détenus par la banque centrale a pour objectif de soulager
    les États de la charge de la dette. (sources S39)
  - F18 [fait, Vrai] Le 24 mars 2026, la Banque de France annonce un bénéfice net de 8,1 milliards d'euros pour
    l'exercice 2025 (Q43). (sources S8)
  - F19 [fait, Vrai] Pour l'exercice 2025, la Banque de France verse un impôt sur les bénéfices de 1,5 milliard
    d'euros avant d'atteindre un résultat net de 8,1 milliards (Q43). (sources S7)
  - 'F20 [fait, Vrai] La Banque de France est un contributeur au budget de l''État : 36,8 milliards d''euros versés
    depuis 2015 (Q43). (sources S7)'
  - F21 [fait, Vrai] La Banque de France, contributrice nette au partage du revenu monétaire entre 2015 et 2022,
    est devenue bénéficiaire nette en 2023-2024 (Q43). (sources S9)
  - F22 [fait, Vrai] En 2025, la charge de la dette de l'ensemble des administrations publiques atteint 65,7 milliards
    d'euros, soit 2,2 points de PIB (Cour des comptes, juin 2026) (Q43). (sources S11)
- id: A24
  auteur: gauche-radicale
  question: Q43
  position: pour
  enonce: Selon le PCF, l'annulation de la part détenue par la banque centrale dégagerait des marges financières,
    dont le montant n'est chiffré ni par le parti ni par une institution. Le gain net pour l'État dépend des bénéfices
    que la Banque de France lui reverse (voir A23).
  raisonnement: La charge d'intérêts de la dette publique est élevée (F22) et la part détenue par la banque centrale
    est ancienne et sans remboursement attendu. L'annuler ou la geler en dette perpétuelle supprime le service et
    le principal de ces titres, d'où des marges financières immédiates (F49).
  porte_par: Fabien Roussel, groupe GDR, débat à l'Assemblée nationale du 22 mars 2021 (PCF, S41)
  repond_a: null
  affirmations:
  - F49 [estimation, Pas d'estimation fiable] L'annulation de la part de la dette détenue par la banque centrale
    dégagerait immédiatement des marges financières importantes pour l'État. — La seule source est l'intervention
    de Fabien Roussel à l'Assemblée nationale (22 mars 2021), sans chiffrage ni méthode. Aucune estimation d'institution
    sur les marges que dégagerait l'annulation n'est au dossier. (sources S41)
  - F22 [fait, Vrai] En 2025, la charge de la dette de l'ensemble des administrations publiques atteint 65,7 milliards
    d'euros, soit 2,2 points de PIB (Cour des comptes, juin 2026) (Q43). (sources S11)
- id: A25
  auteur: gauche-radicale
  question: Q44
  position: contre
  enonce: 'Une décision de gel prise par le conseil des gouverneurs lui-même n''atteindrait ni l''indépendance de
    la BCE ni la crédibilité de l''euro : l''indépendance interdit les instructions des gouvernements, pas une décision
    de la banque sur son propre bilan.'
  raisonnement: 'Le traité définit l''indépendance comme l''interdiction de solliciter ou accepter des instructions
    des gouvernements (F3), et réserve la décision au conseil des gouverneurs (F5). Si ce conseil décide, aucune
    instruction n''est donnée. Quant à la crédibilité, les titres détenus ne seront de toute façon pas remboursés
    (F53) : constater cette réalité ne change pas le bilan réel de la banque centrale.'
  porte_par: Jean-Luc Mélenchon, livret Dette (6 juin 2022) (LFI, S40); Jean-Luc Mélenchon, août 2026 (opération
    « jeu d'écriture dans le bilan ») (LFI, S19)
  repond_a: null
  affirmations:
  - F3 [fait, Vrai] Le traité dispose que ni la BCE, ni une banque centrale nationale, ni un membre de leurs organes
    de décision ne peuvent solliciter ni accepter d'instructions des gouvernements (Q41, Q44). (sources S1)
  - F5 [fait, Vrai] Le conseil des gouverneurs de la BCE arrête les orientations et prend les décisions nécessaires
    aux missions du SEBC (qui décide, Q41). (sources S1)
  - F53 [valeur, sans verdict] Une dette publique inscrite au bilan de la banque centrale peut être constatée comme
    non remboursable. (sources S40)
- id: A26
  auteur: gauche-radicale
  question: Q45
  position: contre
  enonce: Un État n'a pas à rembourser intégralement la part de dette détenue par sa propre banque centrale, mais
    il doit honorer ses créanciers privés.
  raisonnement: 'La banque centrale appartient aux États de l''Union : la dette envers elle est une dette envers
    soi-même (F51). La différence avec les créanciers privés, dont des épargnants, justifie une annulation limitée
    à la seule part de la banque centrale (F52).'
  porte_par: Fabien Roussel, groupe GDR, débat à l'Assemblée nationale du 22 mars 2021 (PCF, S41)
  repond_a: null
  affirmations:
  - F51 [valeur, sans verdict] La dette publique détenue par la banque centrale est une dette envers une institution
    publique, dont les propriétaires sont les États de l'Union, et non envers des créanciers privés. (sources S41)
  - F52 [valeur, sans verdict] Une annulation doit se limiter à la dette détenue par la banque centrale, sans spolier
    les créanciers privés, dont des épargnants. (sources S41)
- id: A27
  auteur: gauche-radicale
  question: Q45
  position: contre
  enonce: 'Pour LFI, une dette publique inscrite au bilan de la banque centrale peut être constatée comme non remboursable,
    sans léser les créanciers privés : c''est un jugement de valeur. Sa faisabilité juridique reste discutée (aucun
    texte ne la mentionne, la Cour ne l''a pas tranchée).'
  raisonnement: Les achats massifs de titres ont été faits par la banque centrale elle-même ; les rembourser intégralement
    n'a pas de finalité économique, alors qu'ils pèsent sur la capacité d'investir de l'État. Acter qu'ils ne seront
    pas payés ne lèse aucun créancier privé (F46, F53).
  porte_par: Jean-Luc Mélenchon, livret Dette (6 juin 2022) (LFI, S40)
  repond_a: null
  affirmations:
  - F53 [valeur, sans verdict] Une dette publique inscrite au bilan de la banque centrale peut être constatée comme
    non remboursable. (sources S40)
  - F46 [fait, Plutôt vrai] La proposition vise la part de la dette française détenue par la Banque de France pour
    le compte de l'Eurosystème ; elle laisse inchangés les titres détenus par les autres créanciers. — Public Sénat
    (25 août 2026) établit que la proposition de Jean-Luc Mélenchon vise les titres détenus par la Banque de France
    pour le compte de la BCE (18 % dans le texte, 20 % dans le chapeau). Que les autres créanciers ne soient pas
    concernés n'est que sous-entendu, par un économiste cité dans l'article. (sources S19)
- id: A28
  auteur: gauche-radicale
  question: Q46
  position: nuance
  enonce: Les règles européennes qui encadrent le financement des États et le statut de la BCE doivent être remises
    en cause, la France exigeant leur changement, plutôt que d'enfermer la politique de la dette dans les traités.
  raisonnement: Les traités obligent les États à emprunter auprès des marchés plutôt qu'auprès de leur banque centrale
    (F1, F2) ; leurs auteurs les jugent un carcan qui prive les peuples de la maîtrise de leur endettement (F56).
    La résolution de 2020 invite le gouvernement à exiger de l'Union européenne un changement, ce qui place la décision
    sous contrôle politique démocratique plutôt que sous règles fixées par des institutions indépendantes.
  porte_par: Jean-Luc Mélenchon et les députés LFI signataires de la proposition de résolution n° 2914 (11 mai 2020)
    (LFI, S39); Jean-Luc Mélenchon, livret Dette (6 juin 2022) (LFI, S40)
  repond_a: null
  affirmations:
  - F56 [valeur, sans verdict] Les règles européennes sur le financement des États et le statut de la banque centrale
    doivent être remises en cause. (sources S39, S40)
  - F1 [fait, Vrai] Le traité interdit à la BCE et aux banques centrales nationales d'accorder des découverts ou
    crédits aux administrations publiques (Q41). (sources S1)
  - F2 [fait, Vrai] Le traité interdit l'acquisition directe, auprès des États, de leurs titres de dette par la
    BCE ou les banques centrales nationales (Q41). (sources S1)
- id: A29
  auteur: gauche-radicale
  question: Q46
  position: nuance
  enonce: 'L''annulation de la part détenue par la banque centrale doit se négocier au niveau européen : démarche
    auprès de la Commission et des autres États, et changement des traités.'
  raisonnement: La banque centrale appartient à l'ensemble des pays de l'Union (F51) et les traités interdisent
    le financement direct des États (F1, F2). La solution passe donc par une démarche collective et par une révision
    des règles (F56), non par une décision unilatérale française.
  porte_par: Fabien Roussel, groupe GDR, débat à l'Assemblée nationale du 22 mars 2021 (PCF, S41)
  repond_a: null
  affirmations:
  - F51 [valeur, sans verdict] La dette publique détenue par la banque centrale est une dette envers une institution
    publique, dont les propriétaires sont les États de l'Union, et non envers des créanciers privés. (sources S41)
  - F56 [valeur, sans verdict] Les règles européennes sur le financement des États et le statut de la banque centrale
    doivent être remises en cause. (sources S39, S40)
  - F1 [fait, Vrai] Le traité interdit à la BCE et aux banques centrales nationales d'accorder des découverts ou
    crédits aux administrations publiques (Q41). (sources S1)
  - F2 [fait, Vrai] Le traité interdit l'acquisition directe, auprès des États, de leurs titres de dette par la
    BCE ou les banques centrales nationales (Q41). (sources S1)
- id: A30
  auteur: gauche-radicale
  question: Q47
  position: pour
  enonce: 'Pour LFI, l''annulation ou le gel de la dette détenue par la banque centrale est préférable aux économies,
    parce qu''elle éviterait un nouveau cycle d''austérité : c''est un choix de valeurs. L''absence d''impact économique
    avancée par ses défenseurs n''est pas établie par une estimation d''institution.'
  raisonnement: Un nouveau cycle d'austérité réduit la demande, la consommation et l'investissement public (F54).
    Une opération qui, selon ses défenseurs, ne coûte à personne et n'a pas d'impact économique (F47) permet de
    financer services publics et investissements sans économies.
  porte_par: Jean-Luc Mélenchon, livret Dette (6 juin 2022) et déclarations d'août 2026 (LFI, S40)
  repond_a: null
  affirmations:
  - F54 [valeur, sans verdict] Dégager des marges budgétaires sans économies sur les dépenses est préférable à un
    nouveau cycle d'austérité. (sources S40, S19)
  - F47 [estimation, Pas d'estimation fiable] L'annulation ou le gel en dette perpétuelle de la dette détenue par
    l'Eurosystème n'aurait pas d'effet sur le coût auquel la France emprunte. — La seule source rapporte l'avis
    de Jean-Luc Mélenchon (« aucun impact économique et aucun impact financier »), que l'article (Public Sénat,
    25 août 2026) dit contesté par des économistes. Aucune institution n'a publié d'estimation chiffrée de l'effet
    sur le coût d'emprunt dans le dossier. (sources S19)
- id: A31
  auteur: gauche-radicale
  question: Q47
  position: nuance
  enonce: 'L''annulation partielle est une voie parmi d''autres : elle doit s''accompagner d''une mise à contribution
    du capital et de la lutte contre l''évasion fiscale, qui dégagent aussi des recettes.'
  raisonnement: 'L''annulation de la part de la banque centrale dégage des marges (F49) mais ne suffit pas : l''État
    a aussi besoin de recettes, que la fiscalité du capital et la lutte contre l''évasion fiscale peuvent apporter
    (F55). Les deux leviers sont complémentaires, et l''austérité est écartée.'
  porte_par: Fabien Roussel, groupe GDR, débat à l'Assemblée nationale du 22 mars 2021 (PCF, S41)
  repond_a: null
  affirmations:
  - F49 [estimation, Pas d'estimation fiable] L'annulation de la part de la dette détenue par la banque centrale
    dégagerait immédiatement des marges financières importantes pour l'État. — La seule source est l'intervention
    de Fabien Roussel à l'Assemblée nationale (22 mars 2021), sans chiffrage ni méthode. Aucune estimation d'institution
    sur les marges que dégagerait l'annulation n'est au dossier. (sources S41)
  - F55 [valeur, sans verdict] Le capital doit être mis à contribution pour financer les besoins de l'État, en complément
    de l'annulation partielle de la dette détenue par la banque centrale. (sources S41)
arguments_des_autres:
- id: A1
  auteur: centre
  question: Q41
  position: contre
  enonce: 'Selon Renaissance, les traités ne permettent pas cette opération : effacer ou geler à taux nul des titres
    que l''Eurosystème a rachetés reviendrait à faire financer l''État par sa banque centrale, ce que l''article
    123 interdit. Aucun texte ni arrêt n''a tranché ce cas précis (la contrariété aux traités reste une interprétation
    juridique disputée), et la décision ne relèverait de toute façon pas du gouvernement mais du conseil des gouverneurs.'
  raisonnement: 'L''article 123 interdit crédits et achats directs de dette aux États (F1, F2). La Cour a validé
    les rachats sur le marché secondaire (F8, F10), mais à condition de garanties contre le financement monétaire
    (F9) : les titres ont été achetés à des investisseurs (F24) et non offerts à l''État. Les annuler ou les convertir
    en perpétuel à taux nul reviendrait à donner à l''État, après coup, un avantage que le traité lui refuse au
    départ. Enfin, les décisions du SEBC appartiennent au conseil des gouverneurs (F5), qui ne peut recevoir d''instructions
    des gouvernements (F3) : un État ne peut ni l''ordonner ni modifier seul le cadre (F4).'
  porte_par: Roland Lescure, ministre de l'Économie (déclaration du 24 août 2026, BFMTV/RMC) (Renaissance, S16)
  repond_a: null
  affirmations:
  - F1 [fait, Vrai] Le traité interdit à la BCE et aux banques centrales nationales d'accorder des découverts ou
    crédits aux administrations publiques (Q41). (sources S1)
  - F2 [fait, Vrai] Le traité interdit l'acquisition directe, auprès des États, de leurs titres de dette par la
    BCE ou les banques centrales nationales (Q41). (sources S1)
  - F3 [fait, Vrai] Le traité dispose que ni la BCE, ni une banque centrale nationale, ni un membre de leurs organes
    de décision ne peuvent solliciter ni accepter d'instructions des gouvernements (Q41, Q44). (sources S1)
  - F4 [fait, Vrai] Le traité prévoit que chaque État membre veille à la compatibilité de sa législation nationale,
    y compris les statuts de sa banque centrale, avec les traités et les statuts du SEBC (Q41, Q44). (sources S1)
  - F5 [fait, Vrai] Le conseil des gouverneurs de la BCE arrête les orientations et prend les décisions nécessaires
    aux missions du SEBC (qui décide, Q41). (sources S1)
  - F8 [fait, Vrai] Dans l'arrêt Gauweiler (C-62/14, 16 juin 2015), la Cour dit pour droit que le SEBC est autorisé
    à adopter un programme d'achat d'obligations souveraines sur les marchés secondaires (Q41). (sources S2)
  - F9 [fait, Vrai] Dans l'arrêt Weiss (C-493/17, 11 décembre 2018), la Cour rappelle que le SEBC doit concilier
    ses interventions avec l'interdiction du financement monétaire de l'article 123 TFUE (Q41). (sources S3)
  - F10 [fait, Vrai] Dans l'arrêt Weiss (C-493/17), la Cour dit pour droit que l'examen des questions n'a révélé
    aucun élément affectant la validité de la décision (UE) 2015/774 de la BCE (Q41). (sources S3)
  - F24 [fait, Vrai] Les titres de dette française détenus par l'Eurosystème ont été achetés sur le marché secondaire,
    auprès d'institutions financières, et non directement auprès de l'État. (sources S19)
  - 'F27 [fait, Invérifiable] L''annulation ou la conversion en dette perpétuelle à taux nul de titres achetés par
    l''Eurosystème est contraire aux traités européens. — Aucun texte ne mentionne l''annulation ou la conversion
    de titres déjà détenus (F45) et aucune décision de la CJUE n''a tranché ce cas. La contrariété aux traités est
    affirmée par Roland Lescure (AFP, 24 août 2026) et par Christine Lagarde (F11, F13, F14) ; les signataires de
    la tribune de 2021 soutiennent le contraire (F57) : c''est une interprétation juridique disputée, pas un fait
    établi. (sources S16)'
