affirmations:
  - ref: f1
    enonce: "Les aides publiques et exonérations versées chaque année aux entreprises privées atteignent 270 milliards d'euros (chiffre cité par Lutte ouvrière, en 2026)."
    type: fait
    sources:
      - {source: s1, extrait: "270 milliards d’aides publiques et d’exonérations diverses versés chaque année"}
  - ref: f2
    enonce: "Une dette construite par des cadeaux fiscaux aux plus riches et aux grandes entreprises est illégitime et n'a pas à être payée."
    type: valeur
    sources:
      - {source: s3, extrait: "n’a pas à être payée"}
arguments:
  - ref: a1
    question: Q43
    position: contre
    enonce: "Annuler la part détenue par la Banque de France ne réduirait pas durablement la charge réelle de l'État : l'État étant actionnaire de la banque centrale, les intérêts qu'il lui verse lui reviennent. La charge qui pèse sur les contribuables est celle versée aux banques, assurances et investisseurs privés, nationaux et étrangers."
    raisonnement: "Si les intérêts payés à la Banque de France reviennent à l'État sous forme d'impôt et de dividende, leur suppression retire autant de recettes que de dépenses : le gain net est faible ou nul. L'effort d'annulation viserait donc la part de la dette qui ne coûte presque rien, et laisserait intacte celle qui coûte (créanciers privés)."
    porte_par:
      - {qui: "Tendance CLAIRE (courant du NPA)", parti: "NPA", source: s4}
    affirmations: [F20, F19, F17]
  - ref: a2
    question: Q45
    position: contre
    enonce: "Un État ne doit pas rembourser une dette construite par des cadeaux fiscaux et des aides aux plus riches et aux grandes entreprises : elle est illégitime. Avant toute décision, un audit citoyen doit établir qui a prêté, à quel taux, quelle part est déjà remboursée, et un moratoire suspend les paiements."
    raisonnement: "Si la dette résulte de choix de politique qui ont profité aux créanciers et aux entreprises plutôt qu'à la population, l'obligation de la rembourser intégralement ne va pas de soi. Le critère n'est pas l'identité du créancier mais la légitimité de la dette, que l'audit doit établir ; ce critère conduit à ne pas rembourser les dettes illégitimes, banque centrale ou non."
    porte_par:
      - {qui: "NPA (tract sur la dette)", parti: "NPA", source: s3}
    affirmations: [f2]
  - ref: a3
    question: Q47
    position: nuance
    enonce: "Les marges budgétaires se trouvent d'abord dans les recettes tirées des profits et dans l'arrêt des aides aux entreprises, non dans les économies sur les budgets utiles à la population. Lutte ouvrière dit que la dette est celle de la bourgeoisie et que c'est à elle de la payer, sans proposer d'annulation d'une part précise."
    raisonnement: "Si la dette a été creusée par des aides aux entreprises (270 milliards d'euros par an de aides et exonérations selon Lutte ouvrière), alors dégager des marges en supprimant ces aides et en taxant les profits est préférable aux économies sur les services publics, que cette position refuse. Elle ne retient pas l'annulation comme voie principale."
    porte_par:
      - {qui: "Lutte ouvrière, campagne de Nathalie Arthaud", parti: "LO", source: s1}
    affirmations: [f1]
  - ref: a4
    question: Q47
    position: pour
    enonce: "L'annulation de la dette publique est préférable à l'austérité : elle libère l'argent des intérêts pour des investissements et des emplois utiles à la population, et met fin au pouvoir des marchés. Elle doit toutefois porter sur les dettes illégitimes, pas sur la seule part de la banque centrale."
    raisonnement: "Si les intérêts payés aux créanciers privés absorbent des sommes qui financeraient des emplois publics (le tract NPA les chiffre à l'équivalent d'un million d'emplois en 2011), alors l'annulation dégage plus de marges que des économies qui frappent la population. La part détenue par la banque centrale étant reversée à l'État, annuler seulement celle-ci est jugé une diversion."
    porte_par:
      - {qui: "NPA (tract sur la dette) ; Tendance CLAIRE (courant du NPA)", parti: "NPA", source: s3}
    affirmations: [F20]
valeurs:
  - {question: Q45, enonce: "Lutte ouvrière met en priorité que la dette de l'État soit payée par la bourgeoisie et les banques, qui en profitent, non par les travailleurs (hebdomadaire du 4 septembre 2026)."}
  - {question: Q47, enonce: "L'extrême gauche met en priorité le refus de l'austérité pour les travailleurs, quelle que soit la voie choisie (annulation, taxation des profits, fin des aides aux entreprises)."}
