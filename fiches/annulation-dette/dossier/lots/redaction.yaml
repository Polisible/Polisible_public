  arguments:
  - id: A2
    auteur: centre
    question: Q42
    position: oui
    enonce: 'Les taux monteraient : un État qui renonce unilatéralement à une part de sa dette, par une voie juridiquement
      contestée, signale qu''il peut changer les règles. Les prêteurs demanderaient un taux plus élevé ; aucune
      institution n''a chiffré cette hausse.'
    raisonnement: La France emprunte à un taux déjà au plus haut depuis 2008 (F25) ; toute hausse supplémentaire
      se répercute sur l'ensemble de la dette renouvelée. L'opération, juridiquement contestée (F27), serait lue
      comme un défaut partiel ou un risque de rupture avec les règles de la zone euro. Les prêteurs, qui n'ont aucune
      raison de croire que le précédent ne se reproduira pas, réclameraient une prime de risque (F26), et l'accès
      aux marchés pourrait se compliquer. Le gain sur les intérêts de la dette gelée serait ainsi rogné par le surcoût
      sur la dette future.
    porte_par: '**Roland Lescure** (ministre de l''Économie, RE), 24 août 2026 [S16, S49]; **Édouard Philippe**
      (candidat à l''élection présidentielle de 2027, HOR), 27 août 2026 [S17, S51]'
    repond_a: null
    affirmations:
    - F25 [fait, Plutôt vrai] Le 24 août 2026, le taux d'intérêt de la France à 10 ans était de 4,11 %, après avoir
      dépassé 4,14 % le jeudi précédent, son plus haut niveau depuis 2008. — La dépêche AFP reprise par MoneyVox
      le 24 août 2026 donne bien 4,11 % le lundi et plus de 4,14 % le jeudi précédent, au plus haut depuis 2008.
      C'est une valeur de la matinée, rapportée par la presse ; aucune série officielle de clôture (Banque de France,
      Agence France Trésor) n'a été consultée. (sources S16)
    - F26 [estimation, Pas d'estimation fiable] Une annulation unilatérale d'une partie de la dette publique ferait
      monter les taux auxquels la France emprunte, car les prêteurs réclameraient une prime de risque supplémentaire.
      — La seule source est la déclaration de Roland Lescure, ministre de l'Économie, rapportée par l'AFP le 24
      août 2026, sans chiffrage ni méthode. Des économistes cités par la presse (Public Sénat, 25 août 2026) et
      Christine Lagarde (F11) vont dans le même sens, mais aucune institution n'a publié d'estimation chiffrée de
      l'effet sur les taux dans le dossier. (sources S16)
    - 'F27 [fait, Invérifiable] L''annulation ou la conversion en dette perpétuelle à taux nul de titres achetés
      par l''Eurosystème est contraire aux traités européens. — Aucun texte ne mentionne l''annulation ou la conversion
      de titres déjà détenus (F45) et aucune décision de la CJUE n''a tranché ce cas. La contrariété aux traités
      est affirmée par Roland Lescure (AFP, 24 août 2026) et par Christine Lagarde (F11, F13, F14) ; les signataires
      de la tribune de 2021 soutiennent le contraire (F57) : c''est une interprétation juridique disputée, pas un
      fait établi. (sources S16)'
  - id: A22
    auteur: gauche-radicale
    question: Q42
    position: non
    enonce: 'L''opération ne ferait pas monter les taux : elle ne vise que la part de l''Eurosystème et les créanciers
      privés sont remboursés intégralement. Le risque de non-remboursement que rémunère le taux n''est donc pas
      modifié.'
    raisonnement: Le taux demandé à la France rémunère le risque de non-remboursement pour les investisseurs de
      marché. La proposition ne vise que la part de l'Eurosystème (F46, F16, F17) et exclut explicitement un défaut
      de paiement envers les autres créanciers, jugé par ses auteurs désastreux. Ce risque n'étant pas modifié,
      le coût d'emprunt ne bouge pas (F47).
    porte_par: '**Jean-Luc Mélenchon** (candidat à l''élection présidentielle de 2027, LFI), 25 août 2026 [S19];
