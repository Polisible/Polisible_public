      validité de la décision 2015/774, donc sur les achats, et F9 montre que la Cour valide ces achats à condition
      de garanties contre le financement monétaire : elle raisonne par l''effet, non par la liste des actes interdits.
      Rien dans F8-F10 ne dit qu''effacer ou geler à taux nul des titres déjà détenus, au profit d''un État, respecte
      ces garanties. Enfin l''argument suppose une décision du conseil des gouverneurs (F5), alors que la proposition
      en débat est portée par un gouvernement et un parlement nationaux (F3).'
