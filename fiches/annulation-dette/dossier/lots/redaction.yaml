  arguments:
  - id: A4
    auteur: expert-centre
    question: Q45
    position: pour
    enonce: 'Oui. Les titres détenus par la banque centrale sont des titres de l''État comme les autres : ils arrivent
      à échéance et sont remboursés, et les effacer unilatéralement porterait atteinte à la signature de la France.'
    raisonnement: 'Les titres ont été achetés sur le marché secondaire (F24) : la banque centrale a payé les vendeurs,
      et ses engagements envers eux demeurent. Distinguer les créanciers que l''on rembourse de ceux que l''on ne
      rembourse pas ferait de la parole de l''État un choix variable. Le respect intégral des engagements est ce
      qui permet à la France d''emprunter durablement (F25 : le coût de l''emprunt est déjà élevé).'
    porte_par:
    - qui: 'Édouard Philippe (débat du Medef, 27 août 2026 : refus de toute annulation de dette)'
      parti: Horizons
      source: S17
    - qui: Roland Lescure, ministre de l'Économie (déclaration du 24 août 2026)
      parti: Renaissance
      source: S16
    repond_a: null
    statut: conteste
    affirmations:
    - id: F24
      enonce: Les titres de dette française détenus par l'Eurosystème ont été achetés sur le marché secondaire,
        auprès d'institutions financières, et non directement auprès de l'État.
      type: fait
      verdict: Vrai
      explication: L'article 123 TFUE interdit à la BCE et aux banques centrales nationales toute acquisition directe
        de titres auprès des États (F2, S1) ; les programmes d'achat validés par la CJUE (Gauweiler 2015, Weiss
        2018) portent sur le marché secondaire (F8, F10). Public Sénat (25 août 2026) le confirme pour les achats
        de 2010 et de 2020.
      sources:
      - source: S19
        extrait: Ces opérations ont eu lieu sur le marché secondaire, c’est-à-dire auprès d’institutions financières
        statut_source: conforme
    - id: F25
      enonce: Le 24 août 2026, le taux d'intérêt de la France à 10 ans était de 4,11 %, après avoir dépassé 4,14
        % le jeudi précédent, son plus haut niveau depuis 2008.
      type: fait
      verdict: Plutôt vrai
      explication: La dépêche AFP reprise par MoneyVox le 24 août 2026 donne bien 4,11 % le lundi et plus de 4,14
        % le jeudi précédent, au plus haut depuis 2008. C'est une valeur de la matinée, rapportée par la presse
        ; aucune série officielle de clôture (Banque de France, Agence France Trésor) n'a été consultée.
      sources:
      - source: S16
        extrait: Lundi, le taux d'intérêt de la France à 10 ans était à 4,11%, après avoir dépassé jeudi 4,14%,
          au plus depuis 2008.
        statut_source: conforme
  - id: A7
    auteur: expert-droite
    question: Q45
    position: contre
    enonce: 'Un État doit rembourser sa dette, y compris quand le créancier est un organisme public comme la banque
      centrale : la parole de l''État engage les contribuables, et y renoncer ferait perdre la confiance qui permet
      d''emprunter.'
    raisonnement: Pour ce défenseur de la rigueur budgétaire, une dette est un engagement pris au nom du peuple.
      Si l'État peut s'en délier dès qu'elle devient pesante, aucun engagement futur ne sera crédible ; la bonne
      réponse à une dette lourde est de redéfinir les priorités de dépense, non de la faire disparaître. Position
      exprimée en décembre 2020 sur l'annulation des dettes détenues par la BCE, pas sur la proposition d'août 2026.
    porte_par:
    - qui: Jean-François Husson, sénateur LR, rapporteur général de la commission des finances du Sénat (entretien
        du 28 décembre 2020)
      parti: LR
      source: S21
    repond_a: null
    statut: ouvert
    affirmations:
    - id: F28
      enonce: 'Un État doit honorer ses dettes : en s''engageant, il engage son peuple, c''est-à-dire ses contribuables,
        et la parole donnée doit garder sa valeur.'
      type: valeur
      verdict: null
      explication: Affirmation de valeur, sans verdict. La source (Public Sénat, 28 décembre 2020) rapporte la position
        de Jean-François Husson ; la formule « la parole donnée doit garder sa valeur » n'y figure pas.
      sources:
      - source: S21
        extrait: Si les États veulent retrouver la confiance de leur peuple, il faut qu’ils honorent leurs dettes
          car, en s’engageant, l’État engage son peuple, qui n’est autre que ses contributeurs.
        statut_source: conforme
  - id: A10
    auteur: expert-ecologistes
    question: Q45
    position: contre
    enonce: 'Un État n''a pas à rembourser intégralement une dette détenue par sa banque centrale : elle n''est
      pas due à un créancier extérieur à la sphère publique, et la marge dégagée peut financer les investissements
      de la transition écologique. Le remboursement intégral n''est pas une obligation de principe mais un choix
      de politique économique.'
    raisonnement: Les titres publics détenus par l'Eurosystème (environ 640 milliards d'euros pour la France en
      2026, F31) sont le résultat d'achats de politique monétaire, non d'un prêt consenti par un épargnant ou un
      investisseur privé. Les intérêts versés à la banque centrale reviennent en partie à l'État (F7, F20). Comme
      l'Europe a besoin de 800 milliards d'euros d'investissements supplémentaires par an (F32), maintenir cette
      dette au bilan pour la rembourser prive l'investissement climatique d'une marge qui existe. Le parti a déjà
      proposé en 2020 de lier annulation de dette auprès de la BCE et financement de la reconstruction écologique
      (F34).
    porte_par:
    - qui: Jérôme Gleizes, conseiller EELV de Paris (2023), chronique Politis du 14 septembre 2026
      parti: Les Écologistes
      source: S23
    - qui: Les Verts (EELV), plan de reconstruction écologique de juin 2020, porte-parole Eva Sas
      parti: Les Écologistes
      source: S24
    repond_a: null
    statut: ouvert
    affirmations:
    - id: F31
      enonce: L'Eurosystème (BCE et banques centrales nationales) détient environ 640 milliards d'euros de titres
        publics français en 2026.
      type: fait
      verdict: Plutôt vrai
      explication: 'La chronique de Politis (14 septembre 2026) ne cite pas d''origine, mais les données de la BCE
        ouvertes le 10 novembre 2026 donnent un ordre de grandeur voisin : achats nets cumulés de titres publics
        français de 359,5 milliards d''euros au titre du PSPP et 237,5 milliards au titre du PEPP fin octobre 2026,
        soit environ 597 milliards (au coût amorti, émetteurs publics français y compris hors État), après environ
        400 milliards pour le seul PSPP fin 2025. Le chiffre de 640 milliards correspond au début de 2026 ; le stock
        baisse au fil de l''année.'
      sources:
      - source: S23
        extrait: dont environ 640 milliards de titres publics français
        statut_source: conforme
      - source: S46
        extrait: France 401,150 -147 359,487 5.91 5.88 8.60
        statut_source: conforme
      - source: S47
        extrait: France -34 237,484 6.60 7.67
        statut_source: conforme
