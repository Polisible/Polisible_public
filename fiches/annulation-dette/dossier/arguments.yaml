    qualifiée par le vérificateur de « Débat entre experts » : la BCE y dit pouvoir remplir son mandat malgré des
    pertes, sans dire que des fonds propres durablement négatifs seraient sans effet. Surtout, la crédibilité tient
    à l''interdiction du financement monétaire (F9) : un effacement au profit d''États peut être lu comme un contournement,
