      établie : Marine Le Pen est présentée comme « candidate du Rassemblement national », et le plan comme « présenté
      par le RN ».'
    extrait: on retrouve l'immigration qui permettrait d'économiser 15 milliards d'euros en 2027 et « 29 milliards
      en année pleine »
- id: F39
  enonce: Marine Le Pen propose d'inscrire une règle d'or budgétaire dans la Constitution par référendum, pour limiter
    le déficit public.
  type: fait
  declaration: true
  sources:
  - source: S32
    niveau: 4
    statut: conforme
    note_verif: 'Bon document : LCP, Maxence Kagni, vendredi 2 octobre 2026 (date lue dans la signature, absente
      des métadonnées). F39 : l''extrait figure mot pour mot ; l''article précise aussi qu''elle propose d''inscrire
      la règle d''or « dans la Constitution » par référendum, en fixant « un déficit maximum », d''après sa tribune
      dans L''Opinion du 1er octobre 2026 : même périmètre que l''affirmation. Appartenance établie : « La candidate
      du Rassemblement national à l''élection présidentielle ».'
    extrait: veut instaurer une "règle d'or budgétaire" qu'elle proposera aux Français d'approuver par référendum,
      si elle est élue à l'Élysée.
- id: F40
  enonce: La proposition de loi constitutionnelle déposée par Marine Le Pen en 2024 met fin à la primauté du droit
    européen sur le droit national.
  type: fait
  declaration: true
  sources:
  - source: S33
    niveau: 4
    statut: conforme
    note_verif: 'Bon document : dépêche AFP reprise par La Gazette France, 5 septembre 2026. F40 : l''extrait figure
      mot pour mot ; la formule « met fin à la primauté du droit européen » est la description de l''AFP, le texte
      officiel (n° 2120 du 25 janvier 2024, ajouté en source) parlant de « supériorité de la Constitution sur toute
      autre norme, même internationale » : même sens, autre formulation. Appartenance établie : « La candidate RN
      à l''élection présidentielle ».'
    extrait: met fin à "la primauté" du droit européen sur le droit national, à la base de la construction européenne...
  - source: S45
    niveau: 1
    statut: conforme
    note_verif: ajoutée par le vérificateur
    extrait: de poser solennellement le principe de supériorité de la Constitution sur toute autre norme, même internationale
- id: F41
  enonce: Les intérêts que l'État paie à la Banque de France sur les titres qu'elle détient contribuent à son résultat,
    dont une part revient à l'État (dividende et impôt).
  type: estimation
  declaration: false
  sources:
  - source: S29
    niveau: 4
    statut: non-conforme
    note_verif: 'Bon document (titre et date du 24 août 2026 conformes ; l''adresse redirige vers une version longue
      de l''URL), page signalée « analyse assistée par IA ». F41 : l''extrait figure mot pour mot, mais il rapporte
      un argument de Jordan Bardella publié sur X (« Il a argué que… »), sans établir le mécanisme, et ne mentionne
      pas l''impôt ; un site de niveau 4 ne peut fonder cette estimation. Appartenance établie : la page présente
      Jordan Bardella comme « président du Rassemblement national ».'
    extrait: Il a argué que la Banque de France étant détenue par l'État, les intérêts versés sont reversés sous
      forme de dividendes.
- id: F42
  enonce: Les aides publiques et exonérations versées chaque année aux entreprises privées atteignent 270 milliards
    d'euros (chiffre cité par Lutte ouvrière, en 2026).
  type: fait
  declaration: false
  sources:
  - source: S35
    niveau: 3
    statut: conforme
    note_verif: 'Bon document : brochure de Lutte ouvrière pour la candidature de Nathalie Arthaud à la présidentielle
      2027 ; le PDF ne porte pas de date en métadonnées, mais son adresse (2026/06) et sa mention de la fête de
      mai 2026 concordent avec juin 2026. F42 : l''extrait figure mot pour mot ; la source dit « aux capitalistes
      privés » là où l''affirmation dit « entreprises privées », et elle établit seulement que LO cite ce chiffre,
      pas son exactitude (niveau 3). Appartenance établie : la brochure est signée de Nathalie Arthaud, sous le
      sigle LO.'
    extrait: 270 milliards d’aides publiques et d’exonérations diverses versés chaque année
- id: F43
  enonce: Une dette construite par des cadeaux fiscaux aux plus riches et aux grandes entreprises est illégitime
    et n'a pas à être payée.
  type: valeur
  declaration: false
  sources:
  - source: S37
    niveau: 3
    statut: conforme
    note_verif: 'Bon document : tract du NPA (adresse npa2009.org imprimée) sur la dette ; la date exacte du 2011-12-01
      n''est pas imprimée, mais le contenu (gouvernement Fillon, « octobre 2011 », candidat socialiste « pour 2012
      ») situe le tract fin 2011, sans confirmer le jour. F43 (valeur) : l''extrait figure (« Pour le NPA, la réponse
      est claire, une dette construite par les cadeaux faits aux plus riches et aux grandes entreprises est illégitime
      et n''a pas à être payée ») et dit la même chose que l''énoncé (le mot « fiscaux » de l''énoncé est repris
      d''autres passages du tract). L''appartenance au NPA est établie par la source (« Pour le NPA »).'
    extrait: n’a pas à être payée
- id: F44
  enonce: Les titres de dette française détenus par l'Eurosystème au titre de la politique monétaire ont été achetés
    sur le marché secondaire, auprès d'institutions financières, et non directement auprès de l'État.
  type: fait
  declaration: false
  sources:
  - source: S19
    niveau: 4
    statut: conforme
    note_verif: 'Bon document (Public Sénat, 25 août 2026) ; la source établit que Jean-Luc Mélenchon est « leader
      de la France insoumise (LFI) ». F24 et F44 : extrait mot pour mot, même chose (achats de 2010 puis de 2020
      pour le compte de la BCE). F46 : extrait présent (18 %, mais le chapô dit « 20 % ») ; que les autres créanciers
      ne soient pas concernés n''est que sous-entendu, par un économiste cité. F47 : extrait présent, mais c''est
      l''avis de Jean-Luc Mélenchon que l''article dit contesté par des économistes (hausse des taux possible),
      pas une estimation qu''il établit. F54 : l''extrait ne dit pas la même chose (le mot austérité est absent
      de la page).'
    extrait: Ces opérations ont eu lieu sur le marché secondaire, c’est-à-dire auprès d’institutions financières
- id: F45
  enonce: L'article 123 TFUE et l'article 21 du protocole n° 4 interdisent les crédits et l'acquisition directe
    de titres auprès des États ; ils ne mentionnent pas expressément l'annulation ou la conversion en dette perpétuelle
    de titres déjà inscrits au bilan d'une banque centrale.
  type: fait
  declaration: false
  sources:
  - source: S1
    niveau: 1
    statut: conforme
    note_verif: 'Version consolidée 2016 du TFUE avec ses protocoles, en français (EUR-Lex). F45 : l''extrait figure
      mot pour mot à l''article 123 §1, et l''article 21.1 du protocole n° 4 dit la même chose ; aucun des deux
      textes ne parle d''annulation ni de conversion de titres déjà détenus, ce qui confirme la seconde moitié de
      F45 sur la lettre du texte (la jurisprudence de la CJUE n''est pas dans cette source). Aucune personne citée,
      donc pas d''appartenance partisane en jeu.'
    extrait: l'acquisition directe, auprès d'eux, par la Banque centrale européenne ou les banques centrales nationales,
      des instruments de leur dette est également interdite.
- id: F46
  enonce: La proposition vise la part de la dette française détenue par la Banque de France pour le compte de l'Eurosystème
    ; elle laisse inchangés les titres détenus par les autres créanciers.
  type: fait
  declaration: false
  sources:
  - source: S19
    niveau: 4
    statut: conforme
