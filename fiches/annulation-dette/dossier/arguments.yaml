  question: Q45
  position: oui
  enonce: 'Un État doit rembourser sa dette, y compris quand le créancier est la banque centrale : l''État engage
    son peuple, et renoncer à une dette ferait perdre la confiance qui permet d''emprunter.'
  porte_par:
  - personne: Jean-François Husson
    fonction: sénateur, rapporteur de la commission des finances du Sénat
    parti: LR
    date: '2020-12-28'
    source: S21
  affirmations:
  - F28
  raisonnement: Une dette est un engagement pris au nom des contribuables. Si l'État peut s'en délier, aucun engagement
    futur n'est crédible. Une dette lourde appelle une redéfinition des priorités de dépense, non sa disparition
    ; cette position date de décembre 2020 et ne porte pas sur la proposition d'août 2026.
  repond_a: null
  auteur: expert-droite
  passage: 1
  statut: ouvert
  versions:
  - passage: 4
    enonce: 'Un État doit rembourser sa dette, y compris quand le créancier est un organisme public comme la banque
      centrale : la parole de l''État engage les contribuables, et y renoncer ferait perdre la confiance qui permet
      d''emprunter.'
    raisonnement: Pour ce défenseur de la rigueur budgétaire, une dette est un engagement pris au nom du peuple.
      Si l'État peut s'en délier dès qu'elle devient pesante, aucun engagement futur ne sera crédible ; la bonne
      réponse à une dette lourde est de redéfinir les priorités de dépense, non de la faire disparaître. Position
      exprimée en décembre 2020 sur l'annulation des dettes détenues par la BCE, pas sur la proposition d'août 2026.
    position: non
    porte_par:
    - parti: LR
      source: S21
      personne_ou_groupe_ancien: Jean-François Husson, sénateur LR, rapporteur général de la commission des finances
        du Sénat (entretien du 28 décembre 2020)
  corrige: true
