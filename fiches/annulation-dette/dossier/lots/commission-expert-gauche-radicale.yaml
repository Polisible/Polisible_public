    avis: confirme
    justification: Examen confirmé. « Ne lèse aucun créancier privé » s'entend au sens étroit, établi par F24 et
      F46 (Plutôt vrai) ; les effets indirects sur les prêteurs, symétriques de l'atteinte à la signature de T15
      (F26), ne sont pas affirmés par T17 et la portée le relève. Objection T15 (A50, F48) sans réponse.
