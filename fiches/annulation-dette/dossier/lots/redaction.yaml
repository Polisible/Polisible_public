      qu''après l''opération. Pour la crédibilité, ce qui compte est la perception de ceux qui détiennent des euros
      ou des titres, pas le verdict final d''un juge. Entre l''annonce et l''arrêt, le doute porte sur le respect
      de l''interdiction du financement monétaire (F9), qui fonde la confiance dans la monnaie commune. A48 a raison
      de dire que l''atteinte n''est pas établie ; elle n''est pas non plus écartée.'
