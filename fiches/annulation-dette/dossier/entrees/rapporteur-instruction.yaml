      justification: "A5 porte sur le niveau de décision, national ou européen (F3, F4), objet de Q46."
    appui:
      valeur: partiel
      justification: "F3 et F4 sont vérifiés (Vrai) ; la contrariété aux traités repose sur F27 (Invérifiable), et le partage du bilan avec les autres membres est nuancé par la résolution de l'objection O1, selon laquelle les revenus et risques des titres d'État acquis depuis 2015 ne sont pas partagés (S9)."
    raisonnement:
      valeur: valide
      justification: "De la priorité donnée aux engagements européens acceptés (F4), la conclusion découle."
    portee:
