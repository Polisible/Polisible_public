- id: F1
  enonce: Le traité interdit à la BCE et aux banques centrales nationales d'accorder des découverts ou crédits aux
    administrations publiques (Q41).
  type: fait
  sources:
  - source: S1
    extrait: Il est interdit à la Banque centrale européenne et aux banques centrales des États membres, ci-après
      dénommées "banques centrales nationales", d'accorder des découverts ou tout autre type de crédit aux institutions,
      organes ou organismes de l'Union, aux administrations centrales
  declaration: false
  auteur: bibliothecaire
  passage: 1
  verdict: Vrai
  explication: L'article 123, paragraphe 1, du TFUE (version consolidée 2016) interdit à la BCE et aux banques centrales
    nationales d'accorder des découverts ou tout autre type de crédit aux administrations publiques. Le texte est
    explicite.
  statut: verifiee
- id: F2
  enonce: Le traité interdit l'acquisition directe, auprès des États, de leurs titres de dette par la BCE ou les
    banques centrales nationales (Q41).
  type: fait
  sources:
  - source: S1
    extrait: l'acquisition directe, auprès d'eux, par la Banque centrale européenne ou les banques centrales nationales,
      des instruments de leur dette est également interdite.
  declaration: false
  auteur: bibliothecaire
  passage: 1
  verdict: Vrai
  explication: La même phrase de l'article 123, paragraphe 1, du TFUE interdit l'acquisition directe, auprès des
    États, des instruments de leur dette par la BCE ou les banques centrales nationales. L'interdiction vise l'achat
    direct (marché primaire), pas les achats sur le marché secondaire.
  statut: verifiee
- id: F3
  enonce: Le traité dispose que ni la BCE, ni une banque centrale nationale, ni un membre de leurs organes de décision
    ne peuvent solliciter ni accepter d'instructions des gouvernements (Q41, Q44).
  type: fait
  sources:
  - source: S1
    extrait: ni la Banque centrale européenne, ni une banque centrale nationale, ni un membre quelconque de leurs
      organes de décision ne peuvent solliciter ni accepter des instructions
  declaration: false
  auteur: bibliothecaire
  passage: 1
  verdict: Vrai
  explication: L'article 130 du TFUE, repris à l'article 7 des statuts du SEBC, interdit à la BCE, aux banques centrales
    nationales et aux membres de leurs organes de décision de solliciter ou d'accepter des instructions, notamment
    des gouvernements des États membres.
  statut: verifiee
- id: F4
  enonce: Le traité prévoit que chaque État membre veille à la compatibilité de sa législation nationale, y compris
    les statuts de sa banque centrale, avec les traités et les statuts du SEBC (Q41, Q44).
  type: fait
  sources:
  - source: S1
    extrait: Chaque État membre veille à la compatibilité de sa législation nationale, y compris les statuts de
      sa banque centrale nationale, avec les traités et les statuts du SEBC et de la BCE.
  declaration: false
  auteur: bibliothecaire
  passage: 1
  verdict: Vrai
  explication: L'article 131 du TFUE, repris à l'article 14.1 des statuts du SEBC, impose à chaque État membre de
    veiller à la compatibilité de sa législation nationale, y compris les statuts de sa banque centrale, avec les
    traités et les statuts.
  statut: verifiee
- id: F5
  enonce: Le conseil des gouverneurs de la BCE arrête les orientations et prend les décisions nécessaires aux missions
    du SEBC (qui décide, Q41).
  type: fait
  sources:
  - source: S1
    extrait: Le conseil des gouverneurs arrête les orientations et prend les décisions nécessaires à l'accomplissement
      des missions confiées au SEBC par les traités et les présents statuts.
  declaration: false
  auteur: bibliothecaire
  passage: 1
  verdict: Vrai
  explication: L'article 12.1 des statuts du SEBC et de la BCE confie au conseil des gouverneurs l'adoption des
    orientations et des décisions nécessaires aux missions du SEBC.
  statut: verifiee
- id: F6
  enonce: La BCE et les banques centrales nationales peuvent intervenir sur les marchés de capitaux pour atteindre
    les objectifs du SEBC (Q41).
  type: fait
  sources:
  - source: S1
    extrait: 'Afin d''atteindre les objectifs du SEBC et d''accomplir ses missions, la BCE et les banques centrales
      nationales peuvent:'
  declaration: false
  auteur: bibliothecaire
  passage: 1
  verdict: Vrai
  explication: L'article 18.1 des statuts du SEBC et de la BCE autorise la BCE et les banques centrales nationales
    à intervenir sur les marchés de capitaux afin d'atteindre les objectifs du SEBC. Cette faculté reste encadrée
    par l'interdiction de l'article 123 du TFUE.
  statut: verifiee
- id: F7
  enonce: Le revenu monétaire des banques centrales nationales est réparti à la fin de chaque exercice (Q43).
  type: fait
  sources:
  - source: S1
    extrait: Le revenu dégagé par les banques centrales nationales dans l'exercice des missions de politique monétaire
      du SEBC, ci-après dénommé "revenu monétaire", est réparti à la fin de chaque exercice conformément au présent
      article.
  declaration: false
  auteur: bibliothecaire
  passage: 1
  verdict: Vrai
  explication: L'article 32.1 des statuts du SEBC et de la BCE prévoit que le revenu monétaire des banques centrales
    nationales est réparti à la fin de chaque exercice, selon les règles de cet article.
  statut: verifiee
- id: F8
  enonce: Dans l'arrêt Gauweiler (C-62/14, 16 juin 2015), la Cour dit pour droit que le SEBC est autorisé à adopter
    un programme d'achat d'obligations souveraines sur les marchés secondaires (Q41).
  type: fait
  sources:
  - source: S2
    extrait: doivent être interprétés en ce sens qu'ils autorisent le Système européen de banques centrales (SEBC)
      à adopter un programme d'achat d'obligations souveraines sur les marchés secondaires
  declaration: false
  auteur: bibliothecaire
  passage: 1
  verdict: Vrai
  explication: Le dispositif de l'arrêt Gauweiler (CJUE, grande chambre, 16 juin 2015, C-62/14) dit pour droit que
    les articles 119, 123, paragraphe 1, et 127 du TFUE autorisent le SEBC à adopter un programme d'achat d'obligations
    souveraines sur les marchés secondaires. L'autorisation porte sur un programme « tel que celui annoncé » en
    septembre 2012 (opérations monétaires sur titres), avec les conditions qui l'encadrent.
  statut: verifiee
- id: F9
  enonce: Dans l'arrêt Weiss (C-493/17, 11 décembre 2018), la Cour rappelle que le SEBC doit concilier ses interventions
    avec l'interdiction du financement monétaire de l'article 123 TFUE (Q41).
  type: fait
  sources:
  - source: S3
    extrait: le SEBC doit entourer son intervention de garanties suffisantes pour concilier celle-ci avec l'interdiction
      du financement monétaire découlant de l'article 123 TFUE
  declaration: false
  auteur: bibliothecaire
  passage: 1
  verdict: Vrai
  explication: Au point 107 de l'arrêt Weiss (CJUE, grande chambre, 11 décembre 2018, C-493/17), la Cour indique
    que le SEBC doit entourer son intervention de garanties suffisantes pour la concilier avec l'interdiction du
    financement monétaire de l'article 123 du TFUE.
  statut: verifiee
- id: F10
  enonce: Dans l'arrêt Weiss (C-493/17), la Cour dit pour droit que l'examen des questions n'a révélé aucun élément
    affectant la validité de la décision (UE) 2015/774 de la BCE (Q41).
  type: fait
  sources:
  - source: S3
    extrait: L'examen des première à quatrième questions préjudicielles n'a révélé aucun élément de nature à affecter
      la validité de la décision (UE) 2015/774 de la Banque centrale européenne
  declaration: false
  auteur: bibliothecaire
  passage: 1
  verdict: Vrai
  explication: Le point 1 du dispositif de l'arrêt Weiss (C-493/17) dit pour droit que l'examen des questions n'a
    révélé aucun élément de nature à affecter la validité de la décision (UE) 2015/774 de la BCE du 4 mars 2015,
    relative au programme d'achats d'actifs du secteur public sur les marchés secondaires.
  statut: verifiee
