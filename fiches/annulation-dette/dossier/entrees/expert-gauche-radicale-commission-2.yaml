    texte: "Je n'ai pas de source qui isole la part des intérêts sur titres de l'État dans le résultat de la Banque de France. Le lien entre ces intérêts et les sommes reversées (F19, F20) reste non établi (F41), comme le dit déjà A23 en parlant de flux variable (F21). Je ne peux pas le chiffrer."
    elements: []
