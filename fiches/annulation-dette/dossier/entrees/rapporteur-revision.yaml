# Second et dernier tour : seulement pour aligner le traitement (même lacune, même relance).
- these: T2
  partis: [PCF]
  question_posee: "Que répondez-vous à T3 (A46), selon laquelle l'achat des titres sur le marché secondaire (F24, F44) établit la régularité de l'achat, non l'interdiction de leur traitement ultérieur ? (même question que R1 pour T1)"
