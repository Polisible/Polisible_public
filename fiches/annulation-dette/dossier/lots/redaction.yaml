    partis: *id002
  arguments:
  - id: A4
    auteur: centre
    question: Q45
    position: oui
    enonce: 'Les titres détenus par la banque centrale sont des titres de l''État comme les autres : ils arrivent
      à échéance et sont remboursés. Les effacer unilatéralement porterait atteinte à la signature de la France.'
    raisonnement: 'Les titres ont été achetés sur le marché secondaire (F24) : la banque centrale a payé les vendeurs,
      et ses engagements envers eux demeurent. Distinguer les créanciers que l''on rembourse de ceux que l''on ne
      rembourse pas ferait de la parole de l''État un choix variable. Le respect intégral des engagements est ce
      qui permet à la France d''emprunter durablement (F25 : le coût de l''emprunt est déjà élevé).'
    porte_par: '**Édouard Philippe** (président d''Horizons, HOR), 27 août 2026 [S17, S51]'
    repond_a: null
    affirmations:
    - F24 [fait, Vrai] Les titres de dette française détenus par l'Eurosystème ont été achetés sur le marché secondaire,
      auprès d'institutions financières, et non directement auprès de l'État. (sources S19)
    - F25 [fait, Plutôt vrai] Le 24 août 2026, le taux d'intérêt de la France à 10 ans était de 4,11 %, après avoir
      dépassé 4,14 % le jeudi précédent, son plus haut niveau depuis 2008. — La dépêche AFP reprise par MoneyVox
      le 24 août 2026 donne bien 4,11 % le lundi et plus de 4,14 % le jeudi précédent, au plus haut depuis 2008.
      C'est une valeur de la matinée, rapportée par la presse ; aucune série officielle de clôture (Banque de France,
      Agence France Trésor) n'a été consultée. (sources S16)
  - id: A7
    auteur: droite
    question: Q45
    position: oui
    enonce: 'Un État doit rembourser sa dette, y compris quand le créancier est la banque centrale : l''État engage
      son peuple, et renoncer à une dette ferait perdre la confiance qui permet d''emprunter.'
    raisonnement: Une dette est un engagement pris au nom des contribuables. Si l'État peut s'en délier, aucun engagement
      futur n'est crédible. Une dette lourde appelle une redéfinition des priorités de dépense, non sa disparition
      ; cette position date de décembre 2020 et ne porte pas sur la proposition d'août 2026.
    porte_par: '**Jean-François Husson** (sénateur, rapporteur de la commission des finances du Sénat, LR), 28 décembre
      2020 [S21]'
    repond_a: null
    affirmations:
    - 'F28 [valeur, sans verdict] Un État doit honorer ses dettes : en s''engageant, il engage son peuple, c''est-à-dire
      ses contribuables, et la parole donnée doit garder sa valeur. (sources S21)'
  - id: A10
    auteur: ecologistes
    question: Q45
    position: non
    enonce: Un État n'a pas à rembourser intégralement une dette détenue par sa banque centrale, qui n'est pas due
      à un créancier extérieur à la sphère publique. La marge dégagée peut financer la transition écologique.
    raisonnement: Les titres publics détenus par l'Eurosystème (environ 640 milliards d'euros pour la France en
      2026, F31) sont le résultat d'achats de politique monétaire, non d'un prêt consenti par un épargnant ou un
      investisseur privé. Les intérêts versés à la banque centrale reviennent en partie à l'État (F7, F20). Comme
      l'Europe a besoin de 800 milliards d'euros d'investissements supplémentaires par an (F32), maintenir cette
      dette au bilan pour la rembourser prive l'investissement climatique d'une marge qui existe. Le parti a déjà
      proposé en 2020 de lier annulation de dette auprès de la BCE et financement de la reconstruction écologique
      (F34).
    porte_par: '**LE**, 15 juin 2020 [S24]'
    repond_a: null
    affirmations:
    - 'F31 [fait, Plutôt vrai] L''Eurosystème (BCE et banques centrales nationales) détient environ 640 milliards
      d''euros de titres publics français en 2026. — La chronique de Politis (14 septembre 2026) ne cite pas d''origine,
      mais les données de la BCE ouvertes le 10 novembre 2026 donnent un ordre de grandeur voisin : achats nets
      cumulés de titres publics français de 359,5 milliards d''euros au titre du PSPP et 237,5 milliards au titre
      du PEPP fin octobre 2026, soit environ 597 milliards (au coût amorti, émetteurs publics français y compris
      hors État), après environ 400 milliards pour le seul PSPP fin 2025. Le chiffre de 640 milliards correspond
      au début de 2026 ; le stock baisse au fil de l''année. (sources S23, S46, S47)'
    - F32 [fait, Plutôt vrai] Les investissements supplémentaires nécessaires à l'Union européenne sont estimés
      à 800 milliards d'euros par an (rapport Draghi, 2024). — Le rapport Draghi (Commission européenne, septembre
      2024) chiffre l'investissement supplémentaire nécessaire à « un minimum » de 750 à 800 milliards d'euros par
      an, soit 4,4 à 4,7 % du PIB de l'UE de 2023, d'après les estimations de la Commission. Le chiffre de 800 milliards
      est le haut de cette fourchette. (sources S23, S44)
    - F34 [fait, Vrai] En juin 2020, le parti Les Verts (EELV) a présenté un plan de reconstruction écologique financé
      par une annulation de la dette française auprès de la BCE et par une fiscalité plus juste, dont le rétablissement
      de l'ISF. (sources S24)
    - F7 [fait, Vrai] Le revenu monétaire des banques centrales nationales est réparti à la fin de chaque exercice
      (Q43). (sources S1)
    - 'F20 [fait, Vrai] La Banque de France est un contributeur au budget de l''État : 36,8 milliards d''euros versés
      depuis 2015 (Q43). (sources S7)'
  - id: A17
    auteur: extreme-gauche
    question: Q45
    position: non
    enonce: Un État ne doit pas rembourser une dette illégitime, construite par des cadeaux aux plus riches et aux
      grandes entreprises. Un audit citoyen établit qui a prêté, à quel taux et quelle part est remboursée, et un
      moratoire suspend les paiements.
    raisonnement: Si la dette résulte de choix de politique qui ont profité aux créanciers et aux entreprises plutôt
      qu'à la population, l'obligation de la rembourser intégralement ne va pas de soi. Le critère n'est pas l'identité
      du créancier mais la légitimité de la dette, que l'audit doit établir ; ce critère conduit à ne pas rembourser
      les dettes illégitimes, banque centrale ou non.
    porte_par: '**NPA**, décembre 2011 [S37]'
    repond_a: null
    affirmations:
    - F43 [valeur, sans verdict] Une dette construite par des cadeaux fiscaux aux plus riches et aux grandes entreprises
      est illégitime et n'a pas à être payée. (sources S37)
  - id: A26
    auteur: gauche-radicale
    question: Q45
    position: non
    enonce: La dette détenue par la banque centrale, institution publique des États, peut être annulée sans spolier
      les créanciers privés. Ceux-ci, dont des épargnants, doivent être honorés.
    raisonnement: 'La banque centrale appartient aux États de l''Union : la dette envers elle est une dette envers
      soi-même (F51). La différence avec les créanciers privés, dont des épargnants, justifie une annulation limitée
      à la seule part de la banque centrale (F52).'
    porte_par: '**Fabien Roussel** (député, PCF), 22 mars 2021 [S41, S52]'
    repond_a: null
    affirmations:
    - F51 [valeur, sans verdict] La dette publique détenue par la banque centrale est une dette envers une institution
      publique, dont les propriétaires sont les États de l'Union, et non envers des créanciers privés. (sources
      S41)
    - F52 [valeur, sans verdict] Une annulation doit se limiter à la dette détenue par la banque centrale, sans
      spolier les créanciers privés, dont des épargnants. (sources S41)
  - id: A27
    auteur: gauche-radicale
    question: Q45
    position: non
    enonce: Une dette publique inscrite au bilan de la banque centrale peut être constatée comme non remboursable,
      sans léser les créanciers privés. La rembourser intégralement n'a pas de finalité économique et pèse sur la
      capacité d'investir de l'État.
    raisonnement: Les achats massifs de titres ont été faits par la banque centrale elle-même ; les rembourser intégralement
      n'a pas de finalité économique, alors qu'ils pèsent sur la capacité d'investir de l'État. Acter qu'ils ne
      seront pas payés ne lèse aucun créancier privé (F46, F53).
    porte_par: '**Jean-Luc Mélenchon** (ancien candidat à l''élection présidentielle de 2022, LFI), 6 juin 2022
      [S40, S19]'
    repond_a: null
    affirmations:
    - F53 [valeur, sans verdict] Une dette publique inscrite au bilan de la banque centrale peut être constatée
      comme non remboursable. (sources S40)
    - F46 [fait, Plutôt vrai] La proposition vise la part de la dette française détenue par la Banque de France
      pour le compte de l'Eurosystème ; elle laisse inchangés les titres détenus par les autres créanciers. — Public
      Sénat (25 août 2026) établit que la proposition de Jean-Luc Mélenchon vise les titres détenus par la Banque
