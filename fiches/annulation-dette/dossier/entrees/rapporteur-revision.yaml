- these: T24
  partis: [HOR, RE]
  question_posee: "Votre thèse T24 suppose que les sommes versées par la Banque de France à l'État reposent en partie sur ces intérêts (F41 Pas d'estimation fiable). Avez-vous une source qui isole la part de ces intérêts dans son résultat ? (même question que R7)"
- these: T25
  partis: [RN]
  question_posee: "Votre thèse T25 présuppose que les économies prévues (F37, F38) seraient obtenues et dégageraient les marges annoncées, ce qu'aucune affirmation du dossier n'établit. Avez-vous une source d'institution ? (même question que R20)"
