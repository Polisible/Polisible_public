    niveau: 2
    pour: F32
    extrait: "To meet the objectives laid out in this report, a minimum annual additional investment of EUR 750 to 800 billion is needed, based on the latest Commission esti- mates, corresponding to 4.4-4.7% of EU GDP in 2023."
