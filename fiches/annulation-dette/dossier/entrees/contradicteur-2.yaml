# ------------------------------------------------------------------ Q47 (point soumis : T25/T36)
- these: T25
  critere: raisonnement
  avis: confirme
  justification: "La différence avec T36 est fondée : A14 corrigé (réponse à R32) donne une raison propre contre l'annulation (la cause visée, le déficit, F22), quand A8 la déduit du seul silence du plan (F29, F30). La lacune d'attribution au plan (F37, F38, F39) ne porte donc pas sur la conclusion. Mais cette raison propre doit alors être examinée dans l'appui (voir T25/appui)."
- these: T25
  critere: appui
  avis: conteste
  justification: "Depuis R32, la conclusion repose sur un présupposé central : l'annulation de la part de l'Eurosystème ne traiterait pas le déficit. Aucune affirmation ne le porte (F22 donne le montant de la charge, non cet effet) ; T31 (A13, même parti) et T8 tiennent même pour plausible une baisse de la charge d'intérêts, non chiffrée (F41). F37, F38, F39 décrivent le plan, point secondaire de l'énoncé. T26 a reçu « faible » pour la même structure (présupposé central non porté, F26 ; F20 vérifié sur un point secondaire), et T24 n'est pas comparable, sa raison centrale (gain net incertain) étant établie par F41. Ma proposition antérieure (« partiel », par analogie avec T24) précédait cette correction de A14."
  proposition: "appui : faible — le présupposé central, que l'annulation ne traiterait pas le déficit, n'est porté par aucune affirmation (F22 donne la charge, non cet effet ; T31 et T8 tiennent une baisse de la charge pour plausible, F41) ; F37, F38, F39 établissent le contenu du plan, point secondaire, et la réalisation des économies n'est pas établie (réponse à R32)."
- these: T25
  critere: conclusion
  avis: conteste
  justification: "Conséquence de T25/appui : appui faible donne « ne tient pas » (§ 3), comme T26 dont le présupposé central n'est pas davantage porté."
  proposition: ne tient pas
- these: T36
  critere: appui
  avis: conteste
  justification: "Lacune essentielle confirmée (silence du plan pris pour un refus, F29, F30, réponses à R21 et R33), et sa différence avec T25 est fondée. Mais avec la règle de T26, une thèse dont le seul point central (les économies dégagent les marges, réponse à R33) n'est porté par aucune affirmation, F29 et F30 ne décrivant que le plan, a un appui faible. Conclusion inchangée (ne tient pas)."
  proposition: "appui : faible — F29 et F30 établissent le contenu du plan ; que ses économies soient obtenues et dégagent des marges n'est porté par aucune affirmation (réponse à R33), et aucune source datée ne donne la position du parti sur l'annulation (réponse à R21). Conclusion inchangée."
- these: T24
  critere: conclusion
  avis: confirme
  justification: "Examen confirmé après R31 : la raison centrale (gain net incertain) est établie par l'absence d'estimation (F41) ; la croissance par la baisse du coût du travail, non portée (réponse à R20), justifie l'appui partiel."
- these: T37
  critere: conclusion
  avis: confirme
  justification: "Examen confirmé : la seule affirmation d'effet est F49 (Pas d'estimation fiable), F55 est une valeur ; même appréciation que T27."
# ------------------------------------------------------------------ Réponses aux questions
- these: Q41
  critere: conclusion
  avis: confirme
  justification: "La réponse découle des examens : certitude Invérifiable (F27, F45) ; T1, T2 et T3 « ne tiennent pas » pour des lacunes symétriques (extension de l'interdiction, silence pris pour permission) ; T1 désignée la plus solide du non par ses objections « en partie » contre « sans réponse » pour T2."
- these: Q42
  critere: conclusion
  avis: conteste
  justification: "La réponse affirme, sous une certitude « Pas d'estimation fiable » (F26, F47), que T6 « tient » et que « l'effet dépend de la voie » : c'est une affirmation d'effet qu'aucune estimation ne porte (voir T6/appui, T6/raisonnement), alors que T4 et T5 sont écartées précisément faute d'estimation. La même rigueur n'est pas appliquée à la thèse nuancée."
  proposition: "Reprendre la phrase sur T6 selon la décision sur T6 (tient en partie) et n'attribuer à T6 que ce que sa portée établit : la rupture unilatérale ne s'applique pas à une décision du conseil (F3, F5, F60), sans estimation de l'effet (F26)."
- these: Q43
  critere: conclusion
  avis: confirme
  justification: "La réponse découle des examens : certitude Pas d'estimation fiable (F41, F49) ; T8 et T31 « tiennent en partie », T7 et T9 « ne tiennent pas » pour des raisons symétriques (un gain net inconnu n'exclut ni n'établit une baisse durable)."
- these: Q44
  critere: conclusion
  avis: conteste
  justification: "Point soumis par le rapporteur. 1) Une seule certitude, « Pas d'estimation fiable », couvre deux volets : elle vaut pour la crédibilité (F27, F58, F61), non pour l'indépendance, que la réponse tranche par des textes (F3, F4, F5), sous condition d'une voie qu'aucune source n'établit (réponses à R9, R11, R29). 2) La réponse classe T10 (oui) parmi les thèses qui « tiennent » et T12, T13 (non) parmi celles qui « tiennent en partie », pour le même raisonnement conditionnel : la même rigueur n'est pas appliquée aux deux positions (voir T10, T13)."
  proposition: "Préciser dans le texte que la certitude vaut pour le volet crédibilité, et que le volet indépendance dépend de la voie, non établie (R9, R11, R29) ; ou remonter au fondateur le format d'une question à deux volets. Reprendre la phrase sur T10 selon la décision sur T10/regroupement."
- these: Q45
  critere: conclusion
  avis: conteste
  justification: "La réponse range T33 avec T17 sous un présupposé « établi » (vendeurs payés, F24, F44). Or l'examen de T33 dit que le présupposé qui donne la réponse « non », l'illégitimité d'une part de la dette, n'est porté par aucune affirmation (appui partiel, F43, réponse à R18). La réponse donne le présupposé non établi de T15 (F26), T16 (F26) et T19 (F43), mais tait celui de T33 : rigueur inégale."
  proposition: "Distinguer T33 de T17 : indiquer pour T33, comme pour T15, T16 et T19, que son critère (la légitimité, F43) repose sur un présupposé non établi (réponse à R18)."
- these: Q46
  critere: conclusion
  avis: conteste
  justification: "La réponse qualifie le présupposé de T21 (« établi », F3, F5) et ceux de T20 et T34 (« pas établis »), mais ne donne aucun statut aux présupposés de T23, pourtant vérifiés (F39 Vrai, F40 Plutôt vrai, appui solide), ni la limite de sa portée (ces propositions ne visent pas les titres détenus par l'Eurosystème). Même méthode non appliquée à une position."
  proposition: "Indiquer pour T23, comme pour T21, le statut de ses présupposés (F39, F40 vérifiés) et ce qu'ils ne couvrent pas (portée de T23)."
- these: Q47
  critere: conclusion
  avis: conteste
  justification: "1) T26 est rattachée à la marge nette non chiffrée (F41, F49), alors que son examen écarte la seule part de la banque centrale et retient comme présupposé central non porté le montant des intérêts versés aux créanciers privés et l'effet sur l'emprunt (F26, réponse à R22). 2) La réponse dit que les deux préférences reposent sur un présupposé non établi (marge nette ; économies obtenues), puis conclut « ne tiennent pas » d'un côté (T26, T27) et « tiennent en partie » de l'autre (T24, T25) sans dire ce qui les distingue ; pour T25, cette différence ne découle pas des examens (voir T25/appui)."
  proposition: "Rattacher T26 à son propre présupposé (F26, réponse à R22) ; reprendre la phrase sur T25 selon la décision sur T25/appui ; pour T24, nommer la raison qui la distingue (gain net incertain, établi par F41)."
