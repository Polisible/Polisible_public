  auteur: droite
  question: Q47
  position: contre
  enonce: Pour dégager des marges budgétaires, la voie retenue par le candidat LR est de réduire la dépense publique
    et de rétablir un excédent primaire, plutôt que de toucher à la dette elle-même.
  raisonnement: 'Le candidat juge la France « quasiment en faillite », avec un taux à 10 ans proche de 5 % (Public
    Sénat, 12 octobre 2026). Son plan finance l''effort par des économies sur l''État et les dépenses sociales,
    et vise un excédent primaire en 2030 puis un déficit sous 3 % en 2031 : les marges viennent de la dépense maîtrisée,
    non d''un allègement du stock de dette. Attention : le plan ne mentionne pas l''annulation ; cet argument en
    est la lecture par le choix des moyens.'
  porte_par: Bruno Retailleau, candidat LR à la présidentielle 2027 (plan présenté le 12 octobre 2026) (LR, S22)
  repond_a: null
  affirmations:
  - F29 [fait, Vrai] Le plan de redressement budgétaire de Bruno Retailleau, présenté le 12 octobre 2026, prévoit
    un effort de 197 milliards d'euros sur cinq ans, dont 56 milliards d'allègements fiscaux, l'essentiel de l'effort
    allant à l'amélioration du solde. (sources S22)
  - F30 [fait, Vrai] Ce plan fait reposer l'essentiel de l'effort sur l'État, dont il questionne le périmètre, et
    sur les dépenses sociales. (sources S22)
