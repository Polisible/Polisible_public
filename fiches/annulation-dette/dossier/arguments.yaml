  question: Q41
  position: non
  enonce: 'L''absence du mot « annulation » dans les traités ne vaut pas autorisation : l''article 123 s''applique
    selon son objet, éviter le financement monétaire des États. Les arrêts cités portent sur les achats de titres,
    pas sur leur sort ultérieur.'
  porte_par:
  - personne: Roland Lescure
    fonction: ministre de l'Économie
    parti: RE
    date: '2026-08-24'
    source: S16
    appartenance: S49
  affirmations:
  - F45
  - F9
  - F10
  - F5
  - F3
  raisonnement: 'F45 (le texte ne mentionne pas l''annulation) établit seulement un silence. F10 porte sur la validité
    de la décision 2015/774, donc sur les achats, et F9 montre que la Cour valide ces achats à condition de garanties
    contre le financement monétaire : elle raisonne par l''effet, non par la liste des actes interdits. Rien dans
