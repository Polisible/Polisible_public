        ; la conclusion de l'énoncé, limitée à « moins que le montant brut », n'en dépend pas.
    portee:
      texte: établit que la Banque de France verse impôt et dividendes à l'État (F19, F20) et rend plausible que
        ces versements dépendent en partie des intérêts perçus (F41) ; ne prouve pas l'ampleur du recul, ni que
        le gain serait faible ou nul.
    objections:
      valeur: répondues
      justification: Aucun argument d'une autre thèse ne vise le raisonnement de A13 ; l'objection O1 du vérificateur
