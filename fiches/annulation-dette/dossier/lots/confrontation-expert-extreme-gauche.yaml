    enonce: 'La Banque de France est un contributeur au budget de l''État : 36,8 milliards d''euros versés depuis
      2015 (Q43).'
    type: fait
    verdict: Vrai
    explication: 'Le document de la Banque de France sur l''exercice 2025 (mars 2026) indique 36,8 Md€ versés au
      budget de l''État depuis 2015. Ce total couvre 2015-2025 et réunit impôt sur les sociétés, dividendes et restitution
      d''excédents : la fiche doit préciser cette composition.'
