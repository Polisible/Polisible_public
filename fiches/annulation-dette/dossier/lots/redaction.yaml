- id: Q47
  enonce: Pour dégager des marges budgétaires, l'annulation d'une partie de la dette est-elle préférable aux économies,
    à la hausse des recettes ou à la recherche de croissance ?
  type: valeur
  sans_position: null
  arguments:
  - id: A6
    auteur: centre
    question: Q47
    position: non
    enonce: Le gain net de l'annulation pour l'État est incertain, car la Banque de France lui verse déjà des bénéfices
      qui reposent en partie sur ces intérêts. Équilibrer les comptes et alléger le coût du travail sont les leviers
      retenus.
    raisonnement: 'La Banque de France verse des sommes à l''État (F20, F19 : impôt de 1,5 milliard d''euros et
      résultat net de 8,1 milliards en 2025, F18). Si l''opération réduit les intérêts payés par l''État, elle réduit
      aussi ce que la banque lui verse, de sorte que la marge nette est inférieure au gain brut (voir Q43). Pour
      dégager une marge durable, les leviers sont les économies, un budget équilibré, et la croissance par la baisse
      du coût du travail.'
    porte_par: '**Édouard Philippe** (candidat à l''élection présidentielle de 2027, HOR), 27 août 2026 [S17, S51];
      **Gabriel Attal** (candidat à l''élection présidentielle de 2027, RE), 27 août 2026 [S17, S50]'
    repond_a: null
    affirmations:
    - F18 [fait, Vrai] Le 24 mars 2026, la Banque de France annonce un bénéfice net de 8,1 milliards d'euros pour
      l'exercice 2025 (Q43). (sources S8)
    - F19 [fait, Vrai] Pour l'exercice 2025, la Banque de France verse un impôt sur les bénéfices de 1,5 milliard
      d'euros avant d'atteindre un résultat net de 8,1 milliards (Q43). (sources S7)
    - 'F20 [fait, Vrai] La Banque de France est un contributeur au budget de l''État : 36,8 milliards d''euros versés
      depuis 2015 (Q43). (sources S7)'
  - id: A8
    auteur: droite
    question: Q47
    position: non
    enonce: Pour dégager des marges budgétaires, la voie retenue est de réduire la dépense publique et de viser
      un excédent primaire, plutôt que de toucher au stock de dette.
    raisonnement: 'Le plan présenté le 12 octobre 2026 finance l''effort par des économies sur l''État et les dépenses
      sociales (F30), avec un déficit sous 3 % en 2031. Les marges viennent de la dépense maîtrisée. Le plan ne
      mentionne pas l''annulation : l''argument en est une lecture par le choix des moyens.'
    porte_par: '**Bruno Retailleau** (candidat à l''élection présidentielle de 2027, LR), 12 octobre 2026 [S22]'
    repond_a: null
    affirmations:
    - F29 [fait, Vrai] Le plan de redressement budgétaire de Bruno Retailleau, présenté le 12 octobre 2026, prévoit
      un effort de 197 milliards d'euros sur cinq ans, dont 56 milliards d'allègements fiscaux, l'essentiel de l'effort
      allant à l'amélioration du solde. (sources S22)
    - F30 [fait, Vrai] Ce plan fait reposer l'essentiel de l'effort sur l'État, dont il questionne le périmètre,
      et sur les dépenses sociales. (sources S22)
  - id: A12
    auteur: ecologistes
    question: Q47
    position: nuance
    enonce: L'annulation de dette auprès de la BCE n'est pas présentée comme une alternative aux recettes fiscales
      et à l'investissement, mais comme un levier à combiner avec eux. Le critère est l'usage de la marge dégagée.
    raisonnement: 'Le parti ne classe pas les leviers : en 2020 il associait annulation de la dette auprès de la
      BCE et rétablissement de l''ISF (F34) ; en 2025 il proposait 28,5 milliards d''euros de recettes fiscales
      (F35) et un retour à 3,7 % de déficit en 2030, plus lent que celui du gouvernement (F36). Le critère est l''usage
      de la dette et de la marge dégagée : « bonne » dette quand elle finance le climat et la justice sociale, «
      mauvaise » dette sinon, selon la formule de sa secrétaire nationale.'
    porte_par: '**LE**, 15 juin 2020 [S24]; **LE**, 4 septembre 2025 [S25]; **Marine Tondelier** (cheffe de file
      des écologistes, LE), 20 juin 2024 [S27]'
    repond_a: null
    affirmations:
    - F34 [fait, Vrai] En juin 2020, le parti Les Verts (EELV) a présenté un plan de reconstruction écologique financé
      par une annulation de la dette française auprès de la BCE et par une fiscalité plus juste, dont le rétablissement
      de l'ISF. (sources S24)
    - F35 [fait, Vrai] Le plan présenté par Les Écologistes en septembre 2025 comprenait 28,5 milliards d'euros
      de recettes fiscales, notamment par la taxe Zucman et une contribution exceptionnelle sur les grandes entreprises.
      (sources S25)
    - F36 [fait, Vrai] Le plan présenté par Les Écologistes en septembre 2025 prévoyait de ramener le déficit public
      à 3,7 % du PIB en 2030, soit une réduction plus progressive que celle du gouvernement de l'époque. (sources
      S25)
  - id: A14
    auteur: extreme-droite
    question: Q47
    position: non
    enonce: 'Pour dégager des marges budgétaires, l''annulation de dette n''est pas préférable aux économies : la
      voie du RN est la réduction des dépenses, dont celles liées à l''immigration, jointe à une règle d''or votée
      par référendum.'
    raisonnement: La charge de la dette (65,7 Md€ en 2025) pèse sur le budget parce que le déficit continue d'alimenter
      la dette ; seule une baisse durable du déficit la stabilise. Le plan du RN fait des économies la condition
      du retour de la dette sous 112 % du PIB en 2032, et la règle d'or vise à rendre cet effort contraignant. Une
      annulation de la part détenue par l'Eurosystème ne traiterait pas la cause du déficit.
    porte_par: '**Marine Le Pen** (candidate à l''élection présidentielle de 2027, RN), 6 octobre 2026 [S31]; **Marine
      Le Pen** (présidente du groupe RN à l''Assemblée nationale et candidate à l''élection présidentielle de 2027,
      RN), 1er octobre 2026 [S32]'
    repond_a: null
    affirmations:
    - F22 [fait, Vrai] En 2025, la charge de la dette de l'ensemble des administrations publiques atteint 65,7 milliards
      d'euros, soit 2,2 points de PIB (Cour des comptes, juin 2026) (Q43). (sources S11)
    - F37 [fait, Vrai] Le RN propose, dans son plan présenté le 6 octobre 2026, 140 milliards d'euros d'économies
      d'ici 2032, pour ramener la dette de 121 % du PIB en 2027 à 112 % en 2032. (sources S31)
    - F38 [fait, Vrai] Le plan du RN présenté le 6 octobre 2026 attend de la maîtrise de l'immigration 15 milliards
      d'euros d'économies en 2027. (sources S31)
    - F39 [fait, Vrai] Marine Le Pen propose d'inscrire une règle d'or budgétaire dans la Constitution par référendum,
      pour limiter le déficit public. (sources S32)
  - id: A18
    auteur: extreme-gauche
    question: Q47
    position: nuance
    enonce: Les marges budgétaires viennent des recettes tirées des profits et de l'arrêt des aides aux entreprises,
      non d'économies sur les budgets utiles à la population. L'annulation d'une part précise de la dette n'est
      pas proposée.
    raisonnement: Si la dette a été creusée par des aides aux entreprises (270 milliards d'euros par an d'aides
      et d'exonérations, chiffre cité par LO), alors supprimer ces aides et taxer les profits est préférable aux
      économies sur les services publics, que cette position refuse. L'annulation n'est pas retenue comme voie principale.
    porte_par: '**Nathalie Arthaud** (candidate à l''élection présidentielle de 2027, LO), juin 2026 [S35]'
    repond_a: null
    affirmations:
    - 'F42 [fait, Invérifiable] Les aides publiques et exonérations versées chaque année aux entreprises privées
      atteignent 270 milliards d''euros (chiffre cité par Lutte ouvrière, en 2026). — La brochure de Lutte ouvrière
      (juin 2026) cite bien 270 milliards, sans origine ni méthode. Les estimations publiques connues dépendent
      du périmètre retenu : la commission d''enquête du Sénat (juillet 2025) retient 211 milliards d''euros pour
      2023, présentés comme un plancher, et le Haut-commissariat à la stratégie et au plan 111,9 milliards (selon
      Public Sénat, 15 septembre 2025). Aucune source officielle ouverte ne donne 270 milliards. (sources S35)'
  - id: A19
    auteur: extreme-gauche
    question: Q47
    position: oui
    enonce: 'L''annulation de la dette publique est préférable à l''austérité : elle libère l''argent des intérêts
      pour des investissements et des emplois utiles à la population. Elle doit porter sur les dettes illégitimes,
      non sur la seule part de la banque centrale.'
    raisonnement: Si les intérêts payés aux créanciers privés absorbent des sommes qui financeraient des emplois
      publics (le tract NPA les chiffre à l'équivalent d'un million d'emplois en 2011), alors l'annulation dégage
      plus de marges que des économies qui frappent la population. La part détenue par la banque centrale étant
      reversée à l'État, annuler seulement celle-ci est jugé une diversion.
    porte_par: '**NPA**, décembre 2011 [S37]'
    repond_a: null
    affirmations:
    - 'F20 [fait, Vrai] La Banque de France est un contributeur au budget de l''État : 36,8 milliards d''euros versés
      depuis 2015 (Q43). (sources S7)'
  - id: A30
    auteur: gauche-radicale
    question: Q47
    position: oui
    enonce: L'annulation ou le gel de la dette détenue par la banque centrale évite un nouveau cycle d'austérité
      et ne coûte rien à personne. Elle permet de financer services publics et investissements sans économies.
    raisonnement: Un nouveau cycle d'austérité réduit la demande, la consommation et l'investissement public (F54).
      Une opération qui, selon ses défenseurs, ne coûte à personne et n'a pas d'impact économique (F47) permet de
      financer services publics et investissements sans économies.
    porte_par: '**Jean-Luc Mélenchon** (ancien candidat à l''élection présidentielle de 2022, LFI), 6 juin 2022
      [S40, S19]; **Jean-Luc Mélenchon** (candidat à l''élection présidentielle de 2027, LFI), 25 août 2026 [S19]'
    repond_a: null
    affirmations:
    - F54 [valeur, sans verdict] Dégager des marges budgétaires sans économies sur les dépenses est préférable à
      un nouveau cycle d'austérité. (sources S40, S19)
    - F47 [estimation, Pas d'estimation fiable] L'annulation ou le gel en dette perpétuelle de la dette détenue
      par l'Eurosystème n'aurait pas d'effet sur le coût auquel la France emprunte. — La seule source rapporte l'avis
      de Jean-Luc Mélenchon (« aucun impact économique et aucun impact financier »), que l'article (Public Sénat,
      25 août 2026) dit contesté par des économistes. Aucune institution n'a publié d'estimation chiffrée de l'effet
      sur le coût d'emprunt dans le dossier. (sources S19)
  - id: A31
    auteur: gauche-radicale
    question: Q47
    position: nuance
    enonce: L'annulation partielle est une voie parmi d'autres. Elle s'accompagne d'une mise à contribution du capital
      et de la lutte contre l'évasion fiscale, qui dégagent aussi des recettes.
    raisonnement: 'L''annulation de la part de la banque centrale dégage des marges (F49) mais ne suffit pas : l''État
      a aussi besoin de recettes, que la fiscalité du capital et la lutte contre l''évasion fiscale peuvent apporter
      (F55). Les deux leviers sont complémentaires, et l''austérité est écartée.'
    porte_par: '**Fabien Roussel** (député, PCF), 22 mars 2021 [S41, S52]'
    repond_a: null
    affirmations:
    - F49 [estimation, Pas d'estimation fiable] L'annulation de la part de la dette détenue par la banque centrale
      dégagerait immédiatement des marges financières importantes pour l'État. — La seule source est l'intervention
      de Fabien Roussel à l'Assemblée nationale (22 mars 2021), sans chiffrage ni méthode. Aucune estimation d'institution
      sur les marges que dégagerait l'annulation n'est au dossier. (sources S41)
    - F55 [valeur, sans verdict] Le capital doit être mis à contribution pour financer les besoins de l'État, en
      complément de l'annulation partielle de la dette détenue par la banque centrale. (sources S41)
  - id: A36
    auteur: sociaux-democrates
    question: Q47
    position: nuance
    enonce: 'L''effacement se substitue aux autres leviers s''il est conditionné : les États s''engagent à investir
      les montants effacés. Sans cette contrepartie, il ne dégagerait pas de marge utile.'
    raisonnement: 'Rembourser exige de réemprunter, de relever les impôts ou de réduire les dépenses (F17 pour l''ampleur
      de la détention). L''effacement évite ces trois choix, mais le texte de 2021 en fait un échange : le même
      montant doit être investi dans la reconstruction écologique et sociale (F59). L''effacement n''est donc pas
      présenté comme préférable en soi, mais comme un contrat avec un usage défini.'
    porte_par: '**Aurore Lalucq** (députée européenne, PP), 5 février 2021 [S43, S53]'
    repond_a: null
    affirmations:
    - F59 [fait, Vrai] Le texte de 2021 propose que la BCE efface ses créances sur les États (ou les convertisse
      en dettes perpétuelles sans intérêt) en échange de l'engagement des États d'investir les mêmes montants dans
      la reconstruction écologique et sociale. (sources S43)
    - F17 [fait, Vrai] Au premier trimestre 2025, la catégorie « autres français », dont la Banque de France pour
      le compte de la BCE, représentait 24,4 % de la dette négociable de l'État (Q41). (sources S10)
  valeurs:
  - V3 Priorité à l'équilibre des comptes et aux leviers durables (économies, compétitivité, croissance) plutôt
    qu'à l'annulation d'une partie de la dette. — **Édouard Philippe** (président d'Horizons, HOR), 27 août 2026
    [S17, S51]
  - V5 Priorité à la maîtrise de la dépense publique et au retour à l'équilibre des comptes plutôt qu'à un allègement
    de la dette. — **Bruno Retailleau** (candidat à l'élection présidentielle de 2027, LR), 12 octobre 2026 [S22]
  - V8 Priorité à l'usage de la dette et de la marge dégagée, au service du climat et de la justice sociale, plutôt
    qu'au choix d'un levier budgétaire unique. — **Marine Tondelier** (secrétaire nationale, LE), 20 juin 2024 [S27]
  - V21 Priorité à la maîtrise de la dépense et au retour à l'excédent primaire plutôt qu'à un allègement du stock
    de dette. — **Bruno Retailleau** (candidat à l'élection présidentielle de 2027, LR), 12 octobre 2026 [S22]
  - V23 Priorité à la mise à contribution du capital et des profits, et au refus de faire payer la dette à la population
    par des économies. — **Nathalie Arthaud** (candidate à l'élection présidentielle de 2027, LO), juin 2026 [S35]
  - V26 Priorité à dégager des marges par l'annulation de la part de la banque centrale et par des recettes sur
    le capital et l'évasion fiscale, plutôt que par des économies. — **Fabien Roussel** (député, PCF), 22 mars 2021
    [S41, S52]
  - V30 Priorité à la maîtrise de la dépense et au rétablissement d'un excédent primaire avant tout allègement du
    stock de dette. — **Bruno Retailleau** (candidat à l'élection présidentielle de 2027, LR), 12 octobre 2026 [S22]
affirmations_hors_argument:
- id: F6
  enonce: La BCE et les banques centrales nationales peuvent intervenir sur les marchés de capitaux pour atteindre
    les objectifs du SEBC (Q41).
  type: fait
  verdict: Vrai
  explication: L'article 18.1 des statuts du SEBC et de la BCE autorise la BCE et les banques centrales nationales
    à intervenir sur les marchés de capitaux afin d'atteindre les objectifs du SEBC. Cette faculté reste encadrée
    par l'interdiction de l'article 123 du TFUE.
  sources:
  - source: S1
    extrait: 'Afin d''atteindre les objectifs du SEBC et d''accomplir ses missions, la BCE et les banques centrales
      nationales peuvent:'
  declaration: false
- id: F11
  enonce: Christine Lagarde, présidente de la BCE, déclare le 12 septembre 2026 que l'annulation de la dette française
    détenue par la Banque de France serait financièrement très dangereuse et contraire aux traités (Q41, Q44).
  type: fait
  verdict: Vrai
  explication: 'Déclaration vérifiée : dans l''entretien avec Ouest-France publié par la BCE le 12 septembre 2026,
    Christine Lagarde qualifie l''annulation de la dette française détenue par la Banque de France de « financièrement
    très dangereux » et de « violation des traités européens ». Le verdict porte sur la réalité de la déclaration,
    pas sur son bien-fondé ; les termes jugeants doivent rester entre guillemets et attribués.'
  sources:
  - source: S4
    extrait: C'est financièrement très dangereux et il se trouve que c'est aussi une violation des traités européens.
  declaration: true
- id: F12
  enonce: Christine Lagarde déclare le 7 février 2021 que l'annulation de la dette publique détenue par la BCE,
    demandée par une pétition d'économistes, est inenvisageable (Q41).
  type: fait
  verdict: Vrai
  explication: 'Déclaration vérifiée : dans l''entretien avec Le Journal du Dimanche publié par la BCE le 7 février
    2021, Christine Lagarde répond à la pétition d''économistes que « l''annulation de cette dette est inenvisageable
    ». Le verdict porte sur la réalité de la déclaration.'
  sources:
  - source: S5
    extrait: L'annulation de cette dette est inenvisageable.
  declaration: true
- id: F13
  enonce: Christine Lagarde déclare le 7 février 2021 que cette annulation violerait le traité européen qui interdit
    le financement monétaire des États (Q41, Q44).
  type: fait
  verdict: Vrai
  explication: 'Déclaration vérifiée : dans le même entretien du 7 février 2021, Christine Lagarde ajoute que ce
    serait une violation du traité européen qui interdit strictement le financement monétaire des États. Le verdict
    porte sur la réalité de la déclaration ; l''interprétation juridique elle-même relève des affirmations sur le
    traité et la jurisprudence.'
  sources:
  - source: S5
    extrait: Ce serait une violation du traité européen qui interdit strictement le financement monétaire des Etats.
  declaration: true
- id: F14
  enonce: Christine Lagarde déclare le 2 juillet 2021 que l'annulation des dettes publiques serait contraire à la
    législation et aux traités (Q41).
  type: fait
  verdict: Vrai
  explication: 'Déclaration vérifiée : dans l''entretien avec La Provence publié par la BCE le 2 juillet 2021, Christine
    Lagarde répond sur l''annulation de la dette souveraine que c''est contraire à la législation et représenterait
    une violation des traités. Le verdict porte sur la réalité de la déclaration.'
  sources:
  - source: S6
    extrait: D'abord, c'est contraire à la législation et représenterait une violation des traités.
  declaration: true
- id: F15
  enonce: Christine Lagarde déclare le 2 juillet 2021 que la plupart des « dettes COVID » achetées par la politique
    monétaire sont inscrites au bilan de la Banque de France (Q41).
  type: fait
  verdict: Vrai
  explication: 'Déclaration vérifiée : dans le même entretien du 2 juillet 2021, Christine Lagarde indique que la
    plupart des « dettes COVID » de l''État français achetées sur le marché secondaire au titre de la politique
    monétaire sont inscrites au bilan de la Banque de France. Le verdict porte sur la réalité de la déclaration.'
  sources:
  - source: S6
    extrait: La plupart des « dettes COVID » contractées par l'Etat français et achetées sur le marché secondaire
      dans le cadre de la politique monétaire sont inscrites au bilan de la Banque de France
  declaration: true
- id: F23
  enonce: La prévision de charge de la dette pour 2026 atteint 77,4 milliards d'euros dans la loi de finances pour
    2026 (Cour des comptes, juin 2026) (Q43).
  type: fait
  verdict: Trompeur
  explication: Le chiffre de 77,4 Md€ (2,5 points de PIB, +11,7 Md€) figure bien dans la synthèse de la Cour des
    comptes de juin 2026, mais comme prévision de charge de la dette de l'ensemble des administrations publiques
    pour 2026 (« devrait »), sans être attribué à la loi de finances pour 2026. La mention de la LFI promulguée
    le 19 février 2026, dans la même page, porte sur la dépense publique (1 735 Md€), pas sur la charge de la dette
    ; l'énoncé doit dire « selon la Cour des comptes (juin 2026), pour l'ensemble des administrations publiques
    ».
  sources:
  - source: S11
    extrait: porter celle-ci à 77,4 Md€
  declaration: false
