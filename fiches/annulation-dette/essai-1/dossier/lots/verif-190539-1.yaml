sources_a_verifier: []
verdicts_a_attribuer:
- id: F1
  enonce: Dans une lettre de 2021, la présidente de la BCE a écrit que l'annulation de dettes publiques par la BCE
    n'est pas compatible avec les traités, car elle enfreindrait l'interdiction du financement monétaire (article
    123 du traité sur le fonctionnement de l'Union européenne, TFUE).
  type: fait
  sources:
  - source: S1
    niveau: 1
    statut: conforme
    note_verif: 'Bon document : lettre de Christine Lagarde à Manon Aubry, datée du 5 février 2021 (L/CL/21/22).
      F1, F22, F32 : extrait présent mot pour mot, même sens (incompatibilité avec les traités au titre de l''article
      123 TFUE).'
    extrait: l’annulation de dettes publiques par la BCE n’est pas compatible avec les traités, car elle enfreindrait
      l’interdiction du financement monétaire énoncée à l’article 123 du traité sur le fonctionnement de l’Union
      européenne.
- id: F2
  enonce: Le 11 septembre 2026, Christine Lagarde a jugé la proposition de Jean-Luc Mélenchon « vraiment pas une
    bonne idée » et, selon Euronews, a estimé qu'elle constituerait une « violation pure du traité ».
  type: fait
  sources:
  - source: S3
    niveau: 4
    statut: conforme
    note_verif: 'Bon article Euronews du 11 septembre 2026. F2 : « vraiment pas une bonne idée » et « violation
      pure du traité » présents, même sens ; la date du 11 septembre est celle de l''article, la déclaration ayant
      eu lieu à la conférence de presse de la BCE. F8 : extrait présent, même sens.'
    extrait: La présidente de la BCE estime même que cela constituerait une "violation pure du traité" sur l'Union
      européenne.
- id: F3
  enonce: Les titres de dette française visés par la proposition sont détenus par la Banque de France pour le compte
    de la BCE (Eurosystème) et représentent environ 18 % de la dette publique, selon Public Sénat ; Jean-Luc Mélenchon
    a employé ce chiffre en août 2026.
  type: fait
  sources:
  - source: S5
    niveau: 4
    statut: conforme
    note_verif: 'Bon article Public Sénat du 25 août 2026. F6, F13, F19, F27, F34 : extrait présent, même sens.
      F3 : les 18 % figurent, mais attribués à une vidéo de juin devenue virale en août, et non à un propos d''août.
      F9 : extrait présent, c''est le compte rendu par Public Sénat d''une déclaration de Lagarde en 2021. F28 :
      citation présente (discours du dimanche de clôture des universités d''été de LFI). F29 : extrait présent,
      mais la source ne date pas explicitement le dépôt de la résolution ni ne l''attribue nommément à LFI (contexte
      : « sa famille exigeait en 2020 »).'
    extrait: l’ancien député encourage l’annulation des 18 % de dette française détenus par la Banque de France
      pour le compte de la Banque centrale européenne (BCE).
- id: F4
  enonce: Selon Euronews, Thierry Breton a écrit dans une tribune (Les Echos, août 2026) qu'une telle annulation
    serait juridiquement impossible, la Banque de France faisant partie de l'Eurosystème et ne pouvant pas annuler
    d'obligations de sa propre initiative.
  type: fait
  sources:
  - source: S2
    niveau: 4
    statut: conforme
    note_verif: 'Bon article Euronews du 27 août 2026. F4 : extrait présent, Euronews rapporte la tribune de Thierry
      Breton publiée « mardi » dans Les Echos, même sens. F11 : extrait présent, même sens, mais le fait n''est
      établi que par le compte rendu d''Euronews, pas par la tribune elle-même.'
    extrait: soulignant qu'une telle décision serait juridiquement impossible, la Banque de France faisant partie
      de l'Eurosystème régi par la Banque centrale européenne et ne pouvant annuler ou effacer des obligations de
      sa propre initiative.
- id: F5
  enonce: Selon un professeur de droit financier (2021), l'article 123 du TFUE n'interdit pas expressément l'annulation
    de la dette souveraine détenue par la BCE.
  type: fait
  sources:
  - source: S4
    niveau: 2
    statut: conforme
    note_verif: 'Bon document : Thierry Bonneau, Club des Juristes, 11 février 2021. F5 : extrait présent (« il
      n''interdit pas expressément l''annulation de la dette souveraine détenue par la BCE »), même sens. F7 et
      F12 : extrait présent ; la partie de F7 sur le marché secondaire est une déduction que l''auteur tire du texte
      et de la jurisprudence de la CJUE, tout en soutenant plus loin que l''article 123 a une portée moins limitée
      que celle admise par la jurisprudence.'
    extrait: En revanche, il n’interdit pas expressément l’annulation de la dette souvera
- id: F6
  enonce: Les titres publics français détenus par l'Eurosystème ont été acquis sur le marché secondaire, auprès
    d'institutions financières, et non directement auprès de l'État.
  type: fait
  sources:
  - source: S5
    niveau: 4
    statut: conforme
    note_verif: 'Bon article Public Sénat du 25 août 2026. F6, F13, F19, F27, F34 : extrait présent, même sens.
      F3 : les 18 % figurent, mais attribués à une vidéo de juin devenue virale en août, et non à un propos d''août.
      F9 : extrait présent, c''est le compte rendu par Public Sénat d''une déclaration de Lagarde en 2021. F28 :
      citation présente (discours du dimanche de clôture des universités d''été de LFI). F29 : extrait présent,
      mais la source ne date pas explicitement le dépôt de la résolution ni ne l''attribue nommément à LFI (contexte
      : « sa famille exigeait en 2020 »).'
    extrait: Ces opérations ont eu lieu sur le marché secondaire, c’est-à-dire auprès d’institutions financières,
      puisque les traités de l’Union européenne interdisent à la BCE de financer directement les États.
- id: F7
  enonce: L'article 123 du TFUE interdit les crédits consentis aux États et l'acquisition directe de leurs titres
    de dette par la BCE et les banques centrales nationales ; il n'interdit pas, dans son texte, les achats sur
    le marché secondaire.
  type: fait
  sources:
  - source: S4
    niveau: 2
    statut: conforme
    note_verif: 'Bon document : Thierry Bonneau, Club des Juristes, 11 février 2021. F5 : extrait présent (« il
      n''interdit pas expressément l''annulation de la dette souveraine détenue par la BCE »), même sens. F7 et
      F12 : extrait présent ; la partie de F7 sur le marché secondaire est une déduction que l''auteur tire du texte
      et de la jurisprudence de la CJUE, tout en soutenant plus loin que l''article 123 a une portée moins limitée
      que celle admise par la jurisprudence.'
    extrait: l’article 123 du TFUE interdit seulement les crédits consentis aux États et l’acquisition directe,
      auprès d’eux, des instruments de leur dette.
- id: F8
  enonce: En septembre 2026, la présidente de la BCE, Christine Lagarde, a estimé que l'annulation proposée constituerait
    une violation du traité.
  type: fait
  sources:
  - source: S3
    niveau: 4
    statut: conforme
    note_verif: 'Bon article Euronews du 11 septembre 2026. F2 : « vraiment pas une bonne idée » et « violation
      pure du traité » présents, même sens ; la date du 11 septembre est celle de l''article, la déclaration ayant
      eu lieu à la conférence de presse de la BCE. F8 : extrait présent, même sens.'
    extrait: La présidente de la BCE estime même que cela constituerait une "violation pure du traité" sur l'Union
      européenne.
- id: F9
  enonce: En 2021, Christine Lagarde a qualifié l'annulation de dettes publiques détenues par la BCE de violation
    du traité européen qui interdit le financement monétaire des États.
  type: fait
  sources:
  - source: S5
    niveau: 4
    statut: conforme
    note_verif: 'Bon article Public Sénat du 25 août 2026. F6, F13, F19, F27, F34 : extrait présent, même sens.
      F3 : les 18 % figurent, mais attribués à une vidéo de juin devenue virale en août, et non à un propos d''août.
      F9 : extrait présent, c''est le compte rendu par Public Sénat d''une déclaration de Lagarde en 2021. F28 :
      citation présente (discours du dimanche de clôture des universités d''été de LFI). F29 : extrait présent,
      mais la source ne date pas explicitement le dépôt de la résolution ni ne l''attribue nommément à LFI (contexte
      : « sa famille exigeait en 2020 »).'
    extrait: une violation du traité européen qui interdit strictement le financement monétaire des Etats
- id: F10
  enonce: La Banque de France fait partie de l'Eurosystème et n'agit pas sur instruction du gouvernement.
  type: fait
  sources:
  - source: S6
    niveau: 3
    statut: conforme
    note_verif: 'Bon titre et auteur (Fondation IFRAP) ; date du 1er septembre 2026 non vérifiable sur la page,
      qui cite un texte du 2 septembre 2026, donc publiée au plus tôt ce jour-là. F10 : extrait présent mot pour
      mot, même sens ; source de niveau 3, qui ne suffit pas seule à établir un fait.'
    extrait: La Banque de France participe à l'Eurosystème mais n'agit pas sur instruction du gouvernement.
- id: F11
  enonce: En août 2026, Thierry Breton a soutenu dans une tribune que la Banque de France ne peut pas annuler d'elle-même
    des obligations, en tant que membre de l'Eurosystème.
  type: fait
  sources:
  - source: S2
    niveau: 4
    statut: conforme
    note_verif: 'Bon article Euronews du 27 août 2026. F4 : extrait présent, Euronews rapporte la tribune de Thierry
      Breton publiée « mardi » dans Les Echos, même sens. F11 : extrait présent, même sens, mais le fait n''est
      établi que par le compte rendu d''Euronews, pas par la tribune elle-même.'
    extrait: ne pouvant annuler ou effacer des obligations de sa propre initiative.
- id: F12
  enonce: L'article 123 du TFUE interdit les crédits consentis aux États et l'acquisition directe, auprès d'eux,
    des instruments de leur dette ; il ne mentionne pas expressément l'annulation d'une dette détenue par une banque
    centrale.
  type: fait
  sources:
  - source: S4
    niveau: 2
    statut: conforme
    note_verif: 'Bon document : Thierry Bonneau, Club des Juristes, 11 février 2021. F5 : extrait présent (« il
      n''interdit pas expressément l''annulation de la dette souveraine détenue par la BCE »), même sens. F7 et
      F12 : extrait présent ; la partie de F7 sur le marché secondaire est une déduction que l''auteur tire du texte
      et de la jurisprudence de la CJUE, tout en soutenant plus loin que l''article 123 a une portée moins limitée
      que celle admise par la jurisprudence.'
    extrait: l’article 123 du TFUE interdit seulement les crédits consentis aux États et l’acquisition directe,
      auprès d’eux, des instruments de leur dette.
- id: F13
  enonce: Les titres publics français détenus par l'Eurosystème proviennent d'achats effectués sur le marché secondaire,
    auprès d'institutions financières, et non directement auprès de l'État.
  type: fait
  sources:
  - source: S5
    niveau: 4
    statut: conforme
    note_verif: 'Bon article Public Sénat du 25 août 2026. F6, F13, F19, F27, F34 : extrait présent, même sens.
      F3 : les 18 % figurent, mais attribués à une vidéo de juin devenue virale en août, et non à un propos d''août.
      F9 : extrait présent, c''est le compte rendu par Public Sénat d''une déclaration de Lagarde en 2021. F28 :
      citation présente (discours du dimanche de clôture des universités d''été de LFI). F29 : extrait présent,
      mais la source ne date pas explicitement le dépôt de la résolution ni ne l''attribue nommément à LFI (contexte
      : « sa famille exigeait en 2020 »).'
    extrait: Ces opérations ont eu lieu sur le marché secondaire, c’est-à-dire auprès d’institutions financières
- id: F14
  enonce: L'article 123 du TFUE interdit à la BCE et aux banques centrales nationales d'accorder des crédits aux
    administrations publiques des États membres et d'acquérir directement leur dette.
  type: fait
  sources:
  - source: S8
    niveau: 1
    statut: conforme
    note_verif: 'Bon document (article 123 TFUE, JO C 326 du 26.10.2012, page EUR-Lex en français). F14 : extrait
      présent mot pour mot ; le paragraphe 1 interdit aussi tout découvert ou crédit aux administrations publiques
      des États membres, ce qui couvre l''énoncé.'
    extrait: l'acquisition directe, auprès d'eux, par la Banque centrale européenne ou les banques centrales nationales,
      des instruments de leur dette est également interdite.
- id: F15
  enonce: L'article 130 du TFUE interdit aux banques centrales de solliciter ou d'accepter des instructions des
    gouvernements des États membres, et les gouvernements s'engagent à ne pas chercher à les influencer.
  type: fait
  sources:
  - source: S9
    niveau: 1
    statut: conforme
    note_verif: 'Bon document (article 130 TFUE, page EUR-Lex en français). F15 : extrait présent mot pour mot ;
      l''article vise aussi les instructions des gouvernements des États membres et contient leur engagement à ne
      pas chercher à influencer les organes de décision, ce qui couvre l''énoncé.'
    extrait: ni la Banque centrale européenne, ni une banque centrale nationale, ni un membre quelconque de leurs
      organes de décision ne peuvent solliciter ni accepter des instructions
- id: F16
  enonce: Le 11 septembre 2026, le gouverneur de la Banque de France, Emmanuel Moulin, a déclaré sur RTL que l'annulation
    proposée par Jean-Luc Mélenchon était illégale car contraire aux traités.
  type: fait
  sources:
  - source: S12
    niveau: 4
    statut: conforme
    note_verif: 'Bon document (Boursorama avec Media Services, 11/09/2026 à 11:13). F16 : extrait présent mot pour
      mot, attribué à Emmanuel Moulin, gouverneur de la Banque de France, « ce vendredi 11 septembre » sur RTL,
      à propos de la proposition de Jean-Luc Mélenchon ; même chose que l''énoncé.'
    extrait: '"Elle est illégale parce qu''elle est contraire aux traités"'
- id: F17
  enonce: Selon des experts interrogés par l'AFP en août 2026, seul le Conseil des gouverneurs de la BCE pourrait
    décider d'effacer la part de dette détenue par l'Eurosystème, et une telle décision est jugée très improbable.
  type: fait
  sources:
  - source: S11
    niveau: 4
    statut: conforme
    note_verif: 'Bon document (fact-check AFP de Gaëlle Geoffroy repris par De Facto), mais la page indique « Publié
      le mercredi 2 septembre 2026 », non le 25 août. F17 : extrait présent mot pour mot, suivi de « Une approbation
      hautement improbable à l''heure actuelle, estiment-ils » ; les experts cités ont été interrogés par l''AFP
      les 17, 18 et 19 août 2026 et « cette part » désigne la dette détenue par la Banque de France pour le compte
      de la BCE, ce qui correspond à l''énoncé.'
    extrait: Des experts soulignent aussi que seul le Conseil des gouverneurs de la BCE pourrait décider d'effacer
      cette part de la dette.
- id: F18
  enonce: Le 23 août 2026, Jordan Bardella a écrit que la Banque de France est détenue par l'État et que les intérêts
    que l'État lui verse lui sont reversés sous forme de dividendes.
  type: fait
  sources:
  - source: S10
    niveau: 3
    statut: conforme
    note_verif: 'Bon document : publication de Jordan Bardella sur X datée du 23 août 2026 (métadonnées). F18 :
      extrait présent mot pour mot, suivi de la phrase indiquant que les intérêts versés par l''État sur la dette
      détenue par la Banque de France « sont ensuite reversés à l''État sous forme de dividendes », ce qui correspond
      à l''énoncé (déclaration rapportée, non preuve du fait).'
    extrait: La Banque de France est détenue par l'État.
- id: F19
  enonce: La dette détenue par la Banque de France provient de rachats d'obligations sur le marché secondaire, car
    les traités interdisent à la BCE de financer directement les États.
  type: fait
  sources:
  - source: S5
    niveau: 4
    statut: conforme
    note_verif: 'Bon article Public Sénat du 25 août 2026. F6, F13, F19, F27, F34 : extrait présent, même sens.
      F3 : les 18 % figurent, mais attribués à une vidéo de juin devenue virale en août, et non à un propos d''août.
      F9 : extrait présent, c''est le compte rendu par Public Sénat d''une déclaration de Lagarde en 2021. F28 :
      citation présente (discours du dimanche de clôture des universités d''été de LFI). F29 : extrait présent,
      mais la source ne date pas explicitement le dépôt de la résolution ni ne l''attribue nommément à LFI (contexte
      : « sa famille exigeait en 2020 »).'
    extrait: Ces opérations ont eu lieu sur le marché secondaire, c'est-à-dire auprès d'institutions financières,
      puisque les traités de l'Union européenne interdisent à la BCE de financer directement les États.
- id: F20
  enonce: La brochure programme de la campagne Poutou 2022 du NPA demande l'arrêt immédiat du paiement de la dette
    publique et de ses intérêts.
  type: fait
  sources:
  - source: S13
    niveau: 3
    statut: conforme
    note_verif: 'Brochure programme Poutou 2022 du NPA (PDF sur le site du NPA) ; la date du 24 février 2022 n''apparaît
      pas dans le document ni dans ses métadonnées. F20 : extrait présent (mise en colonnes du PDF entremêlée),
      dans la partie « Annuler la dette », les intérêts étant chiffrés à près de 40 milliards d''euros en 2021,
      ce qui correspond à la dette publique de l''énoncé. F21 : extrait présent (même mise en colonnes), même chose
      que l''énoncé.'
    extrait: Nous voulons l’arrêt immédiat du paiement de la dette et de ses intérêts,
- id: F21
  enonce: La même brochure du NPA demande une rupture avec les traités européens.
  type: fait
  sources:
  - source: S13
    niveau: 3
    statut: conforme
    note_verif: 'Brochure programme Poutou 2022 du NPA (PDF sur le site du NPA) ; la date du 24 février 2022 n''apparaît
      pas dans le document ni dans ses métadonnées. F20 : extrait présent (mise en colonnes du PDF entremêlée),
      dans la partie « Annuler la dette », les intérêts étant chiffrés à près de 40 milliards d''euros en 2021,
      ce qui correspond à la dette publique de l''énoncé. F21 : extrait présent (même mise en colonnes), même chose
      que l''énoncé.'
    extrait: Rupture avec les traités européens antidémocratiques et favorisant la concurrence libre et non faussée
- id: F22
  enonce: Selon la BCE (courrier de février 2021), l'annulation de dettes publiques par la BCE n'est pas compatible
    avec l'article 123 du traité sur le fonctionnement de l'Union européenne.
  type: fait
  sources:
  - source: S1
    niveau: 1
    statut: conforme
    note_verif: 'Bon document : lettre de Christine Lagarde à Manon Aubry, datée du 5 février 2021 (L/CL/21/22).
      F1, F22, F32 : extrait présent mot pour mot, même sens (incompatibilité avec les traités au titre de l''article
      123 TFUE).'
    extrait: l’annulation de dettes publiques par la BCE n’est pas compatible avec les traités, car elle enfreindrait
      l’interdiction du financement monétaire énoncée à l’article 123 du traité sur le fonctionnement de l’Union
      européenne.
- id: F23
  enonce: Les traités et les statuts du SEBC interdisent à une banque centrale nationale de solliciter ou d'accepter
    des instructions des gouvernements des États membres.
  type: fait
  sources:
  - source: S15
    niveau: 1
    statut: conforme
    note_verif: 'Bon document (statuts du SEBC et de la BCE, version consolidée, EUR-Lex), date non affichée par
      la page. F23 : extrait présent mot pour mot (article 7), il vise expressément les banques centrales nationales
      et les gouvernements des États membres, même périmètre. F26 : extrait présent mot pour mot dans l''article
      32.4, même périmètre (indemnisation possible, décidée par le conseil des gouverneurs, dans des circonstances
      exceptionnelles).'
    extrait: ni la BCE, ni une banque centrale nationale, ni un membre quelconque de leurs organes de décision ne
      peuvent solliciter ni accepter des instructions des institutions, organes ou organismes de l’Union, des gouvernements
      des États membres ou de tout autre organisme.
- id: F24
  enonce: Par l'arrêt Weiss du 11 décembre 2018, la Cour de justice de l'Union européenne a jugé que le programme
    d'achats d'obligations souveraines sur les marchés secondaires (PSPP) ne viole pas l'interdiction du financement
    monétaire.
  type: fait
  sources:
  - source: S14
    niveau: 1
    statut: conforme
    note_verif: 'Bon document (CJUE, communiqué n° 192/18, Luxembourg, 11 décembre 2018, affaire C-493/17 Weiss
      e.a.) ; premier accès refusé (403), ouvert ensuite par l''adresse curia.europa.eu/jcms/… qui redirige vers
      l''adresse annoncée. F24 : extrait présent mot pour mot, même chose que l''énoncé (communiqué de presse, non
      le texte de l''arrêt).'
    extrait: La Cour constate ensuite que le programme PSPP ne viole pas l’interdiction du financement monétaire,
      qui interdit au SEBC d’accorder tout type de crédit à un État membre.
- id: F25
  enonce: L'article 123 du traité sur le fonctionnement de l'Union européenne interdit à la BCE et aux banques centrales
    nationales d'accorder des crédits aux États et d'acquérir directement auprès d'eux leurs titres de dette ; il
    ne mentionne pas l'annulation de titres déjà détenus.
  type: fait
  sources:
  - source: S16
    niveau: 1
    statut: conforme
    note_verif: 'Bon document (TFUE, article 123, JO C 202 du 7.6.2016). F25 : extrait présent mot pour mot, et
      le texte de l''article (court, lu en entier par recherche) ne contient aucune mention de l''annulation, ce
      qui appuie la seconde partie. F30 : extrait présent mot pour mot dans le paragraphe 1, qui contient aussi
      l''interdiction d''acquisition directe, même périmètre.'
    extrait: l'acquisition directe, auprès d'eux, par la Banque centrale européenne ou les banques centrales nationales,
      des instruments de leur dette est également interdite.
- id: F26
  enonce: Selon les statuts du SEBC et de la BCE (article 32.4), le conseil des gouverneurs de la BCE peut, dans
    des circonstances exceptionnelles, indemniser les banques centrales nationales pour des pertes particulières
    liées aux opérations de politique monétaire menées pour le compte du SEBC.
  type: fait
  sources:
  - source: S15
    niveau: 1
    statut: conforme
    note_verif: 'Bon document (statuts du SEBC et de la BCE, version consolidée, EUR-Lex), date non affichée par
      la page. F23 : extrait présent mot pour mot (article 7), il vise expressément les banques centrales nationales
      et les gouvernements des États membres, même périmètre. F26 : extrait présent mot pour mot dans l''article
      32.4, même périmètre (indemnisation possible, décidée par le conseil des gouverneurs, dans des circonstances
      exceptionnelles).'
    extrait: Le conseil des gouverneurs peut décider d'indemniser les banques centrales nationales pour les frais
      encourus à l'occasion de l'émission de billets ou, dans des circonstances exceptionnelles, pour des pertes
      particulières afférentes aux opérations de politique monétaire réalisées pour le compte du SEBC.
- id: F27
  enonce: Les titres de dette française détenus par la Banque de France au titre de la politique monétaire ont été
    achetés sur le marché secondaire, auprès d'institutions financières, et non directement auprès de l'État.
  type: fait
  sources:
  - source: S5
    niveau: 4
    statut: conforme
    note_verif: 'Bon article Public Sénat du 25 août 2026. F6, F13, F19, F27, F34 : extrait présent, même sens.
      F3 : les 18 % figurent, mais attribués à une vidéo de juin devenue virale en août, et non à un propos d''août.
      F9 : extrait présent, c''est le compte rendu par Public Sénat d''une déclaration de Lagarde en 2021. F28 :
      citation présente (discours du dimanche de clôture des universités d''été de LFI). F29 : extrait présent,
