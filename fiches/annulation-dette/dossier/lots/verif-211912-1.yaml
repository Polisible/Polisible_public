      mais c''est une valeur de la matinée. F26 et F27 sont seulement l''avis attribué à Roland Lescure (BFMTV/RMC)
      : la source montre qu''il l''a dit, sans établir l''effet sur les taux ni l''illégalité. Partis : Roland Lescure
      est seulement présenté comme « ministre de l''Economie » ; son appartenance à Renaissance (porte_par) n''est
      PAS établie par cette source, et Jean-Luc Mélenchon y est désigné comme candidat, sans parti.'
    extrait: Le risque, pour le ministre de l'Economie, est également de faire grimper les taux d'intérêt
- id: F27
  enonce: L'annulation ou la conversion en dette perpétuelle à taux nul de titres achetés par l'Eurosystème est
    contraire aux traités européens.
  type: fait
  declaration: false
  sources:
  - source: S16
    niveau: 4
    statut: conforme
    note_verif: 'Bon document (MoneyVox avec AFP, publié le 24 août 2026 à 10h00), les trois extraits y figurent
      mot pour mot. F25 : même chose (10 ans, 4,11 % le lundi 24 août, plus de 4,14 % le jeudi, record depuis 2008),
      mais c''est une valeur de la matinée. F26 et F27 sont seulement l''avis attribué à Roland Lescure (BFMTV/RMC)
