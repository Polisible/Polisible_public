  question: Q41
  position: nuance
  enonce: Le traité interdit le crédit et l'achat direct de dette auprès des États, mais pas les achats sur le marché
    secondaire, que le SEBC pratique depuis 2015 et que la Cour de justice a validés sous conditions. La question
    juridique réelle est donc de savoir si une conversion ou une annulation de titres déjà détenus relève de l'interdiction
    du financement monétaire, et c'est une question de décision politique de l'Eurosystème.
  porte_par:
  - qui: Jérôme Gleizes, conseiller EELV de Paris (2023), chronique Politis du 14 septembre 2026
    parti: Les Écologistes
    source: S23
  affirmations:
  - F1
  - F2
  - F5
  - F8
  - F9
  - F10
  raisonnement: 'L''article 123 vise deux opérations précises : le crédit direct aux États et l''acquisition directe
    de leur dette (F1, F2). Les titres détenus par l''Eurosystème ont été acquis sur les marchés secondaires dans
    un programme que la Cour a jugé compatible avec le traité sous garanties (F8, F9, F10). Un texte qui n''évoque
    pas le traitement ultérieur de ces titres ne tranche pas l''annulation ; l''affirmer interdite comme certaine
    est une interprétation, et le conseil des gouverneurs de la BCE reste l''organe qui décide (F5). Cette lecture
    concerne l''annulation ou la conversion décidée par la BCE elle-même, pas une décision unilatérale de l''État.'
  repond_a: null
  auteur: expert-ecologistes
  passage: 1
  statut: ouvert
