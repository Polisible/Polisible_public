  - id: A21
    auteur: expert-gauche-radicale
    question: Q41
    position: contre
    enonce: 'Le PCF juge que l''annulation de la part détenue par la banque centrale passe par une démarche auprès
      des institutions et des autres pays européens et par un changement des règles européennes, plutôt que par
      une décision française seule. Que les traités actuels l''interdisent n''est pas un fait établi (aucun texte
      ne la mentionne, la Cour ne l''a pas tranché) : c''est la raison pour laquelle le PCF demande de les faire
      évoluer.'
    raisonnement: 'Les traités interdisent à la BCE de financer directement les États (F1, F2) ; c''est pourquoi
      elle a racheté la dette auprès des banques et des assurances (F44), ce qui maintient la dépendance aux marchés.
      L''annulation partielle se heurte donc aux traités : les élus communistes demandent de les changer et de saisir
      la Commission européenne et les autres États, plutôt que d''agir seul.'
    porte_par:
    - qui: Fabien Roussel, groupe GDR, débat à l'Assemblée nationale du 22 mars 2021
      parti: PCF
      source: S41
    repond_a: null
    statut: ouvert
    affirmations:
