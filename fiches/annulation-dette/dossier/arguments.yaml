- id: A4
  question: Q1
  position: contre
  enonce: 'La décision n''appartient pas à la France : les titres ont été acquis dans le cadre de programmes de
    l''Eurosystème, la Banque de France n''est pas sous l''autorité du gouvernement, et aucune banque nationale
    ne peut effacer ces titres seule. Une annulation supposerait donc une décision européenne, c''est-à-dire un
    changement du cadre des traités.'
  porte_par:
  - qui: Thierry Breton, ancien commissaire européen (tribune dans Les Echos, août 2026)
    source: S2
  - qui: Fondation IFRAP (note 2026)
    source: S6
  affirmations:
  - F10
  - F11
  repond_a: null
  auteur: expert-droite
  passage: 1
  statut: ouvert
- id: A5
  question: Q1
  position: nuance
  enonce: L'article 123 du TFUE vise le crédit direct aux États et l'achat direct de leurs titres ; les titres détenus
    par l'Eurosystème ont été rachetés sur le marché secondaire, ce que le traité n'interdit pas dans son texte.
    Pour cette lecture, le texte ne ferme donc pas expressément la porte à l'annulation ou au gel de ces titres,
    et le débat devient d'abord politique. Son auteur reconnaît lui-même que ces achats contournent l'esprit des
    traités, ce que la BCE tient pour déterminant.
  porte_par:
  - qui: Jérôme Gleizes, économiste, chronique dans Politis (14 septembre 2026), à titre personnel
    source: S7
  affirmations:
  - F12
  - F13
  repond_a: null
  auteur: expert-ecologistes
  passage: 1
  statut: ouvert
- id: A6
  question: Q1
  position: contre
  enonce: 'Le président du Rassemblement national rejette l''annulation de la dette détenue par la Banque de France,
    qu''il juge sans effet sur les finances publiques puisque l''État reçoit les intérêts sous forme de dividendes,
    et propre à faire monter les taux demandés à la France. Cet argument porte sur l''utilité de la mesure, non
    sur sa légalité : aucun texte de la famille consulté ne discute la question juridique.'
  porte_par:
  - qui: Jordan Bardella, président du Rassemblement national (23 août 2026)
    source: S10
  affirmations:
  - F18
  repond_a: null
  auteur: expert-extreme-droite
  passage: 1
  statut: ouvert
- id: A7
  question: Q1
  position: contre
  enonce: 'Les textes européens fixent le cadre de la question : l''article 123 interdit le financement direct des
    États par les banques centrales, et l''article 130 interdit tout ordre d''un gouvernement à la banque centrale.
    Une annulation décidée par la France seule se heurterait à ces deux articles ; elle n''est envisageable que
    par une décision du Conseil des gouverneurs de la BCE. Cette lecture est celle du gouverneur de la Banque de
    France et des juristes cités par l''AFP, non d''un texte du RN, de l''UDR ou de Reconquête.'
  porte_par:
  - qui: Emmanuel Moulin, gouverneur de la Banque de France (11 septembre 2026), repris ici comme base du raisonnement
      contre ; aucun texte d'un parti de la famille n'a été trouvé
    source: S12
