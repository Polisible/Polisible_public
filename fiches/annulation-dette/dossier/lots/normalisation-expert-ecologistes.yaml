    pour le compte de la BCE) », titres de la dette négociable de l''État au premier trimestre 2025 en valeur de
    marché ; même périmètre.'
  S16: 'Bon document (MoneyVox avec AFP, publié le 24 août 2026 à 10h00), les trois extraits y figurent mot pour
    mot. F25 : même chose (10 ans, 4,11 % le lundi 24 août, plus de 4,14 % le jeudi, record depuis 2008), mais c''est
