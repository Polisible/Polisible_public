      PAS établie par cette source, et Jean-Luc Mélenchon y est désigné comme candidat, sans parti.'
    extrait: c'est illégal, non conforme aux traités européens
- id: F28
  enonce: 'Un État doit honorer ses dettes : en s''engageant, il engage son peuple, c''est-à-dire ses contribuables,
    et la parole donnée doit garder sa valeur.'
  type: valeur
  declaration: false
  sources:
  - source: S21
    niveau: 4
    statut: conforme
    note_verif: 'Bon document (Public Sénat, 28 décembre 2020) ; la source établit que Jean-François Husson est
      « sénateur LR et rapporteur de la commission des finances ». F28 : l''extrait figure mot pour mot ; en revanche,
      rien n''y dit « la parole donnée doit garder sa valeur », que je n''ai pas cherché ailleurs dans la page.
      La déclaration date de 2020, et non de la campagne de 2026.'
    extrait: Si les États veulent retrouver la confiance de leur peuple, il faut qu’ils honorent leurs dettes car,
      en s’engageant, l’État engage son peuple, qui n’est autre que ses contributeurs.
- id: F29
  enonce: Le plan de redressement budgétaire de Bruno Retailleau, présenté le 12 octobre 2026, prévoit un effort
    de 197 milliards d'euros sur cinq ans, dont 56 milliards d'allègements fiscaux, l'essentiel de l'effort allant
    à l'amélioration du solde.
  type: fait
  declaration: true
  sources:
  - source: S22
    niveau: 4
    statut: conforme
    note_verif: 'Bon document : Public Sénat, article signé Guillaume Jacquot, publié le 12/10/2026. F29 : l''extrait
      figure mot pour mot (« un effort « inédit » de 197 milliards d''euros sur cinq ans, dont 56 milliards d''euros
      d''allègement de la fiscalité… ») et dit la même chose que l''énoncé, présentation du plan « ce 12 octobre
      » comprise ; F30 : l''extrait figure mot pour mot dans le chapeau et dit la même chose. L''appartenance est
      établie par la source (« Le candidat des Républicains », « candidat LR »).'
    extrait: Sa trajectoire prévoit un effort « inédit » de 197 milliards d’euros sur cinq ans, dont 56 milliards
      d’euros d’allègement de la fiscalité qui bénéficiera à la fois aux entreprises (30 milliards d’euros) et aux
      ménages (21 milliards), l’essentiel de l’effort allant à l’amélioration du solde.
- id: F30
  enonce: Ce plan fait reposer l'essentiel de l'effort sur l'État, dont il questionne le périmètre, et sur les dépenses
    sociales.
  type: fait
  declaration: true
  sources:
  - source: S22
    niveau: 4
    statut: conforme
    note_verif: 'Bon document : Public Sénat, article signé Guillaume Jacquot, publié le 12/10/2026. F29 : l''extrait
      figure mot pour mot (« un effort « inédit » de 197 milliards d''euros sur cinq ans, dont 56 milliards d''euros
      d''allègement de la fiscalité… ») et dit la même chose que l''énoncé, présentation du plan « ce 12 octobre
      » comprise ; F30 : l''extrait figure mot pour mot dans le chapeau et dit la même chose. L''appartenance est
      établie par la source (« Le candidat des Républicains », « candidat LR »).'
    extrait: L’essentiel de l’effort repose sur l’État, dont il questionne le périmètre, et sur les dépenses sociales.
- id: F31
  enonce: L'Eurosystème (BCE et banques centrales nationales) détient environ 640 milliards d'euros de titres publics
    français en 2026.
  type: fait
  declaration: false
  sources:
  - source: S23
    niveau: 3
    statut: conforme
    note_verif: 'Bon document : chronique de Jérôme Gleizes, Politis, 14 septembre 2026, rubrique « L''économie
      à contre-courant ». F31 : l''extrait figure (« dont environ 640 milliards de titres publics français », rapporté
      au bilan de l''Eurosystème de 6 000 milliards « en 2026 ») mais c''est le chiffre d''un chroniqueur, sans
      source citée, qui ne suffit pas à établir un fait ; F32 : l''extrait figure, mais le rapport Draghi (ouvert,
      voir sources_ajoutees) dit « un minimum de 750 à 800 milliards » par an, et non 800. La page ne mentionne
      ni EELV ni Les Écologistes : l''appartenance partisane de Jérôme Gleizes n''est pas établie par cette source.'
    extrait: dont environ 640 milliards de titres publics français
- id: F32
  enonce: Les investissements supplémentaires nécessaires à l'Union européenne sont estimés à 800 milliards d'euros
    par an (rapport Draghi, 2024).
  type: fait
  declaration: false
  sources:
  - source: S23
    niveau: 3
    statut: conforme
    note_verif: 'Bon document : chronique de Jérôme Gleizes, Politis, 14 septembre 2026, rubrique « L''économie
      à contre-courant ». F31 : l''extrait figure (« dont environ 640 milliards de titres publics français », rapporté
      au bilan de l''Eurosystème de 6 000 milliards « en 2026 ») mais c''est le chiffre d''un chroniqueur, sans
      source citée, qui ne suffit pas à établir un fait ; F32 : l''extrait figure, mais le rapport Draghi (ouvert,
      voir sources_ajoutees) dit « un minimum de 750 à 800 milliards » par an, et non 800. La page ne mentionne
      ni EELV ni Les Écologistes : l''appartenance partisane de Jérôme Gleizes n''est pas établie par cette source.'
    extrait: L’Europe, selon le rapport Draghi, a besoin de 800 milliards d’euros d’investissements supplémentaires
      chaque année
  - source: S44
    niveau: 2
    statut: conforme
    note_verif: ajoutée par le vérificateur
    extrait: To meet the objectives laid out in this report, a minimum annual additional investment of EUR 750 to
      800 billion is needed, based on the latest Commission esti- mates, corresponding to 4.4-4.7% of EU GDP in
      2023.
- id: F33
  enonce: Le programme adopté par Les Écologistes en juillet 2026 prévoit, au niveau européen, une révision des
    traités garantissant le non-dépassement des limites planétaires et la construction d'un État social européen.
  type: fait
  declaration: true
  sources:
  - source: S26
    niveau: 3
    statut: conforme
    note_verif: 'Bon document : page de la commission Économie, social, services publics des Écologistes, « Publié
      le 26 oct. 2026 ». F33 : l''extrait figure mot pour mot avec la référence (ch. 60, mesure 3, p. 190), et la
      page indique « Le programme adopté en juillet 2026 » ; c''est un résumé de commission qui renvoie au programme
      (PDF lesecologistes.fr), lui-même non ouvert ici. L''appartenance est établie (site et commission du parti).'
    extrait: une révision des traités garantissant le non-dépassement des limites planétaires ainsi que la construction
      d’un État social européen (ch. 60, mesure 3, p. 190)
- id: F34
  enonce: En juin 2020, le parti Les Verts (EELV) a présenté un plan de reconstruction écologique financé par une
    annulation de la dette française auprès de la BCE et par une fiscalité plus juste, dont le rétablissement de
    l'ISF.
  type: fait
  declaration: true
  sources:
  - source: S24
    niveau: 4
    statut: conforme
    note_verif: 'Bon document : FranceTransactions.com (avec AFP), publié le lundi 15 juin 2020 ; la date des métadonnées
      (jour de consultation) est sans valeur. F34 : l''extrait figure (« les Verts souhaitent une annulation de
      la dette française auprès de laBCE , une fiscalité "plus juste" avec notamment le rétablissement de l''ISF
      ») et dit la même chose que l''énoncé, plan de « reconstruction écologique » compris. L''appartenance est
      établie par la source (« projet de société d''EELV », porte-parole du parti Eva Sas).'
    extrait: Pour financer ce plan, les Verts souhaitent une annulation de la dette française auprès de laBCE
- id: F35
  enonce: Le plan présenté par Les Écologistes en septembre 2025 comprenait 28,5 milliards d'euros de recettes fiscales,
    notamment par la taxe Zucman et une contribution exceptionnelle sur les grandes entreprises.
  type: fait
  declaration: true
  sources:
  - source: S25
    niveau: 3
    statut: conforme
    note_verif: 'Bon document : revue de presse du site officiel des Écologistes ; date absente des métadonnées,
      mais les articles repris sont datés du 04/09 et 05/09 (contexte Bayrou), cohérent avec septembre 2025. F35
      et F36 : les deux extraits figurent mot pour mot ; F36 « plus progressive que celle du gouvernement » correspond
      à « ils proposent de réduire plus progressivement le déficit », formulé par rapport à François Bayrou ; il
      s''agit d''un extrait de presse reproduit par le parti, le titre du média d''origine n''apparaissant que partiellement.
      L''appartenance est établie (site lesecologistes.fr, « les écologistes »).'
    extrait: Ils proposent 28,5 milliards de recettes fiscales (notamment par le biais de la taxe Zucman sur les
      très hauts patrimoines, la contribution exceptionnelle sur les grandes entreprises)
- id: F36
  enonce: Le plan présenté par Les Écologistes en septembre 2025 prévoyait de ramener le déficit public à 3,7 %
    du PIB en 2030, soit une réduction plus progressive que celle du gouvernement de l'époque.
  type: fait
  declaration: true
  sources:
  - source: S25
    niveau: 3
    statut: conforme
    note_verif: 'Bon document : revue de presse du site officiel des Écologistes ; date absente des métadonnées,
      mais les articles repris sont datés du 04/09 et 05/09 (contexte Bayrou), cohérent avec septembre 2025. F35
      et F36 : les deux extraits figurent mot pour mot ; F36 « plus progressive que celle du gouvernement » correspond
      à « ils proposent de réduire plus progressivement le déficit », formulé par rapport à François Bayrou ; il
      s''agit d''un extrait de presse reproduit par le parti, le titre du média d''origine n''apparaissant que partiellement.
      L''appartenance est établie (site lesecologistes.fr, « les écologistes »).'
    extrait: pour le ramener à 3,7 % en 2030
- id: F37
  enonce: Le RN propose, dans son plan présenté le 6 octobre 2026, 140 milliards d'euros d'économies d'ici 2032,
    pour ramener la dette de 121 % du PIB en 2027 à 112 % en 2032.
  type: fait
  declaration: true
  sources:
  - source: S31
    niveau: 4
    statut: conforme
    note_verif: 'Bon document : Public Sénat, Stéphane Duguet, 6 octobre 2026. F37 : 140 milliards d''économies
      d''ici 2032 et l''extrait « de 121 % en 2027 à 112 % en 2032 » figurent mot pour mot ; F38 : l''extrait sur
      l''immigration (15 milliards en 2027, 29 milliards en année pleine) figure mot pour mot ; les deux disent
      la même chose, présentés lors de la conférence de presse du 6 octobre 2026 au siège du parti. Appartenance
      établie : Marine Le Pen est présentée comme « candidate du Rassemblement national », et le plan comme « présenté
      par le RN ».'
    extrait: Un « effort radical » assumé par Marine Le Pen pour faire passer la dette française de « 121 % en 2027
      à 112 % en 2032 ».
- id: F38
  enonce: Le plan du RN présenté le 6 octobre 2026 attend de la maîtrise de l'immigration 15 milliards d'euros d'économies
    en 2027.
  type: fait
  declaration: true
  sources:
  - source: S31
    niveau: 4
    statut: conforme
    note_verif: 'Bon document : Public Sénat, Stéphane Duguet, 6 octobre 2026. F37 : 140 milliards d''économies
      d''ici 2032 et l''extrait « de 121 % en 2027 à 112 % en 2032 » figurent mot pour mot ; F38 : l''extrait sur
