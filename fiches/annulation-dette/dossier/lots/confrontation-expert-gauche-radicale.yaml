  question: Q42
  position: pour
  enonce: 'Les taux risquent de monter. Un État qui renonce unilatéralement à une part de sa dette, par une voie
    juridiquement contestée, signale aux prêteurs qu''il peut changer les règles ; ils demanderaient selon Renaissance
    et Horizons un taux plus élevé. Il s''agit d''une estimation sans chiffrage publié : aucune institution n''a
    estimé l''ampleur de la hausse.'
  raisonnement: La France emprunte à un taux déjà au plus haut depuis 2008 (F25) ; toute hausse supplémentaire se
    répercute sur l'ensemble de la dette renouvelée. L'opération, juridiquement contestée (F27), serait lue comme
    un défaut partiel ou un risque de rupture avec les règles de la zone euro. Les prêteurs, qui n'ont aucune raison
    de croire que le précédent ne se reproduira pas, réclameraient une prime de risque (F26), et l'accès aux marchés
    pourrait se compliquer. Le gain sur les intérêts de la dette gelée serait ainsi rogné par le surcoût sur la
    dette future.
  porte_par: Roland Lescure, ministre de l'Économie (déclaration du 24 août 2026, BFMTV/RMC) (Renaissance, S16);
    Édouard Philippe (débat du Medef, 27 août 2026) (Horizons, S17)
  repond_a: null
  affirmations:
  - F25 [fait, Plutôt vrai] Le 24 août 2026, le taux d'intérêt de la France à 10 ans était de 4,11 %, après avoir
    dépassé 4,14 % le jeudi précédent, son plus haut niveau depuis 2008. — La dépêche AFP reprise par MoneyVox le
    24 août 2026 donne bien 4,11 % le lundi et plus de 4,14 % le jeudi précédent, au plus haut depuis 2008. C'est
    une valeur de la matinée, rapportée par la presse ; aucune série officielle de clôture (Banque de France, Agence
    France Trésor) n'a été consultée. (sources S16)
  - F26 [estimation, Pas d'estimation fiable] Une annulation unilatérale d'une partie de la dette publique ferait
    monter les taux auxquels la France emprunte, car les prêteurs réclameraient une prime de risque supplémentaire.
