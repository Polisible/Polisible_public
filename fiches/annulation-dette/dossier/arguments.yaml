  question: Q1
  position: nuance
  enonce: 'La conclusion de A2 repose sur une lecture de l''article 123 que la Cour de justice a écartée : Thierry
    Bonneau juge l''annulation prohibée parce qu''il estime que les achats sur le marché secondaire méconnaissent
    déjà l''article 123, contrairement à l''arrêt Weiss. Pour qui suit la jurisprudence de la Cour, le texte n''interdit
