  question: Q46
  position: nuance
  enonce: La dette détenue par l'Eurosystème relève d'une décision européenne, non d'une décision nationale seule.
    Les règles doivent être révisées par traité pour viser les limites planétaires, plutôt que contournées par un
    État.
  porte_par:
  - parti: LE
    date: 2026-07
    source: S26
  affirmations:
  - F4
  - F5
  - F32
  - F33
  raisonnement: 'Les titres en cause sont détenus au sein de l''Eurosystème, dont le conseil des gouverneurs décide
    (F5), et les banques centrales nationales doivent respecter les statuts du SEBC (F4) : un État ne peut pas décider
    seul. Mais ces règles fixent l''objectif de politique budgétaire à des organes que le parti juge insuffisamment
    démocratiques, alors que les besoins d''investissement sont européens (F32). La réponse du parti est donc une
    révision des traités avec des objectifs écologiques et sociaux (F33), pas un repli national.'
  repond_a: null
  auteur: expert-ecologistes
  passage: 1
  statut: ouvert
  versions:
  - passage: 4
    enonce: 'Ni la seule décision nationale ni les règles européennes actuelles : la dette détenue par l''Eurosystème
      relève d''une décision européenne, qui doit passer sous contrôle démocratique et se fixer pour objectif la
      transition écologique. Les règles doivent être révisées par traité plutôt que contournées par un État seul.'
    position: nuance
    porte_par:
    - parti: LE
      source: S26
      personne_ou_groupe_ancien: Les Écologistes, programme adopté en juillet 2026 (commission Économie, social
        et services publics, 26 octobre 2026)
    - parti: LE
      source: S23
      personne_ou_groupe_ancien: Jérôme Gleizes, conseiller EELV de Paris (2023), chronique Politis du 14 septembre
        2026
  corrige: true
