    appui:
      valeur: partiel
      justification: "Présupposés établis : ampleur de la détention (F31, F16, Plutôt vrai ; F17, Vrai), reversements à l'État (F7, F20, Vrai), besoins d'investissement (F32, Plutôt vrai) ; le présupposé d'une marge nette dégagée n'est pas établi (F41, Pas d'estimation fiable)."
