  question: Q46
  position: non
  enonce: "Dans une union monétaire, la dette en euros et la banque centrale sont des biens communs dont les autres membres supportent leur part. Décider seul sur des titres de l'Eurosystème reviendrait à s'affranchir de règles communes que l'État a acceptées."
  arguments: [A5]
  repond_a: []
  examen:
    pertinence:
      valeur: oui
      justification: "A5 porte sur le niveau de décision, national ou européen (F3, F4), objet de Q46."
    appui:
      valeur: partiel
      justification: "F3 et F4 sont vérifiés (Vrai) ; la contrariété aux traités repose sur F27 (Invérifiable), et le partage du bilan avec les autres membres est contredit pour les titres d'État acquis depuis 2015 par la résolution de O1 (S9), ce que la réponse à R19 admet."
    raisonnement:
      valeur: valide
      justification: "De la priorité donnée aux engagements européens acceptés (F4), la conclusion découle."
    portee:
      texte: "établit que l'État s'est engagé à rendre sa législation compatible avec les traités et ne peut instruire la banque centrale (F3, F4) ; ne prouve pas que les autres membres supportent le risque des titres français détenus, ni que l'opération soit contraire aux traités (F27)."
    objections:
      valeur: répondues
      justification: "Aucun argument d'une autre thèse ne vise le raisonnement de A5 (F4)."
    conclusion: tient en partie
