notes_du_verificateur:
  S1: 'Version consolidée 2016 du TFUE avec ses protocoles, en français (EUR-Lex). F45 : l''extrait figure mot pour
    mot à l''article 123 §1, et l''article 21.1 du protocole n° 4 dit la même chose ; aucun des deux textes ne parle
    d''annulation ni de conversion de titres déjà détenus, ce qui confirme la seconde moitié de F45 sur la lettre
    du texte (la jurisprudence de la CJUE n''est pas dans cette source). Aucune personne citée, donc pas d''appartenance
    partisane en jeu.'
  S10: 'Bon document : rapport d''information de la commission des finances du Sénat, rapporteur Albéric de Montgolfier,
    examiné et déposé le 24 septembre 2025 (date précisable : 2025-09-24). F16 : l''extrait figure mot pour mot,
