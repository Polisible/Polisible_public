    repond_a: null
    affirmations:
    - F46 [fait, Plutôt vrai] La proposition vise la part de la dette française détenue par la Banque de France
      pour le compte de l'Eurosystème ; elle laisse inchangés les titres détenus par les autres créanciers. — Public
      Sénat (25 août 2026) établit que la proposition de Jean-Luc Mélenchon vise les titres détenus par la Banque
      de France pour le compte de la BCE (18 % dans le texte, 20 % dans le chapeau). Que les autres créanciers ne
      soient pas concernés n'est que sous-entendu, par un économiste cité dans l'article. (sources S19)
    - F47 [estimation, Pas d'estimation fiable] L'annulation ou le gel en dette perpétuelle de la dette détenue
      par l'Eurosystème n'aurait pas d'effet sur le coût auquel la France emprunte. — La seule source rapporte l'avis
