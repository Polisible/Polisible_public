sources_a_verifier:
- source:
    id: S54
    titre: The Role of Central Bank Capital Revisited (ECB Working Paper Series No. 392)
    auteur: Ulrich Bindseil, Andres Manzanares, Benedict Weller (BCE)
    date: '2004-09-01'
    adresse: https://www.ecb.europa.eu/pub/pdf/scpwps/ecbwp392.pdf
    niveau: 2
    statut: a-verifier
    demande: null
  a_controler:
  - affirmation: F61
    enonce: Un document de travail des services de la BCE (2004) retient comme hypothèse plus réaliste que des pertes
      prolongées d'une banque centrale conduiraient à une perte totale de crédibilité, la crédibilité variant avec
      le niveau de capital.
    type: estimation
    declaration: true
    extrait_annonce: It is hence important to distinguish between a situation where an assumed absence of central
      bank’s concerns about balance sheet strength is shared by the public and the State, and the more realistic
      situation where prolonged central bank losses would lead to a complete loss of credibility.
