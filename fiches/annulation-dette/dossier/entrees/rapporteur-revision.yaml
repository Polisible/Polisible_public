  partis: [LR]
  question_posee: "Votre thèse T36 présuppose que les économies du plan (F29, F30) seraient obtenues et dégageraient les marges annoncées, ce qu'aucune affirmation du dossier n'établit. Avez-vous une source d'institution ? (même question que R20)"
incertitudes:
  - "A33 cite dans son raisonnement un document de la BCE de 2004 sous la référence provisoire « f1 », qui correspond à F61 (Débat entre experts, S54, S55) ; F61 n'est pas rattachée à la liste d'affirmations de A33 dans le dossier. L'examen de T13 la cite comme document invoqué par A33 ; le rattachement est à faire par l'expert ou le coordinateur."
  - "Le raisonnement de A13 n'a pas été corrigé avec sa position : il affirme encore « faible ou nul » ; l'examen de T31 en fait une lacune limitée."
  - "L'énoncé de A48 n'a pas été corrigé avec son raisonnement ; l'examen de T32 porte sur l'énoncé, qui reste la conclusion publiée."
  - "T6 passe de « tient en partie » à « tient » par l'effet de la correction de A47 ; le contradicteur ne l'a pas encore examinée sous cette forme. Même remarque pour T13 (raisonnement devenu valide) et pour les sept thèses issues des scissions (T31 à T37)."
  - "T36 est jugée « ne tient pas » par une lacune essentielle (silence du plan) ; le caractère essentiel est une appréciation, rapprochée de T2, que le contradicteur peut contester."
