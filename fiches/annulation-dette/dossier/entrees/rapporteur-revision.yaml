  partis: [RE]
  question_posee: "Que répondez-vous à T12 (A45) et à T32 (A48), selon lesquelles une décision libre du conseil des gouverneurs (F5) n'est pas une instruction au sens de F3 ? (même question que R11, R12, R13)"
