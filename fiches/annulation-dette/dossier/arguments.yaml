  question: Q44
  position: contre
  enonce: 'Une banque centrale qui efface des créances peut fonctionner avec des fonds propres négatifs : sa capacité
    à conduire la politique monétaire ne serait donc pas entamée. L''indépendance serait préservée si la décision
