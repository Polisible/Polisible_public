        (réponse à R26).'
    raisonnement:
      valeur: valide
      justification: Si les aides aux entreprises ont creusé la dette, la préférence pour leur suppression découle
        de la priorité affirmée ; ce présupposé et le montant (F42) relèvent de l'appui, comme pour T19 et T26.
    portee:
      texte: établit que les estimations publiques des aides aux entreprises dépendent du périmètre retenu (explication
        de F42) ; ne prouve pas le montant de 270 milliards ni que ces aides aient creusé la dette.
    objections:
      valeur: répondues
      justification: Aucun argument d'une autre thèse ne vise le raisonnement de A18 (F42).
    conclusion: ne tient pas
  portee_par:
  - LO
  contre_examen:
  - critere: raisonnement
    avis: conteste
    justification: La lacune nommée (la dette creusée par les aides, sans affirmation) est un présupposé non établi,
      déjà sanctionné dans l'appui (F42 Invérifiable). T19 a exactement la même structure (« si la dette résulte
      de cadeaux fiscaux », F43) et reçoit « valide » avec le défaut porté dans l'appui. Même lacune, appréciation
      différente.
    proposition: 'raisonnement : valide — Si les aides aux entreprises ont creusé la dette, la préférence pour leur
      suppression découle de la priorité affirmée ; ce présupposé et le montant (F42 Invérifiable) ne sont pas établis
      et relèvent de l''appui. Conclusion inchangée (ne tient pas, appui faible).'
    decision_rapporteur: acceptee
    motif_rapporteur: 'Même structure que T19 (« si … alors », présupposé F42 non établi) : raisonnement valide,
      défaut porté dans l''appui. Conclusion inchangée (appui faible).'
  versions:
  - pertinence:
      valeur: oui
      justification: A18 compare les leviers pour dégager des marges (F42), objet de Q47.
    appui:
      valeur: faible
      justification: 'Le présupposé chiffré repose sur F42 (Invérifiable : 270 milliards cités sans origine ni méthode),
        qui ne peut porter seul la thèse ; le lien entre ces aides et la dette n''est porté par aucune affirmation.'
    raisonnement:
      valeur: lacune
      essentielle: true
      justification: 'Cause supposée : la thèse suppose que la dette a été creusée par les aides aux entreprises
        (F42), sans affirmation qui l''établisse.'
    portee:
      texte: établit que les estimations publiques des aides aux entreprises dépendent du périmètre retenu (explication
        de F42) ; ne prouve pas le montant de 270 milliards ni que ces aides aient creusé la dette.
    objections:
      valeur: répondues
      justification: Aucune thèse ne répond à A18 (F42).
    conclusion: ne tient pas
questions:
- Q41 (fait) Les traités européens permettent-ils d'annuler, ou de convertir en dette perpétuelle à taux nul, la
  dette française détenue par la Banque de France pour l'Eurosystème ?
- Q42 (estimation) Annuler ou geler cette dette ferait-il monter les taux auxquels la France emprunte ?
- Q43 (estimation) L'opération réduirait-elle durablement la charge d'intérêts de l'État, compte tenu des intérêts
  que la Banque de France reverse à l'État ?
- Q44 (estimation) Annuler ou geler cette dette affaiblirait-il la crédibilité de l'euro ou l'indépendance de la
  BCE ?
- Q45 (valeur) Un État doit-il rembourser intégralement sa dette, y compris quand le créancier est sa propre banque
  centrale ?
- Q46 (valeur) Les décisions sur la dette publique doivent-elles relever de la seule décision nationale plutôt que
  des règles européennes ?
- Q47 (valeur) Pour dégager des marges budgétaires, l'annulation d'une partie de la dette est-elle préférable aux
  économies, à la hausse des recettes ou à la recherche de croissance ?
tes_arguments:
- id: A17
  question: Q45
  position: non
  enonce: Un État ne doit pas rembourser une dette illégitime, construite par des cadeaux aux plus riches et aux
    grandes entreprises. Un audit citoyen établit qui a prêté, à quel taux et quelle part est remboursée, et un
    moratoire suspend les paiements.
  raisonnement: Si la dette résulte de choix de politique qui ont profité aux créanciers et aux entreprises plutôt
    qu'à la population, l'obligation de la rembourser intégralement ne va pas de soi. Le critère n'est pas l'identité
    du créancier mais la légitimité de la dette, que l'audit doit établir ; ce critère conduit à ne pas rembourser
    les dettes illégitimes, banque centrale ou non.
  repond_a: null
  partis:
  - NPA
  affirmations:
  - F43 [valeur, sans verdict] Une dette construite par des cadeaux fiscaux aux plus riches et aux grandes entreprises
    est illégitime et n'a pas à être payée.
- id: A18
  question: Q47
  position: nuance
  enonce: Les marges budgétaires viennent des recettes tirées des profits et de l'arrêt des aides aux entreprises,
    non d'économies sur les budgets utiles à la population. L'annulation d'une part précise de la dette n'est pas
    proposée.
  raisonnement: Si la dette a été creusée par des aides aux entreprises (270 milliards d'euros par an d'aides et
    d'exonérations, chiffre cité par LO), alors supprimer ces aides et taxer les profits est préférable aux économies
    sur les services publics, que cette position refuse. L'annulation n'est pas retenue comme voie principale.
  repond_a: null
  partis:
  - LO
  affirmations:
  - 'F42 [fait, Invérifiable] Les aides publiques et exonérations versées chaque année aux entreprises privées atteignent
    270 milliards d''euros (chiffre cité par Lutte ouvrière, en 2026). — La brochure de Lutte ouvrière (juin 2026)
    cite bien 270 milliards, sans origine ni méthode. Les estimations publiques connues dépendent du périmètre retenu
    : la commission d''enquête du Sénat (juillet 2025) retient 211 milliards d''euros pour 2023, présentés comme
    un plancher, et le Haut-commissariat à la stratégie et au plan 111,9 milliards (selon Public Sénat, 15 septembre
    2025). Aucune source officielle ouverte ne donne 270 milliards.'
- id: A19
  question: Q47
  position: oui
  enonce: 'L''annulation de la dette publique est préférable à l''austérité : elle libère l''argent des intérêts
    pour des investissements et des emplois utiles à la population. Elle doit porter sur les dettes illégitimes,
    non sur la seule part de la banque centrale.'
  raisonnement: Si les intérêts payés aux créanciers privés absorbent des sommes qui financeraient des emplois publics
    (le tract NPA les chiffre à l'équivalent d'un million d'emplois en 2011), alors l'annulation dégage plus de
    marges que des économies qui frappent la population. La part détenue par la banque centrale étant reversée à
    l'État, annuler seulement celle-ci est jugé une diversion.
  repond_a: null
  partis:
  - NPA
  affirmations:
  - 'F20 [fait, Vrai] La Banque de France est un contributeur au budget de l''État : 36,8 milliards d''euros versés
    depuis 2015 (Q43).'
- id: A43
  question: Q45
  position: non
  enonce: 'Les vendeurs des titres rachetés par la banque centrale ont été payés au moment de l''achat : la dette
    de l''État n''est pas leur créance. Le critère retenu est la légitimité de la dette, que l''audit établit, non
    l''identité du créancier.'
  raisonnement: 'F24 établit que la banque centrale a acheté les titres sur le marché secondaire : les investisseurs
    vendeurs ont été réglés et n''ont plus de créance sur l''État. Le créancier actuel est la banque centrale, ce
    que A4 ne distingue pas ; la conclusion sur la signature de l''État suppose en outre que le marché assimile
    cette part à celle des créanciers privés, ce qu''aucune affirmation de A4 n''établit.'
  repond_a: A4
  partis:
  - NPA
  affirmations:
  - F24 [fait, Vrai] Les titres de dette française détenus par l'Eurosystème ont été achetés sur le marché secondaire,
    auprès d'institutions financières, et non directement auprès de l'État.
