agent: verificateur
role: verificateur
phase: 3
sources:
  - {id: S1, statut: conforme, note: "Article 123 TFUE, version consolidée JO C 202 du 7.6.2016, p. C 202/99 ; les deux extraits figurent au paragraphe 1 (seule différence : apostrophe typographique dans « d’accorder »). Même périmètre que F1 et F2."}
  - {id: S2, statut: conforme, note: "Article 130 TFUE, même version consolidée ; l'extrait figure mot pour mot. Même périmètre que F3."}
  - {id: S3, statut: conforme, note: "Arrêt de la Cour (grande chambre) du 16 juin 2015, C-62/14, Gauweiler ; l'extrait figure dans le dispositif, qui vise le communiqué mentionné au procès-verbal de la 340e réunion du conseil des gouverneurs des 5 et 6 septembre 2012."}
  - {id: S4, statut: conforme, note: "Arrêt de la Cour (grande chambre) du 11 décembre 2018, C-493/17, Weiss ; l'extrait figure au point 1 du dispositif. Le point 2 déclare la cinquième question irrecevable, et la décision 2015/774 est visée « telle que modifiée par la décision (UE) 2017/100 »."}
  - {id: S5, statut: conforme, note: "Insee, Informations rapides n° 79 du 27 mars 2026 ; les deux extraits figurent (115,6 % du PIB après 117,2 % au troisième trimestre ; 3 460,5 Md€ au sens de Maastricht). Une publication plus récente (trimestres 2026) peut exister ; non vérifié ici."}
  - {id: S6, statut: conforme, note: "Glossaire de la Banque nationale de Belgique, lettre S ; l'entrée « Secondary market » reprend l'extrait mot pour mot. La définition du marché primaire (« Market where new loans are issued ») figure à la lettre P du même glossaire (https://www.nbb.be/en/glossary?letter=p), ouverte pour contrôle."}
  - {id: S7, statut: conforme, note: "Glossaire de la Banque nationale de Belgique, lettre E ; l'entrée ESCB précise « Composed of the European Central Bank (ECB) and the national central banks (NCBs) of all EU Member States » puis l'extrait annoncé, mot pour mot."}
  - {id: S8, statut: inaccessible, note: "Réessayé le 10 novembre 2026 : 403. Autres adresses officielles essayées : page « Précisions sur le programme de détention » en français (403) ; Stat Info Banque de France « Émission et détention de titres français 2025T4 » (ouvert, mais il donne la part des non-résidents, 54,6 % pour les titres longs des administrations publiques fin 2025, pas la détention par la Banque de France). Les tableaux BCE (PSPP/PEPP par pays) portent sur l'Eurosystème, périmètre différent ; non retenus."}
  - {id: S9, statut: inaccessible, note: "Réessayé le 10 novembre 2026 : 403 ; la version française de la même page (banque-france.fr/fr/communiques-de-presse/precisions-sur-le-programme-de-detention-de-la-dette-publique-par-la-banque-de-france) renvoie aussi 403. Même information non trouvée à une autre adresse officielle ouvrable."}
  - {id: S10, statut: inaccessible, note: "Réessayé le 10 novembre 2026 : 403. Essayés aussi : version anglaise du même bulletin (432_Monthly bulletin May 2026, 403) et bulletin de juin 2026 n° 433 (403). Le tableau « répartition par groupe de porteurs » repose sur des données Banque de France, elles aussi inaccessibles (voir S8)."}
affirmations:
  - {id: F1, verdict: "Vrai", explication: "L'article 123, paragraphe 1, du TFUE dispose que l'acquisition directe, auprès des autorités publiques, des instruments de leur dette par la BCE ou les banques centrales nationales est interdite. L'interdiction vise l'achat direct, c'est-à-dire sur le marché primaire."}
  - {id: F2, verdict: "Vrai", explication: "Le même paragraphe interdit à la BCE et aux banques centrales nationales d'accorder des découverts ou tout autre type de crédit aux administrations centrales, aux autres autorités publiques et à d'autres entités publiques de l'Union et des États membres. Le paragraphe 2 exclut de ce champ les établissements publics de crédit."}
  - {id: F3, verdict: "Vrai", explication: "L'article 130 du TFUE dispose que ni la BCE, ni une banque centrale nationale, ni un membre de leurs organes de décision ne peuvent solliciter ni accepter des instructions des gouvernements des États membres, entre autres."}
  - {id: F4, verdict: "Vrai", explication: "Le dispositif de l'arrêt C-62/14 du 16 juin 2015 (grande chambre) dit pour droit que les articles 119, 123 § 1 et 127 §§ 1 et 2 TFUE, avec les articles 17 à 24 des statuts du SEBC, autorisent le SEBC à adopter un tel programme d'achat sur les marchés secondaires. Le programme visé est celui annoncé dans le communiqué cité au procès-verbal de la réunion des 5 et 6 septembre 2012 (opérations monétaires sur titres, OMT)."}
  - {id: F5, verdict: "Plutôt vrai", explication: "Le dispositif de l'arrêt C-493/17 du 11 décembre 2018 dit pour droit que l'examen des première à quatrième questions n'a révélé aucun élément de nature à affecter la validité de la décision (UE) 2015/774, telle que modifiée par la décision (UE) 2017/100. L'énoncé parle des « questions posées » sans préciser que la cinquième question a été déclarée irrecevable, donc non examinée."}
  - {id: F6, verdict: "Vrai", explication: "L'Insee (Informations rapides n° 79, 27 mars 2026) indique 115,6 % du PIB fin 2025 (quatrième trimestre), après 117,2 % au troisième trimestre 2025."}
  - {id: F7, verdict: "Vrai", explication: "La même publication de l'Insee indique une dette publique au sens de Maastricht de 3 460,5 milliards d'euros fin 2025 (quatrième trimestre), en baisse de 23,6 milliards sur le trimestre."}
  - {id: F8, verdict: "Vrai", explication: "Le glossaire de la Banque nationale de Belgique définit le marché secondaire comme le marché des instruments financiers en circulation et, dans une autre entrée (lettre P), le marché primaire comme le marché où de nouveaux emprunts sont émis. La seconde moitié de l'énoncé s'appuie sur cette entrée, qui n'est pas la source citée (S6)."}
  - {id: F9, verdict: "Vrai", explication: "Le glossaire de la Banque nationale de Belgique définit le SEBC comme la BCE et les banques centrales nationales de tous les États membres de l'Union, soit l'Eurosystème plus les banques centrales des États qui n'ont pas adopté l'euro. L'énoncé sur l'Eurosystème découle de cette définition."}
