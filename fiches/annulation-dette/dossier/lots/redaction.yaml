  arguments:
  - id: A13
    auteur: expert-extreme-droite
    question: Q43
    position: contre
    enonce: Annuler ou geler cette dette réduirait la charge d'intérêts de l'État de moins que son montant brut,
      car une part des intérêts reçus par la Banque de France revient à l'État par l'impôt et le dividende (36,8
      Md€ versés depuis 2015) ; l'ampleur de ce recul n'est chiffrée par aucune source du dossier.
    raisonnement: 'L''État est à la fois débiteur (intérêts payés) et bénéficiaire du résultat de la Banque de France
      (dividende, impôt sur les bénéfices). Si les intérêts disparaissent, le résultat de la Banque de France baisse
      d''autant, donc ses versements à l''État aussi : sur l''ensemble État plus Banque de France, le gain serait
      faible ou nul. La Banque de France verse déjà à l''État des montants importants (36,8 Md€ depuis 2015), qui
      seraient réduits.'
    porte_par:
    - qui: Jordan Bardella, président du RN, réponse publiée sur X à Matthieu Pigasse (23 août 2026, rapportée par
        la presse)
      parti: RN
      source: S29
    repond_a: null
    statut: ouvert
    affirmations:
    - id: F41
      enonce: Les intérêts que l'État paie à la Banque de France sur les titres qu'elle détient contribuent à son
        résultat, dont une part revient à l'État (dividende et impôt).
      type: estimation
      verdict: Pas d'estimation fiable
      explication: 'La seule source (site de niveau 4, analyse assistée par IA, 24 août 2026) est non conforme :
        elle rapporte un argument de Jordan Bardella sans établir le mécanisme ni mentionner l''impôt. Les documents
        de la Banque de France au dossier (F19, F20, F21) établissent que la Banque verse un impôt et des dividendes
        à l''État et que son revenu monétaire est partagé dans l''Eurosystème, mais aucune source rattachée n''isole
        la part due aux intérêts sur les titres de l''État.'
      sources:
      - source: S29
        extrait: Il a argué que la Banque de France étant détenue par l'État, les intérêts versés sont reversés
          sous forme de dividendes.
        statut_source: non-conforme
    - id: F19
      enonce: Pour l'exercice 2025, la Banque de France verse un impôt sur les bénéfices de 1,5 milliard d'euros
        avant d'atteindre un résultat net de 8,1 milliards (Q43).
      type: fait
      verdict: Vrai
      explication: Le document de la Banque de France sur les comptes annuels de l'exercice 2025 (mars 2026) indique
        un impôt sur les bénéfices de 1,5 Md€ et un résultat net de 8,1 Md€ ; il concorde avec le communiqué du
        24 mars 2026 (F18).
      sources:
      - source: S7
        extrait: Après paiement de l'impôt sur les bénéfices (1,5 milliard d'euros), le résultat net ressort à 8,1
          milliards d'euros.
        statut_source: conforme
    - id: F20
      enonce: 'La Banque de France est un contributeur au budget de l''État : 36,8 milliards d''euros versés depuis
        2015 (Q43).'
      type: fait
      verdict: Vrai
      explication: 'Le document de la Banque de France sur l''exercice 2025 (mars 2026) indique 36,8 Md€ versés
        au budget de l''État depuis 2015. Ce total couvre 2015-2025 et réunit impôt sur les sociétés, dividendes
        et restitution d''excédents : la fiche doit préciser cette composition.'
      sources:
      - source: S7
        extrait: avec un total de 36,8 milliards d'euros versés depuis 2015
        statut_source: conforme
  - id: A16
    auteur: expert-extreme-gauche
    question: Q43
    position: contre
    enonce: 'Annuler la part détenue par la Banque de France pourrait réduire la charge réelle de l''État de moins
      que son montant brut : l''État étant actionnaire de la banque centrale, une partie des intérêts qu''il lui
      verse lui revient (impôt, dividende). L''ampleur de ce recul n''est chiffrée par aucune source du dossier.
      La charge qui pèse sur les contribuables est surtout celle versée aux créanciers privés, nationaux et étrangers.'
    raisonnement: 'Si les intérêts payés à la Banque de France reviennent à l''État sous forme d''impôt et de dividende,
      leur suppression retire autant de recettes que de dépenses : le gain net est faible ou nul. L''effort d''annulation
      viserait donc la part de la dette qui ne coûte presque rien, et laisserait intacte celle qui coûte (créanciers
      privés).'
    porte_par:
    - qui: Tendance CLAIRE (courant du NPA)
      parti: NPA
      source: S38
    repond_a: null
    statut: ouvert
