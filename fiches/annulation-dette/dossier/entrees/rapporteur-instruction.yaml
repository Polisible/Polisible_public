- id: T19
  question: Q45
  position: non
  enonce: "Un État ne doit pas rembourser une dette illégitime, que le créancier soit ou non la banque centrale. Le critère est la légitimité de la dette, qu'un audit établit, non l'identité du créancier."
  arguments: [A17, A43]
  repond_a: [T15]
  examen:
    pertinence:
      valeur: oui
      justification: "A17 et A43 répondent à la question du remboursement intégral (F43, F24)."
    appui:
      valeur: faible
      justification: "Le présupposé factuel central, une dette construite par des cadeaux fiscaux, n'est porté que par F43 (valeur, sans verdict) ; seul F24 (Vrai) est établi, sur un point secondaire."
    raisonnement:
      valeur: valide
      justification: "De la priorité donnée à la légitimité (F43), la conclusion découle ; la thèse reconnaît qu'elle vaut que le créancier soit ou non la banque centrale (F24)."
    portee:
      texte: "établit que les vendeurs des titres ont été payés (F24) ; ne prouve pas que la dette française ait été construite par des cadeaux fiscaux, ni quelle part en serait illégitime."
    objections:
      valeur: sans réponse
      justification: "T15 (A50) objecte que la part de l'Eurosystème est remboursée à échéance comme les autres (F48) ; aucun argument de T19 n'y répond."
    conclusion: ne tient pas
# ---------------------------------------------------------------- Q46 (valeur)
- id: T20
  question: Q46
  position: non
  enonce: "Dans une union monétaire, la dette en euros et la banque centrale sont des biens communs dont les autres membres supportent leur part. Décider seul sur des titres de l'Eurosystème reviendrait à s'affranchir de règles communes que l'État a acceptées."
