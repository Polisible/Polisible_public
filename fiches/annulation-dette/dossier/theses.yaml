        n''est démontrée dans aucun sens (F9, F27).'
    portee:
      texte: établit qu'un effacement arrêté par le conseil des gouverneurs ne résulterait d'aucune instruction
        (F3, F5) et que sa compatibilité avec les traités est disputée (F27) ; ne prouve pas qu'il serait sans effet
        sur la crédibilité de l'euro.
    objections:
      valeur: sans réponse
      justification: T11 (A53) objecte qu'une légalité disputée suffit à créer un doute tant qu'aucun juge n'a tranché
        (F27) ; A48 corrigé le concède dans son raisonnement mais maintient son énoncé, sans y répondre.
    conclusion: ne tient pas
  portee_par:
  - PP
- id: T15
  question: Q45
  position: oui
  enonce: 'L''État doit rembourser les titres détenus par la banque centrale comme les autres : un titre garde ses
    conditions quel que soit son détenteur, et l''État les rembourse déjà à échéance. Ne pas les honorer pour une
    seule catégorie de détenteurs porterait atteinte à sa signature.'
