- id: T18
  question: Q45
  position: non
  enonce: "Rembourser intégralement la banque centrale oblige à réemprunter, à lever l'impôt ou à réduire la dépense, sans léser de créancier privé. La marge dégagée peut servir à investir, notamment dans la transition écologique."
