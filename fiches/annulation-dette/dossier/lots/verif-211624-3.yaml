- source:
    id: S31
    titre: '140 milliards d''euros d''économies d''ici 2032 : « l''effort radical » proposé par Marine Le Pen pour
      « redresser » les finances publiques'
    auteur: Public Sénat (Stéphane Duguet)
    date: '2026-10-06'
    adresse: https://www.publicsenat.fr/actualites/politique/140-milliards-deuros-deconomies-dici-2032-leffort-radical-propose-par-marine-le-pen-pour-redresser-les-f
    niveau: 4
    statut: a-verifier
    demande: null
  a_controler:
  - affirmation: F37
    enonce: Le RN propose, dans son plan présenté le 6 octobre 2026, 140 milliards d'euros d'économies d'ici 2032,
      pour ramener la dette de 121 % du PIB en 2027 à 112 % en 2032.
    type: fait
    declaration: true
    extrait_annonce: Un « effort radical » assumé par Marine Le Pen pour faire passer la dette française de « 121
      % en 2027 à 112 % en 2032 ».
  - affirmation: F38
    enonce: Le plan du RN présenté le 6 octobre 2026 attend de la maîtrise de l'immigration 15 milliards d'euros
      d'économies en 2027.
    type: fait
    declaration: true
    extrait_annonce: on retrouve l'immigration qui permettrait d'économiser 15 milliards d'euros en 2027 et « 29
      milliards en année pleine »
- source:
