  auteur: extreme-droite
  question: Q47
  position: contre
  enonce: 'Pour dégager des marges budgétaires, l''annulation de dette n''est pas préférable : la voie retenue par
    le RN est la réduction des dépenses, dont l''immigration, jointe à une règle d''or votée par référendum.'
  raisonnement: La charge de la dette (65,7 Md€ en 2025) pèse sur le budget parce que le déficit continue d'alimenter
    la dette ; seule une baisse durable du déficit la stabilise. Le plan du RN fait des économies la condition du
    retour de la dette sous 112 % du PIB en 2032, et la règle d'or vise à rendre cet effort contraignant. Une annulation
    de la part détenue par l'Eurosystème ne traiterait pas la cause du déficit.
  porte_par: Marine Le Pen, candidate du RN à la présidentielle 2027 (RN, S31); Marine Le Pen, tribune sur la règle
    d'or (1er octobre 2026) (RN, S32)
  repond_a: null
  affirmations:
  - F22 [fait, Vrai] En 2025, la charge de la dette de l'ensemble des administrations publiques atteint 65,7 milliards
    d'euros, soit 2,2 points de PIB (Cour des comptes, juin 2026) (Q43). (sources S11)
  - F37 [fait, Vrai] Le RN propose, dans son plan présenté le 6 octobre 2026, 140 milliards d'euros d'économies
    d'ici 2032, pour ramener la dette de 121 % du PIB en 2027 à 112 % en 2032. (sources S31)
  - F38 [fait, Vrai] Le plan du RN présenté le 6 octobre 2026 attend de la maîtrise de l'immigration 15 milliards
    d'euros d'économies en 2027. (sources S31)
  - F39 [fait, Vrai] Marine Le Pen propose d'inscrire une règle d'or budgétaire dans la Constitution par référendum,
    pour limiter le déficit public. (sources S32)
- id: A15
  auteur: extreme-droite
  question: Q46
  position: nuance
  enonce: Le RN veut que les choix budgétaires relèvent du peuple français, par la primauté du droit national et
    une règle d'or adoptée par référendum, mais la règle qu'il propose est un plafond de déficit, pas l'annulation
    unilatérale d'engagements.
  raisonnement: 'Selon Marine Le Pen, la règle d''or sert à éviter « la mise sous tutelle de la France » : la contrainte
    budgétaire est choisie par les Français plutôt qu''imposée de l''extérieur par les créanciers ou par des règles
    européennes. La proposition de loi constitutionnelle de 2024 affirme en parallèle la primauté du droit national
    sur le droit européen. Ces deux textes situent la décision au niveau national, avec une discipline budgétaire,
    sans affirmer que l''État puisse ne pas honorer sa dette.'
  porte_par: Marine Le Pen, présidente du groupe RN à l'Assemblée nationale et candidate à la présidentielle 2027
    (RN, S32); Marine Le Pen, proposition de loi constitutionnelle de 2024 (RN, S33)
  repond_a: null
  affirmations:
  - F39 [fait, Vrai] Marine Le Pen propose d'inscrire une règle d'or budgétaire dans la Constitution par référendum,
    pour limiter le déficit public. (sources S32)
  - 'F40 [fait, Plutôt vrai] La proposition de loi constitutionnelle déposée par Marine Le Pen en 2024 met fin à
    la primauté du droit européen sur le droit national. — La proposition de loi constitutionnelle n° 2120 du 25
    janvier 2024 (Assemblée nationale) vise à poser « la supériorité de la Constitution sur toute autre norme, même
    internationale ». La formule « met fin à la primauté du droit européen » est la description qu''en fait l''AFP
    (5 septembre 2026), pas le texte lui-même : le sens est proche, la formulation est une interprétation. (sources
    S33, S45)'
