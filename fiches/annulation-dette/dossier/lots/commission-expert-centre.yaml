- id: T20
  question: Q46
  position: non
  enonce: Dans une union monétaire, la dette en euros et la banque centrale sont des biens communs dont les autres
    membres supportent leur part. Décider seul sur des titres de l'Eurosystème reviendrait à s'affranchir de règles
    communes que l'État a acceptées.
  arguments:
  - A5
  repond_a: []
  examen:
    pertinence:
      valeur: oui
      justification: A5 porte sur le niveau de décision, national ou européen (F3, F4), objet de Q46.
    appui:
      valeur: partiel
      justification: F3 et F4 sont vérifiés (Vrai) ; la contrariété aux traités repose sur F27 (Invérifiable), et
        le partage du bilan avec les autres membres est contredit pour les titres d'État acquis depuis 2015 par
        la résolution de O1 (S9), ce que la réponse à R19 admet.
    raisonnement:
      valeur: valide
      justification: De la priorité donnée aux engagements européens acceptés (F4), la conclusion découle.
    portee:
      texte: établit que l'État s'est engagé à rendre sa législation compatible avec les traités et ne peut instruire
        la banque centrale (F3, F4) ; ne prouve pas que les autres membres supportent le risque des titres français
        détenus, ni que l'opération soit contraire aux traités (F27).
    objections:
      valeur: répondues
      justification: Aucun argument d'une autre thèse ne vise le raisonnement de A5 (F4).
    conclusion: tient en partie
  portee_par:
  - RE
  contre_examen:
  - critere: conclusion
    avis: confirme
    justification: 'Examen confirmé : appui partiel justifié par O1 (S9) sur le partage du bilan et par F27 ; la
      conclusion « décider seul, c''est s''affranchir des règles communes » découle de F3 et F4 sans dépendre de
      F27.'
    proposition: null
  versions:
  - pertinence:
      valeur: oui
      justification: A5 porte sur le niveau de décision, national ou européen (F3, F4), objet de Q46.
    appui:
      valeur: partiel
      justification: F3 et F4 sont vérifiés (Vrai) ; la contrariété aux traités repose sur F27 (Invérifiable), et
        le partage du bilan avec les autres membres est nuancé par la résolution de l'objection O1, selon laquelle
        les revenus et risques des titres d'État acquis depuis 2015 ne sont pas partagés (S9).
    raisonnement:
      valeur: valide
      justification: De la priorité donnée aux engagements européens acceptés (F4), la conclusion découle.
    portee:
      texte: établit que l'État s'est engagé à rendre sa législation compatible avec les traités et ne peut instruire
        la banque centrale (F3, F4) ; ne prouve pas que les autres membres supportent le risque des titres français
        détenus, ni que l'opération soit contraire aux traités (F27).
    objections:
      valeur: répondues
      justification: Aucune thèse ne répond à A5 (F4).
    conclusion: tient en partie
- id: T24
  question: Q47
  position: non
  enonce: 'L''annulation n''est pas préférable, car son gain net est incertain : la Banque de France verse déjà
    à l''État des sommes qui reposent en partie sur ces intérêts. Les leviers retenus sont les économies, l''équilibre
    des comptes et la croissance par la baisse du coût du travail.'
  arguments:
  - A6
  repond_a: []
  examen:
    pertinence:
      valeur: oui
      justification: A6 compare l'annulation aux autres leviers (F18, F20), objet de Q47.
    appui:
      valeur: partiel
      justification: Les versements de la Banque de France sont établis (F18, F19, F20, Vrai) ; leur dépendance
        aux intérêts perçus repose sur F41 (Pas d'estimation fiable), et la croissance par la baisse du coût du
        travail n'est portée par aucune affirmation (réponse à R20).
    raisonnement:
      valeur: valide
      justification: La conclusion « gain net incertain » découle de F19, F20 et de l'absence d'estimation (F41),
        et le choix des leviers suit d'une priorité ; la thèse ne prétend pas que le gain net soit nul.
    portee:
      texte: établit que la Banque de France verse des sommes à l'État (F18, F19, F20) et qu'aucune source ne chiffre
        l'effet de l'annulation sur ces versements (F41) ; ne prouve pas que les leviers retenus dégageraient davantage
        de marges.
    objections:
      valeur: répondues
      justification: Aucun argument d'une autre thèse ne vise le raisonnement de A6 (F20).
    conclusion: tient en partie
  portee_par:
  - HOR
  - RE
  contre_examen:
  - critere: portee
    avis: conteste
    justification: 'Même raison que T7/portee et T8/portee : l''infériorité du gain net au gain brut n''est pas
      établie par F19 et F20 seuls, elle suppose F41 (Pas d''estimation fiable). La thèse elle-même dit seulement
      que le gain est « incertain », ce que F41 établit.'
    proposition: établit que la Banque de France verse des sommes à l'État (F18, F19, F20) et qu'aucune source ne
      chiffre l'effet de l'annulation sur ces versements (F41) ; ne prouve pas que les leviers retenus dégageraient
      davantage de marges.
    decision_rapporteur: acceptee
    motif_rapporteur: La thèse dit « incertain », ce que F41 établit ; portée reformulée, et l'appui mentionne désormais
      F41. Relance de même nature que R7 posée à T24.
  versions:
  - pertinence:
      valeur: oui
      justification: A6 compare l'annulation aux autres leviers (F18, F20), objet de Q47.
    appui:
      valeur: partiel
      justification: Les versements de la Banque de France sont établis (F18, F19, F20, Vrai) ; le présupposé d'une
        croissance obtenue par la baisse du coût du travail n'est porté par aucune affirmation.
    raisonnement:
      valeur: valide
      justification: La conclusion « gain net inférieur au gain brut » découle de F19 et F20, et le choix des leviers
        suit d'une priorité ; la thèse ne prétend pas que le gain net soit nul.
    portee:
      texte: établit que le gain net de l'annulation serait inférieur au gain brut (F19, F20) ; ne prouve pas que
        les leviers retenus dégageraient davantage de marges.
    objections:
      valeur: répondues
      justification: Aucune thèse ne répond à A6 (F20).
    conclusion: tient en partie
questions:
- Q41 (fait) Les traités européens permettent-ils d'annuler, ou de convertir en dette perpétuelle à taux nul, la
  dette française détenue par la Banque de France pour l'Eurosystème ?
- Q42 (estimation) Annuler ou geler cette dette ferait-il monter les taux auxquels la France emprunte ?
- Q43 (estimation) L'opération réduirait-elle durablement la charge d'intérêts de l'État, compte tenu des intérêts
  que la Banque de France reverse à l'État ?
- Q44 (estimation) Annuler ou geler cette dette affaiblirait-il la crédibilité de l'euro ou l'indépendance de la
  BCE ?
- Q45 (valeur) Un État doit-il rembourser intégralement sa dette, y compris quand le créancier est sa propre banque
  centrale ?
- Q46 (valeur) Les décisions sur la dette publique doivent-elles relever de la seule décision nationale plutôt que
  des règles européennes ?
- Q47 (valeur) Pour dégager des marges budgétaires, l'annulation d'une partie de la dette est-elle préférable aux
  économies, à la hausse des recettes ou à la recherche de croissance ?
tes_arguments:
- id: A1
  question: Q41
  position: non
  enonce: 'Les traités ne permettent pas d''effacer ni de convertir à taux nul ces titres : ce serait faire financer
    l''État par sa banque centrale, ce que l''article 123 interdit. Aucun arrêt n''a tranché ce cas précis, et la
    décision relèverait du conseil des gouverneurs.'
  raisonnement: 'L''article 123 interdit crédits et achats directs de dette aux États (F1, F2). La Cour a validé
    les rachats sur le marché secondaire (F8, F10), mais à condition de garanties contre le financement monétaire
    (F9) : les titres ont été achetés à des investisseurs (F24) et non offerts à l''État. Les annuler ou les convertir
    en perpétuel à taux nul reviendrait à donner à l''État, après coup, un avantage que le traité lui refuse au
    départ. Enfin, les décisions du SEBC appartiennent au conseil des gouverneurs (F5), qui ne peut recevoir d''instructions
    des gouvernements (F3) : un État ne peut ni l''ordonner ni modifier seul le cadre (F4).'
  repond_a: null
  partis:
  - RE
  affirmations:
  - F1 [fait, Vrai] Le traité interdit à la BCE et aux banques centrales nationales d'accorder des découverts ou
    crédits aux administrations publiques (Q41).
  - F2 [fait, Vrai] Le traité interdit l'acquisition directe, auprès des États, de leurs titres de dette par la
    BCE ou les banques centrales nationales (Q41).
  - F3 [fait, Vrai] Le traité dispose que ni la BCE, ni une banque centrale nationale, ni un membre de leurs organes
    de décision ne peuvent solliciter ni accepter d'instructions des gouvernements (Q41, Q44).
  - F4 [fait, Vrai] Le traité prévoit que chaque État membre veille à la compatibilité de sa législation nationale,
    y compris les statuts de sa banque centrale, avec les traités et les statuts du SEBC (Q41, Q44).
  - F5 [fait, Vrai] Le conseil des gouverneurs de la BCE arrête les orientations et prend les décisions nécessaires
    aux missions du SEBC (qui décide, Q41).
  - F8 [fait, Vrai] Dans l'arrêt Gauweiler (C-62/14, 16 juin 2015), la Cour dit pour droit que le SEBC est autorisé
    à adopter un programme d'achat d'obligations souveraines sur les marchés secondaires (Q41).
  - F9 [fait, Vrai] Dans l'arrêt Weiss (C-493/17, 11 décembre 2018), la Cour rappelle que le SEBC doit concilier
    ses interventions avec l'interdiction du financement monétaire de l'article 123 TFUE (Q41).
  - F10 [fait, Vrai] Dans l'arrêt Weiss (C-493/17), la Cour dit pour droit que l'examen des questions n'a révélé
    aucun élément affectant la validité de la décision (UE) 2015/774 de la BCE (Q41).
  - F24 [fait, Vrai] Les titres de dette française détenus par l'Eurosystème ont été achetés sur le marché secondaire,
    auprès d'institutions financières, et non directement auprès de l'État.
  - 'F27 [fait, Invérifiable] L''annulation ou la conversion en dette perpétuelle à taux nul de titres achetés par
    l''Eurosystème est contraire aux traités européens. — Aucun texte ne mentionne l''annulation ou la conversion
    de titres déjà détenus (F45) et aucune décision de la CJUE n''a tranché ce cas. La contrariété aux traités est
    affirmée par Roland Lescure (AFP, 24 août 2026) et par Christine Lagarde (F11, F13, F14) ; les signataires de
    la tribune de 2021 soutiennent le contraire (F57) : c''est une interprétation juridique disputée, pas un fait
    établi.'
