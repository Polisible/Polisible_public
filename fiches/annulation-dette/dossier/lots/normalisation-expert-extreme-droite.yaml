consigne: 'Mets tes éléments au format de docs/format-fiche.md (§ 3, 5, 10) par des `corrections` : position oui/non/nuance
  par rapport à la question ; porte_par complet (personne, fonction au moment de la déclaration, parti en sigle,
  date, source, appartenance si la source ne l''établit pas) ; valeurs : « Priorité à… » + porte_par, sinon retirer.
  Mets normalise: true dans chaque correction.'
questions:
  Q41: Les traités européens permettent-ils d'annuler, ou de convertir en dette perpétuelle à taux nul, la dette
    française détenue par la Banque de France pour l'Eurosystème ?
  Q42: Annuler ou geler cette dette ferait-il monter les taux auxquels la France emprunte ?
  Q43: L'opération réduirait-elle durablement la charge d'intérêts de l'État, compte tenu des intérêts que la Banque
    de France reverse à l'État ?
  Q44: Annuler ou geler cette dette affaiblirait-il la crédibilité de l'euro ou l'indépendance de la BCE ?
  Q45: Un État doit-il rembourser intégralement sa dette, y compris quand le créancier est sa propre banque centrale
    ?
  Q46: Les décisions sur la dette publique doivent-elles relever de la seule décision nationale plutôt que des règles
    européennes ?
  Q47: Pour dégager des marges budgétaires, l'annulation d'une partie de la dette est-elle préférable aux économies,
    à la hausse des recettes ou à la recherche de croissance ?
arguments:
- id: A13
  question: Q43
  position: non
  enonce: Annuler ou geler cette dette réduirait la charge d'intérêts de l'État de moins que son montant brut, car
    une part des intérêts reçus par la Banque de France revient à l'État par l'impôt et le dividende (36,8 Md€ versés
    depuis 2015) ; l'ampleur de ce recul n'est chiffrée par aucune source du dossier.
  raisonnement: 'L''État est à la fois débiteur (intérêts payés) et bénéficiaire du résultat de la Banque de France
    (dividende, impôt sur les bénéfices). Si les intérêts disparaissent, le résultat de la Banque de France baisse
    d''autant, donc ses versements à l''État aussi : sur l''ensemble État plus Banque de France, le gain serait
    faible ou nul. La Banque de France verse déjà à l''État des montants importants (36,8 Md€ depuis 2015), qui
    seraient réduits.'
  porte_par:
  - parti: RN
    source: S29
    personne_ou_groupe_ancien: Jordan Bardella, président du RN, réponse publiée sur X à Matthieu Pigasse (23 août
      2026, rapportée par la presse)
  a_normaliser:
  - position à confirmer (ancienne échelle pour/contre)
  - porteur à reformater (personne, fonction, date)
- id: A14
  question: Q47
  position: non
  enonce: 'Pour dégager des marges budgétaires, l''annulation de dette n''est pas préférable : la voie retenue par
    le RN est la réduction des dépenses, dont l''immigration, jointe à une règle d''or votée par référendum.'
  raisonnement: La charge de la dette (65,7 Md€ en 2025) pèse sur le budget parce que le déficit continue d'alimenter
    la dette ; seule une baisse durable du déficit la stabilise. Le plan du RN fait des économies la condition du
    retour de la dette sous 112 % du PIB en 2032, et la règle d'or vise à rendre cet effort contraignant. Une annulation
    de la part détenue par l'Eurosystème ne traiterait pas la cause du déficit.
  porte_par:
  - parti: RN
    source: S31
    personne_ou_groupe_ancien: Marine Le Pen, candidate du RN à la présidentielle 2027
  - parti: RN
    source: S32
    personne_ou_groupe_ancien: Marine Le Pen, tribune sur la règle d'or (1er octobre 2026)
  a_normaliser:
  - position à confirmer (ancienne échelle pour/contre)
  - porteur à reformater (personne, fonction, date)
  - porteur à reformater (personne, fonction, date)
- id: A15
  question: Q46
  position: nuance
  enonce: Le RN veut que les choix budgétaires relèvent du peuple français, par la primauté du droit national et
    une règle d'or adoptée par référendum, mais la règle qu'il propose est un plafond de déficit, pas l'annulation
    unilatérale d'engagements.
  raisonnement: 'Selon Marine Le Pen, la règle d''or sert à éviter « la mise sous tutelle de la France » : la contrainte
    budgétaire est choisie par les Français plutôt qu''imposée de l''extérieur par les créanciers ou par des règles
    européennes. La proposition de loi constitutionnelle de 2024 affirme en parallèle la primauté du droit national
    sur le droit européen. Ces deux textes situent la décision au niveau national, avec une discipline budgétaire,
    sans affirmer que l''État puisse ne pas honorer sa dette.'
  porte_par:
  - parti: RN
    source: S32
    personne_ou_groupe_ancien: Marine Le Pen, présidente du groupe RN à l'Assemblée nationale et candidate à la
      présidentielle 2027
  - parti: RN
    source: S33
    personne_ou_groupe_ancien: Marine Le Pen, proposition de loi constitutionnelle de 2024
  a_normaliser:
  - porteur à reformater (personne, fonction, date)
  - porteur à reformater (personne, fonction, date)
valeurs:
- id: V9
  question: Q46
  enonce: Le RN met en priorité la décision du peuple français et la primauté du droit national ; il ne se prononce
    pas, dans les sources trouvées, sur l'articulation de cette primauté avec les règles européennes sur la dette.
  porte_par: []
  a_normaliser:
  - 'valeur sans porteur : attribuer (parti, source) ou retirer ; commencer par « Priorité à »'
- id: V22
  question: Q46
  enonce: 'Le RN met en priorité la souveraineté nationale : les choix budgétaires doivent relever des Français,
    par la primauté du droit national et une règle d''or votée par référendum, plutôt que de règles ou de créanciers
    extérieurs.'
  porte_par: []
  a_normaliser:
  - 'valeur sans porteur : attribuer (parti, source) ou retirer ; commencer par « Priorité à »'
