- id: A44
  question: Q42
  position: non
  enonce: L'opération porte sur des titres détenus par l'Eurosystème, dont le sort relève du conseil des gouverneurs
    de la BCE, non sur la signature de l'État. Le signal envoyé aux prêteurs privés n'est donc pas celui d'un défaut
    de l'État.
  porte_par:
  - personne: Jean-Luc Mélenchon
    fonction: député
    parti: LFI
    date: '2020-05-11'
    source: S39
    appartenance: S19
  affirmations:
  - F5
  - F46
  - F26
  raisonnement: Le taux rémunère le risque de non-remboursement des prêteurs privés. La décision appartient au conseil
    des gouverneurs (F5) et les créanciers de marché ne sont pas touchés (F46). L'estimation d'une hausse des taux
    reste sans chiffrage (F26).
  repond_a: A2
  auteur: expert-gauche-radicale
  passage: 3
  statut: conteste
  versions:
  - passage: 4
    enonce: A2 présente l'opération comme une renonciation unilatérale de l'État ; or l'opération examinée porte
      sur des titres détenus par l'Eurosystème, dont le sort relève du conseil des gouverneurs. Le signal envoyé
      aux prêteurs privés n'est donc pas celui d'un défaut de l'État sur sa signature.
    raisonnement: A2 conclut à une prime de risque parce que l'État changerait seul les règles. Mais les arguments
      A1 et A3 rappellent que la décision appartient au conseil des gouverneurs (F5) et que les créanciers de marché
      ne sont pas touchés (F46). Le risque de non-remboursement pour les prêteurs privés, que rémunère le taux,
      n'est donc pas démontré comme modifié ; l'estimation d'une hausse reste sans chiffrage (F26).
    position: non
    porte_par:
    - parti: LFI
      source: S39
      personne_ou_groupe_ancien: Jean-Luc Mélenchon et les députés LFI signataires de la proposition de résolution
        n° 2914
  corrige: true
- id: A45
  question: Q44
  position: non
  enonce: Une demande d'un gouvernement ou d'un parlement n'est pas une instruction tant que la BCE la décide librement.
    L'indépendance interdit d'accepter des instructions, pas d'être sollicitée.
  porte_par:
  - personne: Jean-Luc Mélenchon
    fonction: député
    parti: LFI
    date: '2020-05-11'
    source: S39
    appartenance: S19
  affirmations:
  - F3
  - F4
  - F5
  raisonnement: F3 interdit à la BCE de solliciter ou d'accepter des instructions ; elle n'interdit pas qu'un gouvernement
    formule une demande que le conseil des gouverneurs (F5) reste libre de refuser. F4 porte sur la législation
    nationale et les statuts des banques centrales. L'atteinte à l'indépendance suppose donc que la BCE accepte
    une instruction.
  repond_a: A3
  auteur: expert-gauche-radicale
  passage: 3
  statut: conteste
  versions:
  - passage: 4
    enonce: A3 qualifie d'instruction une décision que le conseil des gouverneurs prendrait lui-même ; la demande
      d'un gouvernement ou d'un parlement, tant que la BCE la décide librement, n'est pas une instruction acceptée.
    raisonnement: F3 interdit à la BCE de solliciter ou d'accepter des instructions ; elle n'interdit pas qu'un
      gouvernement formule une demande politique, que le conseil des gouverneurs (F5) reste libre de refuser. F4
      porte sur la législation nationale et les statuts des banques centrales, non sur les décisions du conseil
      des gouverneurs. L'atteinte à l'indépendance ne suit donc des affirmations citées que si la BCE accepte une
      instruction, ce qu'A3 suppose sans l'établir.
    position: non
    porte_par:
    - parti: LFI
      source: S39
      personne_ou_groupe_ancien: Jean-Luc Mélenchon et les députés LFI signataires de la proposition de résolution
        n° 2914 (invitation faite au gouvernement d'exiger un changement)
  corrige: true
- id: A46
  question: Q41
  position: oui
  enonce: L'article 123 vise deux actes précis, le crédit direct et l'achat direct. Que l'effacement d'une créance
    acquise sur le marché secondaire soit un financement interdit est une interprétation, non une conséquence du
    texte.
