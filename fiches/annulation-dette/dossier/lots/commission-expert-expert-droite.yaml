  sourcées si besoin). Tu peux contester une fois l''examen de tes thèses (contestations : these, critere, nature
  fait|raisonnement, contenu, sources). Pas de contestation de valeur.'
relances:
- these: T16
  partis:
  - LR
  question_posee: Votre thèse T16 présuppose qu'une annulation limitée à la banque centrale ferait perdre la confiance
    des prêteurs, ce que le dossier n'établit pas (F26 Pas d'estimation fiable). Avez-vous une source ?
  id: R15
  statut: posee
- these: T25
  partis:
  - LR
  question_posee: Dans votre thèse T25, la position sur l'annulation est déduite du silence du plan (F29, F30).
    Avez-vous une source datée où le parti se prononce sur l'annulation ou le gel de la dette détenue par la banque
