      premier trimestre 2025 ; même sens. F17 : le chiffre de 24,4 % figure dans le tableau « Autres français (dont
      la Banque de France pour le compte de la BCE) », titres de la dette négociable de l''État au premier trimestre
      2025 en valeur de marché ; même périmètre.'
    extrait: Autres français (dont la Banque de France pour le compte de la BCE) 24,4 %
- id: F18
  enonce: Le 24 mars 2026, la Banque de France annonce un bénéfice net de 8,1 milliards d'euros pour l'exercice
    2025 (Q43).
  type: fait
  declaration: false
  sources:
  - source: S8
    niveau: 1
    statut: conforme
    note_verif: 'Communiqué de presse de la Banque de France daté « Paris, le 24 mars 2026 », titre conforme. F18
      : extrait présent mot pour mot, pour l''exercice 2025, même sens.'
    extrait: La Banque de France enregistre un bénéfice net de 8,1 Mds €.
- id: F19
  enonce: Pour l'exercice 2025, la Banque de France verse un impôt sur les bénéfices de 1,5 milliard d'euros avant
    d'atteindre un résultat net de 8,1 milliards (Q43).
  type: fait
  declaration: false
  sources:
  - source: S7
    niveau: 1
    statut: conforme
    note_verif: 'Document Banque de France « Comprendre les comptes annuels et les équilibres financiers » de l''exercice
      2025, publié en mars 2026 (titre lu en pied de page, pas dans les métadonnées). F19 : extrait présent, même
      exercice 2025 et même unité. F20 : extrait présent (« contributeur important au budget de l''État »), même
      sens ; le document précise que ce total sur 2015-2025 réunit impôt sur les sociétés, dividendes et restitution
      d''excédents.'
    extrait: Après paiement de l'impôt sur les bénéfices (1,5 milliard d'euros), le résultat net ressort à 8,1 milliards
      d'euros.
- id: F20
  enonce: 'La Banque de France est un contributeur au budget de l''État : 36,8 milliards d''euros versés depuis
    2015 (Q43).'
  type: fait
  declaration: false
  sources:
  - source: S7
    niveau: 1
    statut: conforme
    note_verif: 'Document Banque de France « Comprendre les comptes annuels et les équilibres financiers » de l''exercice
      2025, publié en mars 2026 (titre lu en pied de page, pas dans les métadonnées). F19 : extrait présent, même
      exercice 2025 et même unité. F20 : extrait présent (« contributeur important au budget de l''État »), même
      sens ; le document précise que ce total sur 2015-2025 réunit impôt sur les sociétés, dividendes et restitution
      d''excédents.'
    extrait: avec un total de 36,8 milliards d'euros versés depuis 2015
- id: F21
  enonce: La Banque de France, contributrice nette au partage du revenu monétaire entre 2015 et 2022, est devenue
    bénéficiaire nette en 2023-2024 (Q43).
  type: fait
  declaration: false
  sources:
  - source: S9
    niveau: 1
    statut: conforme
    note_verif: 'Bon document : Bulletin de la Banque de France n° 260/6, septembre-octobre 2025, sur le partage
      du revenu monétaire (adresse déposée en février 2026, date du document inchangée). F21 : l''extrait figure
      mot pour mot (note sous le graphique, sources banques centrales nationales) et dit la même chose que l''affirmation,
      même période 2015-2022 puis 2023-2024.'
    extrait: La Banque de France, contributrice nette au titre du partage du revenu monétaire entre 2015 et 2022,
      est devenue bénéficiaire nette en 2023-2024
- id: F22
  enonce: En 2025, la charge de la dette de l'ensemble des administrations publiques atteint 65,7 milliards d'euros,
    soit 2,2 points de PIB (Cour des comptes, juin 2026) (Q43).
  type: fait
  declaration: false
  sources:
  - source: S11
    niveau: 1
    statut: conforme
    note_verif: 'Bon document : synthèse du rapport de la Cour des comptes sur la situation et les perspectives
      des finances publiques, juin 2026. F22 : l''extrait figure et dit la même chose (charge de la dette de l''ensemble
      des administrations publiques en 2025, 65,7 Md€, 2,2 points de PIB, plus de 9 % par rapport à 2024). F23 :
      le chiffre de 77,4 Md€ (2,5 points de PIB, +11,7 Md€) figure comme prévision de charge de la dette des administrations
      publiques pour 2026, mais la synthèse ne l''attribue pas explicitement à la loi de finances pour 2026 (la
      mention de la LFI promulguée le 19 février porte sur la dépense hors charge de la dette, 1 735 Md€) : écart
      de périmètre sur la mention « dans la loi de finances pour 2026 ».'
    extrait: 65,7 Md€ (2,2 points de PIB), soit une
