sources_a_verifier:
- source:
    id: S8
    titre: Traité sur le fonctionnement de l'Union européenne (version consolidée), article 123
    auteur: Union européenne (Journal officiel C 326 du 26.10.2012)
    date: '2012-10-26'
    adresse: https://eur-lex.europa.eu/legal-content/FR/TXT/?uri=CELEX:12012E123
    niveau: 1
  a_controler:
  - affirmation: F14
    enonce: L'article 123 du TFUE interdit à la BCE et aux banques centrales nationales d'accorder des crédits aux
      administrations publiques des États membres et d'acquérir directement leur dette.
    type: fait
    extrait_annonce: l'acquisition directe, auprès d'eux, par la Banque centrale européenne ou les banques centrales
      nationales, des instruments de leur dette est également interdite.
- source:
    id: S9
    titre: Traité sur le fonctionnement de l'Union européenne (version consolidée), article 130
    auteur: Union européenne (Journal officiel C 326 du 26.10.2012)
    date: '2012-10-26'
    adresse: https://eur-lex.europa.eu/legal-content/FR/TXT/?uri=CELEX:12012E130
    niveau: 1
  a_controler:
  - affirmation: F15
    enonce: L'article 130 du TFUE interdit aux banques centrales de solliciter ou d'accepter des instructions des
      gouvernements des États membres, et les gouvernements s'engagent à ne pas chercher à les influencer.
    type: fait
    extrait_annonce: ni la Banque centrale européenne, ni une banque centrale nationale, ni un membre quelconque
      de leurs organes de décision ne peuvent solliciter ni accepter des instructions
- source:
    id: S10
    titre: 'Jordan Bardella sur X : « Matthieu Pigasse raconte n''importe quoi. »'
    auteur: Jordan Bardella, président du Rassemblement national
    date: '2026-08-23'
    adresse: https://x.com/J_Bardella/status/2091477140793373045
    niveau: 3
  a_controler:
  - affirmation: F18
    enonce: Le 23 août 2026, Jordan Bardella a écrit que la Banque de France est détenue par l'État et que les intérêts
      que l'État lui verse lui sont reversés sous forme de dividendes.
    type: fait
    extrait_annonce: La Banque de France est détenue par l'État.
- source:
    id: S11
    titre: Annuler une partie de la dette de la France ? La proposition de LFI face aux obstacles juridiques et
      politiques
    auteur: De Facto (observatoire de l'information, fact-check relayant l'AFP)
    date: '2026-08-25'
    adresse: https://defacto-observatoire.fr/Medias/Factuel/Fact-checks/Annuler-une-partie-de-la-dette-de-la-France-La-proposition-de-LFI-face-aux-obstacles-juridiques-et-politiques/
    niveau: 4
  a_controler:
  - affirmation: F17
    enonce: Selon des experts interrogés par l'AFP en août 2026, seul le Conseil des gouverneurs de la BCE pourrait
      décider d'effacer la part de dette détenue par l'Eurosystème, et une telle décision est jugée très improbable.
    type: fait
    extrait_annonce: Des experts soulignent aussi que seul le Conseil des gouverneurs de la BCE pourrait décider
      d'effacer cette part de la dette.
- source:
    id: S12
    titre: Jean-Luc Mélenchon propose d'annuler la dette, ce serait « illégal, dangereux et inutile », met en garde
      la Banque de France
    auteur: Boursorama avec Media Services (AFP)
    date: '2026-09-11'
    adresse: https://www.boursorama.com/actualite-economique/actualites/jean-luc-melenchon-propose-d-annuler-la-dette-ce-serait-illegal-dangereux-et-inutile-met-en-garde-la-banque-de-france-40b8c3bc3be532dc9b54c8cd44573dea
    niveau: 4
  a_controler:
  - affirmation: F16
    enonce: Le 11 septembre 2026, le gouverneur de la Banque de France, Emmanuel Moulin, a déclaré sur RTL que l'annulation
      proposée par Jean-Luc Mélenchon était illégale car contraire aux traités.
    type: fait
    extrait_annonce: '"Elle est illégale parce qu''elle est contraire aux traités"'
- source:
    id: S13
    titre: Brochure programme de la campagne Poutou 2022
    auteur: NPA (Nouveau Parti anticapitaliste)
    date: '2022-02-24'
    adresse: https://npa-lanticapitaliste.org/sites/default/files/brochure-programme-poutou-2022_2.pdf
    niveau: 3
  a_controler:
  - affirmation: F20
    enonce: La brochure programme de la campagne Poutou 2022 du NPA demande l'arrêt immédiat du paiement de la dette
      publique et de ses intérêts.
    type: fait
    extrait_annonce: Nous voulons l’arrêt immédiat du paiement de la dette et de ses intérêts,
  - affirmation: F21
    enonce: La même brochure du NPA demande une rupture avec les traités européens.
    type: fait
    extrait_annonce: Rupture avec les traités européens antidémocratiques et favorisant la concurrence libre et
      non faussée
- source:
    id: S14
    titre: 'Communiqué de presse n° 192/18 : arrêt dans l''affaire C-493/17, Weiss e.a.'
    auteur: Cour de justice de l'Union européenne
    date: '2018-12-11'
    adresse: https://curia.europa.eu/site/upload/docs/application/pdf/2018-12/cp180192fr.pdf
    niveau: 1
  a_controler:
  - affirmation: F24
    enonce: Par l'arrêt Weiss du 11 décembre 2018, la Cour de justice de l'Union européenne a jugé que le programme
      d'achats d'obligations souveraines sur les marchés secondaires (PSPP) ne viole pas l'interdiction du financement
      monétaire.
    type: fait
    extrait_annonce: La Cour constate ensuite que le programme PSPP ne viole pas l’interdiction du financement monétaire,
      qui interdit au SEBC d’accorder tout type de crédit à un État membre.
