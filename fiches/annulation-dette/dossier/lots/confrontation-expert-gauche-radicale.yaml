  auteur: droite
  question: Q45
  position: contre
  enonce: 'Un État doit rembourser sa dette, y compris quand le créancier est un organisme public comme la banque
    centrale : la parole de l''État engage les contribuables, et y renoncer ferait perdre la confiance qui permet
    d''emprunter.'
  raisonnement: Pour ce défenseur de la rigueur budgétaire, une dette est un engagement pris au nom du peuple. Si
    l'État peut s'en délier dès qu'elle devient pesante, aucun engagement futur ne sera crédible ; la bonne réponse
    à une dette lourde est de redéfinir les priorités de dépense, non de la faire disparaître. Position exprimée
    en décembre 2020 sur l'annulation des dettes détenues par la BCE, pas sur la proposition d'août 2026.
  porte_par: Jean-François Husson, sénateur LR, rapporteur général de la commission des finances du Sénat (entretien
    du 28 décembre 2020) (LR, S21)
  repond_a: null
  affirmations:
  - 'F28 [valeur, sans verdict] Un État doit honorer ses dettes : en s''engageant, il engage son peuple, c''est-à-dire
    ses contribuables, et la parole donnée doit garder sa valeur. (sources S21)'
