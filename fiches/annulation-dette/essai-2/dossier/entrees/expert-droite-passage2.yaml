corrections:
  - vise: A3
    action: corriger
    enonce: "Annuler cette dette ne dépend pas du gouvernement français et heurte l'interdiction du financement monétaire des États : ce n'est donc pas juridiquement possible dans le cadre actuel des traités."
    raisonnement: "Les titres ont été achetés sur le marché secondaire, ce que les traités permettent (F4, F5) parce qu'ils interdisent l'achat direct à l'État (F1) et tout crédit aux autorités publiques (F2). Annuler ces titres reviendrait à transformer ces achats en financement sans contrepartie de l'État, ce que l'article 123 vise à empêcher. En outre, la Banque de France et la BCE ne peuvent recevoir d'instruction d'un gouvernement (F3) et la décision relèverait du Conseil des gouverneurs (F12) : un gouvernement français seul ne peut ni l'ordonner ni la décider. Aucun texte ni arrêt ne traite toutefois de l'annulation en particulier : la conclusion repose sur l'interprétation de l'article 123, comme le note F12."
