sources_a_verifier:
- source:
    id: S17
    titre: Arrêt de la Cour (grande chambre) du 11 décembre 2018, Heinrich Weiss e.a., affaire C-493/17 (texte intégral,
      EUR-Lex)
    auteur: Cour de justice de l'Union européenne
    date: '2018-12-11'
    adresse: https://eur-lex.europa.eu/legal-content/FR/TXT/HTML/?uri=CELEX:62017CJ0493
    niveau: 1
    statut: a-verifier
    demande: null
  a_controler:
  - affirmation: F15
    enonce: Conserver des obligations jusqu'à leur échéance n'implique aucune renonciation au paiement de sa dette
      par l'État émetteur une fois le terme échu (arrêt C-493/17, point 146).
    type: fait
    extrait_annonce: une telle pratique n’est nullement exclue par l’article 18, paragraphe 1, du protocole sur
      le SEBC et la BCE et qu’elle n’implique aucune renonciation au paiement, par l’État membre émetteur, de sa
      dette une fois le terme de l’obligation échue
  - affirmation: F16
    enonce: Le programme d'achats PSPP (décision 2015/774) ne soustrait pas les États membres concernés à l'incitation
      à conduire une politique budgétaire saine (arrêt C-493/17, point 144).
    type: fait
    extrait_annonce: la décision 2015/774 n’a pas pour effet de soustraire les États membres concernés à l’incitation
      à conduire une politique budgétaire saine
