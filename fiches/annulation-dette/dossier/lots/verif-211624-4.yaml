    titre: Pourquoi il faut annuler la dette publique... et qui doit payer cette annulation
    auteur: Tendance CLAIRE (courant du NPA)
    date: '2021-01-01'
    adresse: https://tendanceclaire.org/utils/pdf.php?id=1675
    niveau: 3
