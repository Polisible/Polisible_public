tes_theses:
- id: T2
  question: Q41
  position: non
  enonce: Les traités interdisent à la BCE de financer directement les États, d'où des rachats sur le marché secondaire.
    L'annulation partielle se heurte donc aux traités et suppose de les changer, par une démarche auprès de la Commission
    et des autres États.
  arguments:
  - A21
  repond_a: []
  examen:
    pertinence:
      valeur: oui
      justification: A21 répond à la question de la compatibilité avec les traités (F1, F2).
    appui:
      valeur: solide
      justification: F1, F2 et F44 sont vérifiés (Vrai, textes du traité et données de l'Eurosystème).
    raisonnement:
      valeur: lacune
      essentielle: true
      justification: 'Conclusion plus large que les prémisses : F1 et F2 interdisent le crédit et l''achat direct,
        et F44 montre que les achats ont respecté cette interdiction ; aucune affirmation n''établit que l''annulation
        de titres déjà détenus est visée (F45, F27 Invérifiable).'
    portee:
      texte: établit que le traité interdit le financement direct des États et que les titres ont été achetés sur
        le marché secondaire (F1, F2, F44) ; ne prouve pas que l'annulation de titres déjà détenus soit interdite
        par les traités actuels.
    objections:
      valeur: répondues
      justification: Aucune thèse ne répond formellement à A21 ; T3 (A20, A32) défend la conclusion inverse sans
        viser cet argument.
    conclusion: ne tient pas
  portee_par:
  - PCF
- id: T3
  question: Q41
  position: oui
  enonce: 'Les traités le permettent : l''article 123 interdit deux actes précis, le crédit et l''achat direct,
    et ne mentionne pas l''annulation ni la conversion de titres déjà détenus. La Cour a validé les achats sur le
    marché secondaire, et la décision relèverait du conseil des gouverneurs.'
  arguments:
  - A20
  - A32
  - A46
  repond_a:
  - T1
  examen:
    pertinence:
      valeur: oui
      justification: A20, A32 et A46 portent directement sur ce que permettent les traités (F45, F57).
    appui:
      valeur: solide
      justification: 'Les prémisses sont vérifiées : F1, F2, F5, F8, F9, F10, F24, F44, F45, F57 (Vrai, textes et
        arrêts de la Cour, niveau 1).'
    raisonnement:
      valeur: lacune
      essentielle: true
      justification: 'Silence d''un texte pris pour une permission : F45 et F57 établissent que le traité ne mentionne
        pas l''annulation, non qu''il l''autorise ; F9 montre que la Cour apprécie les interventions selon l''interdiction
        du financement monétaire, et F27 reste Invérifiable dans les deux sens.'
    portee:
      texte: établit que le texte des traités ne mentionne pas l'annulation ou la conversion (F45, F57), qu'aucun
        arrêt n'a tranché ce cas et que la décision appartiendrait au conseil des gouverneurs (F5) ; ne prouve pas
        que les traités autorisent l'opération.
    objections:
      valeur: en partie
      justification: T1 (A37) objecte que l'absence du mot ne vaut pas autorisation et que la proposition débattue
        est portée par un gouvernement (F3) ; A46 répond sur le premier point, aucun argument de T3 ne répond sur
        le second.
    conclusion: ne tient pas
  portee_par:
  - LFI
  - PP
- id: T5
  question: Q42
  position: non
  enonce: 'Les taux ne monteraient pas : l''opération ne vise que la part de l''Eurosystème, dont le sort relève
    du conseil des gouverneurs, et les créanciers privés sont remboursés. Le risque de non-remboursement que rémunère
    le taux n''est donc pas modifié.'
  arguments:
  - A22
  - A44
  repond_a:
  - T4
  examen:
    pertinence:
      valeur: oui
      justification: A22 et A44 portent sur l'effet de l'opération sur les taux (F47), objet de Q42.
    appui:
      valeur: faible
      justification: 'L''absence d''effet repose sur F47 (Pas d''estimation fiable : l''avis du porteur de la proposition,
        contesté par des économistes) ; F46 (Plutôt vrai) décrit le périmètre, pas la réaction des prêteurs.'
    raisonnement:
      valeur: lacune
      essentielle: true
      justification: 'Cause supposée : de ce que les créanciers privés ne sont pas touchés (F46), la thèse déduit
        que le taux ne bouge pas, en supposant que les prêteurs n''évaluent que leur propre risque de non-paiement,
        ce qu''aucune estimation n''établit (F47).'
    portee:
      texte: établit que la proposition vise la part détenue par la Banque de France pour l'Eurosystème (F46) et
        que le conseil des gouverneurs décide pour le SEBC (F5) ; ne prouve pas que l'opération serait sans effet
        sur les taux.
    objections:
      valeur: sans réponse
      justification: T4 (A38, A51) objecte que les prêteurs évaluent aussi la fiabilité des règles et que le scénario
        proposé est national (F46, F27) ; aucun argument de T5 n'y répond.
    conclusion: ne tient pas
  portee_par:
  - LFI
- id: T8
  question: Q43
  position: nuance
  enonce: L'opération allège le stock de dette et évite de refinancer sur le marché les titres que l'Eurosystème
    ne réinvestit plus. L'économie annuelle nette d'intérêts est inférieure à l'économie brute, car la Banque de
    France reverse une partie de ses bénéfices à l'État.
  arguments:
  - A23
  repond_a: []
  examen:
    pertinence:
      valeur: oui
      justification: A23 porte sur la charge d'intérêts compte tenu des reversements de la Banque de France (F18,
        F19, F20, F21), objet de Q43.
    appui:
      valeur: solide
      justification: Toutes les affirmations sont vérifiées (F18, F19, F20, F21, F22, F48, F50, Vrai), issues de
        la Banque de France, de la Cour des comptes et de la BCE.
    raisonnement:
      valeur: valide
      justification: 'La conclusion se limite à ce que montrent les prémisses : non-réinvestissement (F48), d''où
        un refinancement de marché évité, et reversements variables (F19, F21), d''où une économie nette inférieure
        à la brute, sans montant avancé.'
    portee:
      texte: établit que l'économie nette est inférieure à l'économie brute et que la conversion éviterait de refinancer
        ces titres sur le marché (F48, F19, F20) ; ne prouve pas le montant ni le signe durable de l'économie nette,
        faute d'estimation (F41).
    objections:
      valeur: répondues
      justification: Aucune thèse ne répond à A23 (F48, F22).
    conclusion: tient
  portee_par:
  - LFI
- id: T9
  question: Q43
  position: oui
  enonce: L'annulation de la part détenue par la banque centrale dégagerait immédiatement des marges financières
    pour l'État, en supprimant le service et le principal de ces titres. Le gain net dépend des reversements de
    la Banque de France.
  arguments:
  - A24
  repond_a: []
  examen:
    pertinence:
      valeur: oui
      justification: A24 porte sur la réduction de la charge d'intérêts (F22, F49), objet de Q43.
    appui:
      valeur: faible
      justification: 'Les marges reposent sur F49 (Pas d''estimation fiable : une intervention de 2021 sans chiffrage)
        ; F22 porte sur la charge totale de la dette, pas sur la part de la banque centrale.'
    raisonnement:
      valeur: lacune
      essentielle: true
      justification: 'Conclusion plus large que les prémisses : de la charge totale (F22), la thèse tire un gain
        net positif sur la seule part de la banque centrale, sans tenir compte des reversements (F19, F20) qu''elle
        mentionne pourtant.'
    portee:
      texte: établit que la charge de la dette atteint 65,7 milliards d'euros en 2025 (F22) ; ne prouve pas que
        l'opération dégagerait une marge nette, ni de quel montant.
    objections:
      valeur: sans réponse
      justification: T7 (A39) objecte que F22 ne porte pas sur la part de la banque centrale et que le gain net
        n'est pas chiffré (F41, F49) ; A24 n'y répond pas.
    conclusion: ne tient pas
  portee_par:
  - PCF
- id: T12
  question: Q44
  position: non
  enonce: 'Une décision prise par le conseil des gouverneurs lui-même n''atteint pas l''indépendance de la BCE :
    le traité interdit d''accepter des instructions des gouvernements, non d''être sollicité. Constater que ces
    titres ne seront pas remboursés ne change pas le bilan réel.'
  arguments:
  - A25
  - A45
  repond_a:
  - T10
  examen:
    pertinence:
      valeur: oui
      justification: A25 et A45 portent sur l'indépendance de la BCE et la crédibilité de l'euro (F3, F5), objet
        de Q44.
    appui:
      valeur: partiel
      justification: Le volet indépendance repose sur F3 et F5 (Vrai) ; le volet crédibilité repose sur F53, affirmation
        de valeur sans verdict, qui ne peut établir un fait.
    raisonnement:
      valeur: lacune
      essentielle: false
      justification: La distinction entre demande et instruction (F3) est valide pour une décision libre du conseil
        (F5), mais la thèse ne dit pas que la proposition suit cette voie, alors que F4 soumet une loi nationale
        au contrôle de compatibilité.
    portee:
      texte: établit qu'une décision libre du conseil des gouverneurs ne serait pas une instruction au sens de F3
        ; ne prouve pas que la proposition débattue suive cette voie, ni que la crédibilité de l'euro serait intacte.
    objections:
      valeur: sans réponse
      justification: T14 (A52) objecte que la distinction ne vaut pas pour une loi nationale visant la Banque de
        France (F4) ; aucun argument de T12 n'y répond.
    conclusion: tient en partie
  portee_par:
  - LFI
- id: T17
  question: Q45
  position: non
  enonce: La dette détenue par la banque centrale est une dette envers une institution publique, dont les vendeurs
    ont déjà été payés. L'annuler ne lèse aucun créancier privé, que l'État doit continuer d'honorer.
  arguments:
  - A26
  - A49
  - A54
  repond_a:
  - T15
  examen:
    pertinence:
      valeur: oui
      justification: A26, A49 et A54 répondent à la question du remboursement quand le créancier est la banque centrale
        (F24, F51).
    appui:
      valeur: solide
      justification: Le présupposé factuel, vendeurs payés et créancier public, est établi (F24, Vrai ; F46 et F16,
        Plutôt vrai, pour l'ordre de grandeur) ; F51 et F52 sont des valeurs.
    raisonnement:
      valeur: valide
      justification: De la distinction entre créancier public et créanciers privés (F24, F51), la conclusion découle
        ; A54 montre qu'elle ne dépend pas de la part exacte (F16, F46).
    portee:
      texte: établit que les vendeurs ont été réglés et que le créancier actuel est la banque centrale (F24) ; ne
        prouve pas que l'annulation serait sans effet pour l'État ou pour les autres membres de l'Eurosystème.
    objections:
      valeur: sans réponse
      justification: T15 (A50) objecte que ces titres sont déjà remboursés à échéance comme les autres (F48, F31)
        ; aucun argument de T17 n'y répond.
    conclusion: tient en partie
  portee_par:
  - PCF
  - PP
- id: T18
  question: Q45
  position: non
  enonce: Rembourser intégralement la banque centrale oblige à réemprunter, à lever l'impôt ou à réduire la dépense,
    sans léser de créancier privé. La marge dégagée peut servir à investir, notamment dans la transition écologique.
  arguments:
  - A10
  - A27
  - A34
  repond_a: []
  examen:
    pertinence:
      valeur: oui
      justification: A10, A27 et A34 répondent à la question du remboursement quand le créancier est la banque centrale
        (F17, F53).
    appui:
      valeur: partiel
      justification: 'Présupposés établis : ampleur de la détention (F31, F16, Plutôt vrai ; F17, Vrai), reversements
        à l''État (F7, F20, Vrai), besoins d''investissement (F32, Plutôt vrai) ; le présupposé d''une marge nette
        dégagée n''est pas établi (F41, Pas d''estimation fiable).'
    raisonnement:
      valeur: valide
      justification: Si la marge nette existe, la conclusion découle de la priorité donnée à l'investissement (F53,
        F32) ; la thèse reconnaît que les intérêts reviennent en partie à l'État (F20).
    portee:
      texte: établit l'ampleur de la dette détenue par l'Eurosystème (F31, F17) et que son remboursement doit être
        financé ; ne prouve pas que l'annulation dégagerait une marge nette pour l'État.
    objections:
      valeur: répondues
      justification: Aucune thèse ne répond à A10, A27 ou A34 (F53).
    conclusion: tient en partie
  portee_par:
  - LE
  - LFI
  - PP
- id: T21
  question: Q46
  position: non
  enonce: 'Un État seul ne peut pas annuler : la décision appartient à la BCE, institution commune qui n''accepte
    pas d''instructions des gouvernements. Elle passe par un accord entre les États européens et la BCE, puis par
    une révision des règles.'
  arguments:
  - A29
  - A35
  repond_a: []
  examen:
    pertinence:
      valeur: oui
      justification: A29 et A35 portent sur le niveau de décision, national ou européen (F3, F5), objet de Q46.
    appui:
      valeur: solide
      justification: 'Les présupposés factuels sont vérifiés : F1, F2, F3, F5, F60 (Vrai) ; F51 et F56 sont des
        valeurs.'
    raisonnement:
      valeur: valide
      justification: De F3 et F5 découle qu'une décision nationale seule n'a pas d'effet sur la créance ; la préférence
        pour une démarche collective suit de la priorité affirmée (F56).
    portee:
      texte: établit que la décision appartient au conseil des gouverneurs, qui ne reçoit pas d'instructions des
        gouvernements (F3, F5) ; ne prouve pas qu'un accord entre les États et la BCE soit atteignable.
    objections:
      valeur: répondues
      justification: Aucune thèse ne répond à A29 ou A35 (F60).
    conclusion: tient
  portee_par:
  - PCF
  - PP
- id: T22
  question: Q46
  position: nuance
  enonce: La dette détenue par l'Eurosystème relève d'une décision européenne, non nationale seule, mais les règles
    actuelles doivent être révisées. Leurs objectifs et leur contrôle doivent changer, par une révision des traités,
    plutôt qu'être contournés par un État.
  arguments:
  - A11
  - A28
  repond_a: []
  examen:
    pertinence:
      valeur: oui
      justification: A11 et A28 portent sur le niveau de décision et sur les règles européennes (F4, F5, F56), objet
        de Q46.
    appui:
      valeur: solide
      justification: 'Les présupposés factuels sont vérifiés : F1, F2, F4, F5, F33 (Vrai), F32 (Plutôt vrai) ; F56
        est une valeur.'
    raisonnement:
      valeur: valide
      justification: Du cadre actuel (F4, F5) et de la priorité donnée au contrôle démocratique et aux objectifs
        écologiques (F56, F33), la conclusion découle.
    portee:
      texte: établit que la décision relève aujourd'hui de l'Eurosystème (F4, F5) et que les partis concernés proposent
        une révision des traités (F33) ; ne prouve pas qu'une telle révision soit atteignable.
    objections:
      valeur: répondues
      justification: Aucune thèse ne répond à A11 ou A28 (F33).
    conclusion: tient
  portee_par:
  - LE
  - LFI
- id: T27
  question: Q47
  position: oui
  enonce: L'annulation ou le gel de la dette détenue par la banque centrale est préférable à un nouveau cycle d'austérité,
    car elle ne coûte rien à personne. Elle permet de financer services publics et investissements sans économies.
  arguments:
  - A30
  repond_a: []
  examen:
    pertinence:
      valeur: oui
      justification: A30 compare l'annulation aux économies (F54), objet de Q47.
    appui:
      valeur: faible
      justification: 'Le présupposé « ne coûte rien à personne » repose sur F47 (Pas d''estimation fiable : l''avis
        du porteur de la proposition) ; F54 est une valeur.'
    raisonnement:
      valeur: lacune
      essentielle: true
      justification: 'Conclusion plus large que les prémisses : F47 porte sur le coût d''emprunt, non sur la marge
        dégagée, que les reversements de la Banque de France réduisent (F19, F20).'
    portee:
      texte: établit la priorité donnée à l'absence d'économies sur les dépenses (F54) ; ne prouve pas que l'opération
        ne coûterait rien ni qu'elle dégagerait une marge nette.
    objections:
      valeur: répondues
      justification: Aucune thèse ne répond à A30 (F54).
    conclusion: ne tient pas
  portee_par:
  - LFI
- id: T28
  question: Q47
  position: nuance
  enonce: L'annulation de la dette auprès de la banque centrale n'est pas une alternative aux recettes fiscales,
    mais un levier à combiner avec elles et avec la lutte contre l'évasion fiscale. Le critère est l'usage de la
    marge dégagée.
  arguments:
  - A12
  - A31
  repond_a: []
  examen:
    pertinence:
      valeur: oui
      justification: A12 et A31 comparent l'annulation aux recettes et aux économies (F34, F35), objet de Q47.
    appui:
      valeur: partiel
      justification: Les positions des partis sont établies (F34, F35, F36, Vrai) ; le présupposé d'une marge dégagée
        par l'annulation repose sur F49 (Pas d'estimation fiable), sans le porter seul.
    raisonnement:
      valeur: valide
      justification: La thèse ne classe pas les leviers et ne prétend pas chiffrer la marge ; sa conclusion suit
        des priorités affirmées (F55, F34).
    portee:
      texte: établit que les partis concernés associent annulation et hausse des recettes (F34, F35) ; ne prouve
        pas que l'annulation dégagerait une marge nette, ni de quel montant (F49).
    objections:
      valeur: répondues
      justification: Aucune thèse ne répond à A12 ou A31 (F49).
    conclusion: tient en partie
  portee_par:
  - LE
  - PCF
questions:
- Q41 (fait) Les traités européens permettent-ils d'annuler, ou de convertir en dette perpétuelle à taux nul, la
  dette française détenue par la Banque de France pour l'Eurosystème ?
- Q42 (estimation) Annuler ou geler cette dette ferait-il monter les taux auxquels la France emprunte ?
- Q43 (estimation) L'opération réduirait-elle durablement la charge d'intérêts de l'État, compte tenu des intérêts
  que la Banque de France reverse à l'État ?
- Q44 (estimation) Annuler ou geler cette dette affaiblirait-il la crédibilité de l'euro ou l'indépendance de la
  BCE ?
- Q45 (valeur) Un État doit-il rembourser intégralement sa dette, y compris quand le créancier est sa propre banque
  centrale ?
- Q46 (valeur) Les décisions sur la dette publique doivent-elles relever de la seule décision nationale plutôt que
  des règles européennes ?
