incertitudes:
  - "Aucune déclaration officielle des Écologistes ni de Marine Tondelier sur la proposition d'août 2026 n'a été trouvée ; les arguments déposés reposent sur une chronique individuelle (Gleizes) et sur des positions de 2020 et 2025."
  - "Jérôme Gleizes est décrit comme conseiller EELV de Paris par Politis en janvier 2023 ; son statut en 2026 n'est pas vérifié. S'il n'est plus membre, a1, a2 et a3 perdent cette attribution (a3 garde s4)."
  - "La chronique de Gleizes (a1) contient un raisonnement juridique en une phrase : le vérificateur peut juger qu'elle ne couvre pas la conversion perpétuelle."
  - "Le plan de juin 2020 est connu par une dépêche AFP reprise par un site financier (niveau 4), non par un texte du parti ; sa date est celle de la publication. Il parle d'annulation, pas de dette perpétuelle."
  - "La revue de presse du site des Écologistes (s3) ne porte pas de date : septembre 2025 est déduit des dates internes (4 et 5 septembre) et du contexte ; à confirmer."
  - "Le chiffre de 640 milliards d'euros de titres publics français (f1) et celui de 800 milliards d'investissements (f2) viennent d'une chronique ; le vérificateur doit les confronter aux sources officielles (BCE, rapport Draghi)."
  - "Le programme complet de juillet 2026 n'a pas été ouvert ; seul un texte de présentation l'a été. Il pourrait contenir une position sur la dette BCE non vue."
  - "Les trois positions sans_position (Q42, Q43, Q44) reposent sur une recherche web limitée ; Sénat et Parlement européen n'ont pas été consultés."
