relances:
- these: T19
  partis:
  - NPA
  question_posee: Votre thèse T19 présuppose que la dette française a été construite par des cadeaux fiscaux, ce
    que le dossier n'établit pas (F43 est une valeur). Avez-vous une source officielle ou universitaire ? Que répondez-vous
    à T15 (A50) ?
  id: R18
  statut: repondue
  reponses:
  - agent: expert-extreme-gauche
    texte: 'Source officielle ou universitaire établissant que la dette française a été construite par des cadeaux
      fiscaux : non trouvée. Le NPA l''avance comme une position (tract de 2011, F43), pas comme un constat chiffré.
      Sur T15 (A50) : F48 n''est pas contesté, les titres de l''Eurosystème arrivent à échéance et sont remboursés.
      Le désaccord porte sur le critère : le NPA juge qu''une dette se rembourse selon sa légitimité, établie par
      un audit, non selon le détenteur ni l''échéance.'
    elements: []
