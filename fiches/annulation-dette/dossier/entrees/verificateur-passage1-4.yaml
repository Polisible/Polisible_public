phase: 3
sources:
  - id: S36
    statut: conforme
    note: "Bon document : hebdomadaire Lutte ouvrière n° 3031 du 4 septembre 2026 (numéro et date imprimés dans le PDF). Aucune affirmation à contrôler : la source sert seulement de lieu consulté (sans_position) ; elle contient une prise de position générale (« la dette est celle de la bourgeoisie et que c'est à elle de payer »). L'appartenance à Lutte ouvrière est établie (journal du parti, soutien à la campagne de Nathalie Arthaud)."
  - id: S37
    statut: conforme
    note: "Bon document : tract du NPA (adresse npa2009.org imprimée) sur la dette ; la date exacte du 2011-12-01 n'est pas imprimée, mais le contenu (gouvernement Fillon, « octobre 2011 », candidat socialiste « pour 2012 ») situe le tract fin 2011, sans confirmer le jour. F43 (valeur) : l'extrait figure (« Pour le NPA, la réponse est claire, une dette construite par les cadeaux faits aux plus riches et aux grandes entreprises est illégitime et n'a pas à être payée ») et dit la même chose que l'énoncé (le mot « fiscaux » de l'énoncé est repris d'autres passages du tract). L'appartenance au NPA est établie par la source (« Pour le NPA »)."
  - id: S38
    statut: conforme
    date_corrigee: "2021-04-25"
    note: "Bon titre et bon auteur (Tendance CLAIRE), mais le texte est signé « Tendance CLAIRE, le 25 avril 2021 », pas le 1er janvier 2021. Aucune affirmation du lot à contrôler (la source est citée pour porte_par avec F19 et F20, non vérifiées ici). Le rattachement de Tendance CLAIRE au NPA n'est pas établi par cette source : le mot « NPA » n'y figure pas."
  - id: S39
    statut: conforme
    note: "Bon document : proposition de résolution n° 2914, enregistrée le 11 mai 2020, présentée par Jean-Luc Mélenchon et 16 autres députés. F50 : l'extrait figure mot pour mot dans les considérants ; il établit que c'est l'objectif déclaré par les auteurs, pas un effet constaté. F56 (valeur) : l'extrait figure et dit la même chose que l'énoncé. Appartenance partisane : le PDF liste les noms des signataires sans mentionner le groupe La France insoumise ; le rattachement à LFI n'est pas établi par cette source."
  - id: S40
    statut: conforme
    note: "Bon document : livret « Faire tomber le mur de la dette », contributions de Jean-Luc Mélenchon, texte d'ouverture signé « Jean-Luc Mélenchon, 6 juin 2022 ». F53, F54 et F56 (valeurs) : les trois extraits figurent mot pour mot (F54 : « Nous ne pouvons pas nous payer un nouveau cycle austéritaire ») et disent la même chose que les énoncés. Le lien avec LFI est établi par la source (discours lors de la niche parlementaire « du groupe La France Insoumise » défendus par Jean-Luc Mélenchon ; mention de la Nouvelle Union populaire écologique et sociale)."
  - id: S41
    statut: conforme
    note: "Bon document : compte rendu intégral, 2e séance du lundi 22 mars 2021, débat « La dette publique : la payer ou l'annuler ? » à l'initiative du groupe GDR. Les quatre extraits (F49 « dégager immédiatement des marges financières très importantes », F51, F52, F55) figurent dans l'intervention de Fabien Roussel et disent la même chose que les énoncés ; pour F49 (estimation), c'est l'appréciation d'un orateur, sans chiffrage ni méthode, et non une estimation d'institution. Appartenance : la source établit « M. Fabien Roussel (GDR) » et qu'il parle au nom des « députés communistes » ; le sigle PCF n'y figure pas en toutes lettres."
  - id: S42
    statut: conforme
    note: "Bon document : billet du blog de la BCE du 29 avril 2025, par Imène Rahmouni-Rousseau et Isabel Schnabel (texte en anglais, « Pas disponible en français » sur l'adresse .fr). F48 : l'extrait figure (« At the end of 2024 [...] reinvestments under the pandemic emergency purchase programme (PEPP) came to an end ») et dit la même chose que l'énoncé, même programme et même date. Source officielle, sans personne partisane citée."
