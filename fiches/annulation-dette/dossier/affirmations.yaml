- id: F20
  enonce: 'La Banque de France est un contributeur au budget de l''État : 36,8 milliards d''euros versés depuis
    2015 (Q43).'
  type: fait
  sources:
  - source: S7
    extrait: avec un total de 36,8 milliards d'euros versés depuis 2015
  declaration: false
  auteur: bibliothecaire
  passage: 1
  verdict: Vrai
  explication: 'Le document de la Banque de France sur l''exercice 2025 (mars 2026) indique 36,8 Md€ versés au budget
