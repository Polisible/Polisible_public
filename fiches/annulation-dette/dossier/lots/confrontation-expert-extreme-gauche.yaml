- id: A28
  auteur: expert-gauche-radicale
  question: Q46
  position: nuance
  enonce: Les règles européennes qui encadrent le financement des États et le statut de la BCE doivent être remises
    en cause, la France exigeant leur changement, plutôt que d'enfermer la politique de la dette dans les traités.
  raisonnement: Les traités obligent les États à emprunter auprès des marchés plutôt qu'auprès de leur banque centrale
    (F1, F2) ; leurs auteurs les jugent un carcan qui prive les peuples de la maîtrise de leur endettement (F56).
    La résolution de 2020 invite le gouvernement à exiger de l'Union européenne un changement, ce qui place la décision
    sous contrôle politique démocratique plutôt que sous règles fixées par des institutions indépendantes.
  porte_par:
  - qui: Jean-Luc Mélenchon et les députés LFI signataires de la proposition de résolution n° 2914 (11 mai 2020)
    parti: LFI
    source: S39
  - qui: Jean-Luc Mélenchon, livret Dette (6 juin 2022)
    parti: LFI
    source: S40
  repond_a: null
  statut: ouvert
  affirmations:
  - id: F56
    enonce: Les règles européennes sur le financement des États et le statut de la banque centrale doivent être
      remises en cause.
    type: valeur
    verdict: null
    explication: 'Affirmation de valeur, sans verdict : position portée par la proposition de résolution n° 2914
      (2020) et le livret de Jean-Luc Mélenchon (2022).'
    sources:
    - source: S39
      extrait: les traités qui la régissent et les statuts et le mandat de la Banque centrale européenne, qui lui
        assurent une indépendance problématique
