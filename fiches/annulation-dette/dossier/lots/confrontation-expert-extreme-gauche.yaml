- id: A34
  auteur: expert-sociaux-democrates
  question: Q45
  position: contre
  enonce: Quand près d'un quart de la dette négociable est détenu par l'Eurosystème, c'est-à-dire par des institutions
    publiques de la zone euro, rembourser revient à devoir trouver ailleurs la somme (nouvel emprunt, impôts ou
    baisse des dépenses). On ne doit donc pas rembourser intégralement ce créancier-là.
  raisonnement: 'La créance d''une banque centrale n''est pas celle d''un épargnant privé : l''État se la doit en
    partie à lui-même (F17). Rembourser obligerait à rouler la dette au lieu d''investir, à augmenter les impôts
    ou à baisser les dépenses ; l''effacement évite ces choix sans spolier de créancier privé. Argument de 2021
    ; l''obligation de rembourser des créanciers privés n''est pas remise en cause par ce texte.'
  porte_par:
  - qui: Aurore Lalucq, députée européenne (tribune collective, février 2021)
    parti: Place publique
    source: S43
  repond_a: null
  statut: ouvert
