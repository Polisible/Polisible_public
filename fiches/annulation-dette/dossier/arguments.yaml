- id: A20
  question: Q41
  position: oui
  enonce: Aucun texte des traités ne mentionne l'annulation ni la conversion en dette perpétuelle de titres déjà
    détenus par l'Eurosystème. La Cour de justice a validé les achats sur le marché secondaire sous garanties, sans
    trancher le sort ultérieur des titres.
  porte_par:
  - personne: Jean-Luc Mélenchon
    fonction: député
    parti: LFI
    date: '2020-05-11'
    source: S39
    appartenance: S19
  - personne: Jean-Luc Mélenchon
    fonction: candidat à l'élection présidentielle de 2022
    parti: LFI
    date: '2022-06-06'
    source: S40
    appartenance: S19
    fonction_verifiee: 'S40 : « Jean-Luc Mélenchon est le premier candidat à l''élection présidentielle à avoir
      été invité » dans la partie « L''élection présidentielle 2022 » ; « ancien » n''y figure pas.'
  affirmations:
  - F44
  - F45
  - F1
  - F2
  - F3
  - F5
  - F8
  - F9
  - F10
  raisonnement: 'Les titres ont été achetés sur le marché secondaire (F44), pratique que la Cour de justice a jugée
    compatible avec l''article 123 sous garanties (F8, F9, F10). Le texte interdit le crédit et l''acquisition directe
    (F1, F2) mais ne vise pas expressément la conversion de titres déjà au bilan (F45). La décision serait prise
    par le conseil des gouverneurs de la BCE (F5), donc sans instruction d''un gouvernement (F3) : la mesure relève
    de la politique du bilan de la banque centrale, pas d''un crédit à l''État.'
  repond_a: null
  auteur: expert-gauche-radicale
  passage: 1
  statut: conteste
  versions:
  - passage: 4
    enonce: 'Aucun texte des traités ne mentionne l''annulation ni la conversion en dette perpétuelle de titres
      que l''Eurosystème détient déjà : l''article 123 interdit crédits et achats directs aux États. Les arrêts
      Gauweiler et Weiss valident les achats sur le marché secondaire sous garanties ; ils ne tranchent pas le sort
      ultérieur des titres, et l''arrêt Weiss relève que leur conservation jusqu''à l''échéance n''implique aucune
      renonciation au paiement. La compatibilité d''une conversion, qui relèverait du conseil des gouverneurs de
      la BCE, est donc une interprétation juridique que LFI soutient, non un point jugé.'
    position: oui
    porte_par:
    - parti: LFI
      source: S39
      personne_ou_groupe_ancien: Jean-Luc Mélenchon et les députés LFI signataires de la proposition de résolution
        n° 2914 (11 mai 2020)
    - parti: LFI
      source: S40
      personne_ou_groupe_ancien: Jean-Luc Mélenchon, livret Dette (6 juin 2022)
  corrige: true
