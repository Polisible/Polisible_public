    enonce: L'Eurosystème détient près d'un quart des OAT au titre de la politique monétaire (données du premier
      trimestre 2025, rapport du Sénat) (Q41).
    type: fait
    verdict: Plutôt vrai
    explication: 'Le rapport d''information de la commission des finances du Sénat (24 septembre 2025) écrit au
      conditionnel que l''Eurosystème « détiendrait » près d''un quart des OAT, en commentant la détention au premier
      trimestre 2025. Le chiffre sous-jacent (24,4 %) porte sur une catégorie « autres français » qui inclut la
      Banque de France pour le compte de la BCE mais n''est pas limitée à elle : l''ordre de grandeur est sourcé,
      la précision est moindre que ne le suggère l''énoncé.'
    sources:
    - source: S10
      extrait: L'Eurosystème détiendrait près d'un quart des OAT à ce titre .
      statut_source: conforme
  - id: F17
    enonce: Au premier trimestre 2025, la catégorie « autres français », dont la Banque de France pour le compte
      de la BCE, représentait 24,4 % de la dette négociable de l'État (Q41).
    type: fait
    verdict: Vrai
    explication: Le tableau du rapport du Sénat (24 septembre 2025) attribue 24,4 % de la dette négociable de l'État,
      au premier trimestre 2025 et en valeur de marché, à la catégorie « autres français (dont la Banque de France
      pour le compte de la BCE) ». L'énoncé reprend fidèlement ce périmètre.
    sources:
    - source: S10
      extrait: Autres français (dont la Banque de France pour le compte de la BCE) 24,4 %
      statut_source: conforme
