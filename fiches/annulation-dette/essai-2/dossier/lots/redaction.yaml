  - id: A5
    auteur: expert-gauche-radicale
    question: Q1
    position: pour
    enonce: 'Les traités interdisent d''acheter la dette à l''État ou de lui prêter ; ils ne mentionnent ni la conservation
      ni la conversion de titres déjà achetés sur le marché secondaire. La proposition de 2020 en déduit que garder
      ces titres indéfiniment, à taux nul, ne serait ni un achat direct ni un crédit nouveau. Aucun arrêt cité ne
      juge cette conversion elle-même : l''arrêt C-62/14 porte sur l''achat sur le marché secondaire.'
    raisonnement: L'article 123 vise l'acquisition directe auprès de l'émetteur et les crédits (F1, F2). Les titres
      en cause ont été achetés sur le marché secondaire (f1, F8), pratique que la Cour de justice a jugée compatible
      avec l'article 123 (F4). Le texte n'interdit donc pas, tel qu'il est écrit, de renoncer à les revendre ou
      de les convertir en titres perpétuels à taux nul ; la proposition de 2020 en conclut qu'aucune modification
      des traités n'est nécessaire.
    porte_par:
    - qui: Groupe La France insoumise (proposition de résolution n° 2914, 11 mai 2020)
      source: S16
    repond_a: null
    statut: conteste
    affirmations:
    - id: F1
      enonce: L'article 123, paragraphe 1, du TFUE interdit à la BCE et aux banques centrales nationales d'acheter
        directement aux autorités publiques les instruments de leur dette.
      type: fait
      verdict: Vrai
      explication: L'article 123, paragraphe 1, du TFUE dispose que l'acquisition directe, auprès des autorités
