incertitudes:
- A3 est porté en position « oui » alors que son énoncé corrigé est conditionnel (les deux voies) ; le refus du regroupement
  T10/T14 repose sur cette position déclarée. Si l'expert la corrige en « nuance », A3 rejoindrait T14 selon § 2.
- Q44 couvre deux volets (indépendance, crédibilité) sous une seule certitude d'estimation ; le texte de la réponse précise
  la portée de la certitude. Le format d'une question à deux volets relève du fondateur.
