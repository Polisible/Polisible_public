  auteur: extreme-gauche
  question: Q47
  position: pour
  enonce: 'L''annulation de la dette publique est préférable à l''austérité : elle libère l''argent des intérêts
    pour des investissements et des emplois utiles à la population, et met fin au pouvoir des marchés. Elle doit
    toutefois porter sur les dettes illégitimes, pas sur la seule part de la banque centrale.'
  raisonnement: Si les intérêts payés aux créanciers privés absorbent des sommes qui financeraient des emplois publics
    (le tract NPA les chiffre à l'équivalent d'un million d'emplois en 2011), alors l'annulation dégage plus de
    marges que des économies qui frappent la population. La part détenue par la banque centrale étant reversée à
    l'État, annuler seulement celle-ci est jugé une diversion.
  porte_par: NPA (tract sur la dette) ; Tendance CLAIRE (courant du NPA) (NPA, S37)
  repond_a: null
  affirmations:
  - 'F20 [fait, Vrai] La Banque de France est un contributeur au budget de l''État : 36,8 milliards d''euros versés
    depuis 2015 (Q43). (sources S7)'
- id: A32
  auteur: sociaux-democrates
  question: Q41
  position: pour
  enonce: 'Aucune disposition des traités ne mentionne l''annulation : l''article 123 interdit le crédit et l''achat
    direct aux États, non l''abandon d''une créance déjà inscrite au bilan. Les signataires de la tribune de 2021
    en déduisent que la décision relèverait du conseil des gouverneurs de la BCE ; la compatibilité avec l''interdiction
    du financement monétaire reste une interprétation disputée, que la CJUE n''a pas tranchée.'
  raisonnement: Le traité interdit deux actes précis (découvert ou crédit, achat direct de titres, F1 et F2) ; l'annulation
    d'une créance acquise sur le marché secondaire n'est pas l'un d'eux. Comme l'interdiction n'est pas explicite
    et que le conseil des gouverneurs arrête les décisions du SEBC (F5), l'effacement relève d'une décision de la
    BCE et non d'une impossibilité juridique. Cet argument est contesté par la BCE (F11, F13) ; il est la position
    de 2021 d'une élue de Place publique, antérieure à la proposition de 2026.
  porte_par: Aurore Lalucq, députée européenne (tribune collective, février 2021) (Place publique, S43)
  repond_a: null
  affirmations:
  - F57 [fait, Vrai] Les traités européens n'interdisent pas explicitement l'annulation de dettes publiques détenues
    par la BCE (le mot « annulation » ne figure ni dans le traité ni dans le protocole sur le SEBC). (sources S43)
  - F1 [fait, Vrai] Le traité interdit à la BCE et aux banques centrales nationales d'accorder des découverts ou
    crédits aux administrations publiques (Q41). (sources S1)
  - F2 [fait, Vrai] Le traité interdit l'acquisition directe, auprès des États, de leurs titres de dette par la
    BCE ou les banques centrales nationales (Q41). (sources S1)
  - F5 [fait, Vrai] Le conseil des gouverneurs de la BCE arrête les orientations et prend les décisions nécessaires
    aux missions du SEBC (qui décide, Q41). (sources S1)
- id: A33
  auteur: sociaux-democrates
  question: Q44
  position: contre
  enonce: 'Une banque centrale qui efface des créances peut fonctionner avec des fonds propres négatifs : sa capacité
    à conduire la politique monétaire ne serait donc pas entamée. L''indépendance serait préservée si la décision
    est prise par la BCE elle-même.'
  raisonnement: Le risque pour la crédibilité vient de l'idée qu'une perte comptable empêcherait la banque centrale
    d'agir. Si elle peut fonctionner avec des fonds propres négatifs (F58) et si l'effacement est décidé par son
    propre conseil des gouverneurs sans instruction d'un gouvernement (F3, F5), ni sa capacité d'action ni son indépendance
    ne sont atteintes. Position de 2021, avant la proposition de 2026 ; elle porte sur un effacement décidé par
    la BCE, pas imposé par un État.
  porte_par: Aurore Lalucq, députée européenne (tribune collective, février 2021) (Place publique, S43)
  repond_a: null
  affirmations:
  - 'F58 [estimation, Débat entre experts] Une banque centrale peut fonctionner avec des fonds propres négatifs
    sans que sa capacité d''action en soit affectée. — Les signataires de la tribune de 2021 l''affirment sans démonstration.
    La BCE écrit, après ses pertes de 2024, qu''elle peut remplir son mandat « regardless of any losses » (communiqué
    du 20 février 2025), tout en soulignant que sa solidité repose sur 59 milliards de capital et de comptes de
    réévaluation : elle ne dit pas que des fonds propres durablement négatifs seraient sans effet. Aucune estimation
    chiffrée d''institution sur ce point n''est au dossier. (sources S43, S48)'
  - F3 [fait, Vrai] Le traité dispose que ni la BCE, ni une banque centrale nationale, ni un membre de leurs organes
    de décision ne peuvent solliciter ni accepter d'instructions des gouvernements (Q41, Q44). (sources S1)
  - F5 [fait, Vrai] Le conseil des gouverneurs de la BCE arrête les orientations et prend les décisions nécessaires
    aux missions du SEBC (qui décide, Q41). (sources S1)
- id: A34
  auteur: sociaux-democrates
  question: Q45
  position: contre
  enonce: 'Quand la catégorie « autres français », dont la Banque de France pour le compte de la BCE, représente
    24,4 % de la dette négociable de l''État au premier trimestre 2025, une part importante de la dette est due
    à des institutions publiques. Rembourser revient alors à trouver ailleurs la somme (nouvel emprunt, impôts ou
    baisse des dépenses) : on ne doit donc pas rembourser intégralement ce créancier-là.'
  raisonnement: 'La créance d''une banque centrale n''est pas celle d''un épargnant privé : l''État se la doit en
    partie à lui-même (F17). Rembourser obligerait à rouler la dette au lieu d''investir, à augmenter les impôts
    ou à baisser les dépenses ; l''effacement évite ces choix sans spolier de créancier privé. Argument de 2021
    ; l''obligation de rembourser des créanciers privés n''est pas remise en cause par ce texte.'
  porte_par: Aurore Lalucq, députée européenne (tribune collective, février 2021) (Place publique, S43)
  repond_a: null
  affirmations:
  - 'F16 [fait, Plutôt vrai] L''Eurosystème détient près d''un quart des OAT au titre de la politique monétaire
    (données du premier trimestre 2025, rapport du Sénat) (Q41). — Le rapport d''information de la commission des
    finances du Sénat (24 septembre 2025) écrit au conditionnel que l''Eurosystème « détiendrait » près d''un quart
    des OAT, en commentant la détention au premier trimestre 2025. Le chiffre sous-jacent (24,4 %) porte sur une
    catégorie « autres français » qui inclut la Banque de France pour le compte de la BCE mais n''est pas limitée
    à elle : l''ordre de grandeur est sourcé, la précision est moindre que ne le suggère l''énoncé. (sources S10)'
  - F17 [fait, Vrai] Au premier trimestre 2025, la catégorie « autres français », dont la Banque de France pour
    le compte de la BCE, représentait 24,4 % de la dette négociable de l'État (Q41). (sources S10)
- id: A35
  auteur: sociaux-democrates
  question: Q46
  position: contre
  enonce: 'Un État seul ne peut pas annuler : la décision appartient à la BCE, qui n''accepte pas d''instructions
    des gouvernements. Elle doit donc se prendre par un accord entre les États européens et la BCE, non par une
    décision nationale.'
  raisonnement: Le conseil des gouverneurs de la BCE décide (F5) et ni la BCE ni une banque centrale nationale ne
    peuvent accepter d'instructions d'un gouvernement (F3). Une décision nationale unilatérale n'a donc pas d'effet
    juridique sur la créance ; le texte de 2021 propose pour cette raison un contrat entre les États européens et
    la BCE (F60), assorti d'une exigence de gouvernance européenne.
  porte_par: Aurore Lalucq, députée européenne (tribune collective, février 2021) (Place publique, S43)
  repond_a: null
  affirmations:
  - F3 [fait, Vrai] Le traité dispose que ni la BCE, ni une banque centrale nationale, ni un membre de leurs organes
    de décision ne peuvent solliciter ni accepter d'instructions des gouvernements (Q41, Q44). (sources S1)
  - F5 [fait, Vrai] Le conseil des gouverneurs de la BCE arrête les orientations et prend les décisions nécessaires
    aux missions du SEBC (qui décide, Q41). (sources S1)
  - F60 [fait, Vrai] Le texte de 2021 propose un contrat entre les États européens et la BCE, et non une décision
    prise par un seul État. (sources S43)
- id: A36
  auteur: sociaux-democrates
  question: Q47
  position: nuance
  enonce: 'L''effacement ne se substitue aux autres leviers que s''il est conditionné : les États s''engagent à
    investir les montants effacés. Sans cette contrepartie, il ne dégagerait pas de marge utile.'
  raisonnement: 'Rembourser exige de réemprunter, de relever les impôts ou de réduire les dépenses (F17 pour l''ampleur
    de la détention). L''effacement évite ces trois choix, mais le texte de 2021 en fait un échange : le même montant
    doit être investi dans la reconstruction écologique et sociale (F59). L''effacement n''est donc pas présenté
    comme préférable en soi, mais comme un contrat avec un usage défini.'
  porte_par: Aurore Lalucq, députée européenne (tribune collective, février 2021) (Place publique, S43)
  repond_a: null
  affirmations:
  - F59 [fait, Vrai] Le texte de 2021 propose que la BCE efface ses créances sur les États (ou les convertisse en
    dettes perpétuelles sans intérêt) en échange de l'engagement des États d'investir les mêmes montants dans la
    reconstruction écologique et sociale. (sources S43)
  - F17 [fait, Vrai] Au premier trimestre 2025, la catégorie « autres français », dont la Banque de France pour
    le compte de la BCE, représentait 24,4 % de la dette négociable de l'État (Q41). (sources S10)
