incertitudes:
  - "Tendance CLAIRE : date du texte non trouvée (2021 estimée d'après le contexte Covid) ; je n'ai pas vérifié son statut actuel au sein du NPA ni de quel NPA (L'Anticapitaliste ou Révolutionnaires) elle relève."
  - "Tract NPA s3 : date non trouvée (2011-2012 estimée d'après les chiffres de 2010 et la mention de la campagne de 2012). Texte ancien, pas une position 2026."
  - "Ni LO ni le NPA n'ont, d'après mes recherches, réagi à la proposition de J.-L. Mélenchon sur la part détenue par la Banque de France : les arguments déposés sont des positions générales sur la dette."
  - "L'argument a1 suppose que les intérêts reviennent à l'État ; la bibliothèque (F21) montre que la Banque de France a été bénéficiaire nette du partage du revenu monétaire en 2023-2024 : l'ampleur du retour à l'État est à vérifier."
  - "Le chiffre de 270 milliards d'euros (f1) est tiré d'un texte militant (niveau 3) : le vérificateur doit le contrôler, je n'ai pas trouvé de source officielle."
  - "Le tract NPA s3 ne parle pas de la banque centrale ; la position du NPA sur ce point précis vient du seul texte de Tendance CLAIRE."
