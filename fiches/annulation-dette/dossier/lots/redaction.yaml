        extrait: reinvestments under the pandemic emergency purchase programme (PEPP) came to an end
        statut_source: conforme
    - id: F50
      enonce: Le gel en dette perpétuelle de titres détenus par la banque centrale a pour objectif de soulager les
        États de la charge de la dette.
      type: fait
      verdict: Vrai
      explication: La proposition de résolution n° 2914 (11 mai 2020, Jean-Luc Mélenchon et 16 députés) présente
        cette mesure comme nécessaire pour soulager les États de la charge de la dette. Le verdict porte sur l'objectif
        déclaré par ses auteurs, pas sur un effet constaté.
      sources:
      - source: S39
        extrait: Considérant la nécessité de soulager les États de la charge de la dette afin de faciliter leur
          retour dans le financement des infrastructures collectives
        statut_source: conforme
    - id: F18
      enonce: Le 24 mars 2026, la Banque de France annonce un bénéfice net de 8,1 milliards d'euros pour l'exercice
