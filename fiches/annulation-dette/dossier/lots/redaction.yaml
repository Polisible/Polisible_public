  - id: A49
    auteur: sociaux-democrates
    question: Q45
    position: non
    enonce: Les vendeurs des titres ont été payés par la banque centrale (F24). Effacer la créance de la banque
      centrale sur l'État ne retire rien à ces vendeurs, qui n'ont plus de créance.
    raisonnement: Ayant vendu, les vendeurs ont été réglés. Le créancier de l'État est la banque centrale, dont
      les engagements envers des tiers ne sont pas ceux de l'État. Distinguer ce créancier des détenteurs privés
      n'est donc pas une parole variable envers un prêteur privé.
