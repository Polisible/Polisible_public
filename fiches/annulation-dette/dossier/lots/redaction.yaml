    position: contre
    enonce: 'Supprimer le service des titres de l''Eurosystème ne produit pas des marges « immédiates » égales aux
      intérêts : la Banque de France reverse déjà des sommes à l''État, dont le montant dépend de son résultat.'
    raisonnement: 'A24 tire des marges immédiates de F22 (charge totale de 65,7 Md€ en 2025). Mais F22 porte sur
