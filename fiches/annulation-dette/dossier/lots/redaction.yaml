    question: Q41
    position: contre
    enonce: 'L''absence du mot « annulation » dans les traités ne vaut pas autorisation : l''article 123 est appliqué
      selon son objet (éviter le financement monétaire des États), et les arrêts cités pour la compatibilité portent
      sur les achats, pas sur le sort ultérieur des titres.'
