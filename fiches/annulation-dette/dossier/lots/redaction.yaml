      sur le coût d'emprunt dans le dossier. (sources S19)
    - 'F16 [fait, Plutôt vrai] L''Eurosystème détient près d''un quart des OAT au titre de la politique monétaire
      (données du premier trimestre 2025, rapport du Sénat) (Q41). — Le rapport d''information de la commission
      des finances du Sénat (24 septembre 2025) écrit au conditionnel que l''Eurosystème « détiendrait » près d''un
