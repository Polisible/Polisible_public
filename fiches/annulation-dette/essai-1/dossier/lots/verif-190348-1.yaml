  a_controler:
  - affirmation: F10
    enonce: La Banque de France fait partie de l'Eurosystème et n'agit pas sur instruction du gouvernement.
    type: fait
    extrait_annonce: La Banque de France participe à l'Eurosystème mais n'agit pas sur instruction du gouvernement.
