affirmations:
  - ref: f1
    enonce: "Le RN propose, dans son plan présenté le 6 octobre 2026, 140 milliards d'euros d'économies d'ici 2032, pour ramener la dette de 121 % du PIB en 2027 à 112 % en 2032."
    type: fait
