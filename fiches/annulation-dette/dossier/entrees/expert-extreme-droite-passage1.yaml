  - ref: f3
    enonce: "Marine Le Pen propose d'inscrire une règle d'or budgétaire dans la Constitution par référendum, pour limiter le déficit public."
    type: fait
    declaration: true
    sources:
      - {source: s5, extrait: "veut instaurer une \"règle d'or budgétaire\" qu'elle proposera aux Français d'approuver par référendum, si elle est élue à l'Élysée."}
  - ref: f4
    enonce: "La proposition de loi constitutionnelle déposée par Marine Le Pen en 2024 met fin à la primauté du droit européen sur le droit national."
    type: fait
    declaration: true
    sources:
      - {source: s6, extrait: "met fin à \"la primauté\" du droit européen sur le droit national, à la base de la construction européenne..."}
  - ref: f5
    enonce: "Les intérêts que l'État paie à la Banque de France sur les titres qu'elle détient contribuent à son résultat, dont une part revient à l'État (dividende et impôt)."
    type: estimation
    sources:
      - {source: s2, extrait: "Il a argué que la Banque de France étant détenue par l'État, les intérêts versés sont reversés sous forme de dividendes."}
arguments:
  - ref: a1
    question: Q43
    position: contre
    enonce: "Annuler ou geler cette dette ne réduirait pas durablement la charge nette de l'État : ce que l'État économise en intérêts, il le perd en recettes versées par la Banque de France."
    raisonnement: "L'État est à la fois débiteur (intérêts payés) et bénéficiaire du résultat de la Banque de France (dividende, impôt sur les bénéfices). Si les intérêts disparaissent, le résultat de la Banque de France baisse d'autant, donc ses versements à l'État aussi : sur l'ensemble État plus Banque de France, le gain serait faible ou nul. La Banque de France verse déjà à l'État des montants importants (36,8 Md€ depuis 2015), qui seraient réduits."
    porte_par:
      - {qui: "Jordan Bardella, président du RN, réponse publiée sur X à Matthieu Pigasse (23 août 2026, rapportée par la presse)", parti: "RN", source: s2}
    affirmations: [f5, F19, F20]
  - ref: a2
    question: Q47
    position: contre
    enonce: "Pour dégager des marges budgétaires, l'annulation de dette n'est pas préférable : la voie retenue par le RN est la réduction des dépenses, dont l'immigration, jointe à une règle d'or votée par référendum."
    raisonnement: "La charge de la dette (65,7 Md€ en 2025) pèse sur le budget parce que le déficit continue d'alimenter la dette ; seule une baisse durable du déficit la stabilise. Le plan du RN fait des économies la condition du retour de la dette sous 112 % du PIB en 2032, et la règle d'or vise à rendre cet effort contraignant. Une annulation de la part détenue par l'Eurosystème ne traiterait pas la cause du déficit."
    porte_par:
      - {qui: "Marine Le Pen, candidate du RN à la présidentielle 2027", parti: "RN", source: s4}
      - {qui: "Marine Le Pen, tribune sur la règle d'or (1er octobre 2026)", parti: "RN", source: s5}
    affirmations: [F22, f1, f2, f3]
  - ref: a3
    question: Q46
    position: nuance
    enonce: "Le RN veut que les choix budgétaires relèvent du peuple français, par la primauté du droit national et une règle d'or adoptée par référendum, mais la règle qu'il propose est un plafond de déficit, pas l'annulation unilatérale d'engagements."
    raisonnement: "Selon Marine Le Pen, la règle d'or sert à éviter « la mise sous tutelle de la France » : la contrainte budgétaire est choisie par les Français plutôt qu'imposée de l'extérieur par les créanciers ou par des règles européennes. La proposition de loi constitutionnelle de 2024 affirme en parallèle la primauté du droit national sur le droit européen. Ces deux textes situent la décision au niveau national, avec une discipline budgétaire, sans affirmer que l'État puisse ne pas honorer sa dette."
    porte_par:
      - {qui: "Marine Le Pen, présidente du groupe RN à l'Assemblée nationale et candidate à la présidentielle 2027", parti: "RN", source: s5}
      - {qui: "Marine Le Pen, proposition de loi constitutionnelle de 2024", parti: "RN", source: s6}
    affirmations: [f3, f4]
valeurs:
  - {question: Q46, enonce: "Le RN met en priorité la décision du peuple français et la primauté du droit national ; il ne se prononce pas, dans les sources trouvées, sur l'articulation de cette primauté avec les règles européennes sur la dette."}
