  arguments:
  - id: A2
    auteur: expert-centre
    question: Q42
    position: pour
    enonce: 'Les taux risquent de monter. Un État qui renonce unilatéralement à une part de sa dette, par une voie
      juridiquement contestée, signale aux prêteurs qu''il peut changer les règles ; ils demanderaient selon Renaissance
      et Horizons un taux plus élevé. Il s''agit d''une estimation sans chiffrage publié : aucune institution n''a
      estimé l''ampleur de la hausse.'
    raisonnement: La France emprunte à un taux déjà au plus haut depuis 2008 (F25) ; toute hausse supplémentaire
      se répercute sur l'ensemble de la dette renouvelée. L'opération, juridiquement contestée (F27), serait lue
      comme un défaut partiel ou un risque de rupture avec les règles de la zone euro. Les prêteurs, qui n'ont aucune
      raison de croire que le précédent ne se reproduira pas, réclameraient une prime de risque (F26), et l'accès
      aux marchés pourrait se compliquer. Le gain sur les intérêts de la dette gelée serait ainsi rogné par le surcoût
      sur la dette future.
    porte_par:
    - qui: Roland Lescure, ministre de l'Économie (déclaration du 24 août 2026, BFMTV/RMC)
      parti: Renaissance
      source: S16
    - qui: Édouard Philippe (débat du Medef, 27 août 2026)
      parti: Horizons
      source: S17
    repond_a: null
    statut: conteste
    affirmations:
    - id: F25
      enonce: Le 24 août 2026, le taux d'intérêt de la France à 10 ans était de 4,11 %, après avoir dépassé 4,14
        % le jeudi précédent, son plus haut niveau depuis 2008.
      type: fait
      verdict: Plutôt vrai
      explication: La dépêche AFP reprise par MoneyVox le 24 août 2026 donne bien 4,11 % le lundi et plus de 4,14
        % le jeudi précédent, au plus haut depuis 2008. C'est une valeur de la matinée, rapportée par la presse
        ; aucune série officielle de clôture (Banque de France, Agence France Trésor) n'a été consultée.
      sources:
      - source: S16
        extrait: Lundi, le taux d'intérêt de la France à 10 ans était à 4,11%, après avoir dépassé jeudi 4,14%,
          au plus depuis 2008.
        statut_source: conforme
    - id: F26
      enonce: Une annulation unilatérale d'une partie de la dette publique ferait monter les taux auxquels la France
        emprunte, car les prêteurs réclameraient une prime de risque supplémentaire.
      type: estimation
      verdict: Pas d'estimation fiable
      explication: La seule source est la déclaration de Roland Lescure, ministre de l'Économie, rapportée par l'AFP
        le 24 août 2026, sans chiffrage ni méthode. Des économistes cités par la presse (Public Sénat, 25 août 2026)
        et Christine Lagarde (F11) vont dans le même sens, mais aucune institution n'a publié d'estimation chiffrée
        de l'effet sur les taux dans le dossier.
      sources:
      - source: S16
        extrait: Le risque, pour le ministre de l'Economie, est également de faire grimper les taux d'intérêt
        statut_source: conforme
    - id: F27
      enonce: L'annulation ou la conversion en dette perpétuelle à taux nul de titres achetés par l'Eurosystème
        est contraire aux traités européens.
      type: fait
      verdict: Invérifiable
      explication: 'Aucun texte ne mentionne l''annulation ou la conversion de titres déjà détenus (F45) et aucune
        décision de la CJUE n''a tranché ce cas. La contrariété aux traités est affirmée par Roland Lescure (AFP,
        24 août 2026) et par Christine Lagarde (F11, F13, F14) ; les signataires de la tribune de 2021 soutiennent
        le contraire (F57) : c''est une interprétation juridique disputée, pas un fait établi.'
      sources:
      - source: S16
        extrait: c'est illégal, non conforme aux traités européens
        statut_source: conforme
  - id: A22
    auteur: expert-gauche-radicale
    question: Q42
    position: contre
    enonce: Selon LFI, l'opération ne ferait pas monter les taux, puisqu'elle ne vise que la part de l'Eurosystème
      et que les créanciers privés sont remboursés intégralement. Cette estimation de ses auteurs ne répond pas
      à l'argument du précédent juridique ; elle est contestée par des économistes cités par la presse et aucune
      institution n'a chiffré l'effet sur les taux.
    raisonnement: Le taux demandé à la France rémunère le risque de non-remboursement pour les investisseurs de
      marché. La proposition ne vise que la part de l'Eurosystème (F46, F16, F17) et exclut explicitement un défaut
      de paiement envers les autres créanciers, jugé par ses auteurs désastreux. Ce risque n'étant pas modifié,
      le coût d'emprunt ne bouge pas (F47).
    porte_par:
    - qui: Jean-Luc Mélenchon, universités d'été de LFI et déclarations d'août 2026
      parti: LFI
      source: S19
    - qui: Jean-Luc Mélenchon et les députés LFI signataires de la proposition de résolution n° 2914 (défaut de
        paiement écarté)
      parti: LFI
      source: S39
    repond_a: null
    statut: conteste
    affirmations:
    - id: F46
      enonce: La proposition vise la part de la dette française détenue par la Banque de France pour le compte de
        l'Eurosystème ; elle laisse inchangés les titres détenus par les autres créanciers.
      type: fait
      verdict: Plutôt vrai
      explication: Public Sénat (25 août 2026) établit que la proposition de Jean-Luc Mélenchon vise les titres
        détenus par la Banque de France pour le compte de la BCE (18 % dans le texte, 20 % dans le chapeau). Que
        les autres créanciers ne soient pas concernés n'est que sous-entendu, par un économiste cité dans l'article.
      sources:
      - source: S19
        extrait: l’annulation des 18 % de dette française détenus par la Banque de France pour le compte de la Banque
          centrale européenne (BCE)
        statut_source: conforme
    - id: F47
      enonce: L'annulation ou le gel en dette perpétuelle de la dette détenue par l'Eurosystème n'aurait pas d'effet
        sur le coût auquel la France emprunte.
      type: estimation
      verdict: Pas d'estimation fiable
      explication: La seule source rapporte l'avis de Jean-Luc Mélenchon (« aucun impact économique et aucun impact
        financier »), que l'article (Public Sénat, 25 août 2026) dit contesté par des économistes. Aucune institution
        n'a publié d'estimation chiffrée de l'effet sur le coût d'emprunt dans le dossier.
      sources:
      - source: S19
        extrait: aucun impact économique et aucun impact financier
        statut_source: conforme
    - id: F16
      enonce: L'Eurosystème détient près d'un quart des OAT au titre de la politique monétaire (données du premier
        trimestre 2025, rapport du Sénat) (Q41).
      type: fait
      verdict: Plutôt vrai
      explication: 'Le rapport d''information de la commission des finances du Sénat (24 septembre 2025) écrit au
        conditionnel que l''Eurosystème « détiendrait » près d''un quart des OAT, en commentant la détention au
        premier trimestre 2025. Le chiffre sous-jacent (24,4 %) porte sur une catégorie « autres français » qui
        inclut la Banque de France pour le compte de la BCE mais n''est pas limitée à elle : l''ordre de grandeur
        est sourcé, la précision est moindre que ne le suggère l''énoncé.'
      sources:
      - source: S10
        extrait: L'Eurosystème détiendrait près d'un quart des OAT à ce titre .
        statut_source: conforme
    - id: F17
      enonce: Au premier trimestre 2025, la catégorie « autres français », dont la Banque de France pour le compte
        de la BCE, représentait 24,4 % de la dette négociable de l'État (Q41).
      type: fait
      verdict: Vrai
      explication: Le tableau du rapport du Sénat (24 septembre 2025) attribue 24,4 % de la dette négociable de
        l'État, au premier trimestre 2025 et en valeur de marché, à la catégorie « autres français (dont la Banque
        de France pour le compte de la BCE) ». L'énoncé reprend fidèlement ce périmètre.
      sources:
      - source: S10
        extrait: Autres français (dont la Banque de France pour le compte de la BCE) 24,4 %
        statut_source: conforme
