  arguments:
  - id: A1
    auteur: expert-centre
    question: Q41
    position: contre
    enonce: 'Selon Renaissance, les traités ne permettent pas cette opération : effacer ou geler à taux nul des
      titres que l''Eurosystème a rachetés reviendrait à faire financer l''État par sa banque centrale, ce que l''article
      123 interdit. Aucun texte ni arrêt n''a tranché ce cas précis (la contrariété aux traités reste une interprétation
      juridique disputée), et la décision ne relèverait de toute façon pas du gouvernement mais du conseil des gouverneurs.'
    raisonnement: 'L''article 123 interdit crédits et achats directs de dette aux États (F1, F2). La Cour a validé
      les rachats sur le marché secondaire (F8, F10), mais à condition de garanties contre le financement monétaire
      (F9) : les titres ont été achetés à des investisseurs (F24) et non offerts à l''État. Les annuler ou les convertir
      en perpétuel à taux nul reviendrait à donner à l''État, après coup, un avantage que le traité lui refuse au
      départ. Enfin, les décisions du SEBC appartiennent au conseil des gouverneurs (F5), qui ne peut recevoir d''instructions
      des gouvernements (F3) : un État ne peut ni l''ordonner ni modifier seul le cadre (F4).'
    porte_par:
    - qui: Roland Lescure, ministre de l'Économie (déclaration du 24 août 2026, BFMTV/RMC)
      parti: Renaissance
      source: S16
    repond_a: null
    statut: conteste
    affirmations:
    - id: F1
      enonce: Le traité interdit à la BCE et aux banques centrales nationales d'accorder des découverts ou crédits
        aux administrations publiques (Q41).
      type: fait
      verdict: Vrai
      explication: L'article 123, paragraphe 1, du TFUE (version consolidée 2016) interdit à la BCE et aux banques
        centrales nationales d'accorder des découverts ou tout autre type de crédit aux administrations publiques.
        Le texte est explicite.
      sources:
      - source: S1
        extrait: Il est interdit à la Banque centrale européenne et aux banques centrales des États membres, ci-après
          dénommées "banques centrales nationales", d'accorder des découverts ou tout autre type de crédit aux institutions,
          organes ou organismes de l'Union, aux administrations centrales
        statut_source: conforme
    - id: F2
      enonce: Le traité interdit l'acquisition directe, auprès des États, de leurs titres de dette par la BCE ou
        les banques centrales nationales (Q41).
      type: fait
      verdict: Vrai
      explication: La même phrase de l'article 123, paragraphe 1, du TFUE interdit l'acquisition directe, auprès
        des États, des instruments de leur dette par la BCE ou les banques centrales nationales. L'interdiction
        vise l'achat direct (marché primaire), pas les achats sur le marché secondaire.
      sources:
      - source: S1
        extrait: l'acquisition directe, auprès d'eux, par la Banque centrale européenne ou les banques centrales
          nationales, des instruments de leur dette est également interdite.
        statut_source: conforme
    - id: F3
      enonce: Le traité dispose que ni la BCE, ni une banque centrale nationale, ni un membre de leurs organes de
        décision ne peuvent solliciter ni accepter d'instructions des gouvernements (Q41, Q44).
      type: fait
      verdict: Vrai
      explication: L'article 130 du TFUE, repris à l'article 7 des statuts du SEBC, interdit à la BCE, aux banques
        centrales nationales et aux membres de leurs organes de décision de solliciter ou d'accepter des instructions,
        notamment des gouvernements des États membres.
      sources:
      - source: S1
        extrait: ni la Banque centrale européenne, ni une banque centrale nationale, ni un membre quelconque de
          leurs organes de décision ne peuvent solliciter ni accepter des instructions
        statut_source: conforme
    - id: F4
      enonce: Le traité prévoit que chaque État membre veille à la compatibilité de sa législation nationale, y
        compris les statuts de sa banque centrale, avec les traités et les statuts du SEBC (Q41, Q44).
      type: fait
      verdict: Vrai
      explication: L'article 131 du TFUE, repris à l'article 14.1 des statuts du SEBC, impose à chaque État membre
        de veiller à la compatibilité de sa législation nationale, y compris les statuts de sa banque centrale,
        avec les traités et les statuts.
      sources:
      - source: S1
        extrait: Chaque État membre veille à la compatibilité de sa législation nationale, y compris les statuts
          de sa banque centrale nationale, avec les traités et les statuts du SEBC et de la BCE.
        statut_source: conforme
    - id: F5
      enonce: Le conseil des gouverneurs de la BCE arrête les orientations et prend les décisions nécessaires aux
        missions du SEBC (qui décide, Q41).
      type: fait
      verdict: Vrai
      explication: L'article 12.1 des statuts du SEBC et de la BCE confie au conseil des gouverneurs l'adoption
        des orientations et des décisions nécessaires aux missions du SEBC.
      sources:
      - source: S1
        extrait: Le conseil des gouverneurs arrête les orientations et prend les décisions nécessaires à l'accomplissement
          des missions confiées au SEBC par les traités et les présents statuts.
        statut_source: conforme
    - id: F8
      enonce: Dans l'arrêt Gauweiler (C-62/14, 16 juin 2015), la Cour dit pour droit que le SEBC est autorisé à
        adopter un programme d'achat d'obligations souveraines sur les marchés secondaires (Q41).
      type: fait
      verdict: Vrai
      explication: Le dispositif de l'arrêt Gauweiler (CJUE, grande chambre, 16 juin 2015, C-62/14) dit pour droit
        que les articles 119, 123, paragraphe 1, et 127 du TFUE autorisent le SEBC à adopter un programme d'achat
        d'obligations souveraines sur les marchés secondaires. L'autorisation porte sur un programme « tel que celui
        annoncé » en septembre 2012 (opérations monétaires sur titres), avec les conditions qui l'encadrent.
      sources:
      - source: S2
        extrait: doivent être interprétés en ce sens qu'ils autorisent le Système européen de banques centrales
          (SEBC) à adopter un programme d'achat d'obligations souveraines sur les marchés secondaires
        statut_source: conforme
    - id: F9
      enonce: Dans l'arrêt Weiss (C-493/17, 11 décembre 2018), la Cour rappelle que le SEBC doit concilier ses interventions
        avec l'interdiction du financement monétaire de l'article 123 TFUE (Q41).
      type: fait
      verdict: Vrai
      explication: Au point 107 de l'arrêt Weiss (CJUE, grande chambre, 11 décembre 2018, C-493/17), la Cour indique
        que le SEBC doit entourer son intervention de garanties suffisantes pour la concilier avec l'interdiction
        du financement monétaire de l'article 123 du TFUE.
      sources:
      - source: S3
        extrait: le SEBC doit entourer son intervention de garanties suffisantes pour concilier celle-ci avec l'interdiction
          du financement monétaire découlant de l'article 123 TFUE
        statut_source: conforme
    - id: F10
      enonce: Dans l'arrêt Weiss (C-493/17), la Cour dit pour droit que l'examen des questions n'a révélé aucun
        élément affectant la validité de la décision (UE) 2015/774 de la BCE (Q41).
      type: fait
      verdict: Vrai
      explication: Le point 1 du dispositif de l'arrêt Weiss (C-493/17) dit pour droit que l'examen des questions
        n'a révélé aucun élément de nature à affecter la validité de la décision (UE) 2015/774 de la BCE du 4 mars
        2015, relative au programme d'achats d'actifs du secteur public sur les marchés secondaires.
      sources:
      - source: S3
        extrait: L'examen des première à quatrième questions préjudicielles n'a révélé aucun élément de nature à
          affecter la validité de la décision (UE) 2015/774 de la Banque centrale européenne
        statut_source: conforme
    - id: F24
      enonce: Les titres de dette française détenus par l'Eurosystème ont été achetés sur le marché secondaire,
        auprès d'institutions financières, et non directement auprès de l'État.
      type: fait
      verdict: Vrai
      explication: L'article 123 TFUE interdit à la BCE et aux banques centrales nationales toute acquisition directe
        de titres auprès des États (F2, S1) ; les programmes d'achat validés par la CJUE (Gauweiler 2015, Weiss
        2018) portent sur le marché secondaire (F8, F10). Public Sénat (25 août 2026) le confirme pour les achats
        de 2010 et de 2020.
      sources:
      - source: S19
        extrait: Ces opérations ont eu lieu sur le marché secondaire, c’est-à-dire auprès d’institutions financières
        statut_source: conforme
    - id: F27
      enonce: L'annulation ou la conversion en dette perpétuelle à taux nul de titres achetés par l'Eurosystème
        est contraire aux traités européens.
      type: fait
      verdict: Invérifiable
      explication: 'Aucun texte ne mentionne l''annulation ou la conversion de titres déjà détenus (F45) et aucune
        décision de la CJUE n''a tranché ce cas. La contrariété aux traités est affirmée par Roland Lescure (AFP,
        24 août 2026) et par Christine Lagarde (F11, F13, F14) ; les signataires de la tribune de 2021 soutiennent
        le contraire (F57) : c''est une interprétation juridique disputée, pas un fait établi.'
      sources:
      - source: S16
        extrait: c'est illégal, non conforme aux traités européens
        statut_source: conforme
  - id: A9
    auteur: expert-ecologistes
    question: Q41
    position: nuance
    enonce: Le traité interdit le crédit et l'achat direct de dette auprès des États, mais pas les achats sur le
      marché secondaire, que le SEBC pratique depuis 2015. La Cour de justice a jugé le programme d'achats de 2015
      (PSPP) compatible avec le traité sous conditions (arrêt Weiss) ; elle ne s'est pas prononcée sur le programme
      d'urgence pandémique (PEPP) de 2020. La question juridique réelle est de savoir si une conversion ou une annulation
      de titres déjà détenus relève de l'interdiction du financement monétaire, et c'est une question de décision
      de l'Eurosystème.
    raisonnement: 'L''article 123 vise deux opérations précises : le crédit direct aux États et l''acquisition directe
      de leur dette (F1, F2). Les titres détenus par l''Eurosystème ont été acquis sur les marchés secondaires dans
      un programme que la Cour a jugé compatible avec le traité sous garanties (F8, F9, F10). Un texte qui n''évoque
      pas le traitement ultérieur de ces titres ne tranche pas l''annulation ; l''affirmer interdite comme certaine
      est une interprétation, et le conseil des gouverneurs de la BCE reste l''organe qui décide (F5). Cette lecture
      concerne l''annulation ou la conversion décidée par la BCE elle-même, pas une décision unilatérale de l''État.'
    porte_par:
    - qui: Jérôme Gleizes, conseiller EELV de Paris (2023), chronique Politis du 14 septembre 2026
      parti: Les Écologistes
      source: S23
    repond_a: null
    statut: ouvert
    affirmations:
    - id: F1
