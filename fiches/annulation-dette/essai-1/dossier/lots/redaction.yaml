      sources:
      - source: S20
        extrait: « C'est une réduction comptable du déficit, mais qui ne donne pas - hélas - l'équivalent en cash
          »
        statut_source: conforme
  - id: A13
    auteur: expert-centre
    question: Q1
    position: contre
    enonce: 'Le traité (article 123) ne mentionne pas l''annulation, mais la BCE lit l''interdiction du financement
