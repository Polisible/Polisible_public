- id: A25
  auteur: expert-gauche-radicale
  question: Q44
  position: contre
  enonce: 'Une décision de gel prise par le conseil des gouverneurs lui-même n''atteindrait ni l''indépendance de
    la BCE ni la crédibilité de l''euro : l''indépendance interdit les instructions des gouvernements, pas une décision
    de la banque sur son propre bilan.'
  raisonnement: 'Le traité définit l''indépendance comme l''interdiction de solliciter ou accepter des instructions
    des gouvernements (F3), et réserve la décision au conseil des gouverneurs (F5). Si ce conseil décide, aucune
    instruction n''est donnée. Quant à la crédibilité, les titres détenus ne seront de toute façon pas remboursés
    (F53) : constater cette réalité ne change pas le bilan réel de la banque centrale.'
  porte_par:
  - qui: Jean-Luc Mélenchon, livret Dette (6 juin 2022)
    parti: LFI
    source: S40
  - qui: Jean-Luc Mélenchon, août 2026 (opération « jeu d'écriture dans le bilan »)
    parti: LFI
    source: S19
  repond_a: null
  statut: ouvert
  affirmations:
  - id: F3
    enonce: Le traité dispose que ni la BCE, ni une banque centrale nationale, ni un membre de leurs organes de
      décision ne peuvent solliciter ni accepter d'instructions des gouvernements (Q41, Q44).
    type: fait
    verdict: Vrai
    explication: L'article 130 du TFUE, repris à l'article 7 des statuts du SEBC, interdit à la BCE, aux banques
      centrales nationales et aux membres de leurs organes de décision de solliciter ou d'accepter des instructions,
      notamment des gouvernements des États membres.
    sources:
    - source: S1
      extrait: ni la Banque centrale européenne, ni une banque centrale nationale, ni un membre quelconque de leurs
        organes de décision ne peuvent solliciter ni accepter des instructions
      statut_source: conforme
  - id: F5
    enonce: Le conseil des gouverneurs de la BCE arrête les orientations et prend les décisions nécessaires aux
      missions du SEBC (qui décide, Q41).
    type: fait
    verdict: Vrai
    explication: L'article 12.1 des statuts du SEBC et de la BCE confie au conseil des gouverneurs l'adoption des
      orientations et des décisions nécessaires aux missions du SEBC.
    sources:
    - source: S1
      extrait: Le conseil des gouverneurs arrête les orientations et prend les décisions nécessaires à l'accomplissement
        des missions confiées au SEBC par les traités et les présents statuts.
      statut_source: conforme
  - id: F53
    enonce: Une dette publique inscrite au bilan de la banque centrale peut être constatée comme non remboursable.
    type: valeur
    verdict: null
    explication: 'Affirmation de valeur, sans verdict : position de Jean-Luc Mélenchon (livret de juin 2022). La
      possibilité juridique de cette décision relève des affirmations F27 et F45.'
    sources:
    - source: S40
      extrait: Notre banquier central peut acter du fait que la dette détenue dans ses caisses ne sera jamais payée
      statut_source: conforme
- id: A26
  auteur: expert-gauche-radicale
  question: Q45
  position: contre
  enonce: Un État n'a pas à rembourser intégralement la part de dette détenue par sa propre banque centrale, mais
    il doit honorer ses créanciers privés.
  raisonnement: 'La banque centrale appartient aux États de l''Union : la dette envers elle est une dette envers
    soi-même (F51). La différence avec les créanciers privés, dont des épargnants, justifie une annulation limitée
    à la seule part de la banque centrale (F52).'
  porte_par:
  - qui: Fabien Roussel, groupe GDR, débat à l'Assemblée nationale du 22 mars 2021
    parti: PCF
    source: S41
  repond_a: null
  statut: ouvert
  affirmations:
  - id: F51
    enonce: La dette publique détenue par la banque centrale est une dette envers une institution publique, dont
      les propriétaires sont les États de l'Union, et non envers des créanciers privés.
    type: valeur
    verdict: null
    explication: Affirmation de valeur, sans verdict (Fabien Roussel, 22 mars 2021). Elle contient une part factuelle
      (qui détient le capital de la BCE) qui devrait être traitée à part si elle sert à un argument.
    sources:
    - source: S41
      extrait: c’est nous, ce sont les pays de l’Union européenne
      statut_source: conforme
  - id: F52
    enonce: Une annulation doit se limiter à la dette détenue par la banque centrale, sans spolier les créanciers
      privés, dont des épargnants.
    type: valeur
    verdict: null
    explication: 'Affirmation de valeur, sans verdict : position de Fabien Roussel (22 mars 2021) pour une annulation
      limitée à la dette détenue par la banque centrale.'
    sources:
    - source: S41
      extrait: spolier des créanciers privés
      statut_source: conforme
- id: A27
  auteur: expert-gauche-radicale
  question: Q45
  position: contre
  enonce: Une dette publique inscrite au bilan de la banque centrale, qui ne sera jamais remboursée en pratique,
    peut être constatée comme telle.
  raisonnement: Les achats massifs de titres ont été faits par la banque centrale elle-même ; les rembourser intégralement
    n'a pas de finalité économique, alors qu'ils pèsent sur la capacité d'investir de l'État. Acter qu'ils ne seront
    pas payés ne lèse aucun créancier privé (F46, F53).
  porte_par:
  - qui: Jean-Luc Mélenchon, livret Dette (6 juin 2022)
    parti: LFI
    source: S40
  repond_a: null
  statut: ouvert
  affirmations:
  - id: F53
    enonce: Une dette publique inscrite au bilan de la banque centrale peut être constatée comme non remboursable.
    type: valeur
    verdict: null
    explication: 'Affirmation de valeur, sans verdict : position de Jean-Luc Mélenchon (livret de juin 2022). La
      possibilité juridique de cette décision relève des affirmations F27 et F45.'
