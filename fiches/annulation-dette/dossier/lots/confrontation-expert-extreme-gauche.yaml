- id: A33
  auteur: expert-sociaux-democrates
  question: Q44
  position: contre
  enonce: 'Une banque centrale qui efface des créances peut fonctionner avec des fonds propres négatifs : sa capacité
    à conduire la politique monétaire ne serait donc pas entamée. L''indépendance serait préservée si la décision
    est prise par la BCE elle-même.'
  raisonnement: Le risque pour la crédibilité vient de l'idée qu'une perte comptable empêcherait la banque centrale
    d'agir. Si elle peut fonctionner avec des fonds propres négatifs (F58) et si l'effacement est décidé par son
    propre conseil des gouverneurs sans instruction d'un gouvernement (F3, F5), ni sa capacité d'action ni son indépendance
    ne sont atteintes. Position de 2021, avant la proposition de 2026 ; elle porte sur un effacement décidé par
    la BCE, pas imposé par un État.
  porte_par:
  - qui: Aurore Lalucq, députée européenne (tribune collective, février 2021)
    parti: Place publique
    source: S43
  repond_a: null
  statut: ouvert
  affirmations:
  - id: F58
    enonce: Une banque centrale peut fonctionner avec des fonds propres négatifs sans que sa capacité d'action en
      soit affectée.
    type: estimation
    verdict: Débat entre experts
    explication: 'Les signataires de la tribune de 2021 l''affirment sans démonstration. La BCE écrit, après ses
      pertes de 2024, qu''elle peut remplir son mandat « regardless of any losses » (communiqué du 20 février 2025),
      tout en soulignant que sa solidité repose sur 59 milliards de capital et de comptes de réévaluation : elle
      ne dit pas que des fonds propres durablement négatifs seraient sans effet. Aucune estimation chiffrée d''institution
      sur ce point n''est au dossier.'
    sources:
    - source: S43
      extrait: une banque centrale peut fonctionner avec des fonds propres négatifs sans difficulté.
      statut_source: conforme
    - source: S48
      extrait: In any case, the ECB can operate effectively and fulfil its primary mandate of maintaining price
        stability regardless of any losses.
      statut_source: conforme
  - id: F3
    enonce: Le traité dispose que ni la BCE, ni une banque centrale nationale, ni un membre de leurs organes de
      décision ne peuvent solliciter ni accepter d'instructions des gouvernements (Q41, Q44).
    type: fait
    verdict: Vrai
    explication: L'article 130 du TFUE, repris à l'article 7 des statuts du SEBC, interdit à la BCE, aux banques
      centrales nationales et aux membres de leurs organes de décision de solliciter ou d'accepter des instructions,
      notamment des gouvernements des États membres.
