- question: Q41
  certitude: Invérifiable
  texte: 'En l''état du droit, aucun texte ni aucun arrêt ne tranche ce cas (F27, F45). L''article 123 interdit
    le crédit et l''achat direct aux États (F1, F2) sans mentionner l''annulation ou la conversion de titres déjà
    détenus (F45, F57), et la Cour n''a jugé que les achats sur le marché (F8, F9, F10). La présidente de la BCE
    la déclare contraire aux traités (F13, F14), sans décision de la Cour (F27). Pour le non, T1 (RE), la plus solide
    (F9), ne tient pas : elle étend l''interdiction à un cas qu''aucune source ne vise (F27) ; T2 (PCF) aussi. Pour
    le oui, T3 (LFI, PP) ne tient pas : elle prend le silence du texte (F45, F57) pour une permission.'
- question: Q42
  certitude: Pas d'estimation fiable
  texte: 'Aucune institution n''a estimé l''effet de l''opération sur les taux auxquels la France emprunte : les
    deux affirmations du dossier, en sens contraires, sont sans estimation fiable (F26, F47). T6 (PP), nuancée,
    tient : l''effet dépend de la voie, une décision du conseil des gouverneurs par contrat n''étant pas une rupture
    unilatérale (F3, F5, F60), et personne ne le chiffre (F26). Pour le oui, T4 (HOR, RE) ne tient pas : la prime
    de risque qu''elle annonce ne repose que sur F26. Pour le non, T5 (LFI) ne tient pas pour la même raison (F47),
    et limiter l''opération à l''Eurosystème (F46) n''écarte pas un doute sur le financement monétaire (F9).'
- question: Q43
  certitude: Pas d'estimation fiable
  texte: 'Aucune source ne chiffre l''effet net de l''opération sur la charge d''intérêts, faute d''isoler la part
    des intérêts sur titres de l''État dans le résultat de la Banque de France (F41, F49). Sont établis les versements
    variables de la Banque de France à l''État (F18, F19, F20, F21) et la fin des réinvestissements du PEPP (F48).
    Les thèses nuancées tiennent en partie : T8 (LFI) et T31 (RN) concluent à un gain net inférieur au gain brut,
    plausible mais non chiffré (F41). Pour le non, T7 (HOR) ne tient pas : un gain net inconnu n''exclut pas une
    baisse durable (F41, F49). Pour le oui, T9 (PCF) ne tient pas : elle suppose une marge nette qu''aucune source
    n''établit (F49).'
- question: Q44
  certitude: Pas d'estimation fiable
  texte: 'Sur l''indépendance, le traité tranche selon la voie : une opération imposée par une loi nationale serait
    une instruction interdite, une décision libre du conseil des gouverneurs non (F3, F4, F5). Sur la crédibilité
    de l''euro, aucune institution n''a estimé l''effet de l''opération (F27) ; l''effet de pertes durables d''une
    banque centrale est débattu (F58, F61). T14 (RE, nuancée) et T10 (RE, oui) tiennent sur cette distinction (F3,
    F4, F5). T11 (RE) ne tient pas : la défiance supposée n''est estimée par personne (F27). Pour le non, T12 (LFI)
    et T13 (PP) tiennent en partie : l''absence d''instruction est établie (F3, F5), l''absence d''effet sur la
    crédibilité non (F53, F58). T32 (PP) ne tient pas, faute d''estimation (F27).'
- question: Q45
  certitude: null
  texte: 'Question de valeur : la commission ne répond pas (T15, T17). Rembourser intégralement (T15, HOR) revient
    à traiter ces titres comme les autres, déjà remboursés à échéance (F48, F31) ; l''atteinte à la signature de
    la France qu''elle invoque n''est pas estimée (F26). T16 (LR) ne tient pas : la perte de confiance des prêteurs
    qu''elle suppose n''est estimée par personne (F26). Ne pas rembourser la banque centrale (T17, PCF, PP ; T33,
    NPA) suppose qu''aucun créancier privé n''est lésé, ce qui est établi : les vendeurs ont été payés (F24, F44).
    La marge que cela dégagerait n''est pas chiffrée (T18, F41). T19 (NPA) ne tient pas : l''origine de la dette
    dans des cadeaux fiscaux n''est pas établie (F43).'
- question: Q46
  certitude: null
  texte: 'Question de valeur : la commission ne répond pas (T21, T23). Choisir la décision nationale (T23, RN) suppose
    la primauté du droit national, que propose un texte de 2024 (F40), et une règle d''or plafonnant le déficit
    (F39). Choisir les règles européennes s''appuie sur un présupposé établi : la décision appartient au conseil
    des gouverneurs, qui n''accepte pas d''instructions (T21, PP ; F3, F5). Ne sont pas établis le partage entre
    membres du risque des titres français (T20, RE ; objection O1) ni la nécessité de réviser les traités pour annuler
    (T34, PCF ; F45, F27). T22 (LE) et T35 (LFI) tiennent comme priorités : réviser les règles plutôt que les contourner
    (F33), ou les soumettre au contrôle démocratique (F56).'
- question: Q47
  certitude: null
  texte: 'Question de valeur : la commission ne répond pas (T24, T28). Préférer l''annulation suppose une marge
    nette qu''aucune source ne chiffre (F41, F49) : T27 (LFI) et T26 (NPA) ne tiennent pas, faute d''appui (F47,
    F20). Préférer les économies suppose qu''elles soient obtenues, ce qu''aucune institution n''établit : T24 (HOR,
    RE) et T25 (RN) tiennent en partie (F41, F37) ; T36 (LR) ne tient pas, le plan ne mentionnant pas l''annulation
    (F29, F30). Combiner les leviers (T28, LE ; T29, PP) tient en partie : l''usage d''une marge non chiffrée en
    est le critère (F34, F59). T37 (PCF) et T30 (LO) ne tiennent pas, leurs appuis n''étant pas établis (F49, F42).'
