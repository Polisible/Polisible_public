  arguments:
  - id: A5
    auteur: centre
    question: Q46
    position: non
    enonce: Dans une union monétaire, la dette en euros et la banque centrale sont des biens communs. Décider seul
      sur des titres détenus par l'Eurosystème reviendrait à s'affranchir des règles communes, contraires en ce
      cas aux traités.
    raisonnement: 'L''État a lui-même accepté les traités : il doit veiller à la compatibilité de sa législation
      avec eux (F4) et ne peut pas donner d''instructions à la banque centrale (F3). Une décision nationale unilatérale
      sur des titres détenus par l''Eurosystème engagerait les autres membres, qui supportent leur part du bilan
      commun. S''en affranchir sur ce sujet, c''est dire qu''on ne respecte plus les règles communes (F27).'
    porte_par: '**Roland Lescure** (ministre de l''Économie, RE), 24 août 2026 [S16, S49]'
    repond_a: null
    affirmations:
    - F3 [fait, Vrai] Le traité dispose que ni la BCE, ni une banque centrale nationale, ni un membre de leurs organes
      de décision ne peuvent solliciter ni accepter d'instructions des gouvernements (Q41, Q44). (sources S1)
    - F4 [fait, Vrai] Le traité prévoit que chaque État membre veille à la compatibilité de sa législation nationale,
      y compris les statuts de sa banque centrale, avec les traités et les statuts du SEBC (Q41, Q44). (sources
      S1)
    - 'F27 [fait, Invérifiable] L''annulation ou la conversion en dette perpétuelle à taux nul de titres achetés
      par l''Eurosystème est contraire aux traités européens. — Aucun texte ne mentionne l''annulation ou la conversion
      de titres déjà détenus (F45) et aucune décision de la CJUE n''a tranché ce cas. La contrariété aux traités
      est affirmée par Roland Lescure (AFP, 24 août 2026) et par Christine Lagarde (F11, F13, F14) ; les signataires
      de la tribune de 2021 soutiennent le contraire (F57) : c''est une interprétation juridique disputée, pas un
      fait établi. (sources S16)'
  - id: A11
    auteur: ecologistes
    question: Q46
    position: nuance
    enonce: La dette détenue par l'Eurosystème relève d'une décision européenne, non d'une décision nationale seule.
      Les règles doivent être révisées par traité pour viser les limites planétaires, plutôt que contournées par
      un État.
    raisonnement: 'Les titres en cause sont détenus au sein de l''Eurosystème, dont le conseil des gouverneurs décide
      (F5), et les banques centrales nationales doivent respecter les statuts du SEBC (F4) : un État ne peut pas
      décider seul. Mais ces règles fixent l''objectif de politique budgétaire à des organes que le parti juge insuffisamment
      démocratiques, alors que les besoins d''investissement sont européens (F32). La réponse du parti est donc
      une révision des traités avec des objectifs écologiques et sociaux (F33), pas un repli national.'
    porte_par: '**LE**, juillet 2026 [S26]'
    repond_a: null
    affirmations:
    - F4 [fait, Vrai] Le traité prévoit que chaque État membre veille à la compatibilité de sa législation nationale,
      y compris les statuts de sa banque centrale, avec les traités et les statuts du SEBC (Q41, Q44). (sources
      S1)
    - F5 [fait, Vrai] Le conseil des gouverneurs de la BCE arrête les orientations et prend les décisions nécessaires
      aux missions du SEBC (qui décide, Q41). (sources S1)
    - F32 [fait, Plutôt vrai] Les investissements supplémentaires nécessaires à l'Union européenne sont estimés
      à 800 milliards d'euros par an (rapport Draghi, 2024). — Le rapport Draghi (Commission européenne, septembre
      2024) chiffre l'investissement supplémentaire nécessaire à « un minimum » de 750 à 800 milliards d'euros par
      an, soit 4,4 à 4,7 % du PIB de l'UE de 2023, d'après les estimations de la Commission. Le chiffre de 800 milliards
      est le haut de cette fourchette. (sources S23, S44)
    - F33 [fait, Vrai] Le programme adopté par Les Écologistes en juillet 2026 prévoit, au niveau européen, une
      révision des traités garantissant le non-dépassement des limites planétaires et la construction d'un État
      social européen. (sources S26)
  - id: A15
    auteur: extreme-droite
    question: Q46
    position: oui
    enonce: Les choix budgétaires doivent relever des Français plutôt que de règles européennes, par la primauté
