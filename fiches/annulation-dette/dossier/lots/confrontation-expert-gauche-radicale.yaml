  auteur: extreme-gauche
  question: Q43
  position: contre
  enonce: 'Annuler la part détenue par la Banque de France ne réduirait pas durablement la charge réelle de l''État
    : l''État étant actionnaire de la banque centrale, les intérêts qu''il lui verse lui reviennent. La charge qui
    pèse sur les contribuables est celle versée aux banques, assurances et investisseurs privés, nationaux et étrangers.'
  raisonnement: 'Si les intérêts payés à la Banque de France reviennent à l''État sous forme d''impôt et de dividende,
    leur suppression retire autant de recettes que de dépenses : le gain net est faible ou nul. L''effort d''annulation
    viserait donc la part de la dette qui ne coûte presque rien, et laisserait intacte celle qui coûte (créanciers
    privés).'
  porte_par: Tendance CLAIRE (courant du NPA) (NPA, S38)
  repond_a: null
  affirmations:
  - 'F20 [fait, Vrai] La Banque de France est un contributeur au budget de l''État : 36,8 milliards d''euros versés
    depuis 2015 (Q43). (sources S7)'
  - F19 [fait, Vrai] Pour l'exercice 2025, la Banque de France verse un impôt sur les bénéfices de 1,5 milliard
    d'euros avant d'atteindre un résultat net de 8,1 milliards (Q43). (sources S7)
  - F17 [fait, Vrai] Au premier trimestre 2025, la catégorie « autres français », dont la Banque de France pour
    le compte de la BCE, représentait 24,4 % de la dette négociable de l'État (Q41). (sources S10)
