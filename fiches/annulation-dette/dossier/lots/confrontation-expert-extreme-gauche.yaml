    enonce: En juin 2020, le parti Les Verts (EELV) a présenté un plan de reconstruction écologique financé par
      une annulation de la dette française auprès de la BCE et par une fiscalité plus juste, dont le rétablissement
      de l'ISF.
    type: fait
    verdict: Vrai
    explication: 'Déclaration vérifiée : une dépêche AFP du 15 juin 2020 rapporte que le plan de reconstruction
      écologique d''EELV serait financé par une annulation de la dette française auprès de la BCE et une fiscalité
      « plus juste », dont le rétablissement de l''ISF. Le verdict porte sur la réalité de la proposition.'
