  - V14 Priorité à la maîtrise démocratique de l'endettement, par le changement des règles européennes. — **Jean-Luc
    Mélenchon** (député, LFI), 11 mai 2020 [S39, S19]; **Fabien Roussel** (député, PCF), 22 mars 2021 [S41, S52]
  - V16 Priorité à une décision européenne coordonnée plutôt qu'à une décision nationale isolée. — **Aurore Lalucq**
    (députée européenne, PP), 5 février 2021 [S43, S53]
  - 'V22 Priorité à la souveraineté nationale : les choix budgétaires relèvent des Français, par la primauté du
    droit national et une règle d''or votée par référendum. — **Marine Le Pen** (présidente du groupe RN à l''Assemblée
