      type: fait
      verdict: Vrai
      explication: Le blog de la BCE (Imène Rahmouni-Rousseau et Isabel Schnabel, 29 avril 2025) indique que les
        réinvestissements au titre du PEPP ont pris fin à la fin de 2024. La page PEPP de la BCE montre des achats
        nets négatifs en octobre 2026, ce qui concorde.
      sources:
