- id: F1
  enonce: L'article 123, paragraphe 1, du TFUE interdit à la BCE et aux banques centrales nationales d'acheter directement
    aux autorités publiques les instruments de leur dette.
  type: fait
  sources:
  - source: S1
    extrait: l'acquisition directe, auprès d'eux, par la Banque centrale européenne ou les banques centrales nationales,
      des instruments de leur dette est également interdite
  declaration: false
  auteur: bibliothecaire
  passage: 1
  verdict: Vrai
  explication: L'article 123, paragraphe 1, du TFUE dispose que l'acquisition directe, auprès des autorités publiques,
    des instruments de leur dette par la BCE ou les banques centrales nationales est interdite. L'interdiction vise
    l'achat direct, c'est-à-dire sur le marché primaire.
  statut: verifiee
- id: F2
  enonce: Le même article interdit à la BCE et aux banques centrales nationales d'accorder des découverts ou tout
    autre crédit aux administrations centrales et aux autres autorités publiques.
  type: fait
  sources:
  - source: S1
    extrait: d’accorder des découverts ou tout autre type de crédit aux institutions, organes ou organismes de l'Union,
      aux administrations centrales
  declaration: false
  auteur: bibliothecaire
  passage: 1
  verdict: Vrai
  explication: Le même paragraphe interdit à la BCE et aux banques centrales nationales d'accorder des découverts
    ou tout autre type de crédit aux administrations centrales, aux autres autorités publiques et à d'autres entités
    publiques de l'Union et des États membres. Le paragraphe 2 exclut de ce champ les établissements publics de
    crédit.
  statut: verifiee
- id: F3
  enonce: L'article 130 du TFUE interdit à la BCE et aux banques centrales nationales de solliciter ou d'accepter
    des instructions des gouvernements des États membres.
  type: fait
  sources:
  - source: S2
    extrait: ni la Banque centrale européenne, ni une banque centrale nationale, ni un membre quelconque de leurs
      organes de décision ne peuvent solliciter ni accepter des instructions des institutions, organes ou organismes
      de l'Union, des gouvernements des États membres ou de tout autre organisme.
  declaration: false
  auteur: bibliothecaire
  passage: 1
  verdict: Vrai
  explication: L'article 130 du TFUE dispose que ni la BCE, ni une banque centrale nationale, ni un membre de leurs
    organes de décision ne peuvent solliciter ni accepter des instructions des gouvernements des États membres,
    entre autres.
  statut: verifiee
- id: F4
  enonce: Dans l'arrêt C-62/14 du 16 juin 2015, la Cour (grande chambre) dit pour droit que les articles 119, 123
    § 1 et 127 TFUE autorisent le SEBC à adopter un programme d'achat d'obligations souveraines sur les marchés
    secondaires, tel que celui annoncé en septembre 2012 (programme OMT).
  type: fait
  sources:
  - source: S3
    extrait: ils autorisent le Système européen de banques centrales (SEBC) à adopter un programme d’achat d’obligations
      souveraines sur les marchés secondaires
  declaration: false
  auteur: bibliothecaire
  passage: 1
  verdict: Vrai
  explication: Le dispositif de l'arrêt C-62/14 du 16 juin 2015 (grande chambre) dit pour droit que les articles
    119, 123 § 1 et 127 §§ 1 et 2 TFUE, avec les articles 17 à 24 des statuts du SEBC, autorisent le SEBC à adopter
    un tel programme d'achat sur les marchés secondaires. Le programme visé est celui annoncé dans le communiqué
    cité au procès-verbal de la réunion des 5 et 6 septembre 2012 (opérations monétaires sur titres, OMT).
  statut: verifiee
- id: F5
  enonce: Dans l'arrêt C-493/17 du 11 décembre 2018, la Cour (grande chambre) dit pour droit que l'examen des questions
    posées n'a révélé aucun élément de nature à affecter la validité de la décision (UE) 2015/774 de la BCE, relative
    au programme d'achats d'actifs du secteur public sur les marchés secondaires.
  type: fait
  sources:
  - source: S4
    extrait: L’examen des première à quatrième questions préjudicielles n’a révélé aucun élément de nature à affecter
      la validité de la décision (UE) 2015/774 de la Banque centrale européenne
  declaration: false
  auteur: bibliothecaire
  passage: 1
  verdict: Plutôt vrai
  explication: Le dispositif de l'arrêt C-493/17 du 11 décembre 2018 dit pour droit que l'examen des première à
    quatrième questions n'a révélé aucun élément de nature à affecter la validité de la décision (UE) 2015/774,
    telle que modifiée par la décision (UE) 2017/100. L'énoncé parle des « questions posées » sans préciser que
    la cinquième question a été déclarée irrecevable, donc non examinée.
  statut: verifiee
- id: F6
  enonce: Fin 2025 (quatrième trimestre), la dette publique française s'élevait à 115,6 % du produit intérieur brut
    (Insee, publication du 27 mars 2026).
  type: fait
  sources:
  - source: S5
    extrait: At the end of the fourth quarter of 2025, the public debt ratio stood at 115.6% of GDP
  declaration: false
  auteur: bibliothecaire
  passage: 1
  verdict: Vrai
  explication: L'Insee (Informations rapides n° 79, 27 mars 2026) indique 115,6 % du PIB fin 2025 (quatrième trimestre),
    après 117,2 % au troisième trimestre 2025.
  statut: verifiee
- id: F7
  enonce: Au sens de Maastricht, la dette publique française s'élevait à 3 460,5 milliards d'euros fin 2025 (quatrième
    trimestre, Insee).
  type: fait
  sources:
  - source: S5
    extrait: public debt as defined by the Maastricht criteria stood at €3,460.5 billion
  declaration: false
  auteur: bibliothecaire
  passage: 1
  verdict: Vrai
  explication: La même publication de l'Insee indique une dette publique au sens de Maastricht de 3 460,5 milliards
    d'euros fin 2025 (quatrième trimestre), en baisse de 23,6 milliards sur le trimestre.
  statut: verifiee
- id: F8
  enonce: Le marché secondaire est le marché où sont échangés des instruments financiers déjà en circulation, par
    opposition au marché primaire où ils sont émis.
  type: fait
  sources:
  - source: S6
    extrait: Market where transactions are carried out concerning financial instruments in circulation.
  declaration: false
  auteur: bibliothecaire
  passage: 1
  verdict: Vrai
  explication: Le glossaire de la Banque nationale de Belgique définit le marché secondaire comme le marché des
    instruments financiers en circulation et, dans une autre entrée (lettre P), le marché primaire comme le marché
    où de nouveaux emprunts sont émis. La seconde moitié de l'énoncé s'appuie sur cette entrée, qui n'est pas la
    source citée (S6).
  statut: verifiee
- id: F9
  enonce: Le SEBC comprend la BCE et les banques centrales de tous les États membres ; l'Eurosystème ne comprend
    que la BCE et les banques centrales des États ayant adopté l'euro.
  type: fait
  sources:
  - source: S7
    extrait: it includes, in addition to the members of the Eurosystem, the NCBs of those Member States that have
      not yet adopted the euro.
  declaration: false
  auteur: bibliothecaire
  passage: 1
  verdict: Vrai
  explication: Le glossaire de la Banque nationale de Belgique définit le SEBC comme la BCE et les banques centrales
    nationales de tous les États membres de l'Union, soit l'Eurosystème plus les banques centrales des États qui
    n'ont pas adopté l'euro. L'énoncé sur l'Eurosystème découle de cette définition.
  statut: verifiee
