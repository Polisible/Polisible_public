    texte: "Je n'ai trouvé aucune décision de la Cour ni aucun avis juridique d'institution qui traite l'annulation ou la conversion de titres déjà détenus. A29 ne repose donc que sur F1 et F2, qui établissent l'interdiction du financement direct, non son extension à ce cas (F45, F27 Invérifiable). La nécessité d'une révision reste une position de la famille, non un point établi."
    elements: []
