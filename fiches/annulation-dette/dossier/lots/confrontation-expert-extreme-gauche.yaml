- id: A20
  auteur: expert-gauche-radicale
  question: Q41
  position: pour
  enonce: 'Le gel en dette perpétuelle à taux nul de titres que l''Eurosystème détient déjà peut se faire dans le
    cadre des traités actuels : l''article 123 interdit crédits et achats directs aux États, pas le sort ultérieur
    de titres achetés sur le marché.'
  raisonnement: 'Les titres ont été achetés sur le marché secondaire (F44), pratique que la Cour de justice a jugée
    compatible avec l''article 123 sous garanties (F8, F9, F10). Le texte interdit le crédit et l''acquisition directe
    (F1, F2) mais ne vise pas expressément la conversion de titres déjà au bilan (F45). La décision serait prise
    par le conseil des gouverneurs de la BCE (F5), donc sans instruction d''un gouvernement (F3) : la mesure relève
    de la politique du bilan de la banque centrale, pas d''un crédit à l''État.'
  porte_par:
  - qui: Jean-Luc Mélenchon et les députés LFI signataires de la proposition de résolution n° 2914 (11 mai 2020)
    parti: LFI
    source: S39
  - qui: Jean-Luc Mélenchon, livret Dette (6 juin 2022)
    parti: LFI
    source: S40
  repond_a: null
  statut: ouvert
  affirmations:
  - id: F44
    enonce: Les titres de dette française détenus par l'Eurosystème au titre de la politique monétaire ont été achetés
      sur le marché secondaire, auprès d'institutions financières, et non directement auprès de l'État.
    type: fait
    verdict: Vrai
    explication: L'article 123 TFUE interdit l'acquisition directe de titres auprès des États (F2, S1), et les programmes
      d'achat de politique monétaire validés par la CJUE portent sur le marché secondaire (F8, F10). Public Sénat
      (25 août 2026) le confirme pour les achats de 2010 et de 2020.
    sources:
    - source: S19
      extrait: Ces opérations ont eu lieu sur le marché secondaire, c’est-à-dire auprès d’institutions financières
      statut_source: conforme
  - id: F45
    enonce: L'article 123 TFUE et l'article 21 du protocole n° 4 interdisent les crédits et l'acquisition directe
      de titres auprès des États ; ils ne mentionnent pas expressément l'annulation ou la conversion en dette perpétuelle
      de titres déjà inscrits au bilan d'une banque centrale.
    type: fait
    verdict: Vrai
    explication: L'article 123, paragraphe 1, du TFUE et l'article 21.1 du protocole n° 4 (version consolidée de
      2016) interdisent les crédits aux administrations publiques et l'acquisition directe de leurs titres. Aucun
      des deux textes ne mentionne l'annulation ni la conversion de titres déjà détenus ; leur interprétation sur
      ce point n'a pas été tranchée par la CJUE.
    sources:
    - source: S1
      extrait: l'acquisition directe, auprès d'eux, par la Banque centrale européenne ou les banques centrales nationales,
        des instruments de leur dette est également interdite.
      statut_source: conforme
  - id: F1
    enonce: Le traité interdit à la BCE et aux banques centrales nationales d'accorder des découverts ou crédits
      aux administrations publiques (Q41).
    type: fait
    verdict: Vrai
    explication: L'article 123, paragraphe 1, du TFUE (version consolidée 2016) interdit à la BCE et aux banques
      centrales nationales d'accorder des découverts ou tout autre type de crédit aux administrations publiques.
      Le texte est explicite.
    sources:
    - source: S1
      extrait: Il est interdit à la Banque centrale européenne et aux banques centrales des États membres, ci-après
        dénommées "banques centrales nationales", d'accorder des découverts ou tout autre type de crédit aux institutions,
        organes ou organismes de l'Union, aux administrations centrales
      statut_source: conforme
  - id: F2
    enonce: Le traité interdit l'acquisition directe, auprès des États, de leurs titres de dette par la BCE ou les
      banques centrales nationales (Q41).
    type: fait
    verdict: Vrai
    explication: La même phrase de l'article 123, paragraphe 1, du TFUE interdit l'acquisition directe, auprès des
      États, des instruments de leur dette par la BCE ou les banques centrales nationales. L'interdiction vise l'achat
      direct (marché primaire), pas les achats sur le marché secondaire.
    sources:
    - source: S1
      extrait: l'acquisition directe, auprès d'eux, par la Banque centrale européenne ou les banques centrales nationales,
        des instruments de leur dette est également interdite.
      statut_source: conforme
  - id: F3
    enonce: Le traité dispose que ni la BCE, ni une banque centrale nationale, ni un membre de leurs organes de
      décision ne peuvent solliciter ni accepter d'instructions des gouvernements (Q41, Q44).
    type: fait
    verdict: Vrai
    explication: L'article 130 du TFUE, repris à l'article 7 des statuts du SEBC, interdit à la BCE, aux banques
      centrales nationales et aux membres de leurs organes de décision de solliciter ou d'accepter des instructions,
      notamment des gouvernements des États membres.
    sources:
    - source: S1
      extrait: ni la Banque centrale européenne, ni une banque centrale nationale, ni un membre quelconque de leurs
        organes de décision ne peuvent solliciter ni accepter des instructions
      statut_source: conforme
  - id: F5
    enonce: Le conseil des gouverneurs de la BCE arrête les orientations et prend les décisions nécessaires aux
      missions du SEBC (qui décide, Q41).
    type: fait
    verdict: Vrai
    explication: L'article 12.1 des statuts du SEBC et de la BCE confie au conseil des gouverneurs l'adoption des
      orientations et des décisions nécessaires aux missions du SEBC.
    sources:
    - source: S1
      extrait: Le conseil des gouverneurs arrête les orientations et prend les décisions nécessaires à l'accomplissement
        des missions confiées au SEBC par les traités et les présents statuts.
      statut_source: conforme
  - id: F8
    enonce: Dans l'arrêt Gauweiler (C-62/14, 16 juin 2015), la Cour dit pour droit que le SEBC est autorisé à adopter
      un programme d'achat d'obligations souveraines sur les marchés secondaires (Q41).
    type: fait
    verdict: Vrai
    explication: Le dispositif de l'arrêt Gauweiler (CJUE, grande chambre, 16 juin 2015, C-62/14) dit pour droit
      que les articles 119, 123, paragraphe 1, et 127 du TFUE autorisent le SEBC à adopter un programme d'achat
      d'obligations souveraines sur les marchés secondaires. L'autorisation porte sur un programme « tel que celui
      annoncé » en septembre 2012 (opérations monétaires sur titres), avec les conditions qui l'encadrent.
    sources:
    - source: S2
      extrait: doivent être interprétés en ce sens qu'ils autorisent le Système européen de banques centrales (SEBC)
        à adopter un programme d'achat d'obligations souveraines sur les marchés secondaires
      statut_source: conforme
  - id: F9
    enonce: Dans l'arrêt Weiss (C-493/17, 11 décembre 2018), la Cour rappelle que le SEBC doit concilier ses interventions
      avec l'interdiction du financement monétaire de l'article 123 TFUE (Q41).
    type: fait
    verdict: Vrai
    explication: Au point 107 de l'arrêt Weiss (CJUE, grande chambre, 11 décembre 2018, C-493/17), la Cour indique
      que le SEBC doit entourer son intervention de garanties suffisantes pour la concilier avec l'interdiction
      du financement monétaire de l'article 123 du TFUE.
    sources:
    - source: S3
      extrait: le SEBC doit entourer son intervention de garanties suffisantes pour concilier celle-ci avec l'interdiction
        du financement monétaire découlant de l'article 123 TFUE
      statut_source: conforme
  - id: F10
    enonce: Dans l'arrêt Weiss (C-493/17), la Cour dit pour droit que l'examen des questions n'a révélé aucun élément
      affectant la validité de la décision (UE) 2015/774 de la BCE (Q41).
    type: fait
    verdict: Vrai
    explication: Le point 1 du dispositif de l'arrêt Weiss (C-493/17) dit pour droit que l'examen des questions
      n'a révélé aucun élément de nature à affecter la validité de la décision (UE) 2015/774 de la BCE du 4 mars
      2015, relative au programme d'achats d'actifs du secteur public sur les marchés secondaires.
    sources:
    - source: S3
      extrait: L'examen des première à quatrième questions préjudicielles n'a révélé aucun élément de nature à affecter
        la validité de la décision (UE) 2015/774 de la Banque centrale européenne
      statut_source: conforme
- id: A21
  auteur: expert-gauche-radicale
  question: Q41
  position: contre
  enonce: Les traités actuels s'opposent à ce que la BCE efface la dette des États ; l'annulation exige une démarche
    auprès des institutions et des autres pays européens, et un changement des traités.
  raisonnement: 'Les traités interdisent à la BCE de financer directement les États (F1, F2) ; c''est pourquoi elle
    a racheté la dette auprès des banques et des assurances (F44), ce qui maintient la dépendance aux marchés. L''annulation
    partielle se heurte donc aux traités : les élus communistes demandent de les changer et de saisir la Commission
    européenne et les autres États, plutôt que d''agir seul.'
  porte_par:
  - qui: Fabien Roussel, groupe GDR, débat à l'Assemblée nationale du 22 mars 2021
    parti: PCF
    source: S41
  repond_a: null
  statut: ouvert
  affirmations:
  - id: F1
    enonce: Le traité interdit à la BCE et aux banques centrales nationales d'accorder des découverts ou crédits
      aux administrations publiques (Q41).
    type: fait
    verdict: Vrai
    explication: L'article 123, paragraphe 1, du TFUE (version consolidée 2016) interdit à la BCE et aux banques
      centrales nationales d'accorder des découverts ou tout autre type de crédit aux administrations publiques.
      Le texte est explicite.
    sources:
    - source: S1
      extrait: Il est interdit à la Banque centrale européenne et aux banques centrales des États membres, ci-après
        dénommées "banques centrales nationales", d'accorder des découverts ou tout autre type de crédit aux institutions,
        organes ou organismes de l'Union, aux administrations centrales
      statut_source: conforme
  - id: F2
    enonce: Le traité interdit l'acquisition directe, auprès des États, de leurs titres de dette par la BCE ou les
      banques centrales nationales (Q41).
    type: fait
    verdict: Vrai
    explication: La même phrase de l'article 123, paragraphe 1, du TFUE interdit l'acquisition directe, auprès des
      États, des instruments de leur dette par la BCE ou les banques centrales nationales. L'interdiction vise l'achat
      direct (marché primaire), pas les achats sur le marché secondaire.
    sources:
    - source: S1
      extrait: l'acquisition directe, auprès d'eux, par la Banque centrale européenne ou les banques centrales nationales,
        des instruments de leur dette est également interdite.
      statut_source: conforme
  - id: F44
    enonce: Les titres de dette française détenus par l'Eurosystème au titre de la politique monétaire ont été achetés
      sur le marché secondaire, auprès d'institutions financières, et non directement auprès de l'État.
    type: fait
    verdict: Vrai
    explication: L'article 123 TFUE interdit l'acquisition directe de titres auprès des États (F2, S1), et les programmes
      d'achat de politique monétaire validés par la CJUE portent sur le marché secondaire (F8, F10). Public Sénat
      (25 août 2026) le confirme pour les achats de 2010 et de 2020.
    sources:
    - source: S19
      extrait: Ces opérations ont eu lieu sur le marché secondaire, c’est-à-dire auprès d’institutions financières
      statut_source: conforme
- id: A22
  auteur: expert-gauche-radicale
  question: Q42
  position: contre
  enonce: 'L''opération ne ferait pas monter les taux : elle ne touche que des titres détenus par la banque centrale,
    tandis que les créanciers privés continuent d''être remboursés intégralement.'
  raisonnement: Le taux demandé à la France rémunère le risque de non-remboursement pour les investisseurs de marché.
    La proposition ne vise que la part de l'Eurosystème (F46, F16, F17) et exclut explicitement un défaut de paiement
    envers les autres créanciers, jugé par ses auteurs désastreux. Ce risque n'étant pas modifié, le coût d'emprunt
    ne bouge pas (F47).
  porte_par:
  - qui: Jean-Luc Mélenchon, universités d'été de LFI et déclarations d'août 2026
    parti: LFI
    source: S19
  - qui: Jean-Luc Mélenchon et les députés LFI signataires de la proposition de résolution n° 2914 (défaut de paiement
      écarté)
    parti: LFI
    source: S39
  repond_a: null
  statut: ouvert
  affirmations:
  - id: F46
    enonce: La proposition vise la part de la dette française détenue par la Banque de France pour le compte de
      l'Eurosystème ; elle laisse inchangés les titres détenus par les autres créanciers.
    type: fait
    verdict: Plutôt vrai
    explication: Public Sénat (25 août 2026) établit que la proposition de Jean-Luc Mélenchon vise les titres détenus
      par la Banque de France pour le compte de la BCE (18 % dans le texte, 20 % dans le chapeau). Que les autres
      créanciers ne soient pas concernés n'est que sous-entendu, par un économiste cité dans l'article.
    sources:
    - source: S19
      extrait: l’annulation des 18 % de dette française détenus par la Banque de France pour le compte de la Banque
        centrale européenne (BCE)
      statut_source: conforme
  - id: F47
    enonce: L'annulation ou le gel en dette perpétuelle de la dette détenue par l'Eurosystème n'aurait pas d'effet
      sur le coût auquel la France emprunte.
    type: estimation
    verdict: Pas d'estimation fiable
    explication: La seule source rapporte l'avis de Jean-Luc Mélenchon (« aucun impact économique et aucun impact
      financier »), que l'article (Public Sénat, 25 août 2026) dit contesté par des économistes. Aucune institution
      n'a publié d'estimation chiffrée de l'effet sur le coût d'emprunt dans le dossier.
    sources:
    - source: S19
      extrait: aucun impact économique et aucun impact financier
      statut_source: conforme
  - id: F16
    enonce: L'Eurosystème détient près d'un quart des OAT au titre de la politique monétaire (données du premier
      trimestre 2025, rapport du Sénat) (Q41).
    type: fait
    verdict: Plutôt vrai
    explication: 'Le rapport d''information de la commission des finances du Sénat (24 septembre 2025) écrit au
      conditionnel que l''Eurosystème « détiendrait » près d''un quart des OAT, en commentant la détention au premier
      trimestre 2025. Le chiffre sous-jacent (24,4 %) porte sur une catégorie « autres français » qui inclut la
      Banque de France pour le compte de la BCE mais n''est pas limitée à elle : l''ordre de grandeur est sourcé,
      la précision est moindre que ne le suggère l''énoncé.'
    sources:
    - source: S10
      extrait: L'Eurosystème détiendrait près d'un quart des OAT à ce titre .
      statut_source: conforme
  - id: F17
    enonce: Au premier trimestre 2025, la catégorie « autres français », dont la Banque de France pour le compte
      de la BCE, représentait 24,4 % de la dette négociable de l'État (Q41).
    type: fait
    verdict: Vrai
    explication: Le tableau du rapport du Sénat (24 septembre 2025) attribue 24,4 % de la dette négociable de l'État,
      au premier trimestre 2025 et en valeur de marché, à la catégorie « autres français (dont la Banque de France
      pour le compte de la BCE) ». L'énoncé reprend fidèlement ce périmètre.
    sources:
    - source: S10
      extrait: Autres français (dont la Banque de France pour le compte de la BCE) 24,4 %
      statut_source: conforme
- id: A23
  auteur: expert-gauche-radicale
  question: Q43
  position: nuance
  enonce: 'L''intérêt de l''opération tient d''abord à l''allègement du stock de dette et du besoin de refinancement
    sur les marchés, plus qu''à une économie annuelle d''intérêts : la Banque de France reverse une partie de ses
    bénéfices à l''État.'
  raisonnement: 'Les intérêts versés à la Banque de France reviennent en partie à l''État par ses bénéfices (F18,
    F19, F20), flux variable (F21) : l''économie nette d''intérêts est donc moindre que l''économie brute. Mais
    l''Eurosystème ne réinvestit plus les titres arrivés à échéance (F48) ; sans conversion, l''État devrait remplacer
    ces titres par de la dette de marché au taux du moment, alors que la charge de la dette est déjà de 65,7 milliards
    en 2025 (F22). Le gel en dette perpétuelle vise à soulager les États de cette charge (F50).'
  porte_par:
  - qui: Jean-Luc Mélenchon et les députés LFI signataires de la proposition de résolution n° 2914 (11 mai 2020)
    parti: LFI
    source: S39
  - qui: Jean-Luc Mélenchon, déclarations d'août 2026 (opération sans coût pour personne)
    parti: LFI
    source: S19
  repond_a: null
  statut: ouvert
  affirmations:
  - id: F48
    enonce: Les réinvestissements des titres arrivant à échéance au titre du programme d'achats d'urgence pandémique
      (PEPP) de l'Eurosystème ont pris fin à la fin de 2024.
    type: fait
    verdict: Vrai
    explication: Le blog de la BCE (Imène Rahmouni-Rousseau et Isabel Schnabel, 29 avril 2025) indique que les réinvestissements
      au titre du PEPP ont pris fin à la fin de 2024. La page PEPP de la BCE montre des achats nets négatifs en
      octobre 2026, ce qui concorde.
    sources:
    - source: S42
      extrait: reinvestments under the pandemic emergency purchase programme (PEPP) came to an end
      statut_source: conforme
  - id: F50
    enonce: Le gel en dette perpétuelle de titres détenus par la banque centrale a pour objectif de soulager les
      États de la charge de la dette.
    type: fait
    verdict: Vrai
    explication: La proposition de résolution n° 2914 (11 mai 2020, Jean-Luc Mélenchon et 16 députés) présente cette
      mesure comme nécessaire pour soulager les États de la charge de la dette. Le verdict porte sur l'objectif
      déclaré par ses auteurs, pas sur un effet constaté.
    sources:
    - source: S39
      extrait: Considérant la nécessité de soulager les États de la charge de la dette afin de faciliter leur retour
        dans le financement des infrastructures collectives
      statut_source: conforme
  - id: F18
    enonce: Le 24 mars 2026, la Banque de France annonce un bénéfice net de 8,1 milliards d'euros pour l'exercice
      2025 (Q43).
    type: fait
    verdict: Vrai
    explication: Le communiqué de la Banque de France du 24 mars 2026 annonce un bénéfice net de 8,1 Md€ pour l'exercice
      2025.
    sources:
    - source: S8
      extrait: La Banque de France enregistre un bénéfice net de 8,1 Mds €.
      statut_source: conforme
  - id: F19
    enonce: Pour l'exercice 2025, la Banque de France verse un impôt sur les bénéfices de 1,5 milliard d'euros avant
      d'atteindre un résultat net de 8,1 milliards (Q43).
    type: fait
    verdict: Vrai
    explication: Le document de la Banque de France sur les comptes annuels de l'exercice 2025 (mars 2026) indique
      un impôt sur les bénéfices de 1,5 Md€ et un résultat net de 8,1 Md€ ; il concorde avec le communiqué du 24
      mars 2026 (F18).
    sources:
    - source: S7
      extrait: Après paiement de l'impôt sur les bénéfices (1,5 milliard d'euros), le résultat net ressort à 8,1
        milliards d'euros.
      statut_source: conforme
  - id: F20
    enonce: 'La Banque de France est un contributeur au budget de l''État : 36,8 milliards d''euros versés depuis
      2015 (Q43).'
    type: fait
    verdict: Vrai
    explication: 'Le document de la Banque de France sur l''exercice 2025 (mars 2026) indique 36,8 Md€ versés au
      budget de l''État depuis 2015. Ce total couvre 2015-2025 et réunit impôt sur les sociétés, dividendes et restitution
      d''excédents : la fiche doit préciser cette composition.'
    sources:
    - source: S7
      extrait: avec un total de 36,8 milliards d'euros versés depuis 2015
      statut_source: conforme
  - id: F21
    enonce: La Banque de France, contributrice nette au partage du revenu monétaire entre 2015 et 2022, est devenue
      bénéficiaire nette en 2023-2024 (Q43).
    type: fait
    verdict: Vrai
    explication: Le Bulletin de la Banque de France n° 260/6 (septembre-octobre 2025) indique, d'après les données
      des banques centrales nationales, que la Banque de France a été contributrice nette au partage du revenu monétaire
      de 2015 à 2022, puis bénéficiaire nette en 2023-2024.
    sources:
    - source: S9
      extrait: La Banque de France, contributrice nette au titre du partage du revenu monétaire entre 2015 et 2022,
        est devenue bénéficiaire nette en 2023-2024
      statut_source: conforme
  - id: F22
    enonce: En 2025, la charge de la dette de l'ensemble des administrations publiques atteint 65,7 milliards d'euros,
      soit 2,2 points de PIB (Cour des comptes, juin 2026) (Q43).
    type: fait
    verdict: Vrai
    explication: La synthèse du rapport de la Cour des comptes sur la situation et les perspectives des finances
      publiques (juin 2026) chiffre la charge de la dette de l'ensemble des administrations publiques à 65,7 Md€
      en 2025, soit 2,2 points de PIB, en hausse de plus de 9 % par rapport à 2024.
    sources:
    - source: S11
      extrait: 65,7 Md€ (2,2 points de PIB), soit une
      statut_source: conforme
- id: A24
  auteur: expert-gauche-radicale
  question: Q43
