- id: F19
  enonce: Pour l'exercice 2025, la Banque de France verse un impôt sur les bénéfices de 1,5 milliard d'euros avant
    d'atteindre un résultat net de 8,1 milliards (Q43).
  type: fait
  sources:
  - source: S7
    extrait: Après paiement de l'impôt sur les bénéfices (1,5 milliard d'euros), le résultat net ressort à 8,1 milliards
      d'euros.
  declaration: false
  auteur: bibliothecaire
  passage: 1
  verdict: Vrai
  explication: Le document de la Banque de France sur les comptes annuels de l'exercice 2025 (mars 2026) indique
    un impôt sur les bénéfices de 1,5 Md€ et un résultat net de 8,1 Md€ ; il concorde avec le communiqué du 24 mars
    2026 (F18).
