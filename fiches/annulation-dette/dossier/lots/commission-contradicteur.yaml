    raisonnement:
      valeur: valide
      justification: La distinction découle de F3 (instruction) et de F4 (compatibilité de la législation nationale
        avec les statuts) ; la thèse conclut seulement que l'atteinte dépend de la voie (F5).
    portee:
      texte: établit que l'atteinte à l'indépendance dépend de la voie retenue, décision libre du conseil ou loi
