      (sources S33, S45)'
  - id: A28
    auteur: gauche-radicale
    question: Q46
    position: nuance
    enonce: Les règles européennes sur le financement des États et le statut de la BCE doivent être remises en cause,
      la France exigeant leur changement. La politique de la dette relève du contrôle démocratique plutôt que de
      règles fixées par des institutions indépendantes.
    raisonnement: Les traités obligent les États à emprunter auprès des marchés plutôt qu'auprès de leur banque
      centrale (F1, F2) ; leurs auteurs les jugent un carcan qui prive les peuples de la maîtrise de leur endettement
      (F56). La résolution de 2020 invite le gouvernement à exiger de l'Union européenne un changement, ce qui place
      la décision sous contrôle politique démocratique plutôt que sous règles fixées par des institutions indépendantes.
    porte_par: '**Jean-Luc Mélenchon** (député, LFI), 11 mai 2020 [S39, S19]; **Jean-Luc Mélenchon** (ancien candidat
      à l''élection présidentielle de 2022, LFI), 6 juin 2022 [S40, S19]'
    repond_a: null
    affirmations:
    - F56 [valeur, sans verdict] Les règles européennes sur le financement des États et le statut de la banque centrale
      doivent être remises en cause. (sources S39, S40)
    - F1 [fait, Vrai] Le traité interdit à la BCE et aux banques centrales nationales d'accorder des découverts
      ou crédits aux administrations publiques (Q41). (sources S1)
    - F2 [fait, Vrai] Le traité interdit l'acquisition directe, auprès des États, de leurs titres de dette par la
      BCE ou les banques centrales nationales (Q41). (sources S1)
  - id: A29
    auteur: gauche-radicale
    question: Q46
    position: non
    enonce: 'L''annulation de la part détenue par la banque centrale se négocie au niveau européen : démarche auprès
