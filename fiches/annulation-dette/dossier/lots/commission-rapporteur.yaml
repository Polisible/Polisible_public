  question: Q44
  position: non
  enonce: Une demande d'un gouvernement ou d'un parlement n'est pas une instruction tant que la BCE la décide librement.
    L'indépendance interdit d'accepter des instructions, pas d'être sollicitée.
  raisonnement: F3 interdit à la BCE de solliciter ou d'accepter des instructions ; elle n'interdit pas qu'un gouvernement
    formule une demande que le conseil des gouverneurs (F5) reste libre de refuser. F4 porte sur la législation
    nationale et les statuts des banques centrales. L'atteinte à l'indépendance suppose donc que la BCE accepte
    une instruction.
  repond_a: A3
  partis:
  - LFI
  affirmations:
  - F3 [fait, Vrai] Le traité dispose que ni la BCE, ni une banque centrale nationale, ni un membre de leurs organes
    de décision ne peuvent solliciter ni accepter d'instructions des gouvernements (Q41, Q44).
  - F4 [fait, Vrai] Le traité prévoit que chaque État membre veille à la compatibilité de sa législation nationale,
    y compris les statuts de sa banque centrale, avec les traités et les statuts du SEBC (Q41, Q44).
  - F5 [fait, Vrai] Le conseil des gouverneurs de la BCE arrête les orientations et prend les décisions nécessaires
    aux missions du SEBC (qui décide, Q41).
- id: A46
  question: Q41
  position: oui
  enonce: L'article 123 vise deux actes précis, le crédit direct et l'achat direct. Que l'effacement d'une créance
    acquise sur le marché secondaire soit un financement interdit est une interprétation, non une conséquence du
    texte.
  raisonnement: Déduire l'interdiction de ce que les titres ont été achetés à des investisseurs (F24) établit que
    l'achat initial était régulier, pas que le traitement ultérieur du titre est interdit. Le traité ne mentionne
    pas ce cas (F57) et F27 reste invérifiable ; l'« avantage après coup » est une lecture que la Cour n'a pas validée.
  repond_a: A1
  partis:
  - PP
  affirmations:
  - F24 [fait, Vrai] Les titres de dette française détenus par l'Eurosystème ont été achetés sur le marché secondaire,
    auprès d'institutions financières, et non directement auprès de l'État.
  - F57 [fait, Vrai] Les traités européens n'interdisent pas explicitement l'annulation de dettes publiques détenues
    par la BCE (le mot « annulation » ne figure ni dans le traité ni dans le protocole sur le SEBC).
  - 'F27 [fait, Invérifiable] L''annulation ou la conversion en dette perpétuelle à taux nul de titres achetés par
    l''Eurosystème est contraire aux traités européens. — Aucun texte ne mentionne l''annulation ou la conversion
    de titres déjà détenus (F45) et aucune décision de la CJUE n''a tranché ce cas. La contrariété aux traités est
    affirmée par Roland Lescure (AFP, 24 août 2026) et par Christine Lagarde (F11, F13, F14) ; les signataires de
    la tribune de 2021 soutiennent le contraire (F57) : c''est une interprétation juridique disputée, pas un fait
    établi.'
- id: A47
  question: Q42
  position: nuance
  enonce: Une proposition passant par une décision du conseil des gouverneurs et un contrat avec les États n'est
    pas une opération unilatérale. Le signal de rupture unilatérale ne s'y applique pas, et personne ne chiffre
    l'ampleur de l'effet sur les taux.
  raisonnement: 'La prime de risque tient à un État qui « change les règles » seul. Si la décision est prise par
    la BCE elle-même (F5, F60), sans instruction d''un gouvernement (F3), cette prémisse manque. F26 n''a pas d''estimation
    fiable : le gain « rogné » par un surcoût n''est pas démontré.'
  repond_a: A2
  partis:
  - PP
  affirmations:
  - F3 [fait, Vrai] Le traité dispose que ni la BCE, ni une banque centrale nationale, ni un membre de leurs organes
    de décision ne peuvent solliciter ni accepter d'instructions des gouvernements (Q41, Q44).
  - F5 [fait, Vrai] Le conseil des gouverneurs de la BCE arrête les orientations et prend les décisions nécessaires
    aux missions du SEBC (qui décide, Q41).
  - F60 [fait, Vrai] Le texte de 2021 propose un contrat entre les États européens et la BCE, et non une décision
    prise par un seul État.
  - F26 [estimation, Pas d'estimation fiable] Une annulation unilatérale d'une partie de la dette publique ferait
    monter les taux auxquels la France emprunte, car les prêteurs réclameraient une prime de risque supplémentaire.
    — La seule source est la déclaration de Roland Lescure, ministre de l'Économie, rapportée par l'AFP le 24 août
    2026, sans chiffrage ni méthode. Des économistes cités par la presse (Public Sénat, 25 août 2026) et Christine
    Lagarde (F11) vont dans le même sens, mais aucune institution n'a publié d'estimation chiffrée de l'effet sur
    les taux dans le dossier.
- id: A48
  question: Q44
  position: nuance
  enonce: L'atteinte à la crédibilité de l'euro vaut pour une décision imposée par un gouvernement. Elle ne s'applique
    pas à un effacement arrêté par le conseil des gouverneurs lui-même.
  raisonnement: 'F3 interdit les instructions des gouvernements ; si le conseil décide (F5), aucune instruction
    n''est donnée. L''atteinte à la crédibilité suppose en outre que l''opération soit contraire aux traités (F27),
    ce qui est invérifiable : la compatibilité est disputée.'
  repond_a: A3
  partis:
  - PP
  affirmations:
  - F3 [fait, Vrai] Le traité dispose que ni la BCE, ni une banque centrale nationale, ni un membre de leurs organes
    de décision ne peuvent solliciter ni accepter d'instructions des gouvernements (Q41, Q44).
  - F5 [fait, Vrai] Le conseil des gouverneurs de la BCE arrête les orientations et prend les décisions nécessaires
    aux missions du SEBC (qui décide, Q41).
  - 'F27 [fait, Invérifiable] L''annulation ou la conversion en dette perpétuelle à taux nul de titres achetés par
    l''Eurosystème est contraire aux traités européens. — Aucun texte ne mentionne l''annulation ou la conversion
    de titres déjà détenus (F45) et aucune décision de la CJUE n''a tranché ce cas. La contrariété aux traités est
    affirmée par Roland Lescure (AFP, 24 août 2026) et par Christine Lagarde (F11, F13, F14) ; les signataires de
    la tribune de 2021 soutiennent le contraire (F57) : c''est une interprétation juridique disputée, pas un fait
    établi.'
- id: A49
  question: Q45
  position: non
  enonce: Les vendeurs des titres ont été payés par la banque centrale (F24). Effacer la créance de la banque centrale
    sur l'État ne retire rien à ces vendeurs, qui n'ont plus de créance.
  raisonnement: Ayant vendu, les vendeurs ont été réglés. Le créancier de l'État est la banque centrale, dont les
    engagements envers des tiers ne sont pas ceux de l'État. Distinguer ce créancier des détenteurs privés n'est
    donc pas une parole variable envers un prêteur privé.
  repond_a: A4
  partis:
  - PP
  affirmations:
  - F24 [fait, Vrai] Les titres de dette française détenus par l'Eurosystème ont été achetés sur le marché secondaire,
    auprès d'institutions financières, et non directement auprès de l'État.
- id: A50
  question: Q45
  position: oui
  enonce: 'Les vendeurs des titres ont été payés, mais la part détenue par l''Eurosystème reste une dette remboursable
    : ces titres arrivent à échéance comme les autres et l''État les rembourse.'
  raisonnement: 'A43 et A49 ont raison sur un point : les vendeurs n''ont plus de créance, et le créancier actuel
    est la banque centrale. Mais A43 en conclut que cette part est à part. Or l''Eurosystème ne réinvestit plus
    les titres arrivés à échéance depuis la fin de 2024 pour le PEPP (F48), et son stock baisse au fil de 2026 (F31)
    : cette part est déjà remboursée par l''État à chaque échéance, au même titre que les autres. Un titre de dette
    garde les mêmes conditions quel que soit son détenteur ; ne pas honorer celles-ci pour une seule catégorie de
    détenteurs modifie le contrat après coup. Que le marché assimile ou non cette part aux autres reste une estimation,
    pas une certitude (voir Q42).'
  repond_a: A43
  partis:
  - HOR
  affirmations:
  - F48 [fait, Vrai] Les réinvestissements des titres arrivant à échéance au titre du programme d'achats d'urgence
    pandémique (PEPP) de l'Eurosystème ont pris fin à la fin de 2024.
  - 'F31 [fait, Plutôt vrai] L''Eurosystème (BCE et banques centrales nationales) détient environ 640 milliards
    d''euros de titres publics français en 2026. — La chronique de Politis (14 septembre 2026) ne cite pas d''origine,
    mais les données de la BCE ouvertes le 10 novembre 2026 donnent un ordre de grandeur voisin : achats nets cumulés
    de titres publics français de 359,5 milliards d''euros au titre du PSPP et 237,5 milliards au titre du PEPP
    fin octobre 2026, soit environ 597 milliards (au coût amorti, émetteurs publics français y compris hors État),
    après environ 400 milliards pour le seul PSPP fin 2025. Le chiffre de 640 milliards correspond au début de 2026
    ; le stock baisse au fil de l''année.'
  - F24 [fait, Vrai] Les titres de dette française détenus par l'Eurosystème ont été achetés sur le marché secondaire,
    auprès d'institutions financières, et non directement auprès de l'État.
- id: A51
  question: Q42
  position: oui
  enonce: La proposition débattue en 2026 vient d'un acteur politique national, et la présidente de la BCE juge
    l'opération contraire aux traités. Le scénario sans signal de rupture, celui d'une décision du conseil des gouverneurs,
    n'est donc pas celui proposé.
  raisonnement: 'Si le conseil des gouverneurs décidait lui-même (F5), le signal serait différent, comme le disent
    A44 et A47. Mais ce scénario suppose que la BCE change de position : sa présidente affirme l''inverse (F27,
    F11, F13, F14), et la proposition est portée par un parti national (F46). Tant que la décision dépend d''un
    gouvernement ou d''une loi nationale, les prêteurs évaluent le scénario qui est sur la table, pas celui qui
    supposerait l''accord de la BCE. Même dans le scénario où la BCE déciderait, il reste à savoir si les prêteurs
    y verraient un contournement de l''interdiction du financement monétaire (F9) ; aucune estimation n''existe
    dans un sens ou dans l''autre (F26).'
  repond_a: A44
  partis:
  - RE
  affirmations:
  - 'F27 [fait, Invérifiable] L''annulation ou la conversion en dette perpétuelle à taux nul de titres achetés par
    l''Eurosystème est contraire aux traités européens. — Aucun texte ne mentionne l''annulation ou la conversion
    de titres déjà détenus (F45) et aucune décision de la CJUE n''a tranché ce cas. La contrariété aux traités est
    affirmée par Roland Lescure (AFP, 24 août 2026) et par Christine Lagarde (F11, F13, F14) ; les signataires de
    la tribune de 2021 soutiennent le contraire (F57) : c''est une interprétation juridique disputée, pas un fait
    établi.'
  - F46 [fait, Plutôt vrai] La proposition vise la part de la dette française détenue par la Banque de France pour
    le compte de l'Eurosystème ; elle laisse inchangés les titres détenus par les autres créanciers. — Public Sénat
    (25 août 2026) établit que la proposition de Jean-Luc Mélenchon vise les titres détenus par la Banque de France
    pour le compte de la BCE (18 % dans le texte, 20 % dans le chapeau). Que les autres créanciers ne soient pas
    concernés n'est que sous-entendu, par un économiste cité dans l'article.
  - F5 [fait, Vrai] Le conseil des gouverneurs de la BCE arrête les orientations et prend les décisions nécessaires
    aux missions du SEBC (qui décide, Q41).
  - F9 [fait, Vrai] Dans l'arrêt Weiss (C-493/17, 11 décembre 2018), la Cour rappelle que le SEBC doit concilier
    ses interventions avec l'interdiction du financement monétaire de l'article 123 TFUE (Q41).
  - F26 [estimation, Pas d'estimation fiable] Une annulation unilatérale d'une partie de la dette publique ferait
    monter les taux auxquels la France emprunte, car les prêteurs réclameraient une prime de risque supplémentaire.
    — La seule source est la déclaration de Roland Lescure, ministre de l'Économie, rapportée par l'AFP le 24 août
    2026, sans chiffrage ni méthode. Des économistes cités par la presse (Public Sénat, 25 août 2026) et Christine
    Lagarde (F11) vont dans le même sens, mais aucune institution n'a publié d'estimation chiffrée de l'effet sur
    les taux dans le dossier.
- id: A52
  question: Q44
  position: nuance
  enonce: Une demande politique que la BCE serait libre de refuser n'est pas une instruction. Si l'effacement passe
    par une loi nationale visant les titres de la Banque de France, l'État impose, et le traité interdit à une banque
    centrale nationale d'accepter des instructions de son gouvernement.
  raisonnement: 'A45 distingue demande et instruction (F3) ; la distinction vaut tant que le conseil des gouverneurs
    reste libre (F5). Elle ne vaut pas pour une loi : F4 oblige chaque État à rendre sa législation compatible avec
    les statuts de sa banque centrale et du SEBC, de sorte qu''une loi qui modifierait le bilan de la Banque de
    France relèverait de ce contrôle de compatibilité. A45 ne dit pas quelle voie suit la proposition ; l''atteinte
    à l''indépendance dépend donc de la voie choisie, et non de la seule existence d''une demande.'
  repond_a: A45
  partis:
  - RE
  affirmations:
  - F3 [fait, Vrai] Le traité dispose que ni la BCE, ni une banque centrale nationale, ni un membre de leurs organes
    de décision ne peuvent solliciter ni accepter d'instructions des gouvernements (Q41, Q44).
  - F4 [fait, Vrai] Le traité prévoit que chaque État membre veille à la compatibilité de sa législation nationale,
    y compris les statuts de sa banque centrale, avec les traités et les statuts du SEBC (Q41, Q44).
  - F5 [fait, Vrai] Le conseil des gouverneurs de la BCE arrête les orientations et prend les décisions nécessaires
    aux missions du SEBC (qui décide, Q41).
- id: A53
  question: Q44
  position: oui
  enonce: La crédibilité d'une monnaie dépend de ce que les marchés croient. Une légalité contestée suffit à créer
    un doute tant qu'aucun juge n'a tranché.
  raisonnement: 'F27 est invérifiable : aucune décision de la CJUE n''a tranché, et une telle décision n''interviendrait
    qu''après l''opération. Pour la crédibilité, ce qui compte est la perception de ceux qui détiennent des euros
    ou des titres, pas le verdict final d''un juge. Entre l''annonce et l''arrêt, le doute porte sur le respect
    de l''interdiction du financement monétaire (F9), qui fonde la confiance dans la monnaie commune. A48 a raison
    de dire que l''atteinte n''est pas établie ; elle n''est pas non plus écartée.'
  repond_a: A48
  partis:
  - RE
  affirmations:
  - 'F27 [fait, Invérifiable] L''annulation ou la conversion en dette perpétuelle à taux nul de titres achetés par
    l''Eurosystème est contraire aux traités européens. — Aucun texte ne mentionne l''annulation ou la conversion
    de titres déjà détenus (F45) et aucune décision de la CJUE n''a tranché ce cas. La contrariété aux traités est
    affirmée par Roland Lescure (AFP, 24 août 2026) et par Christine Lagarde (F11, F13, F14) ; les signataires de
    la tribune de 2021 soutiennent le contraire (F57) : c''est une interprétation juridique disputée, pas un fait
    établi.'
  - F9 [fait, Vrai] Dans l'arrêt Weiss (C-493/17, 11 décembre 2018), la Cour rappelle que le SEBC doit concilier
    ses interventions avec l'interdiction du financement monétaire de l'article 123 TFUE (Q41).
- id: A54
  question: Q45
  position: non
  enonce: Le chiffre de 24,4 % (F17) englobe plus que la Banque de France, mais l'argument ne dépend pas de lui.
    Il porte sur la nature publique du créancier, quelle que soit la part, de 18 % (F46) à près d'un quart.
  raisonnement: 'La conclusion « ne pas rembourser intégralement » repose sur la nature publique du créancier (F24
    : les vendeurs ont été payés), non sur le pourcentage. Que la part soit de 18 % ou de près d''un quart (F16),
    le raisonnement est le même ; F17 situe seulement l''ordre de grandeur.'
  repond_a: A42
  partis:
  - PP
  affirmations:
  - F46 [fait, Plutôt vrai] La proposition vise la part de la dette française détenue par la Banque de France pour
    le compte de l'Eurosystème ; elle laisse inchangés les titres détenus par les autres créanciers. — Public Sénat
    (25 août 2026) établit que la proposition de Jean-Luc Mélenchon vise les titres détenus par la Banque de France
    pour le compte de la BCE (18 % dans le texte, 20 % dans le chapeau). Que les autres créanciers ne soient pas
    concernés n'est que sous-entendu, par un économiste cité dans l'article.
  - 'F16 [fait, Plutôt vrai] L''Eurosystème détient près d''un quart des OAT au titre de la politique monétaire
    (données du premier trimestre 2025, rapport du Sénat) (Q41). — Le rapport d''information de la commission des
    finances du Sénat (24 septembre 2025) écrit au conditionnel que l''Eurosystème « détiendrait » près d''un quart
    des OAT, en commentant la détention au premier trimestre 2025. Le chiffre sous-jacent (24,4 %) porte sur une
    catégorie « autres français » qui inclut la Banque de France pour le compte de la BCE mais n''est pas limitée
    à elle : l''ordre de grandeur est sourcé, la précision est moindre que ne le suggère l''énoncé.'
  - F24 [fait, Vrai] Les titres de dette française détenus par l'Eurosystème ont été achetés sur le marché secondaire,
    auprès d'institutions financières, et non directement auprès de l'État.
