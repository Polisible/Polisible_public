- id: A9
  auteur: expert-ecologistes
  question: Q41
  position: nuance
  enonce: Le traité interdit le crédit et l'achat direct de dette auprès des États, mais pas les achats sur le marché
    secondaire, que le SEBC pratique depuis 2015 et que la Cour de justice a validés sous conditions. La question
    juridique réelle est donc de savoir si une conversion ou une annulation de titres déjà détenus relève de l'interdiction
    du financement monétaire, et c'est une question de décision politique de l'Eurosystème.
  raisonnement: 'L''article 123 vise deux opérations précises : le crédit direct aux États et l''acquisition directe
    de leur dette (F1, F2). Les titres détenus par l''Eurosystème ont été acquis sur les marchés secondaires dans
    un programme que la Cour a jugé compatible avec le traité sous garanties (F8, F9, F10). Un texte qui n''évoque
    pas le traitement ultérieur de ces titres ne tranche pas l''annulation ; l''affirmer interdite comme certaine
    est une interprétation, et le conseil des gouverneurs de la BCE reste l''organe qui décide (F5). Cette lecture
    concerne l''annulation ou la conversion décidée par la BCE elle-même, pas une décision unilatérale de l''État.'
  porte_par:
  - qui: Jérôme Gleizes, conseiller EELV de Paris (2023), chronique Politis du 14 septembre 2026
    parti: Les Écologistes
    source: S23
  repond_a: null
  statut: ouvert
  affirmations:
  - id: F1
    enonce: Le traité interdit à la BCE et aux banques centrales nationales d'accorder des découverts ou crédits
      aux administrations publiques (Q41).
    type: fait
    verdict: Vrai
    explication: L'article 123, paragraphe 1, du TFUE (version consolidée 2016) interdit à la BCE et aux banques
      centrales nationales d'accorder des découverts ou tout autre type de crédit aux administrations publiques.
      Le texte est explicite.
    sources:
    - source: S1
      extrait: Il est interdit à la Banque centrale européenne et aux banques centrales des États membres, ci-après
        dénommées "banques centrales nationales", d'accorder des découverts ou tout autre type de crédit aux institutions,
        organes ou organismes de l'Union, aux administrations centrales
      statut_source: conforme
  - id: F2
    enonce: Le traité interdit l'acquisition directe, auprès des États, de leurs titres de dette par la BCE ou les
      banques centrales nationales (Q41).
    type: fait
    verdict: Vrai
    explication: La même phrase de l'article 123, paragraphe 1, du TFUE interdit l'acquisition directe, auprès des
      États, des instruments de leur dette par la BCE ou les banques centrales nationales. L'interdiction vise l'achat
      direct (marché primaire), pas les achats sur le marché secondaire.
    sources:
    - source: S1
      extrait: l'acquisition directe, auprès d'eux, par la Banque centrale européenne ou les banques centrales nationales,
        des instruments de leur dette est également interdite.
      statut_source: conforme
  - id: F5
    enonce: Le conseil des gouverneurs de la BCE arrête les orientations et prend les décisions nécessaires aux
      missions du SEBC (qui décide, Q41).
    type: fait
    verdict: Vrai
    explication: L'article 12.1 des statuts du SEBC et de la BCE confie au conseil des gouverneurs l'adoption des
      orientations et des décisions nécessaires aux missions du SEBC.
    sources:
    - source: S1
      extrait: Le conseil des gouverneurs arrête les orientations et prend les décisions nécessaires à l'accomplissement
        des missions confiées au SEBC par les traités et les présents statuts.
      statut_source: conforme
  - id: F8
    enonce: Dans l'arrêt Gauweiler (C-62/14, 16 juin 2015), la Cour dit pour droit que le SEBC est autorisé à adopter
      un programme d'achat d'obligations souveraines sur les marchés secondaires (Q41).
    type: fait
    verdict: Vrai
    explication: Le dispositif de l'arrêt Gauweiler (CJUE, grande chambre, 16 juin 2015, C-62/14) dit pour droit
      que les articles 119, 123, paragraphe 1, et 127 du TFUE autorisent le SEBC à adopter un programme d'achat
      d'obligations souveraines sur les marchés secondaires. L'autorisation porte sur un programme « tel que celui
      annoncé » en septembre 2012 (opérations monétaires sur titres), avec les conditions qui l'encadrent.
    sources:
    - source: S2
      extrait: doivent être interprétés en ce sens qu'ils autorisent le Système européen de banques centrales (SEBC)
        à adopter un programme d'achat d'obligations souveraines sur les marchés secondaires
      statut_source: conforme
  - id: F9
    enonce: Dans l'arrêt Weiss (C-493/17, 11 décembre 2018), la Cour rappelle que le SEBC doit concilier ses interventions
      avec l'interdiction du financement monétaire de l'article 123 TFUE (Q41).
    type: fait
    verdict: Vrai
    explication: Au point 107 de l'arrêt Weiss (CJUE, grande chambre, 11 décembre 2018, C-493/17), la Cour indique
      que le SEBC doit entourer son intervention de garanties suffisantes pour la concilier avec l'interdiction
      du financement monétaire de l'article 123 du TFUE.
    sources:
    - source: S3
      extrait: le SEBC doit entourer son intervention de garanties suffisantes pour concilier celle-ci avec l'interdiction
        du financement monétaire découlant de l'article 123 TFUE
      statut_source: conforme
  - id: F10
    enonce: Dans l'arrêt Weiss (C-493/17), la Cour dit pour droit que l'examen des questions n'a révélé aucun élément
      affectant la validité de la décision (UE) 2015/774 de la BCE (Q41).
    type: fait
    verdict: Vrai
    explication: Le point 1 du dispositif de l'arrêt Weiss (C-493/17) dit pour droit que l'examen des questions
      n'a révélé aucun élément de nature à affecter la validité de la décision (UE) 2015/774 de la BCE du 4 mars
      2015, relative au programme d'achats d'actifs du secteur public sur les marchés secondaires.
    sources:
    - source: S3
      extrait: L'examen des première à quatrième questions préjudicielles n'a révélé aucun élément de nature à affecter
        la validité de la décision (UE) 2015/774 de la Banque centrale européenne
      statut_source: conforme
- id: A10
  auteur: expert-ecologistes
  question: Q45
  position: contre
  enonce: 'Un État n''a pas à rembourser intégralement une dette détenue par sa banque centrale : elle n''est pas
    due à un créancier extérieur à la sphère publique, et la marge dégagée peut financer les investissements de
    la transition écologique. Le remboursement intégral n''est pas une obligation de principe mais un choix de politique
    économique.'
  raisonnement: Les titres publics détenus par l'Eurosystème (environ 640 milliards d'euros pour la France en 2026,
    F31) sont le résultat d'achats de politique monétaire, non d'un prêt consenti par un épargnant ou un investisseur
    privé. Les intérêts versés à la banque centrale reviennent en partie à l'État (F7, F20). Comme l'Europe a besoin
    de 800 milliards d'euros d'investissements supplémentaires par an (F32), maintenir cette dette au bilan pour
    la rembourser prive l'investissement climatique d'une marge qui existe. Le parti a déjà proposé en 2020 de lier
    annulation de dette auprès de la BCE et financement de la reconstruction écologique (F34).
  porte_par:
  - qui: Jérôme Gleizes, conseiller EELV de Paris (2023), chronique Politis du 14 septembre 2026
    parti: Les Écologistes
    source: S23
  - qui: Les Verts (EELV), plan de reconstruction écologique de juin 2020, porte-parole Eva Sas
    parti: Les Écologistes
    source: S24
  repond_a: null
  statut: ouvert
  affirmations:
  - id: F31
    enonce: L'Eurosystème (BCE et banques centrales nationales) détient environ 640 milliards d'euros de titres
      publics français en 2026.
    type: fait
    verdict: Plutôt vrai
    explication: 'La chronique de Politis (14 septembre 2026) ne cite pas d''origine, mais les données de la BCE
      ouvertes le 10 novembre 2026 donnent un ordre de grandeur voisin : achats nets cumulés de titres publics français
      de 359,5 milliards d''euros au titre du PSPP et 237,5 milliards au titre du PEPP fin octobre 2026, soit environ
      597 milliards (au coût amorti, émetteurs publics français y compris hors État), après environ 400 milliards
      pour le seul PSPP fin 2025. Le chiffre de 640 milliards correspond au début de 2026 ; le stock baisse au fil
      de l''année.'
    sources:
    - source: S23
      extrait: dont environ 640 milliards de titres publics français
      statut_source: conforme
    - source: S46
      extrait: France 401,150 -147 359,487 5.91 5.88 8.60
      statut_source: conforme
    - source: S47
      extrait: France -34 237,484 6.60 7.67
      statut_source: conforme
  - id: F32
    enonce: Les investissements supplémentaires nécessaires à l'Union européenne sont estimés à 800 milliards d'euros
      par an (rapport Draghi, 2024).
    type: fait
    verdict: Plutôt vrai
    explication: Le rapport Draghi (Commission européenne, septembre 2024) chiffre l'investissement supplémentaire
      nécessaire à « un minimum » de 750 à 800 milliards d'euros par an, soit 4,4 à 4,7 % du PIB de l'UE de 2023,
      d'après les estimations de la Commission. Le chiffre de 800 milliards est le haut de cette fourchette.
    sources:
    - source: S23
      extrait: L’Europe, selon le rapport Draghi, a besoin de 800 milliards d’euros d’investissements supplémentaires
        chaque année
      statut_source: conforme
    - source: S44
      extrait: To meet the objectives laid out in this report, a minimum annual additional investment of EUR 750
        to 800 billion is needed, based on the latest Commission esti- mates, corresponding to 4.4-4.7% of EU GDP
        in 2023.
      statut_source: conforme
  - id: F34
    enonce: En juin 2020, le parti Les Verts (EELV) a présenté un plan de reconstruction écologique financé par
      une annulation de la dette française auprès de la BCE et par une fiscalité plus juste, dont le rétablissement
