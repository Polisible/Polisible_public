grille: docs/commission.md § 3 (à relire)
questions:
- Q41 (fait) Les traités européens permettent-ils d'annuler, ou de convertir en dette perpétuelle à taux nul, la
  dette française détenue par la Banque de France pour l'Eurosystème ?
- Q42 (estimation) Annuler ou geler cette dette ferait-il monter les taux auxquels la France emprunte ?
- Q43 (estimation) L'opération réduirait-elle durablement la charge d'intérêts de l'État, compte tenu des intérêts
  que la Banque de France reverse à l'État ?
- Q44 (estimation) Annuler ou geler cette dette affaiblirait-il la crédibilité de l'euro ou l'indépendance de la
  BCE ?
- Q45 (valeur) Un État doit-il rembourser intégralement sa dette, y compris quand le créancier est sa propre banque
  centrale ?
- Q46 (valeur) Les décisions sur la dette publique doivent-elles relever de la seule décision nationale plutôt que
  des règles européennes ?
- Q47 (valeur) Pour dégager des marges budgétaires, l'annulation d'une partie de la dette est-elle préférable aux
  économies, à la hausse des recettes ou à la recherche de croissance ?
institutions:
- F11 **Christine Lagarde** (présidente de la Banque centrale européenne, BCE), 12 septembre 2026 [S4] — Christine
  Lagarde, présidente de la BCE, déclare le 12 septembre 2026 que l'annulation de la dette française détenue par
  la Banque de France serait financièrement très dangereuse et contraire aux traités (Q41, Q44). [Vrai]
- F12 **Christine Lagarde** (présidente de la Banque centrale européenne, BCE), 7 février 2021 [S5] — Christine
  Lagarde déclare le 7 février 2021 que l'annulation de la dette publique détenue par la BCE, demandée par une pétition
  d'économistes, est inenvisageable (Q41). [Vrai]
- F13 **Christine Lagarde** (présidente de la Banque centrale européenne, BCE), 7 février 2021 [S5] — Christine
  Lagarde déclare le 7 février 2021 que cette annulation violerait le traité européen qui interdit le financement
  monétaire des États (Q41, Q44). [Vrai]
- F14 **Christine Lagarde** (présidente de la Banque centrale européenne, BCE), 2 juillet 2021 [S6] — Christine
  Lagarde déclare le 2 juillet 2021 que l'annulation des dettes publiques serait contraire à la législation et aux
  traités (Q41). [Vrai]
- F15 **Christine Lagarde** (présidente de la Banque centrale européenne, BCE), 2 juillet 2021 [S6] — Christine
  Lagarde déclare le 2 juillet 2021 que la plupart des « dettes COVID » achetées par la politique monétaire sont
  inscrites au bilan de la Banque de France (Q41). [Vrai]
objections:
- id: O1
  vise: F41
  contenu: L'énoncé et l'argument A13 supposent que le résultat de la Banque de France baisse d'autant que les intérêts
    qu'elle ne perçoit plus, donc que ses versements à l'État baissent d'autant.
  resolution: 'Objection non fondée sur son point central : S9 (Bulletin de la Banque de France n° 260/6, 2025)
    indique que, si les revenus et risques des titres supranationaux, d''entreprises et obligations sécurisées achetés
    après 2014 sont partagés, « ils ne le sont pas pour les titres d''État acquis depuis 2015 » ; seule une part
    forfaitaire, rémunérée au taux de référence, est mutualisée lorsque ces actifs sont financés par des passifs
    partagés. Le partage du revenu monétaire ne permet donc pas d''écarter l''idée que les intérêts sur les titres
    d''État détenus restent pour l''essentiel à la Banque de France, mais il nuance un effet « à due concurrence
    » ; F41 n''affirme d''ailleurs pas cet effet intégral. Le verdict de F41 (Pas d''estimation fiable) est inchangé,
    faute de source conforme isolant la part de ces intérêts dans le résultat.'
arguments:
- id: A1
  question: Q41
  position: non
  enonce: 'Les traités ne permettent pas d''effacer ni de convertir à taux nul ces titres : ce serait faire financer
    l''État par sa banque centrale, ce que l''article 123 interdit. Aucun arrêt n''a tranché ce cas précis, et la
    décision relèverait du conseil des gouverneurs.'
  raisonnement: 'L''article 123 interdit crédits et achats directs de dette aux États (F1, F2). La Cour a validé
    les rachats sur le marché secondaire (F8, F10), mais à condition de garanties contre le financement monétaire
    (F9) : les titres ont été achetés à des investisseurs (F24) et non offerts à l''État. Les annuler ou les convertir
    en perpétuel à taux nul reviendrait à donner à l''État, après coup, un avantage que le traité lui refuse au
    départ. Enfin, les décisions du SEBC appartiennent au conseil des gouverneurs (F5), qui ne peut recevoir d''instructions
    des gouvernements (F3) : un État ne peut ni l''ordonner ni modifier seul le cadre (F4).'
  repond_a: null
  partis:
  - RE
  affirmations:
  - F1 [fait, Vrai] Le traité interdit à la BCE et aux banques centrales nationales d'accorder des découverts ou
    crédits aux administrations publiques (Q41).
  - F2 [fait, Vrai] Le traité interdit l'acquisition directe, auprès des États, de leurs titres de dette par la
    BCE ou les banques centrales nationales (Q41).
  - F3 [fait, Vrai] Le traité dispose que ni la BCE, ni une banque centrale nationale, ni un membre de leurs organes
    de décision ne peuvent solliciter ni accepter d'instructions des gouvernements (Q41, Q44).
  - F4 [fait, Vrai] Le traité prévoit que chaque État membre veille à la compatibilité de sa législation nationale,
    y compris les statuts de sa banque centrale, avec les traités et les statuts du SEBC (Q41, Q44).
  - F5 [fait, Vrai] Le conseil des gouverneurs de la BCE arrête les orientations et prend les décisions nécessaires
    aux missions du SEBC (qui décide, Q41).
  - F8 [fait, Vrai] Dans l'arrêt Gauweiler (C-62/14, 16 juin 2015), la Cour dit pour droit que le SEBC est autorisé
    à adopter un programme d'achat d'obligations souveraines sur les marchés secondaires (Q41).
  - F9 [fait, Vrai] Dans l'arrêt Weiss (C-493/17, 11 décembre 2018), la Cour rappelle que le SEBC doit concilier
    ses interventions avec l'interdiction du financement monétaire de l'article 123 TFUE (Q41).
  - F10 [fait, Vrai] Dans l'arrêt Weiss (C-493/17), la Cour dit pour droit que l'examen des questions n'a révélé
    aucun élément affectant la validité de la décision (UE) 2015/774 de la BCE (Q41).
  - F24 [fait, Vrai] Les titres de dette française détenus par l'Eurosystème ont été achetés sur le marché secondaire,
    auprès d'institutions financières, et non directement auprès de l'État.
  - 'F27 [fait, Invérifiable] L''annulation ou la conversion en dette perpétuelle à taux nul de titres achetés par
    l''Eurosystème est contraire aux traités européens. — Aucun texte ne mentionne l''annulation ou la conversion
    de titres déjà détenus (F45) et aucune décision de la CJUE n''a tranché ce cas. La contrariété aux traités est
    affirmée par Roland Lescure (AFP, 24 août 2026) et par Christine Lagarde (F11, F13, F14) ; les signataires de
    la tribune de 2021 soutiennent le contraire (F57) : c''est une interprétation juridique disputée, pas un fait
    établi.'
- id: A2
  question: Q42
  position: oui
  enonce: 'Les taux monteraient : un État qui renonce unilatéralement à une part de sa dette, par une voie juridiquement
    contestée, signale qu''il peut changer les règles. Les prêteurs demanderaient un taux plus élevé ; aucune institution
    n''a chiffré cette hausse.'
  raisonnement: La France emprunte à un taux déjà au plus haut depuis 2008 (F25) ; toute hausse supplémentaire se
    répercute sur l'ensemble de la dette renouvelée. L'opération, juridiquement contestée (F27), serait lue comme
    un défaut partiel ou un risque de rupture avec les règles de la zone euro. Les prêteurs, qui n'ont aucune raison
    de croire que le précédent ne se reproduira pas, réclameraient une prime de risque (F26), et l'accès aux marchés
    pourrait se compliquer. Le gain sur les intérêts de la dette gelée serait ainsi rogné par le surcoût sur la
    dette future.
  repond_a: null
  partis:
  - HOR
  - RE
  affirmations:
  - F25 [fait, Plutôt vrai] Le 24 août 2026, le taux d'intérêt de la France à 10 ans était de 4,11 %, après avoir
    dépassé 4,14 % le jeudi précédent, son plus haut niveau depuis 2008. — La dépêche AFP reprise par MoneyVox le
    24 août 2026 donne bien 4,11 % le lundi et plus de 4,14 % le jeudi précédent, au plus haut depuis 2008. C'est
    une valeur de la matinée, rapportée par la presse ; aucune série officielle de clôture (Banque de France, Agence
    France Trésor) n'a été consultée.
  - F26 [estimation, Pas d'estimation fiable] Une annulation unilatérale d'une partie de la dette publique ferait
    monter les taux auxquels la France emprunte, car les prêteurs réclameraient une prime de risque supplémentaire.
    — La seule source est la déclaration de Roland Lescure, ministre de l'Économie, rapportée par l'AFP le 24 août
    2026, sans chiffrage ni méthode. Des économistes cités par la presse (Public Sénat, 25 août 2026) et Christine
    Lagarde (F11) vont dans le même sens, mais aucune institution n'a publié d'estimation chiffrée de l'effet sur
    les taux dans le dossier.
  - 'F27 [fait, Invérifiable] L''annulation ou la conversion en dette perpétuelle à taux nul de titres achetés par
    l''Eurosystème est contraire aux traités européens. — Aucun texte ne mentionne l''annulation ou la conversion
    de titres déjà détenus (F45) et aucune décision de la CJUE n''a tranché ce cas. La contrariété aux traités est
    affirmée par Roland Lescure (AFP, 24 août 2026) et par Christine Lagarde (F11, F13, F14) ; les signataires de
    la tribune de 2021 soutiennent le contraire (F57) : c''est une interprétation juridique disputée, pas un fait
    établi.'
- id: A3
  question: Q44
  position: oui
  enonce: L'indépendance de la BCE repose sur l'interdiction faite aux gouvernements de lui donner des instructions
    ; lui imposer d'effacer ses actifs serait une instruction. La crédibilité de l'euro repose sur le respect des
    règles communes.
  raisonnement: Le traité interdit à la BCE et aux banques centrales nationales de solliciter ou d'accepter des
    instructions des gouvernements (F3) et oblige chaque État à rendre ses lois compatibles avec les traités (F4).
    Un État qui déciderait seul d'effacer des titres de l'Eurosystème, sans accord du conseil des gouverneurs (F5),
    afficherait que l'indépendance peut être levée par un gouvernement. Une monnaie commune n'a de valeur que si
    chaque membre applique les mêmes règles ; l'opération, jugée contraire aux traités (F27), reviendrait à n'en
    plus respecter les règles, avec un risque de défiance envers la signature des États et la monnaie.
  repond_a: null
  partis:
  - RE
  affirmations:
  - F3 [fait, Vrai] Le traité dispose que ni la BCE, ni une banque centrale nationale, ni un membre de leurs organes
    de décision ne peuvent solliciter ni accepter d'instructions des gouvernements (Q41, Q44).
  - F4 [fait, Vrai] Le traité prévoit que chaque État membre veille à la compatibilité de sa législation nationale,
    y compris les statuts de sa banque centrale, avec les traités et les statuts du SEBC (Q41, Q44).
  - F5 [fait, Vrai] Le conseil des gouverneurs de la BCE arrête les orientations et prend les décisions nécessaires
    aux missions du SEBC (qui décide, Q41).
  - 'F27 [fait, Invérifiable] L''annulation ou la conversion en dette perpétuelle à taux nul de titres achetés par
    l''Eurosystème est contraire aux traités européens. — Aucun texte ne mentionne l''annulation ou la conversion
    de titres déjà détenus (F45) et aucune décision de la CJUE n''a tranché ce cas. La contrariété aux traités est
    affirmée par Roland Lescure (AFP, 24 août 2026) et par Christine Lagarde (F11, F13, F14) ; les signataires de
    la tribune de 2021 soutiennent le contraire (F57) : c''est une interprétation juridique disputée, pas un fait
    établi.'
- id: A4
  question: Q45
  position: oui
  enonce: 'Les titres détenus par la banque centrale sont des titres de l''État comme les autres : ils arrivent
    à échéance et sont remboursés. Les effacer unilatéralement porterait atteinte à la signature de la France.'
  raisonnement: 'Les titres ont été achetés sur le marché secondaire (F24) : la banque centrale a payé les vendeurs,
    et ses engagements envers eux demeurent. Distinguer les créanciers que l''on rembourse de ceux que l''on ne
    rembourse pas ferait de la parole de l''État un choix variable. Le respect intégral des engagements est ce qui
    permet à la France d''emprunter durablement (F25 : le coût de l''emprunt est déjà élevé).'
  repond_a: null
  partis:
  - HOR
  affirmations:
  - F24 [fait, Vrai] Les titres de dette française détenus par l'Eurosystème ont été achetés sur le marché secondaire,
    auprès d'institutions financières, et non directement auprès de l'État.
  - F25 [fait, Plutôt vrai] Le 24 août 2026, le taux d'intérêt de la France à 10 ans était de 4,11 %, après avoir
    dépassé 4,14 % le jeudi précédent, son plus haut niveau depuis 2008. — La dépêche AFP reprise par MoneyVox le
    24 août 2026 donne bien 4,11 % le lundi et plus de 4,14 % le jeudi précédent, au plus haut depuis 2008. C'est
    une valeur de la matinée, rapportée par la presse ; aucune série officielle de clôture (Banque de France, Agence
    France Trésor) n'a été consultée.
- id: A5
  question: Q46
  position: non
  enonce: Dans une union monétaire, la dette en euros et la banque centrale sont des biens communs. Décider seul
    sur des titres détenus par l'Eurosystème reviendrait à s'affranchir des règles communes, contraires en ce cas
    aux traités.
  raisonnement: 'L''État a lui-même accepté les traités : il doit veiller à la compatibilité de sa législation avec
    eux (F4) et ne peut pas donner d''instructions à la banque centrale (F3). Une décision nationale unilatérale
    sur des titres détenus par l''Eurosystème engagerait les autres membres, qui supportent leur part du bilan commun.
    S''en affranchir sur ce sujet, c''est dire qu''on ne respecte plus les règles communes (F27).'
  repond_a: null
  partis:
  - RE
  affirmations:
  - F3 [fait, Vrai] Le traité dispose que ni la BCE, ni une banque centrale nationale, ni un membre de leurs organes
    de décision ne peuvent solliciter ni accepter d'instructions des gouvernements (Q41, Q44).
  - F4 [fait, Vrai] Le traité prévoit que chaque État membre veille à la compatibilité de sa législation nationale,
    y compris les statuts de sa banque centrale, avec les traités et les statuts du SEBC (Q41, Q44).
  - 'F27 [fait, Invérifiable] L''annulation ou la conversion en dette perpétuelle à taux nul de titres achetés par
    l''Eurosystème est contraire aux traités européens. — Aucun texte ne mentionne l''annulation ou la conversion
    de titres déjà détenus (F45) et aucune décision de la CJUE n''a tranché ce cas. La contrariété aux traités est
    affirmée par Roland Lescure (AFP, 24 août 2026) et par Christine Lagarde (F11, F13, F14) ; les signataires de
    la tribune de 2021 soutiennent le contraire (F57) : c''est une interprétation juridique disputée, pas un fait
    établi.'
- id: A6
  question: Q47
  position: non
  enonce: Le gain net de l'annulation pour l'État est incertain, car la Banque de France lui verse déjà des bénéfices
    qui reposent en partie sur ces intérêts. Équilibrer les comptes et alléger le coût du travail sont les leviers
    retenus.
  raisonnement: 'La Banque de France verse des sommes à l''État (F20, F19 : impôt de 1,5 milliard d''euros et résultat
    net de 8,1 milliards en 2025, F18). Si l''opération réduit les intérêts payés par l''État, elle réduit aussi
    ce que la banque lui verse, de sorte que la marge nette est inférieure au gain brut (voir Q43). Pour dégager
    une marge durable, les leviers sont les économies, un budget équilibré, et la croissance par la baisse du coût
    du travail.'
  repond_a: null
  partis:
  - HOR
  - RE
  affirmations:
  - F18 [fait, Vrai] Le 24 mars 2026, la Banque de France annonce un bénéfice net de 8,1 milliards d'euros pour
    l'exercice 2025 (Q43).
  - F19 [fait, Vrai] Pour l'exercice 2025, la Banque de France verse un impôt sur les bénéfices de 1,5 milliard
    d'euros avant d'atteindre un résultat net de 8,1 milliards (Q43).
  - 'F20 [fait, Vrai] La Banque de France est un contributeur au budget de l''État : 36,8 milliards d''euros versés
    depuis 2015 (Q43).'
- id: A7
  question: Q45
  position: oui
  enonce: 'Un État doit rembourser sa dette, y compris quand le créancier est la banque centrale : l''État engage
    son peuple, et renoncer à une dette ferait perdre la confiance qui permet d''emprunter.'
  raisonnement: Une dette est un engagement pris au nom des contribuables. Si l'État peut s'en délier, aucun engagement
    futur n'est crédible. Une dette lourde appelle une redéfinition des priorités de dépense, non sa disparition
    ; cette position date de décembre 2020 et ne porte pas sur la proposition d'août 2026.
  repond_a: null
  partis:
  - LR
  affirmations:
  - 'F28 [valeur, sans verdict] Un État doit honorer ses dettes : en s''engageant, il engage son peuple, c''est-à-dire
    ses contribuables, et la parole donnée doit garder sa valeur.'
- id: A8
  question: Q47
  position: non
  enonce: Pour dégager des marges budgétaires, la voie retenue est de réduire la dépense publique et de viser un
    excédent primaire, plutôt que de toucher au stock de dette.
  raisonnement: 'Le plan présenté le 12 octobre 2026 finance l''effort par des économies sur l''État et les dépenses
    sociales (F30), avec un déficit sous 3 % en 2031. Les marges viennent de la dépense maîtrisée. Le plan ne mentionne
    pas l''annulation : l''argument en est une lecture par le choix des moyens.'
  repond_a: null
  partis:
  - LR
  affirmations:
  - F29 [fait, Vrai] Le plan de redressement budgétaire de Bruno Retailleau, présenté le 12 octobre 2026, prévoit
    un effort de 197 milliards d'euros sur cinq ans, dont 56 milliards d'allègements fiscaux, l'essentiel de l'effort
    allant à l'amélioration du solde.
  - F30 [fait, Vrai] Ce plan fait reposer l'essentiel de l'effort sur l'État, dont il questionne le périmètre, et
    sur les dépenses sociales.
- id: A10
  question: Q45
  position: non
  enonce: Un État n'a pas à rembourser intégralement une dette détenue par sa banque centrale, qui n'est pas due
    à un créancier extérieur à la sphère publique. La marge dégagée peut financer la transition écologique.
  raisonnement: Les titres publics détenus par l'Eurosystème (environ 640 milliards d'euros pour la France en 2026,
    F31) sont le résultat d'achats de politique monétaire, non d'un prêt consenti par un épargnant ou un investisseur
    privé. Les intérêts versés à la banque centrale reviennent en partie à l'État (F7, F20). Comme l'Europe a besoin
    de 800 milliards d'euros d'investissements supplémentaires par an (F32), maintenir cette dette au bilan pour
    la rembourser prive l'investissement climatique d'une marge qui existe. Le parti a déjà proposé en 2020 de lier
    annulation de dette auprès de la BCE et financement de la reconstruction écologique (F34).
  repond_a: null
  partis:
  - LE
  affirmations:
  - 'F31 [fait, Plutôt vrai] L''Eurosystème (BCE et banques centrales nationales) détient environ 640 milliards
    d''euros de titres publics français en 2026. — La chronique de Politis (14 septembre 2026) ne cite pas d''origine,
    mais les données de la BCE ouvertes le 10 novembre 2026 donnent un ordre de grandeur voisin : achats nets cumulés
    de titres publics français de 359,5 milliards d''euros au titre du PSPP et 237,5 milliards au titre du PEPP
    fin octobre 2026, soit environ 597 milliards (au coût amorti, émetteurs publics français y compris hors État),
    après environ 400 milliards pour le seul PSPP fin 2025. Le chiffre de 640 milliards correspond au début de 2026
    ; le stock baisse au fil de l''année.'
  - F32 [fait, Plutôt vrai] Les investissements supplémentaires nécessaires à l'Union européenne sont estimés à
    800 milliards d'euros par an (rapport Draghi, 2024). — Le rapport Draghi (Commission européenne, septembre 2024)
    chiffre l'investissement supplémentaire nécessaire à « un minimum » de 750 à 800 milliards d'euros par an, soit
    4,4 à 4,7 % du PIB de l'UE de 2023, d'après les estimations de la Commission. Le chiffre de 800 milliards est
    le haut de cette fourchette.
  - F34 [fait, Vrai] En juin 2020, le parti Les Verts (EELV) a présenté un plan de reconstruction écologique financé
    par une annulation de la dette française auprès de la BCE et par une fiscalité plus juste, dont le rétablissement
    de l'ISF.
  - F7 [fait, Vrai] Le revenu monétaire des banques centrales nationales est réparti à la fin de chaque exercice
    (Q43).
  - 'F20 [fait, Vrai] La Banque de France est un contributeur au budget de l''État : 36,8 milliards d''euros versés
    depuis 2015 (Q43).'
- id: A11
  question: Q46
  position: nuance
  enonce: La dette détenue par l'Eurosystème relève d'une décision européenne, non d'une décision nationale seule.
    Les règles doivent être révisées par traité pour viser les limites planétaires, plutôt que contournées par un
    État.
  raisonnement: 'Les titres en cause sont détenus au sein de l''Eurosystème, dont le conseil des gouverneurs décide
    (F5), et les banques centrales nationales doivent respecter les statuts du SEBC (F4) : un État ne peut pas décider
    seul. Mais ces règles fixent l''objectif de politique budgétaire à des organes que le parti juge insuffisamment
    démocratiques, alors que les besoins d''investissement sont européens (F32). La réponse du parti est donc une
    révision des traités avec des objectifs écologiques et sociaux (F33), pas un repli national.'
  repond_a: null
  partis:
  - LE
  affirmations:
  - F4 [fait, Vrai] Le traité prévoit que chaque État membre veille à la compatibilité de sa législation nationale,
    y compris les statuts de sa banque centrale, avec les traités et les statuts du SEBC (Q41, Q44).
  - F5 [fait, Vrai] Le conseil des gouverneurs de la BCE arrête les orientations et prend les décisions nécessaires
    aux missions du SEBC (qui décide, Q41).
  - F32 [fait, Plutôt vrai] Les investissements supplémentaires nécessaires à l'Union européenne sont estimés à
    800 milliards d'euros par an (rapport Draghi, 2024). — Le rapport Draghi (Commission européenne, septembre 2024)
    chiffre l'investissement supplémentaire nécessaire à « un minimum » de 750 à 800 milliards d'euros par an, soit
    4,4 à 4,7 % du PIB de l'UE de 2023, d'après les estimations de la Commission. Le chiffre de 800 milliards est
    le haut de cette fourchette.
  - F33 [fait, Vrai] Le programme adopté par Les Écologistes en juillet 2026 prévoit, au niveau européen, une révision
    des traités garantissant le non-dépassement des limites planétaires et la construction d'un État social européen.
- id: A12
  question: Q47
  position: nuance
  enonce: L'annulation de dette auprès de la BCE n'est pas présentée comme une alternative aux recettes fiscales
