notes_du_verificateur:
  S1: 'Version consolidée 2016 du TFUE avec ses protocoles, en français (EUR-Lex). F45 : l''extrait figure mot pour
    mot à l''article 123 §1, et l''article 21.1 du protocole n° 4 dit la même chose ; aucun des deux textes ne parle
    d''annulation ni de conversion de titres déjà détenus, ce qui confirme la seconde moitié de F45 sur la lettre
    du texte (la jurisprudence de la CJUE n''est pas dans cette source). Aucune personne citée, donc pas d''appartenance
    partisane en jeu.'
  S10: 'Bon document : rapport d''information de la commission des finances du Sénat, rapporteur Albéric de Montgolfier,
    examiné et déposé le 24 septembre 2025 (date précisable : 2025-09-24). F16 : l''extrait figure mot pour mot,
    au conditionnel (« détiendrait »), dans la partie qui commente la structure de détention au premier trimestre
    2025 ; même sens. F17 : le chiffre de 24,4 % figure dans le tableau « Autres français (dont la Banque de France
    pour le compte de la BCE) », titres de la dette négociable de l''État au premier trimestre 2025 en valeur de
    marché ; même périmètre.'
  S16: 'Bon document (MoneyVox avec AFP, publié le 24 août 2026 à 10h00), les trois extraits y figurent mot pour
    mot. F25 : même chose (10 ans, 4,11 % le lundi 24 août, plus de 4,14 % le jeudi, record depuis 2008), mais c''est
    une valeur de la matinée. F26 et F27 sont seulement l''avis attribué à Roland Lescure (BFMTV/RMC) : la source
    montre qu''il l''a dit, sans établir l''effet sur les taux ni l''illégalité. Partis : Roland Lescure est seulement
    présenté comme « ministre de l''Economie » ; son appartenance à Renaissance (porte_par) n''est PAS établie par
    cette source, et Jean-Luc Mélenchon y est désigné comme candidat, sans parti.'
  S20: 'L''adresse Sud Radio renvoie toujours 404 (essai refait, ainsi que la reprise Boursedirect, 404 aussi).
    J''ai ouvert la même dépêche AFP, publiée le 24 août 2026, à https://www.lagazettefrance.fr/article/annuler-une-partie-de-la-dette-la-proposition-de-melenchon-sous-le-feu-des-critiques
    : il faudrait remplacer l''adresse au dossier. Elle dit que « Gabriel Attal a dénoncé mi-août un discours "délirant"
    », sans citer son parti : son appartenance à Renaissance n''est PAS établie par cette source.'
  S22: 'Bon document : Public Sénat, article signé Guillaume Jacquot, publié le 12/10/2026. F29 : l''extrait figure
    mot pour mot (« un effort « inédit » de 197 milliards d''euros sur cinq ans, dont 56 milliards d''euros d''allègement
    de la fiscalité… ») et dit la même chose que l''énoncé, présentation du plan « ce 12 octobre » comprise ; F30
    : l''extrait figure mot pour mot dans le chapeau et dit la même chose. L''appartenance est établie par la source
    (« Le candidat des Républicains », « candidat LR »).'
  S23: 'Bon document : chronique de Jérôme Gleizes, Politis, 14 septembre 2026, rubrique « L''économie à contre-courant
    ». F31 : l''extrait figure (« dont environ 640 milliards de titres publics français », rapporté au bilan de
    l''Eurosystème de 6 000 milliards « en 2026 ») mais c''est le chiffre d''un chroniqueur, sans source citée,
    qui ne suffit pas à établir un fait ; F32 : l''extrait figure, mais le rapport Draghi (ouvert, voir sources_ajoutees)
    dit « un minimum de 750 à 800 milliards » par an, et non 800. La page ne mentionne ni EELV ni Les Écologistes
    : l''appartenance partisane de Jérôme Gleizes n''est pas établie par cette source.'
  S24: 'Bon document : FranceTransactions.com (avec AFP), publié le lundi 15 juin 2020 ; la date des métadonnées
    (jour de consultation) est sans valeur. F34 : l''extrait figure (« les Verts souhaitent une annulation de la
    dette française auprès de laBCE , une fiscalité "plus juste" avec notamment le rétablissement de l''ISF ») et
    dit la même chose que l''énoncé, plan de « reconstruction écologique » compris. L''appartenance est établie
    par la source (« projet de société d''EELV », porte-parole du parti Eva Sas).'
  S25: 'Bon document : revue de presse du site officiel des Écologistes ; date absente des métadonnées, mais les
    articles repris sont datés du 04/09 et 05/09 (contexte Bayrou), cohérent avec septembre 2025. F35 et F36 : les
    deux extraits figurent mot pour mot ; F36 « plus progressive que celle du gouvernement » correspond à « ils
    proposent de réduire plus progressivement le déficit », formulé par rapport à François Bayrou ; il s''agit d''un
    extrait de presse reproduit par le parti, le titre du média d''origine n''apparaissant que partiellement. L''appartenance
    est établie (site lesecologistes.fr, « les écologistes »).'
  S26: 'Bon document : page de la commission Économie, social, services publics des Écologistes, « Publié le 26
    oct. 2026 ». F33 : l''extrait figure mot pour mot avec la référence (ch. 60, mesure 3, p. 190), et la page indique
    « Le programme adopté en juillet 2026 » ; c''est un résumé de commission qui renvoie au programme (PDF lesecologistes.fr),
    lui-même non ouvert ici. L''appartenance est établie (site et commission du parti).'
  S27: 'Bon document : Public Sénat, 20 juin 2024, titre exact ; la citation « Il y a de la bonne et de la mauvaise
    dette » attribuée à Marine Tondelier figure dans le titre. Aucune affirmation du lot à contrôler. L''appartenance
    est établie par la source (« la cheffe de file des écologistes Marine Tondelier »).'
  S29: 'Bon document (titre et date du 24 août 2026 conformes ; l''adresse redirige vers une version longue de l''URL),
    page signalée « analyse assistée par IA ». F41 : l''extrait figure mot pour mot, mais il rapporte un argument
    de Jordan Bardella publié sur X (« Il a argué que… »), sans établir le mécanisme, et ne mentionne pas l''impôt
    ; un site de niveau 4 ne peut fonder cette estimation. Appartenance établie : la page présente Jordan Bardella
    comme « président du Rassemblement national ».'
  S30: 'Bon document : dépêche AFP reprise par La Gazette France, publiée le 24 août 2026, titre conforme ; aucune
    affirmation à contrôler. Appartenance : la dépêche nomme La France insoumise (LFI) à propos des universités
    d''été où Matthieu Pigasse était invité, sans dire en toutes lettres, dans les passages lus, que Jean-Luc Mélenchon
    dirige LFI.'
  S31: 'Bon document : Public Sénat, Stéphane Duguet, 6 octobre 2026. F37 : 140 milliards d''économies d''ici 2032
    et l''extrait « de 121 % en 2027 à 112 % en 2032 » figurent mot pour mot ; F38 : l''extrait sur l''immigration
    (15 milliards en 2027, 29 milliards en année pleine) figure mot pour mot ; les deux disent la même chose, présentés
    lors de la conférence de presse du 6 octobre 2026 au siège du parti. Appartenance établie : Marine Le Pen est
    présentée comme « candidate du Rassemblement national », et le plan comme « présenté par le RN ».'
  S32: 'Bon document : LCP, Maxence Kagni, vendredi 2 octobre 2026 (date lue dans la signature, absente des métadonnées).
    F39 : l''extrait figure mot pour mot ; l''article précise aussi qu''elle propose d''inscrire la règle d''or
    « dans la Constitution » par référendum, en fixant « un déficit maximum », d''après sa tribune dans L''Opinion
    du 1er octobre 2026 : même périmètre que l''affirmation. Appartenance établie : « La candidate du Rassemblement
    national à l''élection présidentielle ».'
  S33: 'Bon document : dépêche AFP reprise par La Gazette France, 5 septembre 2026. F40 : l''extrait figure mot
    pour mot ; la formule « met fin à la primauté du droit européen » est la description de l''AFP, le texte officiel
    (n° 2120 du 25 janvier 2024, ajouté en source) parlant de « supériorité de la Constitution sur toute autre norme,
    même internationale » : même sens, autre formulation. Appartenance établie : « La candidate RN à l''élection
    présidentielle ».'
  S35: 'Bon document : brochure de Lutte ouvrière pour la candidature de Nathalie Arthaud à la présidentielle 2027
    ; le PDF ne porte pas de date en métadonnées, mais son adresse (2026/06) et sa mention de la fête de mai 2026
    concordent avec juin 2026. F42 : l''extrait figure mot pour mot ; la source dit « aux capitalistes privés »
    là où l''affirmation dit « entreprises privées », et elle établit seulement que LO cite ce chiffre, pas son
    exactitude (niveau 3). Appartenance établie : la brochure est signée de Nathalie Arthaud, sous le sigle LO.'
  S36: 'Bon document : hebdomadaire Lutte ouvrière n° 3031 du 4 septembre 2026 (numéro et date imprimés dans le
    PDF). Aucune affirmation à contrôler : la source sert seulement de lieu consulté (sans_position) ; elle contient
    une prise de position générale (« la dette est celle de la bourgeoisie et que c''est à elle de payer »). L''appartenance
    à Lutte ouvrière est établie (journal du parti, soutien à la campagne de Nathalie Arthaud).'
  S37: 'Bon document : tract du NPA (adresse npa2009.org imprimée) sur la dette ; la date exacte du 2011-12-01 n''est
    pas imprimée, mais le contenu (gouvernement Fillon, « octobre 2011 », candidat socialiste « pour 2012 ») situe
    le tract fin 2011, sans confirmer le jour. F43 (valeur) : l''extrait figure (« Pour le NPA, la réponse est claire,
    une dette construite par les cadeaux faits aux plus riches et aux grandes entreprises est illégitime et n''a
    pas à être payée ») et dit la même chose que l''énoncé (le mot « fiscaux » de l''énoncé est repris d''autres
    passages du tract). L''appartenance au NPA est établie par la source (« Pour le NPA »).'
  S39: 'Bon document : proposition de résolution n° 2914, enregistrée le 11 mai 2020, présentée par Jean-Luc Mélenchon
    et 16 autres députés. F50 : l''extrait figure mot pour mot dans les considérants ; il établit que c''est l''objectif
    déclaré par les auteurs, pas un effet constaté. F56 (valeur) : l''extrait figure et dit la même chose que l''énoncé.
    Appartenance partisane : le PDF liste les noms des signataires sans mentionner le groupe La France insoumise
    ; le rattachement à LFI n''est pas établi par cette source.'
  S41: 'Bon document : compte rendu intégral, 2e séance du lundi 22 mars 2021, débat « La dette publique : la payer
    ou l''annuler ? » à l''initiative du groupe GDR. Les quatre extraits (F49 « dégager immédiatement des marges
    financières très importantes », F51, F52, F55) figurent dans l''intervention de Fabien Roussel et disent la
    même chose que les énoncés ; pour F49 (estimation), c''est l''appréciation d''un orateur, sans chiffrage ni
    méthode, et non une estimation d''institution. Appartenance : la source établit « M. Fabien Roussel (GDR) »
    et qu''il parle au nom des « députés communistes » ; le sigle PCF n''y figure pas en toutes lettres.'
  S42: 'Bon document : billet du blog de la BCE du 29 avril 2025, par Imène Rahmouni-Rousseau et Isabel Schnabel
    (texte en anglais, « Pas disponible en français » sur l''adresse .fr). F48 : l''extrait figure (« At the end
    of 2024 [...] reinvestments under the pandemic emergency purchase programme (PEPP) came to an end ») et dit
    la même chose que l''énoncé, même programme et même date. Source officielle, sans personne partisane citée.'
  S43: 'Bon document : copie PDF (hébergée par EconomiX) de la tribune collective du Monde au titre annoncé ; la
    date du 2021-02-05 n''apparaît pas dans le PDF (« Publié aujourd''hui »), elle n''est donc pas confirmée par
    cette copie. F57, F58, F59, F60 : les quatre extraits figurent mot pour mot et disent la même chose que les
    énoncés (F58 est bien la position des signataires, présentée comme reconnue par « un très grand nombre d''économistes
    », pas une démonstration ; F57 reprend aussi la phrase sur le mot « annulation » absent du traité et du protocole
    SEBC). Appartenance partisane : la source présente Aurore Lalucq comme « (Parlement européen) » seulement ;
    son rattachement à Place publique n''est pas établi par cette source.'
