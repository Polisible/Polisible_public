  - id: A15
    auteur: expert-extreme-droite
    question: Q46
    position: nuance
    enonce: Le RN veut que les choix budgétaires relèvent du peuple français, par la primauté du droit national
      et une règle d'or adoptée par référendum, mais la règle qu'il propose est un plafond de déficit, pas l'annulation
      unilatérale d'engagements.
    raisonnement: 'Selon Marine Le Pen, la règle d''or sert à éviter « la mise sous tutelle de la France » : la
      contrainte budgétaire est choisie par les Français plutôt qu''imposée de l''extérieur par les créanciers ou
      par des règles européennes. La proposition de loi constitutionnelle de 2024 affirme en parallèle la primauté
      du droit national sur le droit européen. Ces deux textes situent la décision au niveau national, avec une
      discipline budgétaire, sans affirmer que l''État puisse ne pas honorer sa dette.'
    porte_par:
    - qui: Marine Le Pen, présidente du groupe RN à l'Assemblée nationale et candidate à la présidentielle 2027
      parti: RN
      source: S32
    - qui: Marine Le Pen, proposition de loi constitutionnelle de 2024
      parti: RN
      source: S33
    repond_a: null
    statut: ouvert
    affirmations:
    - id: F39
      enonce: Marine Le Pen propose d'inscrire une règle d'or budgétaire dans la Constitution par référendum, pour
        limiter le déficit public.
      type: fait
      verdict: Vrai
      explication: 'Déclaration vérifiée : LCP (Maxence Kagni, 2 octobre 2026), d''après une tribune de Marine Le
        Pen dans L''Opinion du 1er octobre 2026, rapporte qu''elle veut inscrire une règle d''or budgétaire fixant
        un déficit maximum dans la Constitution, par référendum.'
      sources:
      - source: S32
        extrait: veut instaurer une "règle d'or budgétaire" qu'elle proposera aux Français d'approuver par référendum,
          si elle est élue à l'Élysée.
        statut_source: conforme
    - id: F40
      enonce: La proposition de loi constitutionnelle déposée par Marine Le Pen en 2024 met fin à la primauté du
        droit européen sur le droit national.
      type: fait
      verdict: Plutôt vrai
      explication: 'La proposition de loi constitutionnelle n° 2120 du 25 janvier 2024 (Assemblée nationale) vise
        à poser « la supériorité de la Constitution sur toute autre norme, même internationale ». La formule « met
        fin à la primauté du droit européen » est la description qu''en fait l''AFP (5 septembre 2026), pas le texte
        lui-même : le sens est proche, la formulation est une interprétation.'
      sources:
      - source: S33
        extrait: met fin à "la primauté" du droit européen sur le droit national, à la base de la construction européenne...
        statut_source: conforme
      - source: S45
        extrait: de poser solennellement le principe de supériorité de la Constitution sur toute autre norme, même
          internationale
        statut_source: conforme
  - id: A28
    auteur: expert-gauche-radicale
    question: Q46
    position: nuance
    enonce: Les règles européennes qui encadrent le financement des États et le statut de la BCE doivent être remises
      en cause, la France exigeant leur changement, plutôt que d'enfermer la politique de la dette dans les traités.
    raisonnement: Les traités obligent les États à emprunter auprès des marchés plutôt qu'auprès de leur banque
      centrale (F1, F2) ; leurs auteurs les jugent un carcan qui prive les peuples de la maîtrise de leur endettement
      (F56). La résolution de 2020 invite le gouvernement à exiger de l'Union européenne un changement, ce qui place
      la décision sous contrôle politique démocratique plutôt que sous règles fixées par des institutions indépendantes.
    porte_par:
    - qui: Jean-Luc Mélenchon et les députés LFI signataires de la proposition de résolution n° 2914 (11 mai 2020)
      parti: LFI
      source: S39
    - qui: Jean-Luc Mélenchon, livret Dette (6 juin 2022)
      parti: LFI
      source: S40
    repond_a: null
    statut: ouvert
