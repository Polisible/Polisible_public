  question: Q46
  position: non
  enonce: "Un État seul ne peut pas annuler : la décision appartient au conseil des gouverneurs de la BCE, qui n'accepte pas d'instructions des gouvernements. Elle passe par un accord entre les États européens et la BCE, non par une décision nationale."
