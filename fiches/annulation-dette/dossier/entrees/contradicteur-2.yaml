# Contrôle final de la commission (docs/commission.md § 6.1), sur le lot commission-contradicteur.yaml.
# 1. Contestations du premier contre-examen : toutes acceptées par le rapporteur (decision_rapporteur: acceptee) ;
#    aucune n'est à maintenir. Leur mise en œuvre est vérifiée ci-dessous pour les thèses issues de la révision.
# 2. Thèses modifiées depuis (révision et second tour : T2, T6, T7, T8, T10, T13, T14, T21, T22, T24, T25, T31 à T37)
#    et points soumis par le rapporteur (T10/T14, T25/T36, Q44).
# 3. Réponses aux questions (these: Q4x, critere: conclusion).
# Règle de symétrie appliquée : une thèse conditionnelle (« si la voie est X, alors… ») classée oui ou non reçoit
# la même appréciation dans les deux sens ; un présupposé central non porté par une affirmation vérifiée donne le
# même appui, quel que soit le camp.
# Aucune contestation d'expert à trancher.
contre_examen:
# ------------------------------------------------------------------ Q41
- these: T2
  critere: conclusion
  avis: confirme
  justification: "Examen confirmé après R27 : objections « sans réponse », l'expert concédant que F24 et F44 établissent la régularité de l'achat, non l'interdiction du traitement ultérieur (A46) ; lacune essentielle symétrique de T1 et T3 (F45, F27)."
# ------------------------------------------------------------------ Q42
- these: T6
  critere: appui
  avis: conteste
  justification: "L'énoncé conclut sur l'effet sur les taux (« l'effet dépend de la voie »). F3, F5 et F60 (Vrai) établissent la voie juridique, non une réaction différente des prêteurs ; F26 n'établit que l'absence de chiffrage. T32, de même structure pour la crédibilité (le mécanisme vaut pour une décision imposée, pas pour une décision du conseil, F3, F5), reçoit « faible » parce que l'effet n'est porté par aucune estimation (réponse à R13). Même lacune, appréciation plus favorable ; la réponse à R6 concède d'ailleurs qu'un doute (F9) peut subsister dans la voie du conseil."
  proposition: "appui : partiel — la voie de décision (F3, F5, F60, Vrai) et l'absence de chiffrage (F26) sont établies ; que l'effet sur les taux diffère selon la voie n'est porté par aucune estimation (F26), A47 corrigé admettant qu'un doute sur le financement monétaire peut subsister (F9, réponse à R6)."
- these: T6
  critere: raisonnement
  avis: conteste
  justification: "La portée retenue (« le mécanisme de rupture unilatérale ne s'applique pas » à une décision du conseil, F3, F5, F60) est plus étroite que l'énoncé (« l'effet sur les taux dépend de la voie »). Passer de l'un à l'autre suppose que les prêteurs ne réagissent qu'à une rupture unilatérale : cause supposée, que A51 et la réponse à R6 contestent (F9, F11, F13). C'est la lacune limitée confirmée au premier contre-examen ; la correction de A47 ne l'a pas levée, l'énoncé de T6 étant resté le même."
  proposition: "raisonnement : lacune, essentielle: false — Cause supposée : de ce qu'une décision du conseil n'est pas une rupture unilatérale (F3, F5, F60), la thèse tire que l'effet sur les taux dépend de la voie, alors que A47 corrigé admet qu'un doute sur le financement monétaire peut subsister (F9) ; la partie « personne ne chiffre l'effet » est établie (F26)."
- these: T6
  critere: conclusion
  avis: conteste
  justification: "Conséquence de T6/appui et T6/raisonnement (§ 3). Sans cette correction, Q42 compte une seule thèse qui « tient », sur une affirmation d'effet qu'aucune estimation ne porte (F26), alors que T32, de même structure sur Q44, « ne tient pas »."
  proposition: tient en partie
# ------------------------------------------------------------------ Q43
- these: T7
  critere: conclusion
  avis: confirme
  justification: "Examen confirmé après séparation de A13 : appui faible (F41, F49 seuls portent la réponse « non »), lacune essentielle symétrique de T9, portée reformulée (« rend plausible », F41, O1)."
- these: T31
  critere: conclusion
  avis: confirme
  justification: "Examen confirmé : appui partiel comme T8 (F19, F20 établis, F41 rendu plausible par O1) ; lacune limitée au raisonnement de A13 (« d'autant », « faible ou nul »), l'énoncé corrigé (réponse à R7) s'en tenant à « moins que le montant brut »."
- these: T8
  critere: conclusion
  avis: confirme
  justification: "Examen confirmé après R30 : appui partiel (F41, sans source isolant la part des intérêts), raisonnement valide (F48, F19, F21), même appréciation que T31 et T24."
# ------------------------------------------------------------------ Q44 (point soumis : T10/T14)
- these: T10
  critere: regroupement
  avis: conteste
  justification: "Depuis la correction de A3 (réponse à R29), A3 et A52 (T14) ont la même conclusion par le même raisonnement : une opération imposée par une loi nationale serait une instruction interdite (F3, F4), une décision libre du conseil des gouverneurs non (F5). Les énoncés de T10 et T14 disent la même chose. § 2 : même conclusion et même raisonnement font une seule thèse ; la séparation produit deux positions (oui, nuance) pour un raisonnement unique, et la réponse à Q44 compte une thèse « oui » qui tient."
  proposition: "Rattacher A3 à T14 (position nuance, énoncé inchangé, portée par RE) et supprimer T10. Examen de T14 inchangé (appui solide, raisonnement valide, tient)."
- these: T10
  critere: raisonnement
  avis: conteste
  justification: "À titre subsidiaire, si T10 reste une thèse « oui » : la réponse « oui » (l'opération affaiblirait l'indépendance) suppose que la proposition suive la voie d'une loi nationale, ce qu'aucune source n'établit (réponses à R9 et R29). C'est exactement la lacune retenue pour T12 (« ne dit pas que la proposition suit cette voie », essentielle: false), dans l'autre sens ; T10 reçoit « valide ». Même lacune, appréciation plus favorable."
  proposition: "raisonnement : lacune, essentielle: false — De F3 et F4 découle qu'une opération imposée par une loi nationale serait une instruction interdite, et de F5 qu'une décision libre n'en serait pas une ; la réponse « oui » suppose que la proposition suive la première voie, ce qu'aucune source n'établit (réponses à R9, R29), comme T12 pour la seconde."
- these: T10
  critere: conclusion
  avis: conteste
  justification: "Conséquence de T10/regroupement (thèse supprimée) ou, à défaut, de T10/raisonnement : une lacune limitée donne « tient en partie » (§ 3), comme T12 et T13, conditionnelles en sens inverse."
  proposition: "T10 supprimée (A3 dans T14) ; à défaut, tient en partie."
- these: T13
  critere: raisonnement
  avis: conteste
  justification: "T13 (non) conclut qu'un effacement décidé par le conseil n'atteint pas l'indépendance (F3, F5), sans établir que la proposition suit cette voie ; sa portée le relève (« ni que la proposition de 2026 suive cette voie »). T12, même raisonnement conditionnel et même position, reçoit pour ce motif une lacune (essentielle: false, réponse à R11) ; T13 reçoit « valide ». La règle doit être la même pour T10, T12 et T13."
  proposition: "raisonnement : lacune, essentielle: false — La distinction entre décision du conseil et instruction (F3, F5) est valide, mais la réponse « non » suppose que la proposition suive cette voie, ce qu'aucune source n'établit (portée ; réponses à R9, R11, R29). Conclusion inchangée (tient en partie, appui partiel)."
- these: T12
  critere: conclusion
  avis: confirme
  justification: "Examen confirmé : la lacune limitée (voie de la proposition non établie, F4, réponse à R11) est l'appréciation juste pour une thèse conditionnelle classée non ; elle doit valoir aussi pour T10 et T13 (voir ces thèses)."
- these: T14
  critere: conclusion
  avis: confirme
  justification: "Examen confirmé : T14, réduite à A52, conclut seulement que l'atteinte dépend de la voie (F3, F4, F5), position nuance, sans lacune ; A3 corrigé peut la rejoindre (voir T10/regroupement)."
- these: T32
  critere: conclusion
  avis: confirme
  justification: "Examen confirmé : appui faible et lacune essentielle symétriques de T11 (effet sur la crédibilité porté par aucune estimation, F27), objection T11 (A53) sans réponse. T32 sert de terme de comparaison pour T6 (Q42)."
