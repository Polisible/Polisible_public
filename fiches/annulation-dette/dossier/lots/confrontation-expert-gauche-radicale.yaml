  auteur: ecologistes
  question: Q47
  position: nuance
  enonce: L'annulation n'est pas présentée comme une alternative aux recettes et à l'investissement, mais comme
    un levier à combiner avec eux. Le parti a financé son plan de 2020 par l'annulation de dette auprès de la BCE
    et par une fiscalité plus juste, et son plan de 2025 repose sur des recettes fiscales et un rythme de réduction
    du déficit plus progressif.
  raisonnement: 'Le parti ne classe pas les leviers : en 2020 il associait annulation de la dette auprès de la BCE
    et rétablissement de l''ISF (F34) ; en 2025 il proposait 28,5 milliards d''euros de recettes fiscales (F35)
    et un retour à 3,7 % de déficit en 2030, plus lent que celui du gouvernement (F36). Le critère est l''usage
    de la dette et de la marge dégagée : « bonne » dette quand elle finance le climat et la justice sociale, « mauvaise
    » dette sinon, selon la formule de sa secrétaire nationale.'
  porte_par: Les Verts (EELV), plan de reconstruction écologique de juin 2020 (Les Écologistes, S24); Les Écologistes,
    plan de sortie de crise présenté le 4 septembre 2025 (Les Écologistes, S25); Marine Tondelier, secrétaire nationale,
    déclaration du 20 juin 2024 (Les Écologistes, S27)
  repond_a: null
  affirmations:
  - F34 [fait, Vrai] En juin 2020, le parti Les Verts (EELV) a présenté un plan de reconstruction écologique financé
    par une annulation de la dette française auprès de la BCE et par une fiscalité plus juste, dont le rétablissement
    de l'ISF. (sources S24)
  - F35 [fait, Vrai] Le plan présenté par Les Écologistes en septembre 2025 comprenait 28,5 milliards d'euros de
    recettes fiscales, notamment par la taxe Zucman et une contribution exceptionnelle sur les grandes entreprises.
    (sources S25)
  - F36 [fait, Vrai] Le plan présenté par Les Écologistes en septembre 2025 prévoyait de ramener le déficit public
    à 3,7 % du PIB en 2030, soit une réduction plus progressive que celle du gouvernement de l'époque. (sources
    S25)
