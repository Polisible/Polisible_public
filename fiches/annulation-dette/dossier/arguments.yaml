- id: A5
  question: Q46
  position: non
  enonce: Dans une union monétaire, la dette en euros et la banque centrale sont des biens communs. Décider seul
    sur des titres détenus par l'Eurosystème reviendrait à s'affranchir des règles communes, contraires en ce cas
    aux traités.
  porte_par:
  - personne: Roland Lescure
    fonction: ministre de l'Économie
    parti: RE
    date: '2026-08-24'
    source: S16
    appartenance: S49
  affirmations:
  - F3
  - F4
  - F27
  raisonnement: 'L''État a lui-même accepté les traités : il doit veiller à la compatibilité de sa législation avec
    eux (F4) et ne peut pas donner d''instructions à la banque centrale (F3). Une décision nationale unilatérale
    sur des titres détenus par l''Eurosystème engagerait les autres membres, qui supportent leur part du bilan commun.
    S''en affranchir sur ce sujet, c''est dire qu''on ne respecte plus les règles communes (F27).'
  repond_a: null
  auteur: expert-centre
  passage: 1
  statut: ouvert
  versions:
  - passage: 4
    enonce: Non, selon Renaissance. Dans une union monétaire, la dette en euros et la banque centrale sont des biens
      communs ; les règles européennes limitent la décision nationale, et décider seul sur des titres détenus par
      l'Eurosystème reviendrait à s'affranchir des règles communes, ce que le gouvernement juge contraire aux traités
      (interprétation contestée par les signataires de la tribune de 2021).
    position: non
    porte_par:
    - parti: RE
      source: S16
      personne_ou_groupe_ancien: Roland Lescure, ministre de l'Économie (déclaration du 24 août 2026, BFMTV/RMC)
  corrige: true
