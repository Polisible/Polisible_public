objections:
  - id: O1
    statut: resolue
    resolution: "Objection non fondée sur son point central : S9 (Bulletin de la Banque de France n° 260/6, 2025) indique que, si les revenus et risques des titres supranationaux, d'entreprises et obligations sécurisées achetés après 2014 sont partagés, « ils ne le sont pas pour les titres d'État acquis depuis 2015 » ; seule une part forfaitaire, rémunérée au taux de référence, est mutualisée lorsque ces actifs sont financés par des passifs partagés. Le partage du revenu monétaire ne permet donc pas d'écarter l'idée que les intérêts sur les titres d'État détenus restent pour l'essentiel à la Banque de France, mais il nuance un effet « à due concurrence » ; F41 n'affirme d'ailleurs pas cet effet intégral. Le verdict de F41 (Pas d'estimation fiable) est inchangé, faute de source conforme isolant la part de ces intérêts dans le résultat."
incertitudes:
  - "Le texte de S9 est extrait d'un PDF en colonnes entremêlées ; la phrase citée a été reconstituée à partir des passages 5 à 7, sans garantie d'exactitude au mot près."
  - "L'effet net sur le résultat dépend aussi du coût de financement (rémunération des réserves), que S9 ne chiffre pas pour les titres d'État."
