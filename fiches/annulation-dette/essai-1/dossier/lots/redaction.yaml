  - id: V2
    question: Q1
    auteur: expert-ecologistes
    enonce: Priorité à la capacité des pouvoirs publics de financer la transition écologique sans dépendre des marchés
      financiers, ce qui conduit à contester que les traités et l'indépendance de la banque centrale soient des
      limites intangibles.
    passage: 1
  - id: V3
    question: Q1
    auteur: expert-extreme-droite
    enonce: La famille met en avant la souveraineté nationale et le rejet d'une dette effacée au détriment de la
      crédibilité financière de l'État ; aucun texte consulté ne tranche la question de la légalité elle-même.
    passage: 1
  - id: V4
    question: Q1
    auteur: expert-gauche-radicale
    enonce: La gauche radicale met en priorité la capacité de la puissance publique à dépenser pour l'investissement
      social et écologique, et considère que la dette détenue par la banque centrale est une dette que la collectivité
