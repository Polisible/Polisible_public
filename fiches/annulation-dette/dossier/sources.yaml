  auteur: Union européenne (EUR-Lex)
  date: '2016'
  adresse: https://eur-lex.europa.eu/legal-content/FR/TXT/?uri=CELEX:12016E/TXT
  niveau: 1
  ajoutee_par: bibliothecaire
  statut: conforme
  note_verif: 'Version consolidée 2016 du TFUE avec ses protocoles, en français (EUR-Lex). F45 : l''extrait figure
    mot pour mot à l''article 123 §1, et l''article 21.1 du protocole n° 4 dit la même chose ; aucun des deux textes
    ne parle d''annulation ni de conversion de titres déjà détenus, ce qui confirme la seconde moitié de F45 sur
    la lettre du texte (la jurisprudence de la CJUE n''est pas dans cette source). Aucune personne citée, donc pas
    d''appartenance partisane en jeu.'
