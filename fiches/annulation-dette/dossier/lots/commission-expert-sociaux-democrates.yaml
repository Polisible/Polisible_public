questions:
- Q41 (fait) Les traités européens permettent-ils d'annuler, ou de convertir en dette perpétuelle à taux nul, la
  dette française détenue par la Banque de France pour l'Eurosystème ?
- Q42 (estimation) Annuler ou geler cette dette ferait-il monter les taux auxquels la France emprunte ?
- Q43 (estimation) L'opération réduirait-elle durablement la charge d'intérêts de l'État, compte tenu des intérêts
  que la Banque de France reverse à l'État ?
- Q44 (estimation) Annuler ou geler cette dette affaiblirait-il la crédibilité de l'euro ou l'indépendance de la
  BCE ?
- Q45 (valeur) Un État doit-il rembourser intégralement sa dette, y compris quand le créancier est sa propre banque
  centrale ?
- Q46 (valeur) Les décisions sur la dette publique doivent-elles relever de la seule décision nationale plutôt que
  des règles européennes ?
- Q47 (valeur) Pour dégager des marges budgétaires, l'annulation d'une partie de la dette est-elle préférable aux
  économies, à la hausse des recettes ou à la recherche de croissance ?
tes_arguments:
- id: A32
  question: Q41
  position: oui
  enonce: 'Aucune disposition des traités ne mentionne l''annulation : l''article 123 interdit le crédit et l''achat
    direct de titres aux États, non l''abandon d''une créance déjà inscrite au bilan. La décision relèverait du
    conseil des gouverneurs de la BCE.'
  raisonnement: 'Le traité interdit deux actes précis (F1, F2) ; l''annulation d''une créance acquise sur le marché
    secondaire n''en est pas un, et le conseil des gouverneurs décide (F5). Ce silence n''établit pas l''autorisation
    (F27) : aucun avis d''institution ne traite ce cas. La proposition de 2021 passait par un contrat avec la BCE
    (F60), non par une décision d''un gouvernement.'
  repond_a: null
  partis:
  - PP
  affirmations:
  - F57 [fait, Vrai] Les traités européens n'interdisent pas explicitement l'annulation de dettes publiques détenues
    par la BCE (le mot « annulation » ne figure ni dans le traité ni dans le protocole sur le SEBC).
  - F1 [fait, Vrai] Le traité interdit à la BCE et aux banques centrales nationales d'accorder des découverts ou
    crédits aux administrations publiques (Q41).
  - F2 [fait, Vrai] Le traité interdit l'acquisition directe, auprès des États, de leurs titres de dette par la
    BCE ou les banques centrales nationales (Q41).
  - F5 [fait, Vrai] Le conseil des gouverneurs de la BCE arrête les orientations et prend les décisions nécessaires
    aux missions du SEBC (qui décide, Q41).
- id: A33
  question: Q44
  position: non
  enonce: La BCE affirme pouvoir remplir son mandat malgré des pertes (F58) ; si son conseil décide lui-même l'effacement,
    aucun gouvernement ne donne d'instruction (F3, F5). L'effet de fonds propres négatifs sur la crédibilité n'est
    pas établi.
  raisonnement: Le volet indépendance découle de F3 et F5 pour une décision du conseil. Le volet capacité d'action
    repose sur F58 (débat entre experts) ; un document des services de la BCE tient la perte de crédibilité pour
    possible en cas de pertes prolongées (f1). Ce volet n'est donc pas démontré.
  repond_a: null
  partis:
  - PP
  affirmations:
  - 'F58 [estimation, Débat entre experts] Une banque centrale peut fonctionner avec des fonds propres négatifs
    sans que sa capacité d''action en soit affectée. — Les signataires de la tribune de 2021 l''affirment sans démonstration.
    La BCE écrit, après ses pertes de 2024, qu''elle peut remplir son mandat « regardless of any losses » (communiqué
    du 20 février 2025), tout en soulignant que sa solidité repose sur 59 milliards de capital et de comptes de
    réévaluation : elle ne dit pas que des fonds propres durablement négatifs seraient sans effet. Aucune estimation
    chiffrée d''institution sur ce point n''est au dossier.'
  - F3 [fait, Vrai] Le traité dispose que ni la BCE, ni une banque centrale nationale, ni un membre de leurs organes
    de décision ne peuvent solliciter ni accepter d'instructions des gouvernements (Q41, Q44).
  - F5 [fait, Vrai] Le conseil des gouverneurs de la BCE arrête les orientations et prend les décisions nécessaires
    aux missions du SEBC (qui décide, Q41).
- id: A34
  question: Q45
  position: non
  enonce: 'Au premier trimestre 2025, la catégorie « autres français », dont la Banque de France pour le compte
    de la BCE, représente 24,4 % de la dette négociable de l''État. Rembourser la banque centrale oblige à trouver
    la somme ailleurs : nouvel emprunt, impôts ou baisse des dépenses.'
  raisonnement: La créance d'une banque centrale n'est pas celle d'un épargnant privé (F17). Rembourser oblige à
    réemprunter, à lever l'impôt ou à réduire la dépense ; l'effacement évite ces choix sans léser de créancier
    privé. La marge nette pour l'État n'est pas chiffrée, des intérêts lui revenant en partie (F41, F20).
  repond_a: null
  partis:
  - PP
  affirmations:
  - 'F16 [fait, Plutôt vrai] L''Eurosystème détient près d''un quart des OAT au titre de la politique monétaire
    (données du premier trimestre 2025, rapport du Sénat) (Q41). — Le rapport d''information de la commission des
    finances du Sénat (24 septembre 2025) écrit au conditionnel que l''Eurosystème « détiendrait » près d''un quart
    des OAT, en commentant la détention au premier trimestre 2025. Le chiffre sous-jacent (24,4 %) porte sur une
    catégorie « autres français » qui inclut la Banque de France pour le compte de la BCE mais n''est pas limitée
    à elle : l''ordre de grandeur est sourcé, la précision est moindre que ne le suggère l''énoncé.'
  - F17 [fait, Vrai] Au premier trimestre 2025, la catégorie « autres français », dont la Banque de France pour
    le compte de la BCE, représentait 24,4 % de la dette négociable de l'État (Q41).
- id: A35
  question: Q46
  position: non
  enonce: 'Un État seul ne peut pas annuler : la décision appartient à la BCE, qui n''accepte pas d''instructions
    des gouvernements. Elle se prend par un accord entre les États européens et la BCE, non par une décision nationale.'
  raisonnement: Le conseil des gouverneurs de la BCE décide (F5) et ni la BCE ni une banque centrale nationale ne
    peuvent accepter d'instructions d'un gouvernement (F3). Une décision nationale unilatérale n'a donc pas d'effet
    juridique sur la créance ; le texte de 2021 propose pour cette raison un contrat entre les États européens et
    la BCE (F60), assorti d'une exigence de gouvernance européenne.
  repond_a: null
  partis:
  - PP
  affirmations:
  - F3 [fait, Vrai] Le traité dispose que ni la BCE, ni une banque centrale nationale, ni un membre de leurs organes
    de décision ne peuvent solliciter ni accepter d'instructions des gouvernements (Q41, Q44).
  - F5 [fait, Vrai] Le conseil des gouverneurs de la BCE arrête les orientations et prend les décisions nécessaires
    aux missions du SEBC (qui décide, Q41).
  - F60 [fait, Vrai] Le texte de 2021 propose un contrat entre les États européens et la BCE, et non une décision
    prise par un seul État.
- id: A36
  question: Q47
  position: nuance
  enonce: 'L''effacement ne se substitue aux autres leviers que s''il est conditionné : les États s''engagent à
    investir les montants effacés. La marge nette qu''il dégagerait n''est pas chiffrée.'
  raisonnement: 'Rembourser exige de réemprunter, de relever les impôts ou de réduire les dépenses (F17). Le texte
    de 2021 fait de l''effacement un échange : le même montant est investi dans la reconstruction écologique et
    sociale (F59). La marge nette n''est pas établie (F41, F20) : l''effacement n''est pas présenté comme préférable
    en soi.'
  repond_a: null
  partis:
  - PP
  affirmations:
  - F59 [fait, Vrai] Le texte de 2021 propose que la BCE efface ses créances sur les États (ou les convertisse en
    dettes perpétuelles sans intérêt) en échange de l'engagement des États d'investir les mêmes montants dans la
    reconstruction écologique et sociale.
  - F17 [fait, Vrai] Au premier trimestre 2025, la catégorie « autres français », dont la Banque de France pour
    le compte de la BCE, représentait 24,4 % de la dette négociable de l'État (Q41).
- id: A46
  question: Q41
  position: oui
  enonce: L'article 123 vise deux actes précis, le crédit direct et l'achat direct. Que l'effacement d'une créance
    acquise sur le marché secondaire soit un financement interdit est une interprétation, non une conséquence du
    texte.
  raisonnement: Déduire l'interdiction de ce que les titres ont été achetés à des investisseurs (F24) établit que
    l'achat initial était régulier, pas que le traitement ultérieur du titre est interdit. Le traité ne mentionne
    pas ce cas (F57) et F27 reste invérifiable ; l'« avantage après coup » est une lecture que la Cour n'a pas validée.
  repond_a: A1
  partis:
  - PP
  affirmations:
  - F24 [fait, Vrai] Les titres de dette française détenus par l'Eurosystème ont été achetés sur le marché secondaire,
    auprès d'institutions financières, et non directement auprès de l'État.
  - F57 [fait, Vrai] Les traités européens n'interdisent pas explicitement l'annulation de dettes publiques détenues
    par la BCE (le mot « annulation » ne figure ni dans le traité ni dans le protocole sur le SEBC).
  - 'F27 [fait, Invérifiable] L''annulation ou la conversion en dette perpétuelle à taux nul de titres achetés par
    l''Eurosystème est contraire aux traités européens. — Aucun texte ne mentionne l''annulation ou la conversion
    de titres déjà détenus (F45) et aucune décision de la CJUE n''a tranché ce cas. La contrariété aux traités est
    affirmée par Roland Lescure (AFP, 24 août 2026) et par Christine Lagarde (F11, F13, F14) ; les signataires de
    la tribune de 2021 soutiennent le contraire (F57) : c''est une interprétation juridique disputée, pas un fait
    établi.'
- id: A47
  question: Q42
  position: nuance
  enonce: Une proposition passant par une décision du conseil des gouverneurs et un contrat avec les États n'est
    pas une opération unilatérale. Le signal de rupture unilatérale ne s'y applique pas, et personne ne chiffre
    l'ampleur de l'effet sur les taux.
  raisonnement: La prime de risque tient à un État qui « change les règles » seul. Si la BCE décide (F5, F60), sans
    instruction d'un gouvernement (F3), cette prémisse manque. Un doute sur le financement monétaire (F9) peut subsister
    ; aucune estimation n'existe dans un sens ou l'autre (F26).
  repond_a: A2
  partis:
  - PP
  affirmations:
  - F3 [fait, Vrai] Le traité dispose que ni la BCE, ni une banque centrale nationale, ni un membre de leurs organes
    de décision ne peuvent solliciter ni accepter d'instructions des gouvernements (Q41, Q44).
  - F5 [fait, Vrai] Le conseil des gouverneurs de la BCE arrête les orientations et prend les décisions nécessaires
    aux missions du SEBC (qui décide, Q41).
  - F60 [fait, Vrai] Le texte de 2021 propose un contrat entre les États européens et la BCE, et non une décision
    prise par un seul État.
  - F26 [estimation, Pas d'estimation fiable] Une annulation unilatérale d'une partie de la dette publique ferait
    monter les taux auxquels la France emprunte, car les prêteurs réclameraient une prime de risque supplémentaire.
    — La seule source est la déclaration de Roland Lescure, ministre de l'Économie, rapportée par l'AFP le 24 août
    2026, sans chiffrage ni méthode. Des économistes cités par la presse (Public Sénat, 25 août 2026) et Christine
    Lagarde (F11) vont dans le même sens, mais aucune institution n'a publié d'estimation chiffrée de l'effet sur
    les taux dans le dossier.
- id: A48
  question: Q44
  position: nuance
  enonce: L'atteinte à la crédibilité de l'euro vaut pour une décision imposée par un gouvernement. Elle ne s'applique
    pas à un effacement arrêté par le conseil des gouverneurs lui-même.
  raisonnement: 'F3 interdit les instructions des gouvernements ; si le conseil décide (F5), aucune instruction
    n''est donnée. Pour la crédibilité, la compatibilité avec les traités est disputée (F27) : le doute sur le financement
    monétaire (F9) n''est pas établi, mais pas écarté non plus. L''atteinte à la crédibilité n''est démontrée dans
    aucun sens.'
  repond_a: A3
  partis:
  - PP
  affirmations:
  - F3 [fait, Vrai] Le traité dispose que ni la BCE, ni une banque centrale nationale, ni un membre de leurs organes
    de décision ne peuvent solliciter ni accepter d'instructions des gouvernements (Q41, Q44).
  - F5 [fait, Vrai] Le conseil des gouverneurs de la BCE arrête les orientations et prend les décisions nécessaires
    aux missions du SEBC (qui décide, Q41).
  - 'F27 [fait, Invérifiable] L''annulation ou la conversion en dette perpétuelle à taux nul de titres achetés par
    l''Eurosystème est contraire aux traités européens. — Aucun texte ne mentionne l''annulation ou la conversion
    de titres déjà détenus (F45) et aucune décision de la CJUE n''a tranché ce cas. La contrariété aux traités est
    affirmée par Roland Lescure (AFP, 24 août 2026) et par Christine Lagarde (F11, F13, F14) ; les signataires de
    la tribune de 2021 soutiennent le contraire (F57) : c''est une interprétation juridique disputée, pas un fait
    établi.'
- id: A49
  question: Q45
  position: non
  enonce: Les vendeurs des titres ont été payés par la banque centrale (F24). Effacer la créance de la banque centrale
    sur l'État ne retire rien à ces vendeurs, qui n'ont plus de créance.
  raisonnement: Ayant vendu, les vendeurs ont été réglés. Le créancier de l'État est la banque centrale, dont les
    engagements envers des tiers ne sont pas ceux de l'État. Distinguer ce créancier des détenteurs privés n'est
    donc pas une parole variable envers un prêteur privé.
  repond_a: A4
  partis:
  - PP
  affirmations:
  - F24 [fait, Vrai] Les titres de dette française détenus par l'Eurosystème ont été achetés sur le marché secondaire,
    auprès d'institutions financières, et non directement auprès de l'État.
- id: A54
  question: Q45
  position: non
  enonce: Le chiffre de 24,4 % (F17) englobe plus que la Banque de France, mais l'argument ne dépend pas de lui.
    Il porte sur la nature publique du créancier, quelle que soit la part, de 18 % (F46) à près d'un quart.
  raisonnement: 'La conclusion « ne pas rembourser intégralement » repose sur la nature publique du créancier (F24
    : les vendeurs ont été payés), non sur le pourcentage. Que la part soit de 18 % ou de près d''un quart (F16),
    le raisonnement est le même ; F17 situe seulement l''ordre de grandeur.'
  repond_a: A42
  partis:
  - PP
  affirmations:
  - F46 [fait, Plutôt vrai] La proposition vise la part de la dette française détenue par la Banque de France pour
    le compte de l'Eurosystème ; elle laisse inchangés les titres détenus par les autres créanciers. — Public Sénat
    (25 août 2026) établit que la proposition de Jean-Luc Mélenchon vise les titres détenus par la Banque de France
    pour le compte de la BCE (18 % dans le texte, 20 % dans le chapeau). Que les autres créanciers ne soient pas
    concernés n'est que sous-entendu, par un économiste cité dans l'article.
  - 'F16 [fait, Plutôt vrai] L''Eurosystème détient près d''un quart des OAT au titre de la politique monétaire
    (données du premier trimestre 2025, rapport du Sénat) (Q41). — Le rapport d''information de la commission des
    finances du Sénat (24 septembre 2025) écrit au conditionnel que l''Eurosystème « détiendrait » près d''un quart
    des OAT, en commentant la détention au premier trimestre 2025. Le chiffre sous-jacent (24,4 %) porte sur une
    catégorie « autres français » qui inclut la Banque de France pour le compte de la BCE mais n''est pas limitée
    à elle : l''ordre de grandeur est sourcé, la précision est moindre que ne le suggère l''énoncé.'
  - F24 [fait, Vrai] Les titres de dette française détenus par l'Eurosystème ont été achetés sur le marché secondaire,
    auprès d'institutions financières, et non directement auprès de l'État.
