    auteur: expert-centre
    question: Q45
    position: pour
    enonce: 'Les vendeurs des titres ont bien été payés, mais cela ne fait pas de la part détenue par l''Eurosystème
      une dette qui ne serait jamais remboursée : ces titres arrivent à échéance comme les autres et l''État les
      rembourse.'
    raisonnement: 'A43 et A49 ont raison sur un point : les vendeurs n''ont plus de créance, et le créancier actuel
      est la banque centrale. Mais A43 en conclut que cette part est à part. Or l''Eurosystème ne réinvestit plus
      les titres arrivés à échéance depuis la fin de 2024 pour le PEPP (F48), et son stock baisse au fil de 2026
      (F31) : cette part est déjà remboursée par l''État à chaque échéance, au même titre que les autres. Un titre
      de dette garde les mêmes conditions quel que soit son détenteur ; ne pas honorer celles-ci pour une seule
      catégorie de détenteurs modifie le contrat après coup. Que le marché assimile ou non cette part aux autres
      reste une estimation, pas une certitude (voir Q42).'
