    auteur: expert-droite
    question: Q1
    position: contre
    enonce: 'L''article 32.4 des statuts du SEBC, cité par A9, porte sur l''indemnisation de pertes de banques centrales
      nationales liées à des opérations de politique monétaire ; il ne dit rien d''une annulation de titres publics.
      La BCE a écrit en 2021 que l''annulation enfreindrait l''interdiction du financement monétaire, et un membre
      de son directoire a dit en 2020 que ne pas demander le remboursement de titres souverains achetés en serait
      un : l''argument d''une annulation possible « dans le cadre des traités actuels » ne suit donc pas de ce texte.'
    porte_par:
