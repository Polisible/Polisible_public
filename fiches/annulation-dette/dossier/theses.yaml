    motif_rapporteur: 'Le raisonnement de A43 est la réfutation de A4 par F24, sans prémisse sur la légitimité ;
      A43 forme T33. T19 réduite à A17 : objections « répondues ». L''énoncé de A43 maintient le critère de légitimité,
      de sorte que T15 garde « en partie ».'
