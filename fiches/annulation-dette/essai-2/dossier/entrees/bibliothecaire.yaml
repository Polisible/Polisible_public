affirmations:
  - ref: f1
    enonce: "L'article 123, paragraphe 1, du TFUE interdit à la BCE et aux banques centrales nationales d'acheter directement aux autorités publiques les instruments de leur dette."
    type: fait
    sources:
      - {source: s1, extrait: "l'acquisition directe, auprès d'eux, par la Banque centrale européenne ou les banques centrales nationales, des instruments de leur dette est également interdite"}
  - ref: f2
    enonce: "Le même article interdit à la BCE et aux banques centrales nationales d'accorder des découverts ou tout autre crédit aux administrations centrales et aux autres autorités publiques."
    type: fait
    sources:
      - {source: s1, extrait: "d’accorder des découverts ou tout autre type de crédit aux institutions, organes ou organismes de l'Union, aux administrations centrales"}
  - ref: f3
    enonce: "L'article 130 du TFUE interdit à la BCE et aux banques centrales nationales de solliciter ou d'accepter des instructions des gouvernements des États membres."
    type: fait
    sources:
      - {source: s2, extrait: "ni la Banque centrale européenne, ni une banque centrale nationale, ni un membre quelconque de leurs organes de décision ne peuvent solliciter ni accepter des instructions des institutions, organes ou organismes de l'Union, des gouvernements des États membres ou de tout autre organisme."}
  - ref: f4
    enonce: "Dans l'arrêt C-62/14 du 16 juin 2015, la Cour (grande chambre) dit pour droit que les articles 119, 123 § 1 et 127 TFUE autorisent le SEBC à adopter un programme d'achat d'obligations souveraines sur les marchés secondaires, tel que celui annoncé en septembre 2012 (programme OMT)."
    type: fait
    sources:
      - {source: s3, extrait: "ils autorisent le Système européen de banques centrales (SEBC) à adopter un programme d’achat d’obligations souveraines sur les marchés secondaires"}
  - ref: f5
    enonce: "Dans l'arrêt C-493/17 du 11 décembre 2018, la Cour (grande chambre) dit pour droit que l'examen des questions posées n'a révélé aucun élément de nature à affecter la validité de la décision (UE) 2015/774 de la BCE, relative au programme d'achats d'actifs du secteur public sur les marchés secondaires."
    type: fait
    sources:
      - {source: s4, extrait: "L’examen des première à quatrième questions préjudicielles n’a révélé aucun élément de nature à affecter la validité de la décision (UE) 2015/774 de la Banque centrale européenne"}
  - ref: f6
    enonce: "Fin 2025 (quatrième trimestre), la dette publique française s'élevait à 115,6 % du produit intérieur brut (Insee, publication du 27 mars 2026)."
    type: fait
    sources:
      - {source: s5, extrait: "At the end of the fourth quarter of 2025, the public debt ratio stood at 115.6% of GDP"}
  - ref: f7
    enonce: "Au sens de Maastricht, la dette publique française s'élevait à 3 460,5 milliards d'euros fin 2025 (quatrième trimestre, Insee)."
    type: fait
    sources:
      - {source: s5, extrait: "public debt as defined by the Maastricht criteria stood at €3,460.5 billion"}
  - ref: f8
    enonce: "Le marché secondaire est le marché où sont échangés des instruments financiers déjà en circulation, par opposition au marché primaire où ils sont émis."
    type: fait
    sources:
      - {source: s6, extrait: "Market where transactions are carried out concerning financial instruments in circulation."}
  - ref: f9
    enonce: "Le SEBC comprend la BCE et les banques centrales de tous les États membres ; l'Eurosystème ne comprend que la BCE et les banques centrales des États ayant adopté l'euro."
    type: fait
    sources:
      - {source: s7, extrait: "it includes, in addition to the members of the Eurosystem, the NCBs of those Member States that have not yet adopted the euro."}
