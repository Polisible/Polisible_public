  arguments:
  - id: A1
    auteur: centre
    question: Q41
    position: non
    enonce: 'Les traités ne permettent pas d''effacer ni de convertir à taux nul ces titres : ce serait faire financer
      l''État par sa banque centrale, ce que l''article 123 interdit. Aucun arrêt n''a tranché ce cas précis, et
      la décision relèverait du conseil des gouverneurs.'
    raisonnement: 'L''article 123 interdit crédits et achats directs de dette aux États (F1, F2). La Cour a validé
      les rachats sur le marché secondaire (F8, F10), mais à condition de garanties contre le financement monétaire
      (F9) : les titres ont été achetés à des investisseurs (F24) et non offerts à l''État. Les annuler ou les convertir
      en perpétuel à taux nul reviendrait à donner à l''État, après coup, un avantage que le traité lui refuse au
      départ. Enfin, les décisions du SEBC appartiennent au conseil des gouverneurs (F5), qui ne peut recevoir d''instructions
      des gouvernements (F3) : un État ne peut ni l''ordonner ni modifier seul le cadre (F4).'
    porte_par: '**Roland Lescure** (ministre de l''Économie, RE), 24 août 2026 [S16, S49]'
    repond_a: null
    affirmations:
    - F1 [fait, Vrai] Le traité interdit à la BCE et aux banques centrales nationales d'accorder des découverts
      ou crédits aux administrations publiques (Q41). (sources S1)
    - F2 [fait, Vrai] Le traité interdit l'acquisition directe, auprès des États, de leurs titres de dette par la
      BCE ou les banques centrales nationales (Q41). (sources S1)
    - F3 [fait, Vrai] Le traité dispose que ni la BCE, ni une banque centrale nationale, ni un membre de leurs organes
      de décision ne peuvent solliciter ni accepter d'instructions des gouvernements (Q41, Q44). (sources S1)
    - F4 [fait, Vrai] Le traité prévoit que chaque État membre veille à la compatibilité de sa législation nationale,
      y compris les statuts de sa banque centrale, avec les traités et les statuts du SEBC (Q41, Q44). (sources
      S1)
    - F5 [fait, Vrai] Le conseil des gouverneurs de la BCE arrête les orientations et prend les décisions nécessaires
      aux missions du SEBC (qui décide, Q41). (sources S1)
    - F8 [fait, Vrai] Dans l'arrêt Gauweiler (C-62/14, 16 juin 2015), la Cour dit pour droit que le SEBC est autorisé
      à adopter un programme d'achat d'obligations souveraines sur les marchés secondaires (Q41). (sources S2)
    - F9 [fait, Vrai] Dans l'arrêt Weiss (C-493/17, 11 décembre 2018), la Cour rappelle que le SEBC doit concilier
      ses interventions avec l'interdiction du financement monétaire de l'article 123 TFUE (Q41). (sources S3)
    - F10 [fait, Vrai] Dans l'arrêt Weiss (C-493/17), la Cour dit pour droit que l'examen des questions n'a révélé
      aucun élément affectant la validité de la décision (UE) 2015/774 de la BCE (Q41). (sources S3)
    - F24 [fait, Vrai] Les titres de dette française détenus par l'Eurosystème ont été achetés sur le marché secondaire,
      auprès d'institutions financières, et non directement auprès de l'État. (sources S19)
    - 'F27 [fait, Invérifiable] L''annulation ou la conversion en dette perpétuelle à taux nul de titres achetés
      par l''Eurosystème est contraire aux traités européens. — Aucun texte ne mentionne l''annulation ou la conversion
      de titres déjà détenus (F45) et aucune décision de la CJUE n''a tranché ce cas. La contrariété aux traités
      est affirmée par Roland Lescure (AFP, 24 août 2026) et par Christine Lagarde (F11, F13, F14) ; les signataires
      de la tribune de 2021 soutiennent le contraire (F57) : c''est une interprétation juridique disputée, pas un
      fait établi. (sources S16)'
  - id: A20
    auteur: gauche-radicale
    question: Q41
    position: oui
    enonce: Aucun texte des traités ne mentionne l'annulation ni la conversion en dette perpétuelle de titres déjà
      détenus par l'Eurosystème. La Cour de justice a validé les achats sur le marché secondaire sous garanties,
      sans trancher le sort ultérieur des titres.
    raisonnement: 'Les titres ont été achetés sur le marché secondaire (F44), pratique que la Cour de justice a
      jugée compatible avec l''article 123 sous garanties (F8, F9, F10). Le texte interdit le crédit et l''acquisition
      directe (F1, F2) mais ne vise pas expressément la conversion de titres déjà au bilan (F45). La décision serait
      prise par le conseil des gouverneurs de la BCE (F5), donc sans instruction d''un gouvernement (F3) : la mesure
      relève de la politique du bilan de la banque centrale, pas d''un crédit à l''État.'
    porte_par: '**Jean-Luc Mélenchon** (député, LFI), 11 mai 2020 [S39, S19]; **Jean-Luc Mélenchon** (candidat à
      l''élection présidentielle de 2022, LFI), 6 juin 2022 [S40, S19]'
    repond_a: null
    affirmations:
    - F44 [fait, Vrai] Les titres de dette française détenus par l'Eurosystème au titre de la politique monétaire
      ont été achetés sur le marché secondaire, auprès d'institutions financières, et non directement auprès de
      l'État. (sources S19)
    - F45 [fait, Vrai] L'article 123 TFUE et l'article 21 du protocole n° 4 interdisent les crédits et l'acquisition
      directe de titres auprès des États ; ils ne mentionnent pas expressément l'annulation ou la conversion en
      dette perpétuelle de titres déjà inscrits au bilan d'une banque centrale. (sources S1)
    - F1 [fait, Vrai] Le traité interdit à la BCE et aux banques centrales nationales d'accorder des découverts
      ou crédits aux administrations publiques (Q41). (sources S1)
    - F2 [fait, Vrai] Le traité interdit l'acquisition directe, auprès des États, de leurs titres de dette par la
      BCE ou les banques centrales nationales (Q41). (sources S1)
    - F3 [fait, Vrai] Le traité dispose que ni la BCE, ni une banque centrale nationale, ni un membre de leurs organes
      de décision ne peuvent solliciter ni accepter d'instructions des gouvernements (Q41, Q44). (sources S1)
    - F5 [fait, Vrai] Le conseil des gouverneurs de la BCE arrête les orientations et prend les décisions nécessaires
      aux missions du SEBC (qui décide, Q41). (sources S1)
    - F8 [fait, Vrai] Dans l'arrêt Gauweiler (C-62/14, 16 juin 2015), la Cour dit pour droit que le SEBC est autorisé
      à adopter un programme d'achat d'obligations souveraines sur les marchés secondaires (Q41). (sources S2)
    - F9 [fait, Vrai] Dans l'arrêt Weiss (C-493/17, 11 décembre 2018), la Cour rappelle que le SEBC doit concilier
      ses interventions avec l'interdiction du financement monétaire de l'article 123 TFUE (Q41). (sources S3)
    - F10 [fait, Vrai] Dans l'arrêt Weiss (C-493/17), la Cour dit pour droit que l'examen des questions n'a révélé
      aucun élément affectant la validité de la décision (UE) 2015/774 de la BCE (Q41). (sources S3)
  - id: A21
    auteur: gauche-radicale
    question: Q41
    position: non
    enonce: 'L''annulation de la part détenue par la banque centrale suppose de changer les règles européennes :
      les députés communistes demandent de sortir des traités actuels et de les changer. La France doit d''abord
      engager une démarche auprès de la Commission européenne et des autres pays.'
    raisonnement: 'Les traités interdisent à la BCE de financer directement les États (F1, F2) ; c''est pourquoi
      elle a racheté la dette auprès des banques et des assurances (F44), ce qui maintient la dépendance aux marchés.
      L''annulation partielle se heurte donc aux traités : les élus communistes demandent de les changer et de saisir
      la Commission européenne et les autres États, plutôt que d''agir seul.'
    porte_par: '**Fabien Roussel** (député, PCF), 22 mars 2021 [S41, S52]'
    repond_a: null
    affirmations:
    - F1 [fait, Vrai] Le traité interdit à la BCE et aux banques centrales nationales d'accorder des découverts
      ou crédits aux administrations publiques (Q41). (sources S1)
    - F2 [fait, Vrai] Le traité interdit l'acquisition directe, auprès des États, de leurs titres de dette par la
      BCE ou les banques centrales nationales (Q41). (sources S1)
    - F44 [fait, Vrai] Les titres de dette française détenus par l'Eurosystème au titre de la politique monétaire
      ont été achetés sur le marché secondaire, auprès d'institutions financières, et non directement auprès de
      l'État. (sources S19)
  - id: A32
    auteur: sociaux-democrates
    question: Q41
    position: oui
    enonce: 'Aucune disposition des traités ne mentionne l''annulation : l''article 123 interdit le crédit et l''achat
      direct de titres aux États, non l''abandon d''une créance déjà inscrite au bilan. La décision relèverait du
      conseil des gouverneurs de la BCE.'
    raisonnement: Le traité interdit deux actes précis (découvert ou crédit, achat direct de titres, F1 et F2) ;
      l'annulation d'une créance acquise sur le marché secondaire n'est pas l'un d'eux. Comme l'interdiction n'est
      pas explicite et que le conseil des gouverneurs arrête les décisions du SEBC (F5), l'effacement relève d'une
      décision de la BCE et non d'une impossibilité juridique. Cet argument est contesté par la BCE (F11, F13) ;
      il est la position de 2021 d'une élue de Place publique, antérieure à la proposition de 2026.
    porte_par: '**Aurore Lalucq** (députée européenne, PP), 5 février 2021 [S43, S53]'
    repond_a: null
    affirmations:
    - F57 [fait, Vrai] Les traités européens n'interdisent pas explicitement l'annulation de dettes publiques détenues
      par la BCE (le mot « annulation » ne figure ni dans le traité ni dans le protocole sur le SEBC). (sources
      S43)
    - F1 [fait, Vrai] Le traité interdit à la BCE et aux banques centrales nationales d'accorder des découverts
      ou crédits aux administrations publiques (Q41). (sources S1)
    - F2 [fait, Vrai] Le traité interdit l'acquisition directe, auprès des États, de leurs titres de dette par la
      BCE ou les banques centrales nationales (Q41). (sources S1)
    - F5 [fait, Vrai] Le conseil des gouverneurs de la BCE arrête les orientations et prend les décisions nécessaires
      aux missions du SEBC (qui décide, Q41). (sources S1)
  - id: A37
    auteur: centre
    question: Q41
    position: non
    enonce: 'L''absence du mot « annulation » dans les traités ne vaut pas autorisation : l''article 123 s''applique
      selon son objet, éviter le financement monétaire des États. Les arrêts cités portent sur les achats de titres,
      pas sur leur sort ultérieur.'
    raisonnement: 'F45 (le texte ne mentionne pas l''annulation) établit seulement un silence. F10 porte sur la
      validité de la décision 2015/774, donc sur les achats, et F9 montre que la Cour valide ces achats à condition
      de garanties contre le financement monétaire : elle raisonne par l''effet, non par la liste des actes interdits.
      Rien dans F8-F10 ne dit qu''effacer ou geler à taux nul des titres déjà détenus, au profit d''un État, respecte
      ces garanties. Enfin l''argument suppose une décision du conseil des gouverneurs (F5), alors que la proposition
      en débat est portée par un gouvernement et un parlement nationaux (F3).'
    porte_par: '**Roland Lescure** (ministre de l''Économie, RE), 24 août 2026 [S16, S49]'
    repond_a: A20
    affirmations:
    - F45 [fait, Vrai] L'article 123 TFUE et l'article 21 du protocole n° 4 interdisent les crédits et l'acquisition
      directe de titres auprès des États ; ils ne mentionnent pas expressément l'annulation ou la conversion en
      dette perpétuelle de titres déjà inscrits au bilan d'une banque centrale. (sources S1)
    - F9 [fait, Vrai] Dans l'arrêt Weiss (C-493/17, 11 décembre 2018), la Cour rappelle que le SEBC doit concilier
      ses interventions avec l'interdiction du financement monétaire de l'article 123 TFUE (Q41). (sources S3)
    - F10 [fait, Vrai] Dans l'arrêt Weiss (C-493/17), la Cour dit pour droit que l'examen des questions n'a révélé
      aucun élément affectant la validité de la décision (UE) 2015/774 de la BCE (Q41). (sources S3)
    - F5 [fait, Vrai] Le conseil des gouverneurs de la BCE arrête les orientations et prend les décisions nécessaires
      aux missions du SEBC (qui décide, Q41). (sources S1)
    - F3 [fait, Vrai] Le traité dispose que ni la BCE, ni une banque centrale nationale, ni un membre de leurs organes
      de décision ne peuvent solliciter ni accepter d'instructions des gouvernements (Q41, Q44). (sources S1)
  - id: A46
    auteur: sociaux-democrates
    question: Q41
    position: oui
    enonce: L'article 123 vise deux actes précis, le crédit direct et l'achat direct. Que l'effacement d'une créance
      acquise sur le marché secondaire soit un financement interdit est une interprétation, non une conséquence
      du texte.
    raisonnement: Déduire l'interdiction de ce que les titres ont été achetés à des investisseurs (F24) établit
      que l'achat initial était régulier, pas que le traitement ultérieur du titre est interdit. Le traité ne mentionne
      pas ce cas (F57) et F27 reste invérifiable ; l'« avantage après coup » est une lecture que la Cour n'a pas
      validée.
    porte_par: '**Aurore Lalucq** (députée européenne, PP), 5 février 2021 [S43, S53]'
    repond_a: A1
    affirmations:
    - F24 [fait, Vrai] Les titres de dette française détenus par l'Eurosystème ont été achetés sur le marché secondaire,
      auprès d'institutions financières, et non directement auprès de l'État. (sources S19)
    - F57 [fait, Vrai] Les traités européens n'interdisent pas explicitement l'annulation de dettes publiques détenues
      par la BCE (le mot « annulation » ne figure ni dans le traité ni dans le protocole sur le SEBC). (sources
      S43)
    - 'F27 [fait, Invérifiable] L''annulation ou la conversion en dette perpétuelle à taux nul de titres achetés
      par l''Eurosystème est contraire aux traités européens. — Aucun texte ne mentionne l''annulation ou la conversion
      de titres déjà détenus (F45) et aucune décision de la CJUE n''a tranché ce cas. La contrariété aux traités
      est affirmée par Roland Lescure (AFP, 24 août 2026) et par Christine Lagarde (F11, F13, F14) ; les signataires
      de la tribune de 2021 soutiennent le contraire (F57) : c''est une interprétation juridique disputée, pas un
      fait établi. (sources S16)'
  valeurs: []
