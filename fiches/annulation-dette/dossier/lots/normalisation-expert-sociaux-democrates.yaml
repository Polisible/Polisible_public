consigne: 'Mets tes éléments au format de docs/format-fiche.md (§ 3, 5, 10) par des `corrections` : position oui/non/nuance
  par rapport à la question ; porte_par complet (personne, fonction au moment de la déclaration, parti en sigle,
  date, source, appartenance si la source ne l''établit pas) ; valeurs : « Priorité à… » + porte_par, sinon retirer.
  Mets normalise: true dans chaque correction.'
questions:
  Q41: Les traités européens permettent-ils d'annuler, ou de convertir en dette perpétuelle à taux nul, la dette
    française détenue par la Banque de France pour l'Eurosystème ?
  Q42: Annuler ou geler cette dette ferait-il monter les taux auxquels la France emprunte ?
  Q43: L'opération réduirait-elle durablement la charge d'intérêts de l'État, compte tenu des intérêts que la Banque
    de France reverse à l'État ?
  Q44: Annuler ou geler cette dette affaiblirait-il la crédibilité de l'euro ou l'indépendance de la BCE ?
  Q45: Un État doit-il rembourser intégralement sa dette, y compris quand le créancier est sa propre banque centrale
    ?
  Q46: Les décisions sur la dette publique doivent-elles relever de la seule décision nationale plutôt que des règles
    européennes ?
  Q47: Pour dégager des marges budgétaires, l'annulation d'une partie de la dette est-elle préférable aux économies,
    à la hausse des recettes ou à la recherche de croissance ?
arguments:
- id: A32
  question: Q41
  position: oui
  enonce: 'Aucune disposition des traités ne mentionne l''annulation : l''article 123 interdit le crédit et l''achat
    direct aux États, non l''abandon d''une créance déjà inscrite au bilan. Les signataires de la tribune de 2021
    en déduisent que la décision relèverait du conseil des gouverneurs de la BCE ; la compatibilité avec l''interdiction
    du financement monétaire reste une interprétation disputée, que la CJUE n''a pas tranchée.'
  raisonnement: Le traité interdit deux actes précis (découvert ou crédit, achat direct de titres, F1 et F2) ; l'annulation
    d'une créance acquise sur le marché secondaire n'est pas l'un d'eux. Comme l'interdiction n'est pas explicite
    et que le conseil des gouverneurs arrête les décisions du SEBC (F5), l'effacement relève d'une décision de la
    BCE et non d'une impossibilité juridique. Cet argument est contesté par la BCE (F11, F13) ; il est la position
    de 2021 d'une élue de Place publique, antérieure à la proposition de 2026.
  porte_par:
  - parti: PP
    source: S43
    personne_ou_groupe_ancien: Aurore Lalucq, députée européenne (tribune collective, février 2021)
  a_normaliser:
  - position à confirmer (ancienne échelle pour/contre)
  - porteur à reformater (personne, fonction, date)
- id: A33
  question: Q44
  position: non
  enonce: La BCE affirme pouvoir remplir son mandat malgré des pertes (F58) ; des fonds propres durablement négatifs
    ne sont pas chiffrés par une institution. Si l'effacement est décidé par le conseil des gouverneurs lui-même,
    aucune instruction d'un gouvernement n'est donnée (F3, F5) ; l'argument ne vaut pas pour un effacement imposé
    par un État.
  raisonnement: Le risque pour la crédibilité vient de l'idée qu'une perte comptable empêcherait la banque centrale
    d'agir. Si elle peut fonctionner avec des fonds propres négatifs (F58) et si l'effacement est décidé par son
    propre conseil des gouverneurs sans instruction d'un gouvernement (F3, F5), ni sa capacité d'action ni son indépendance
    ne sont atteintes. Position de 2021, avant la proposition de 2026 ; elle porte sur un effacement décidé par
    la BCE, pas imposé par un État.
  porte_par:
  - parti: PP
    source: S43
    personne_ou_groupe_ancien: Aurore Lalucq, députée européenne (tribune collective, février 2021)
  a_normaliser:
  - position à confirmer (ancienne échelle pour/contre)
  - porteur à reformater (personne, fonction, date)
- id: A34
  question: Q45
  position: non
  enonce: 'Au premier trimestre 2025, la catégorie « autres français », dont la Banque de France pour le compte
    de la BCE, représente 24,4 % de la dette négociable de l''État : une part importante est due à la banque centrale,
    institution publique. La catégorie n''est pas limitée à elle ; rembourser ce créancier revient à trouver ailleurs
    la somme (nouvel emprunt, impôts ou baisse des dépenses), d''où l''idée de ne pas le rembourser intégralement.'
  raisonnement: 'La créance d''une banque centrale n''est pas celle d''un épargnant privé : l''État se la doit en
    partie à lui-même (F17). Rembourser obligerait à rouler la dette au lieu d''investir, à augmenter les impôts
    ou à baisser les dépenses ; l''effacement évite ces choix sans spolier de créancier privé. Argument de 2021
    ; l''obligation de rembourser des créanciers privés n''est pas remise en cause par ce texte.'
  porte_par:
  - parti: PP
    source: S43
    personne_ou_groupe_ancien: Aurore Lalucq, députée européenne (tribune collective, février 2021)
  a_normaliser:
  - position à confirmer (ancienne échelle pour/contre)
  - porteur à reformater (personne, fonction, date)
- id: A35
  question: Q46
  position: non
  enonce: 'Un État seul ne peut pas annuler : la décision appartient à la BCE, qui n''accepte pas d''instructions
    des gouvernements. Elle doit donc se prendre par un accord entre les États européens et la BCE, non par une
    décision nationale.'
  raisonnement: Le conseil des gouverneurs de la BCE décide (F5) et ni la BCE ni une banque centrale nationale ne
    peuvent accepter d'instructions d'un gouvernement (F3). Une décision nationale unilatérale n'a donc pas d'effet
    juridique sur la créance ; le texte de 2021 propose pour cette raison un contrat entre les États européens et
    la BCE (F60), assorti d'une exigence de gouvernance européenne.
  porte_par:
  - parti: PP
    source: S43
    personne_ou_groupe_ancien: Aurore Lalucq, députée européenne (tribune collective, février 2021)
  a_normaliser:
  - position à confirmer (ancienne échelle pour/contre)
  - porteur à reformater (personne, fonction, date)
- id: A36
  question: Q47
  position: nuance
  enonce: 'L''effacement ne se substitue aux autres leviers que s''il est conditionné : les États s''engagent à
    investir les montants effacés. Sans cette contrepartie, il ne dégagerait pas de marge utile.'
  raisonnement: 'Rembourser exige de réemprunter, de relever les impôts ou de réduire les dépenses (F17 pour l''ampleur
    de la détention). L''effacement évite ces trois choix, mais le texte de 2021 en fait un échange : le même montant
    doit être investi dans la reconstruction écologique et sociale (F59). L''effacement n''est donc pas présenté
    comme préférable en soi, mais comme un contrat avec un usage défini.'
  porte_par:
  - parti: PP
    source: S43
    personne_ou_groupe_ancien: Aurore Lalucq, députée européenne (tribune collective, février 2021)
  a_normaliser:
  - porteur à reformater (personne, fonction, date)
- id: A46
  question: Q41
  position: oui
  enonce: L'article 123 vise deux actes précis (crédit direct, achat direct) ; que l'effacement d'une créance déjà
    acquise sur le marché secondaire reviendrait à un financement interdit est une interprétation, non une conséquence
    du texte.
  raisonnement: 'A1 déduit l''interdiction de ce que les titres ont été achetés à des investisseurs (F24) : cela
    établit que l''achat initial était régulier, pas que le traitement ultérieur du titre est interdit. Le traité
    ne mentionne pas ce cas (F57) et F27 reste invérifiable ; l''« avantage après coup » est une lecture que la
    Cour n''a pas validée.'
  porte_par:
  - parti: PP
    source: S43
    personne_ou_groupe_ancien: Aurore Lalucq, députée européenne (tribune collective, février 2021)
  a_normaliser:
  - position à confirmer (ancienne échelle pour/contre)
  - porteur à reformater (personne, fonction, date)
- id: A47
  question: Q42
  position: nuance
  enonce: A2 suppose une opération unilatérale ; la proposition de 2021 passe par une décision du conseil des gouverneurs
    et un contrat avec les États. Un signal de rupture unilatérale ne s'applique donc pas à ce cas, et l'ampleur
    de l'effet n'est chiffrée par personne.
  raisonnement: 'La prime de risque décrite par A2 découle d''un État qui « change les règles » seul. Si la décision
    est prise par la BCE elle-même (F5, F60), sans instruction d''un gouvernement (F3), la prémisse manque. F26
    n''a pas d''estimation fiable : le gain « rogné » par un surcoût n''est pas démontré.'
  porte_par:
  - parti: PP
    source: S43
    personne_ou_groupe_ancien: Aurore Lalucq, députée européenne (tribune collective, février 2021)
  a_normaliser:
  - porteur à reformater (personne, fonction, date)
- id: A48
  question: Q44
  position: nuance
  enonce: L'argument d'A3 vaut pour une décision imposée par un gouvernement ; il ne s'applique pas à un effacement
    arrêté par le conseil des gouverneurs lui-même.
  raisonnement: 'F3 interdit les instructions des gouvernements ; si le conseil décide (F5), aucune instruction
    n''est donnée. L''atteinte à la crédibilité suppose en outre que l''opération soit contraire aux traités (F27),
    ce qui est invérifiable : A3 reconnaît d''ailleurs que la compatibilité est disputée.'
  porte_par:
  - parti: PP
    source: S43
    personne_ou_groupe_ancien: Aurore Lalucq, députée européenne (tribune collective, février 2021)
  a_normaliser:
  - porteur à reformater (personne, fonction, date)
- id: A49
  question: Q45
  position: non
  enonce: Les vendeurs des titres ont été payés par la banque centrale (F24) ; effacer la créance de la banque centrale
    sur l'État ne retire rien à ces vendeurs, qui n'ont plus de créance.
  raisonnement: 'A4 écrit que les engagements envers les vendeurs « demeurent » : or, ayant vendu, ils ont été réglés.
    Le créancier de l''État est la banque centrale, dont les engagements envers des tiers ne sont pas ceux de l''État.
    Distinguer ce créancier des détenteurs privés n''est donc pas en soi une parole variable envers un prêteur privé.'
  porte_par:
  - parti: PP
    source: S43
    personne_ou_groupe_ancien: Aurore Lalucq, députée européenne (tribune collective, février 2021)
  a_normaliser:
  - position à confirmer (ancienne échelle pour/contre)
  - porteur à reformater (personne, fonction, date)
- id: A54
  question: Q45
  position: non
  enonce: 'A42 a raison que 24,4 % (F17) englobe plus que la Banque de France ; mais l''argument ne dépend pas de
    ce chiffre : il porte sur la nature du créancier, et la part visée par la proposition en débat est évaluée à
    18 % dans le texte de Public Sénat (F46).'
  raisonnement: 'A34 écrit déjà que la catégorie n''est pas limitée à la Banque de France ; la conclusion « ne pas
    rembourser intégralement » repose sur la nature publique du créancier (F24 : les vendeurs ont été payés), non
    sur le pourcentage. Que la part soit de 18 % ou de près d''un quart (F16, ordre de grandeur sourcé), le raisonnement
    est le même ; F17 ne sert qu''à situer l''ordre de grandeur.'
  porte_par:
  - parti: PP
    source: S43
    personne_ou_groupe_ancien: Aurore Lalucq, députée européenne (tribune collective, février 2021)
  a_normaliser:
  - position à confirmer (ancienne échelle pour/contre)
  - porteur à reformater (personne, fonction, date)
