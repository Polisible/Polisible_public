  niveau: 3
  ajoutee_par: expert-gauche-radicale
  statut: conforme
  note_verif: 'Bon document : compte rendu intégral, 2e séance du lundi 22 mars 2021, débat « La dette publique
    : la payer ou l''annuler ? » à l''initiative du groupe GDR. Les quatre extraits (F49 « dégager immédiatement
    des marges financières très importantes », F51, F52, F55) figurent dans l''intervention de Fabien Roussel et
    disent la même chose que les énoncés ; pour F49 (estimation), c''est l''appréciation d''un orateur, sans chiffrage
    ni méthode, et non une estimation d''institution. Appartenance : la source établit « M. Fabien Roussel (GDR)
    » et qu''il parle au nom des « députés communistes » ; le sigle PCF n''y figure pas en toutes lettres.'
