      et l'ampleur de l'effet n'est chiffrée par personne.
    raisonnement: 'La prime de risque décrite par A2 découle d''un État qui « change les règles » seul. Si la décision
      est prise par la BCE elle-même (F5, F60), sans instruction d''un gouvernement (F3), la prémisse manque. F26
      n''a pas d''estimation fiable : le gain « rogné » par un surcoût n''est pas démontré.'
    position: nuance
    porte_par:
    - parti: PP
      source: S43
      personne_ou_groupe_ancien: Aurore Lalucq, députée européenne (tribune collective, février 2021)
