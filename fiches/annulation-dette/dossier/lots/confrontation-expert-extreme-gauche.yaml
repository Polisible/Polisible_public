    type: fait
    verdict: Vrai
    explication: 'Déclaration vérifiée : la même tribune de 2021 propose « un contrat entre les Etats européens
      et la BCE », et non une décision prise par un seul État.'
    sources:
    - source: S43
      extrait: 'Notre proposition est donc simple : passons un contrat entre les Etats européens et la BCE.'
      statut_source: conforme
- id: A36
  auteur: expert-sociaux-democrates
  question: Q47
  position: nuance
  enonce: 'L''effacement ne se substitue aux autres leviers que s''il est conditionné : les États s''engagent à
    investir les montants effacés. Sans cette contrepartie, il ne dégagerait pas de marge utile.'
  raisonnement: 'Rembourser exige de réemprunter, de relever les impôts ou de réduire les dépenses (F17 pour l''ampleur
    de la détention). L''effacement évite ces trois choix, mais le texte de 2021 en fait un échange : le même montant
    doit être investi dans la reconstruction écologique et sociale (F59). L''effacement n''est donc pas présenté
    comme préférable en soi, mais comme un contrat avec un usage défini.'
  porte_par:
  - qui: Aurore Lalucq, députée européenne (tribune collective, février 2021)
    parti: Place publique
    source: S43
  repond_a: null
  statut: ouvert
  affirmations:
  - id: F59
    enonce: Le texte de 2021 propose que la BCE efface ses créances sur les États (ou les convertisse en dettes
      perpétuelles sans intérêt) en échange de l'engagement des États d'investir les mêmes montants dans la reconstruction
      écologique et sociale.
    type: fait
    verdict: Vrai
    explication: 'Déclaration vérifiée : la tribune collective (Le Monde, février 2021, copie hébergée par EconomiX)
      propose que la BCE efface ses créances ou les convertisse en dettes perpétuelles sans intérêt, contre l''engagement
      des États d''investir les mêmes montants dans la reconstruction écologique et sociale. L''année 2021 est confirmée
      par la réponse de Christine Lagarde du 7 février 2021 (F12).'
    sources:
    - source: S43
      extrait: tandis que les Etats s’engagent à investir les mêmes montants dans la reconstruction écologique et
        sociale.
      statut_source: conforme
  - id: F17
    enonce: Au premier trimestre 2025, la catégorie « autres français », dont la Banque de France pour le compte
      de la BCE, représentait 24,4 % de la dette négociable de l'État (Q41).
    type: fait
    verdict: Vrai
    explication: Le tableau du rapport du Sénat (24 septembre 2025) attribue 24,4 % de la dette négociable de l'État,
      au premier trimestre 2025 et en valeur de marché, à la catégorie « autres français (dont la Banque de France
      pour le compte de la BCE) ». L'énoncé reprend fidèlement ce périmètre.
    sources:
    - source: S10
      extrait: Autres français (dont la Banque de France pour le compte de la BCE) 24,4 %
      statut_source: conforme
