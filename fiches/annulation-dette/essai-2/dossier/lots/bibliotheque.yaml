  S7: Glossary, entrée « European System of Central Banks (ESCB) » (Banque nationale de Belgique (membre de l'Eurosystème),
    non datée (glossaire consulté le 2026-11-10), niveau 1) — https://www.nbb.be/en/glossary?letter=e
