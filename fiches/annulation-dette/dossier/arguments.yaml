- id: A9
  question: Q41
  position: nuance
  enonce: Le traité interdit le crédit et l'achat direct de dette auprès des États, mais pas les achats sur le marché
    secondaire, que le SEBC pratique depuis 2015. La Cour de justice a jugé le programme d'achats de 2015 (PSPP)
    compatible avec le traité sous conditions (arrêt Weiss) ; elle ne s'est pas prononcée sur le programme d'urgence
    pandémique (PEPP) de 2020. La question juridique réelle est de savoir si une conversion ou une annulation de
    titres déjà détenus relève de l'interdiction du financement monétaire, et c'est une question de décision de
    l'Eurosystème.
  porte_par:
  - parti: LE
    source: S23
    personne_ou_groupe_ancien: Jérôme Gleizes, conseiller EELV de Paris (2023), chronique Politis du 14 septembre
      2026
  affirmations:
  - F1
  - F2
  - F5
  - F8
  - F9
  - F10
  raisonnement: 'L''article 123 vise deux opérations précises : le crédit direct aux États et l''acquisition directe
    de leur dette (F1, F2). Les titres détenus par l''Eurosystème ont été acquis sur les marchés secondaires dans
    un programme que la Cour a jugé compatible avec le traité sous garanties (F8, F9, F10). Un texte qui n''évoque
    pas le traitement ultérieur de ces titres ne tranche pas l''annulation ; l''affirmer interdite comme certaine
    est une interprétation, et le conseil des gouverneurs de la BCE reste l''organe qui décide (F5). Cette lecture
    concerne l''annulation ou la conversion décidée par la BCE elle-même, pas une décision unilatérale de l''État.'
  repond_a: null
  auteur: expert-ecologistes
  passage: 1
  statut: retire
  a_normaliser:
  - porteur à reformater (personne, fonction, date)
- id: A10
  question: Q45
  position: non
  enonce: Un État n'a pas à rembourser intégralement une dette détenue par sa banque centrale, qui n'est pas due
    à un créancier extérieur à la sphère publique. La marge dégagée peut financer la transition écologique.
  porte_par:
  - parti: LE
    date: '2020-06-15'
    source: S24
  affirmations:
  - F31
  - F32
  - F34
  - F7
  - F20
  raisonnement: Les titres publics détenus par l'Eurosystème (environ 640 milliards d'euros pour la France en 2026,
    F31) sont le résultat d'achats de politique monétaire, non d'un prêt consenti par un épargnant ou un investisseur
    privé. Les intérêts versés à la banque centrale reviennent en partie à l'État (F7, F20). Comme l'Europe a besoin
    de 800 milliards d'euros d'investissements supplémentaires par an (F32), maintenir cette dette au bilan pour
    la rembourser prive l'investissement climatique d'une marge qui existe. Le parti a déjà proposé en 2020 de lier
    annulation de dette auprès de la BCE et financement de la reconstruction écologique (F34).
  repond_a: null
  auteur: expert-ecologistes
  passage: 1
  statut: ouvert
  versions:
  - passage: 4
    enonce: 'Un État n''a pas à rembourser intégralement une dette détenue par sa banque centrale : elle n''est
      pas due à un créancier extérieur à la sphère publique, et la marge dégagée peut financer les investissements
      de la transition écologique. Le remboursement intégral n''est pas une obligation de principe mais un choix
      de politique économique.'
    position: non
    porte_par:
    - parti: LE
      source: S23
      personne_ou_groupe_ancien: Jérôme Gleizes, conseiller EELV de Paris (2023), chronique Politis du 14 septembre
        2026
    - parti: LE
      source: S24
