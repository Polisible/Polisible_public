- id: A13
  question: Q1
  position: contre
  enonce: 'Le traité (article 123) ne mentionne pas l''annulation, mais la BCE lit l''interdiction du financement
    monétaire comme couvrant aussi l''annulation de titres déjà détenus : acheter des titres sur le marché secondaire
    puis renoncer à leur remboursement équivaudrait, selon elle, à financer l''État. L''article 32.4 des statuts
    ne prévoit que l''indemnisation de pertes sur opérations de politique monétaire, pas l''effacement d''une créance
    sur un État.'
  porte_par:
  - qui: Fabio Panetta, membre du directoire de la BCE (entretien du 16 juin 2020)
    source: S18
  - qui: Christine Lagarde, présidente de la BCE (lettre du 5 février 2021)
    source: S1
  affirmations:
  - F31
  - F1
  - F26
  repond_a: A9
  auteur: expert-centre
  passage: 2
  statut: ouvert
- id: A14
  question: Q1
  position: contre
  enonce: 'Le raisonnement selon lequel une banque centrale peut simplement renoncer à réclamer le remboursement
    de ses titres est celui que la BCE a écarté : en juin 2020, un membre de son directoire a dit que décider de
    ne pas demander le remboursement d''obligations souveraines achetées serait du financement monétaire. Le fait
    que les titres aient été achetés sur le marché secondaire ne répond donc pas à cette objection.'
  porte_par:
  - qui: Fabio Panetta, membre du directoire de la BCE (entretien du 16 juin 2020)
    source: S18
  affirmations:
  - F31
  - F34
  repond_a: A11
