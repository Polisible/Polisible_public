- id: A9
  question: Q1
  position: pour
  enonce: 'Pour La France insoumise, l''annulation de titres déjà détenus par une banque centrale n''est ni un crédit
    à l''État ni un achat direct de ses titres, et le texte de l''article 123 ne la mentionne pas. Cette lecture
    est contestée par la BCE (lettre de 2021, F1) et par Fabio Panetta (2020, F31) ; aucune décision de justice
    ne l''a tranchée : la Cour de justice, dans l''arrêt Weiss (2018), a examiné les achats du programme PSPP, pas
    leur annulation.'
  porte_par:
  - qui: Jean-Luc Mélenchon (La France insoumise)
    source: S17
  affirmations:
  - F25
