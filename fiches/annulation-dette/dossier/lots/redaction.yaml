  - id: A35
    auteur: sociaux-democrates
    question: Q46
    position: non
    enonce: 'Un État seul ne peut pas annuler : la décision appartient à la BCE, qui n''accepte pas d''instructions
      des gouvernements. Elle se prend par un accord entre les États européens et la BCE, non par une décision nationale.'
    raisonnement: Le conseil des gouverneurs de la BCE décide (F5) et ni la BCE ni une banque centrale nationale
      ne peuvent accepter d'instructions d'un gouvernement (F3). Une décision nationale unilatérale n'a donc pas
      d'effet juridique sur la créance ; le texte de 2021 propose pour cette raison un contrat entre les États européens
      et la BCE (F60), assorti d'une exigence de gouvernance européenne.
    porte_par: '**Aurore Lalucq** (députée européenne, PP), 5 février 2021 [S43, S53]'
    repond_a: null
    affirmations:
    - F3 [fait, Vrai] Le traité dispose que ni la BCE, ni une banque centrale nationale, ni un membre de leurs organes
      de décision ne peuvent solliciter ni accepter d'instructions des gouvernements (Q41, Q44). (sources S1)
    - F5 [fait, Vrai] Le conseil des gouverneurs de la BCE arrête les orientations et prend les décisions nécessaires
      aux missions du SEBC (qui décide, Q41). (sources S1)
    - F60 [fait, Vrai] Le texte de 2021 propose un contrat entre les États européens et la BCE, et non une décision
      prise par un seul État. (sources S43)
  valeurs:
  - V2 Priorité à la protection que les règles communes de la zone euro offrent à tous les États membres, plutôt
