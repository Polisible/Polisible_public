  - id: A20
    auteur: expert-gauche-radicale
    question: Q41
    position: pour
    enonce: 'Aucun texte des traités ne mentionne l''annulation ni la conversion en dette perpétuelle de titres
      que l''Eurosystème détient déjà : l''article 123 interdit crédits et achats directs aux États. Les arrêts
      Gauweiler et Weiss valident les achats sur le marché secondaire sous garanties ; ils ne tranchent pas le sort
      ultérieur des titres, et l''arrêt Weiss relève que leur conservation jusqu''à l''échéance n''implique aucune
      renonciation au paiement. La compatibilité d''une conversion, qui relèverait du conseil des gouverneurs de
      la BCE, est donc une interprétation juridique que LFI soutient, non un point jugé.'
    raisonnement: 'Les titres ont été achetés sur le marché secondaire (F44), pratique que la Cour de justice a
      jugée compatible avec l''article 123 sous garanties (F8, F9, F10). Le texte interdit le crédit et l''acquisition
      directe (F1, F2) mais ne vise pas expressément la conversion de titres déjà au bilan (F45). La décision serait
      prise par le conseil des gouverneurs de la BCE (F5), donc sans instruction d''un gouvernement (F3) : la mesure
      relève de la politique du bilan de la banque centrale, pas d''un crédit à l''État.'
    porte_par:
    - qui: Jean-Luc Mélenchon et les députés LFI signataires de la proposition de résolution n° 2914 (11 mai 2020)
      parti: LFI
      source: S39
    - qui: Jean-Luc Mélenchon, livret Dette (6 juin 2022)
      parti: LFI
      source: S40
    repond_a: null
    statut: conteste
    affirmations:
    - id: F44
      enonce: Les titres de dette française détenus par l'Eurosystème au titre de la politique monétaire ont été
        achetés sur le marché secondaire, auprès d'institutions financières, et non directement auprès de l'État.
      type: fait
      verdict: Vrai
      explication: L'article 123 TFUE interdit l'acquisition directe de titres auprès des États (F2, S1), et les
        programmes d'achat de politique monétaire validés par la CJUE portent sur le marché secondaire (F8, F10).
        Public Sénat (25 août 2026) le confirme pour les achats de 2010 et de 2020.
      sources:
      - source: S19
        extrait: Ces opérations ont eu lieu sur le marché secondaire, c’est-à-dire auprès d’institutions financières
        statut_source: conforme
    - id: F45
      enonce: L'article 123 TFUE et l'article 21 du protocole n° 4 interdisent les crédits et l'acquisition directe
        de titres auprès des États ; ils ne mentionnent pas expressément l'annulation ou la conversion en dette
        perpétuelle de titres déjà inscrits au bilan d'une banque centrale.
      type: fait
      verdict: Vrai
      explication: L'article 123, paragraphe 1, du TFUE et l'article 21.1 du protocole n° 4 (version consolidée
        de 2016) interdisent les crédits aux administrations publiques et l'acquisition directe de leurs titres.
        Aucun des deux textes ne mentionne l'annulation ni la conversion de titres déjà détenus ; leur interprétation
        sur ce point n'a pas été tranchée par la CJUE.
      sources:
      - source: S1
        extrait: l'acquisition directe, auprès d'eux, par la Banque centrale européenne ou les banques centrales
          nationales, des instruments de leur dette est également interdite.
        statut_source: conforme
