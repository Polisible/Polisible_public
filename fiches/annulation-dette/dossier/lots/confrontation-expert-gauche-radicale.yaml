  auteur: extreme-gauche
  question: Q45
  position: contre
  enonce: 'Un État ne doit pas rembourser une dette construite par des cadeaux fiscaux et des aides aux plus riches
    et aux grandes entreprises : elle est illégitime. Avant toute décision, un audit citoyen doit établir qui a
    prêté, à quel taux, quelle part est déjà remboursée, et un moratoire suspend les paiements.'
  raisonnement: Si la dette résulte de choix de politique qui ont profité aux créanciers et aux entreprises plutôt
    qu'à la population, l'obligation de la rembourser intégralement ne va pas de soi. Le critère n'est pas l'identité
    du créancier mais la légitimité de la dette, que l'audit doit établir ; ce critère conduit à ne pas rembourser
    les dettes illégitimes, banque centrale ou non.
  porte_par: NPA (tract sur la dette) (NPA, S37)
  repond_a: null
  affirmations:
  - F43 [valeur, sans verdict] Une dette construite par des cadeaux fiscaux aux plus riches et aux grandes entreprises
    est illégitime et n'a pas à être payée. (sources S37)
- id: A18
  auteur: extreme-gauche
  question: Q47
  position: nuance
  enonce: Les marges budgétaires se trouvent d'abord dans les recettes tirées des profits et dans l'arrêt des aides
    aux entreprises, non dans les économies sur les budgets utiles à la population. Lutte ouvrière dit que la dette
    est celle de la bourgeoisie et que c'est à elle de la payer, sans proposer d'annulation d'une part précise.
  raisonnement: Si la dette a été creusée par des aides aux entreprises (270 milliards d'euros par an de aides et
    exonérations selon Lutte ouvrière), alors dégager des marges en supprimant ces aides et en taxant les profits
    est préférable aux économies sur les services publics, que cette position refuse. Elle ne retient pas l'annulation
    comme voie principale.
  porte_par: Lutte ouvrière, campagne de Nathalie Arthaud (LO, S35)
  repond_a: null
  affirmations:
  - 'F42 [fait, Invérifiable] Les aides publiques et exonérations versées chaque année aux entreprises privées atteignent
    270 milliards d''euros (chiffre cité par Lutte ouvrière, en 2026). — La brochure de Lutte ouvrière (juin 2026)
    cite bien 270 milliards, sans origine ni méthode. Les estimations publiques connues dépendent du périmètre retenu
    : la commission d''enquête du Sénat (juillet 2025) retient 211 milliards d''euros pour 2023, présentés comme
    un plancher, et le Haut-commissariat à la stratégie et au plan 111,9 milliards (selon Public Sénat, 15 septembre
    2025). Aucune source officielle ouverte ne donne 270 milliards. (sources S35)'
