      statut_source: conforme
  - id: F11
    enonce: Les titres de dette publique française détenus pour le compte de l'Eurosystème ont été achetés sur le
      marché secondaire, auprès d'institutions financières, et non directement à l'État.
    type: fait
    verdict: Vrai
    explication: La FAQ de la BCE sur le programme PSPP indique que l'Eurosystème n'a jamais acheté sur le marché
      primaire, ces achats étant interdits par l'article 123 du TFUE ; cet article (F1) interdit l'achat direct
      à l'État pour tous les programmes. Public Sénat (niveau 4) rapporte la même chose ; doublon de F13.
    sources:
    - source: S13
      extrait: Ces opérations ont eu lieu sur le marché secondaire, c’est-à-dire auprès d’institutions financières,
        puisque les traités de l’Union européenne interdisent à la BCE de financer directement les États.
      statut_source: conforme
  - id: F12
    enonce: 'Une décision d''annuler spécifiquement la dette française détenue par l''Eurosystème ne pourrait pas
      être prise unilatéralement par la France : elle relèverait du Conseil des gouverneurs de la BCE.'
    type: fait
    verdict: Plutôt vrai
    explication: 'Les statuts du SEBC (art. 12.1) confient la politique monétaire au Conseil des gouverneurs, et
      les banques centrales nationales agissent selon les orientations et instructions de la BCE (art. 14.3) ; l''article
      130 TFUE interdit les instructions des gouvernements (F3). Aucun texte ni arrêt ne traite toutefois de l''annulation
      en particulier, et selon la présidente de la BCE (10 septembre 2026) une telle décision serait de toute façon
      contraire à l''article 123 : la compétence du Conseil ne signifie pas qu''il pourrait la prendre.'
    sources:
    - source: S12
      extrait: Une décision de « mettre au frigo » ou d’annuler spécifiquement (ou prioritairement) la dette française
        ne pourrait être prise unilatéralement par la France.
      statut_source: conforme
- id: A4
  auteur: expert-extreme-droite
  question: Q1
  position: contre
  enonce: Effacer une créance de la Banque de France sur l'État reviendrait à un financement monétaire de l'État,
    que les traités interdisent, et la France ne peut pas l'imposer seule à sa banque centrale.
  raisonnement: 'L''article 123 interdit toute forme de crédit ou de découvert de la banque centrale à l''État (F1,
    F2) : abandonner une créance détenue sur lui revient à lui faire un don équivalent, donc à un crédit sans contrepartie.
    L''article 130 interdit au gouvernement de donner des instructions à la banque centrale (F3), et la Banque de
    France fait partie de l''Eurosystème (F9) : le gouvernement ne peut donc pas décider seul l''effacement. Limite
    : le texte des articles 123 et 130 n''emploie pas le mot « annuler » ; la conclusion repose sur l''interprétation
    de l''interdiction du crédit, non sur une mention explicite.'
  porte_par:
  - qui: Christine Lagarde, présidente de la BCE (déclaration du 11 septembre 2026, rapportée par la presse)
