agent: expert-sociaux-democrates
phase: 5
sources:
  - ref: s1
    titre: "The Role of Central Bank Capital Revisited (ECB Working Paper Series No. 392)"
    auteur: "Ulrich Bindseil, Andres Manzanares, Benedict Weller (BCE)"
    date: "2004-09-01"
    adresse: "https://www.ecb.europa.eu/pub/pdf/scpwps/ecbwp392.pdf"
    niveau: 2
affirmations:
  - ref: f1
    enonce: "Un document de travail des services de la BCE (2004) retient comme hypothèse plus réaliste que des pertes prolongées d'une banque centrale conduiraient à une perte totale de crédibilité, la crédibilité variant avec le niveau de capital."
    type: estimation
    declaration: true
    sources:
      - {source: s1, extrait: "It is hence important to distinguish between a situation where an assumed absence of central bank’s concerns about balance sheet strength is shared by the public and the State, and the more realistic situation where prolonged central bank losses would lead to a complete loss of credibility."}
corrections:
  - vise: A32
    action: corriger
    raisonnement: "Le traité interdit deux actes précis (F1, F2) ; l'annulation d'une créance acquise sur le marché secondaire n'en est pas un, et le conseil des gouverneurs décide (F5). Ce silence n'établit pas l'autorisation (F27) : aucun avis d'institution ne traite ce cas. La proposition de 2021 passait par un contrat avec la BCE (F60), non par une décision d'un gouvernement."
  - vise: A47
    action: corriger
    raisonnement: "La prime de risque tient à un État qui « change les règles » seul. Si la BCE décide (F5, F60), sans instruction d'un gouvernement (F3), cette prémisse manque. Un doute sur le financement monétaire (F9) peut subsister ; aucune estimation n'existe dans un sens ou l'autre (F26)."
  - vise: A33
    action: corriger
    enonce: "La BCE affirme pouvoir remplir son mandat malgré des pertes (F58) ; si son conseil décide lui-même l'effacement, aucun gouvernement ne donne d'instruction (F3, F5). L'effet de fonds propres négatifs sur la crédibilité n'est pas établi."
    raisonnement: "Le volet indépendance découle de F3 et F5 pour une décision du conseil. Le volet capacité d'action repose sur F58 (débat entre experts) ; un document des services de la BCE tient la perte de crédibilité pour possible en cas de pertes prolongées (f1). Ce volet n'est donc pas démontré."
  - vise: A48
    action: corriger
    raisonnement: "F3 interdit les instructions des gouvernements ; si le conseil décide (F5), aucune instruction n'est donnée. Pour la crédibilité, la compatibilité avec les traités est disputée (F27) : le doute sur le financement monétaire (F9) n'est pas établi, mais pas écarté non plus. L'atteinte à la crédibilité n'est démontrée dans aucun sens."
  - vise: A34
    action: corriger
    raisonnement: "La créance d'une banque centrale n'est pas celle d'un épargnant privé (F17). Rembourser oblige à réemprunter, à lever l'impôt ou à réduire la dépense ; l'effacement évite ces choix sans léser de créancier privé. La marge nette pour l'État n'est pas chiffrée, des intérêts lui revenant en partie (F41, F20)."
  - vise: A36
    action: corriger
    enonce: "L'effacement ne se substitue aux autres leviers que s'il est conditionné : les États s'engagent à investir les montants effacés. La marge nette qu'il dégagerait n'est pas chiffrée."
    raisonnement: "Rembourser exige de réemprunter, de relever les impôts ou de réduire les dépenses (F17). Le texte de 2021 fait de l'effacement un échange : le même montant est investi dans la reconstruction écologique et sociale (F59). La marge nette n'est pas établie (F41, F20) : l'effacement n'est pas présenté comme préférable en soi."
reponses_relances:
  - relance: R3
    texte: "Je n'ai pas de source (arrêt, avis d'institution) qui traite ce cas précis ; je n'en ai pas trouvé. F45 et F57 établissent un silence du texte, pas une autorisation : A32 est corrigé en ce sens. La thèse se limite à dire que l'interdiction n'est pas démontrée (F27). Sur T1 (A37) : la proposition de 2021 passait par un contrat avec la BCE (F60), non par une décision d'un gouvernement ; la proposition de 2026 portée par un gouvernement n'est pas défendue par A32."
    elements: [A32]
  - relance: R6
    texte: "T4 (A51) a raison : le scénario d'une décision du conseil suppose que la BCE change de position (F11, F13), et un doute sur le financement monétaire (F9) peut subsister. A47 est corrigé : il ne dit plus qu'aucun autre motif de prime n'existe. Reste établi qu'aucune estimation de l'effet sur les taux n'existe (F26)."
    elements: [A47]
  - relance: R12
    texte: "Je n'ai pas trouvé d'institution qui établisse que des fonds propres durablement négatifs soient sans effet. J'ai trouvé l'inverse : un document des services de la BCE de 2004 (f1). Sur T11 (A40) : la solvabilité ne répond pas à la perception d'un financement monétaire (F9). A33 est corrigé : le volet crédibilité n'est plus affirmé."
    elements: [A33, f1]
  - relance: R13
    texte: "Je n'ai pas d'estimation d'institution sur l'effet, pour la crédibilité de l'euro, d'une décision du conseil des gouverneurs. Le seul document trouvé (f1) porte sur les pertes d'une banque centrale, pas sur ce cas. Sur T11 (A53) : une légalité disputée peut créer un doute (F27), que A48 ne peut écarter ; A48 est corrigé pour dire que l'atteinte n'est démontrée dans aucun sens."
    elements: [A48, f1]
  - relance: R16
    texte: "A50 (F48, F31) établit que les titres de l'Eurosystème arrivent à échéance et sont remboursés comme les autres, depuis la fin des réinvestissements du PEPP. Cela ne contredit pas T17 : celle-ci porte sur l'absence de créancier privé lésé (F24), non sur le calendrier. Que modifier les conditions pour un détenteur public change le contrat est un désaccord de droit et de valeur, que je ne tranche pas par un fait nouveau."
    elements: []
  - relance: R17
    texte: "Je n'ai pas de source qui chiffre la marge nette compte tenu des versements de la Banque de France (F19, F20) ; F41 reste sans estimation. A34 est corrigé : il ne présente plus la marge comme acquise. Ce qui reste établi : l'ampleur de la détention (F17) et le fait que le remboursement doit être financé."
    elements: [A34]
  - relance: R25
    texte: "Je n'ai pas de source qui chiffre la marge nette (F19, F20, F41). A36 est corrigé : la thèse ne dit plus que l'effacement dégage une marge, elle conditionne son usage à l'engagement d'investir (F59)."
    elements: [A36]
incertitudes:
  - "f1 est un document de travail de 2004, non une position officielle de la BCE ; il ne traite pas d'un effacement décidé par le conseil des gouverneurs."
  - "Aucune source d'institution n'a été trouvée sur le cas précis de l'annulation de titres déjà détenus, sur la marge nette ni sur l'effet sur la crédibilité."
