    date: '2026-08-24'
    adresse: https://dettedelafrance.fr/actualites/annuler-la-dette-detenue-par-la-bce-ce-que-dit-l-economie
    niveau: 4
    statut: a-verifier
    demande: null
  a_controler:
  - affirmation: F41
    enonce: Les intérêts que l'État paie à la Banque de France sur les titres qu'elle détient contribuent à son
      résultat, dont une part revient à l'État (dividende et impôt).
    type: estimation
    declaration: false
    extrait_annonce: Il a argué que la Banque de France étant détenue par l'État, les intérêts versés sont reversés
      sous forme de dividendes.
