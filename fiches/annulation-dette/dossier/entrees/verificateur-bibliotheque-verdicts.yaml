agent: verificateur
role: verificateur
phase: 3
affirmations:
  - {id: F1, verdict: "Vrai", explication: "L'article 123, paragraphe 1, du TFUE (version consolidée 2016) interdit à la BCE et aux banques centrales nationales d'accorder des découverts ou tout autre type de crédit aux administrations publiques. Le texte est explicite."}
  - {id: F2, verdict: "Vrai", explication: "La même phrase de l'article 123, paragraphe 1, du TFUE interdit l'acquisition directe, auprès des États, des instruments de leur dette par la BCE ou les banques centrales nationales. L'interdiction vise l'achat direct (marché primaire), pas les achats sur le marché secondaire."}
  - {id: F3, verdict: "Vrai", explication: "L'article 130 du TFUE, repris à l'article 7 des statuts du SEBC, interdit à la BCE, aux banques centrales nationales et aux membres de leurs organes de décision de solliciter ou d'accepter des instructions, notamment des gouvernements des États membres."}
  - {id: F4, verdict: "Vrai", explication: "L'article 131 du TFUE, repris à l'article 14.1 des statuts du SEBC, impose à chaque État membre de veiller à la compatibilité de sa législation nationale, y compris les statuts de sa banque centrale, avec les traités et les statuts."}
  - {id: F5, verdict: "Vrai", explication: "L'article 12.1 des statuts du SEBC et de la BCE confie au conseil des gouverneurs l'adoption des orientations et des décisions nécessaires aux missions du SEBC."}
  - {id: F6, verdict: "Vrai", explication: "L'article 18.1 des statuts du SEBC et de la BCE autorise la BCE et les banques centrales nationales à intervenir sur les marchés de capitaux afin d'atteindre les objectifs du SEBC. Cette faculté reste encadrée par l'interdiction de l'article 123 du TFUE."}
  - {id: F7, verdict: "Vrai", explication: "L'article 32.1 des statuts du SEBC et de la BCE prévoit que le revenu monétaire des banques centrales nationales est réparti à la fin de chaque exercice, selon les règles de cet article."}
  - {id: F8, verdict: "Vrai", explication: "Le dispositif de l'arrêt Gauweiler (CJUE, grande chambre, 16 juin 2015, C-62/14) dit pour droit que les articles 119, 123, paragraphe 1, et 127 du TFUE autorisent le SEBC à adopter un programme d'achat d'obligations souveraines sur les marchés secondaires. L'autorisation porte sur un programme « tel que celui annoncé » en septembre 2012 (opérations monétaires sur titres), avec les conditions qui l'encadrent."}
  - {id: F9, verdict: "Vrai", explication: "Au point 107 de l'arrêt Weiss (CJUE, grande chambre, 11 décembre 2018, C-493/17), la Cour indique que le SEBC doit entourer son intervention de garanties suffisantes pour la concilier avec l'interdiction du financement monétaire de l'article 123 du TFUE."}
  - {id: F10, verdict: "Vrai", explication: "Le point 1 du dispositif de l'arrêt Weiss (C-493/17) dit pour droit que l'examen des questions n'a révélé aucun élément de nature à affecter la validité de la décision (UE) 2015/774 de la BCE du 4 mars 2015, relative au programme d'achats d'actifs du secteur public sur les marchés secondaires."}
  - {id: F11, verdict: "Vrai", explication: "Déclaration vérifiée : dans l'entretien avec Ouest-France publié par la BCE le 12 septembre 2026, Christine Lagarde qualifie l'annulation de la dette française détenue par la Banque de France de « financièrement très dangereux » et de « violation des traités européens ». Le verdict porte sur la réalité de la déclaration, pas sur son bien-fondé ; les termes jugeants doivent rester entre guillemets et attribués."}
  - {id: F12, verdict: "Vrai", explication: "Déclaration vérifiée : dans l'entretien avec Le Journal du Dimanche publié par la BCE le 7 février 2021, Christine Lagarde répond à la pétition d'économistes que « l'annulation de cette dette est inenvisageable ». Le verdict porte sur la réalité de la déclaration."}
  - {id: F13, verdict: "Vrai", explication: "Déclaration vérifiée : dans le même entretien du 7 février 2021, Christine Lagarde ajoute que ce serait une violation du traité européen qui interdit strictement le financement monétaire des États. Le verdict porte sur la réalité de la déclaration ; l'interprétation juridique elle-même relève des affirmations sur le traité et la jurisprudence."}
  - {id: F14, verdict: "Vrai", explication: "Déclaration vérifiée : dans l'entretien avec La Provence publié par la BCE le 2 juillet 2021, Christine Lagarde répond sur l'annulation de la dette souveraine que c'est contraire à la législation et représenterait une violation des traités. Le verdict porte sur la réalité de la déclaration."}
  - {id: F15, verdict: "Vrai", explication: "Déclaration vérifiée : dans le même entretien du 2 juillet 2021, Christine Lagarde indique que la plupart des « dettes COVID » de l'État français achetées sur le marché secondaire au titre de la politique monétaire sont inscrites au bilan de la Banque de France. Le verdict porte sur la réalité de la déclaration."}
  - {id: F16, verdict: "Plutôt vrai", explication: "Le rapport d'information de la commission des finances du Sénat (24 septembre 2025) écrit au conditionnel que l'Eurosystème « détiendrait » près d'un quart des OAT, en commentant la détention au premier trimestre 2025. Le chiffre sous-jacent (24,4 %) porte sur une catégorie « autres français » qui inclut la Banque de France pour le compte de la BCE mais n'est pas limitée à elle : l'ordre de grandeur est sourcé, la précision est moindre que ne le suggère l'énoncé."}
  - {id: F17, verdict: "Vrai", explication: "Le tableau du rapport du Sénat (24 septembre 2025) attribue 24,4 % de la dette négociable de l'État, au premier trimestre 2025 et en valeur de marché, à la catégorie « autres français (dont la Banque de France pour le compte de la BCE) ». L'énoncé reprend fidèlement ce périmètre."}
  - {id: F18, verdict: "Vrai", explication: "Le communiqué de la Banque de France du 24 mars 2026 annonce un bénéfice net de 8,1 Md€ pour l'exercice 2025."}
  - {id: F19, verdict: "Vrai", explication: "Le document de la Banque de France sur les comptes annuels de l'exercice 2025 (mars 2026) indique un impôt sur les bénéfices de 1,5 Md€ et un résultat net de 8,1 Md€ ; il concorde avec le communiqué du 24 mars 2026 (F18)."}
  - {id: F20, verdict: "Vrai", explication: "Le document de la Banque de France sur l'exercice 2025 (mars 2026) indique 36,8 Md€ versés au budget de l'État depuis 2015. Ce total couvre 2015-2025 et réunit impôt sur les sociétés, dividendes et restitution d'excédents : la fiche doit préciser cette composition."}
  - {id: F21, verdict: "Vrai", explication: "Le Bulletin de la Banque de France n° 260/6 (septembre-octobre 2025) indique, d'après les données des banques centrales nationales, que la Banque de France a été contributrice nette au partage du revenu monétaire de 2015 à 2022, puis bénéficiaire nette en 2023-2024."}
  - {id: F22, verdict: "Vrai", explication: "La synthèse du rapport de la Cour des comptes sur la situation et les perspectives des finances publiques (juin 2026) chiffre la charge de la dette de l'ensemble des administrations publiques à 65,7 Md€ en 2025, soit 2,2 points de PIB, en hausse de plus de 9 % par rapport à 2024."}
  - {id: F23, verdict: "Trompeur", explication: "Le chiffre de 77,4 Md€ (2,5 points de PIB, +11,7 Md€) figure bien dans la synthèse de la Cour des comptes de juin 2026, mais comme prévision de charge de la dette de l'ensemble des administrations publiques pour 2026 (« devrait »), sans être attribué à la loi de finances pour 2026. La mention de la LFI promulguée le 19 février 2026, dans la même page, porte sur la dépense publique (1 735 Md€), pas sur la charge de la dette ; l'énoncé doit dire « selon la Cour des comptes (juin 2026), pour l'ensemble des administrations publiques »."}
