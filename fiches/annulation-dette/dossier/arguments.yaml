    enonce: L'article 123 vise deux actes précis (crédit direct, achat direct) ; que l'effacement d'une créance
      déjà acquise sur le marché secondaire reviendrait à un financement interdit est une interprétation, non une
      conséquence du texte.
    raisonnement: 'A1 déduit l''interdiction de ce que les titres ont été achetés à des investisseurs (F24) : cela
      établit que l''achat initial était régulier, pas que le traitement ultérieur du titre est interdit. Le traité
      ne mentionne pas ce cas (F57) et F27 reste invérifiable ; l''« avantage après coup » est une lecture que la
      Cour n''a pas validée.'
    position: oui
    porte_par:
    - parti: PP
      source: S43
      personne_ou_groupe_ancien: Aurore Lalucq, députée européenne (tribune collective, février 2021)
