  - id: A34
    auteur: sociaux-democrates
    question: Q45
    position: non
    enonce: 'Au premier trimestre 2025, la catégorie « autres français », dont la Banque de France pour le compte
      de la BCE, représente 24,4 % de la dette négociable de l''État. Rembourser la banque centrale oblige à trouver
      la somme ailleurs : nouvel emprunt, impôts ou baisse des dépenses.'
    raisonnement: 'La créance d''une banque centrale n''est pas celle d''un épargnant privé : l''État se la doit
      en partie à lui-même (F17). Rembourser obligerait à rouler la dette au lieu d''investir, à augmenter les impôts
      ou à baisser les dépenses ; l''effacement évite ces choix sans spolier de créancier privé. Argument de 2021
      ; l''obligation de rembourser des créanciers privés n''est pas remise en cause par ce texte.'
    porte_par: '**Aurore Lalucq** (députée européenne, PP), 5 février 2021 [S43, S53]'
    repond_a: null
    affirmations:
    - 'F16 [fait, Plutôt vrai] L''Eurosystème détient près d''un quart des OAT au titre de la politique monétaire
