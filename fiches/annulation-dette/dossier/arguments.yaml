    enonce: 'Un État ne doit pas rembourser une dette construite par des cadeaux fiscaux et des aides aux plus riches
      et aux grandes entreprises : elle est illégitime. Avant toute décision, un audit citoyen doit établir qui
      a prêté, à quel taux, quelle part est déjà remboursée, et un moratoire suspend les paiements.'
    position: non
    porte_par:
    - parti: NPA
      source: S37
      personne_ou_groupe_ancien: NPA (tract sur la dette)
  corrige: true
