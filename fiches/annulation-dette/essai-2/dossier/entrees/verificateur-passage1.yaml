sources:
  - {id: S11, statut: conforme, note: "Bon document (Euronews, Olivier Tolachides, publié le 11 septembre 2026) ; l'extrait y figure mot pour mot. L'article ne date pas la conférence de presse : la transcription officielle de la BCE la situe le 10 septembre 2026 (voir F10)."}
  - {id: S12, statut: conforme, note: "Bon titre et bon auteur (Fondation IFRAP) ; l'extrait y figure mot pour mot, suivi de la phrase sur le Conseil des gouverneurs. La date du 1er septembre 2026 n'apparaît pas dans la page (pas de date en métadonnées ; les notes citent des articles jusqu'au 27 août 2026) : non confirmée. Source de niveau 3 : elle restitue un argument, le fait F12 a été contrôlé sur les statuts du SEBC."}
  - {id: S13, statut: conforme, note: "Bon document (Public Sénat, 25 août 2026) ; les deux extraits y figurent mot pour mot. La citation de Jean-Luc Mélenchon est datée « dimanche », lors du discours de clôture des universités d'été de LFI à Châteauneuf-sur-Isère, soit le dimanche 23 août 2026."}
  - {id: S14, statut: inaccessible, note: "Réessayé le 10 novembre 2026 : 403. Essayé aussi : version anglaise (banque-france.fr/en/node/1924173, 403) et variante d'adresse « …dette-publique-detenue-par-la-banque-de-france » (403) ; le PDF CP_BDF_Dette_120926 est déjà signalé en 403. Titre, auteur et niveau non établis faute d'ouverture ; un résumé de moteur de recherche n'a pas été retenu comme source."}
  - {id: S15, statut: conforme, note: "Bon document : Euronews, Eleonora Vasques, publié le 27 août 2026, titre conforme. Aucune affirmation de ce lot ne le cite."}
  - {id: S16, statut: conforme, note: "Bon document : proposition de résolution n° 2914, XVe législature, enregistrée le 11 mai 2020, présentée par Jean-Luc Mélenchon et les députés du groupe La France insoumise ; titre conforme. Aucune affirmation de ce lot ne la cite."}
affirmations:
  - {id: F10, verdict: "Plutôt vrai", explication: "La transcription officielle de la BCE (ecb.europa.eu, ecb.is260910) confirme que Christine Lagarde a dit, en anglais, que tout ce qui irait contre l'interdiction de financement de la dette serait « a pure violation of the Treaty », en réponse à une question sur le gel ou l'annulation d'une part de la dette française. Mais la conférence de presse a eu lieu le 10 septembre 2026 à Berlin, pas le 11 (date de l'article d'Euronews)."}
  - {id: F11, verdict: "Vrai", explication: "La FAQ de la BCE sur le programme PSPP indique que l'Eurosystème n'a jamais acheté sur le marché primaire, ces achats étant interdits par l'article 123 du TFUE ; cet article (F1) interdit l'achat direct à l'État pour tous les programmes. Public Sénat (niveau 4) rapporte la même chose ; doublon de F13."}
  - {id: F12, verdict: "Plutôt vrai", explication: "Les statuts du SEBC (art. 12.1) confient la politique monétaire au Conseil des gouverneurs, et les banques centrales nationales agissent selon les orientations et instructions de la BCE (art. 14.3) ; l'article 130 TFUE interdit les instructions des gouvernements (F3). Aucun texte ni arrêt ne traite toutefois de l'annulation en particulier, et selon la présidente de la BCE (10 septembre 2026) une telle décision serait de toute façon contraire à l'article 123 : la compétence du Conseil ne signifie pas qu'il pourrait la prendre."}
  - {id: F13, verdict: "Vrai", explication: "Même contenu que F11 (doublon) : la FAQ de la BCE sur le PSPP indique qu'aucun achat n'a eu lieu sur le marché primaire, en raison de l'article 123 du TFUE, qui interdit l'achat direct aux États pour tous les programmes."}
  - {id: F14, verdict: "Vrai", explication: "Public Sénat (25 août 2026) rapporte cette phrase, prononcée « dimanche » (23 août 2026) lors du discours de clôture des universités d'été de LFI à Châteauneuf-sur-Isère. L'enregistrement du discours n'a pas été consulté ; la presse suffit ici pour rapporter une déclaration."}
