verdicts_a_attribuer:
- id: F24
  enonce: Les titres de dette française détenus par l'Eurosystème ont été achetés sur le marché secondaire, auprès
    d'institutions financières, et non directement auprès de l'État.
  type: fait
  declaration: false
  sources:
  - source: S19
    niveau: 4
    statut: conforme
    note_verif: 'Bon document (Public Sénat, 25 août 2026) ; la source établit que Jean-Luc Mélenchon est « leader
      de la France insoumise (LFI) ». F24 et F44 : extrait mot pour mot, même chose (achats de 2010 puis de 2020
      pour le compte de la BCE). F46 : extrait présent (18 %, mais le chapô dit « 20 % ») ; que les autres créanciers
      ne soient pas concernés n''est que sous-entendu, par un économiste cité. F47 : extrait présent, mais c''est
      l''avis de Jean-Luc Mélenchon que l''article dit contesté par des économistes (hausse des taux possible),
      pas une estimation qu''il établit. F54 : l''extrait ne dit pas la même chose (le mot austérité est absent
      de la page).'
    extrait: Ces opérations ont eu lieu sur le marché secondaire, c’est-à-dire auprès d’institutions financières
- id: F25
  enonce: Le 24 août 2026, le taux d'intérêt de la France à 10 ans était de 4,11 %, après avoir dépassé 4,14 % le
    jeudi précédent, son plus haut niveau depuis 2008.
  type: fait
  declaration: false
  sources:
  - source: S16
    niveau: 4
    statut: conforme
    note_verif: 'Bon document (MoneyVox avec AFP, publié le 24 août 2026 à 10h00), les trois extraits y figurent
      mot pour mot. F25 : même chose (10 ans, 4,11 % le lundi 24 août, plus de 4,14 % le jeudi, record depuis 2008),
      mais c''est une valeur de la matinée. F26 et F27 sont seulement l''avis attribué à Roland Lescure (BFMTV/RMC)
      : la source montre qu''il l''a dit, sans établir l''effet sur les taux ni l''illégalité. Partis : Roland Lescure
      est seulement présenté comme « ministre de l''Economie » ; son appartenance à Renaissance (porte_par) n''est
      PAS établie par cette source, et Jean-Luc Mélenchon y est désigné comme candidat, sans parti.'
    extrait: Lundi, le taux d'intérêt de la France à 10 ans était à 4,11%, après avoir dépassé jeudi 4,14%, au plus
      depuis 2008.
- id: F26
  enonce: Une annulation unilatérale d'une partie de la dette publique ferait monter les taux auxquels la France
    emprunte, car les prêteurs réclameraient une prime de risque supplémentaire.
  type: estimation
  declaration: false
  sources:
  - source: S16
    niveau: 4
    statut: conforme
    note_verif: 'Bon document (MoneyVox avec AFP, publié le 24 août 2026 à 10h00), les trois extraits y figurent
