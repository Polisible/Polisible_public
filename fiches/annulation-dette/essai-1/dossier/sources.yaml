- id: S4
  titre: '« Milliards magiques » : le droit permet-il une annulation de la dette COVID ?'
  auteur: Thierry Bonneau, professeur de droit (Université Paris-Panthéon-Assas), Le Club des Juristes
  date: '2021-02-11'
  adresse: https://www.leclubdesjuristes.com/archives-cdj/milliards-magiques-le-droit-permet-il-une-annulation-de-la-dette-covid-3344/
  niveau: 2
  ajoutee_par: expert-centre
  statut: conforme
  note_verif: 'Bon document : Thierry Bonneau, Club des Juristes, 11 février 2021. F5 : extrait présent (« il n''interdit
    pas expressément l''annulation de la dette souveraine détenue par la BCE »), même sens. F7 et F12 : extrait
    présent ; la partie de F7 sur le marché secondaire est une déduction que l''auteur tire du texte et de la jurisprudence
    de la CJUE, tout en soutenant plus loin que l''article 123 a une portée moins limitée que celle admise par la
    jurisprudence.'
