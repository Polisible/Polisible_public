affirmations:
  - ref: f1
    enonce: "Le traité interdit à la BCE et aux banques centrales nationales d'accorder des découverts ou crédits aux administrations publiques (Q41)."
    type: fait
    sources:
      - {source: s1, extrait: "Il est interdit à la Banque centrale européenne et aux banques centrales des États membres, ci-après dénommées \"banques centrales nationales\", d'accorder des découverts ou tout autre type de crédit aux institutions, organes ou organismes de l'Union, aux administrations centrales"}
  - ref: f2
    enonce: "Le traité interdit l'acquisition directe, auprès des États, de leurs titres de dette par la BCE ou les banques centrales nationales (Q41)."
    type: fait
    sources:
      - {source: s1, extrait: "l'acquisition directe, auprès d'eux, par la Banque centrale européenne ou les banques centrales nationales, des instruments de leur dette est également interdite."}
  - ref: f3
    enonce: "Le traité dispose que ni la BCE, ni une banque centrale nationale, ni un membre de leurs organes de décision ne peuvent solliciter ni accepter d'instructions des gouvernements (Q41, Q44)."
    type: fait
    sources:
      - {source: s1, extrait: "ni la Banque centrale européenne, ni une banque centrale nationale, ni un membre quelconque de leurs organes de décision ne peuvent solliciter ni accepter des instructions"}
  - ref: f4
    enonce: "Le traité prévoit que chaque État membre veille à la compatibilité de sa législation nationale, y compris les statuts de sa banque centrale, avec les traités et les statuts du SEBC (Q41, Q44)."
    type: fait
    sources:
      - {source: s1, extrait: "Chaque État membre veille à la compatibilité de sa législation nationale, y compris les statuts de sa banque centrale nationale, avec les traités et les statuts du SEBC et de la BCE."}
  - ref: f5
    enonce: "Le conseil des gouverneurs de la BCE arrête les orientations et prend les décisions nécessaires aux missions du SEBC (qui décide, Q41)."
    type: fait
    sources:
      - {source: s1, extrait: "Le conseil des gouverneurs arrête les orientations et prend les décisions nécessaires à l'accomplissement des missions confiées au SEBC par les traités et les présents statuts."}
  - ref: f6
    enonce: "La BCE et les banques centrales nationales peuvent intervenir sur les marchés de capitaux pour atteindre les objectifs du SEBC (Q41)."
    type: fait
    sources:
      - {source: s1, extrait: "Afin d'atteindre les objectifs du SEBC et d'accomplir ses missions, la BCE et les banques centrales nationales peuvent:"}
  - ref: f7
    enonce: "Le revenu monétaire des banques centrales nationales est réparti à la fin de chaque exercice (Q43)."
    type: fait
    sources:
      - {source: s1, extrait: "Le revenu dégagé par les banques centrales nationales dans l'exercice des missions de politique monétaire du SEBC, ci-après dénommé \"revenu monétaire\", est réparti à la fin de chaque exercice conformément au présent article."}
  - ref: f8
    enonce: "Dans l'arrêt Gauweiler (C-62/14, 16 juin 2015), la Cour dit pour droit que le SEBC est autorisé à adopter un programme d'achat d'obligations souveraines sur les marchés secondaires (Q41)."
    type: fait
    sources:
      - {source: s2, extrait: "doivent être interprétés en ce sens qu'ils autorisent le Système européen de banques centrales (SEBC) à adopter un programme d'achat d'obligations souveraines sur les marchés secondaires"}
  - ref: f9
    enonce: "Dans l'arrêt Weiss (C-493/17, 11 décembre 2018), la Cour rappelle que le SEBC doit concilier ses interventions avec l'interdiction du financement monétaire de l'article 123 TFUE (Q41)."
    type: fait
    sources:
      - {source: s3, extrait: "le SEBC doit entourer son intervention de garanties suffisantes pour concilier celle-ci avec l'interdiction du financement monétaire découlant de l'article 123 TFUE"}
  - ref: f10
    enonce: "Dans l'arrêt Weiss (C-493/17), la Cour dit pour droit que l'examen des questions n'a révélé aucun élément affectant la validité de la décision (UE) 2015/774 de la BCE (Q41)."
    type: fait
    sources:
      - {source: s3, extrait: "L'examen des première à quatrième questions préjudicielles n'a révélé aucun élément de nature à affecter la validité de la décision (UE) 2015/774 de la Banque centrale européenne"}
  - ref: f11
    enonce: "Christine Lagarde, présidente de la BCE, déclare le 12 septembre 2026 que l'annulation de la dette française détenue par la Banque de France serait financièrement très dangereuse et contraire aux traités (Q41, Q44)."
    type: fait
    declaration: true
    sources:
      - {source: s4, extrait: "C'est financièrement très dangereux et il se trouve que c'est aussi une violation des traités européens."}
  - ref: f12
    enonce: "Christine Lagarde déclare le 7 février 2021 que l'annulation de la dette publique détenue par la BCE, demandée par une pétition d'économistes, est inenvisageable (Q41)."
    type: fait
    declaration: true
    sources:
      - {source: s5, extrait: "L'annulation de cette dette est inenvisageable."}
  - ref: f13
    enonce: "Christine Lagarde déclare le 7 février 2021 que cette annulation violerait le traité européen qui interdit le financement monétaire des États (Q41, Q44)."
    type: fait
    declaration: true
    sources:
      - {source: s5, extrait: "Ce serait une violation du traité européen qui interdit strictement le financement monétaire des Etats."}
  - ref: f14
    enonce: "Christine Lagarde déclare le 2 juillet 2021 que l'annulation des dettes publiques serait contraire à la législation et aux traités (Q41)."
    type: fait
    declaration: true
    sources:
      - {source: s6, extrait: "D'abord, c'est contraire à la législation et représenterait une violation des traités."}
  - ref: f15
    enonce: "Christine Lagarde déclare le 2 juillet 2021 que la plupart des « dettes COVID » achetées par la politique monétaire sont inscrites au bilan de la Banque de France (Q41)."
    type: fait
    declaration: true
    sources:
      - {source: s6, extrait: "La plupart des « dettes COVID » contractées par l'Etat français et achetées sur le marché secondaire dans le cadre de la politique monétaire sont inscrites au bilan de la Banque de France"}
  - ref: f16
    enonce: "L'Eurosystème détient près d'un quart des OAT au titre de la politique monétaire (données du premier trimestre 2025, rapport du Sénat) (Q41)."
    type: fait
    sources:
      - {source: s10, extrait: "L'Eurosystème détiendrait près d'un quart des OAT à ce titre ."}
  - ref: f17
    enonce: "Au premier trimestre 2025, la catégorie « autres français », dont la Banque de France pour le compte de la BCE, représentait 24,4 % de la dette négociable de l'État (Q41)."
    type: fait
    sources:
      - {source: s10, extrait: "Autres français (dont la Banque de France pour le compte de la BCE) 24,4 %"}
  - ref: f18
    enonce: "Le 24 mars 2026, la Banque de France annonce un bénéfice net de 8,1 milliards d'euros pour l'exercice 2025 (Q43)."
    type: fait
    sources:
      - {source: s8, extrait: "La Banque de France enregistre un bénéfice net de 8,1 Mds €."}
  - ref: f19
    enonce: "Pour l'exercice 2025, la Banque de France verse un impôt sur les bénéfices de 1,5 milliard d'euros avant d'atteindre un résultat net de 8,1 milliards (Q43)."
    type: fait
    sources:
      - {source: s7, extrait: "Après paiement de l'impôt sur les bénéfices (1,5 milliard d'euros), le résultat net ressort à 8,1 milliards d'euros."}
  - ref: f20
    enonce: "La Banque de France est un contributeur au budget de l'État : 36,8 milliards d'euros versés depuis 2015 (Q43)."
    type: fait
    sources:
      - {source: s7, extrait: "avec un total de 36,8 milliards d'euros versés depuis 2015"}
  - ref: f21
    enonce: "La Banque de France, contributrice nette au partage du revenu monétaire entre 2015 et 2022, est devenue bénéficiaire nette en 2023-2024 (Q43)."
    type: fait
    sources:
      - {source: s9, extrait: "La Banque de France, contributrice nette au titre du partage du revenu monétaire entre 2015 et 2022, est devenue bénéficiaire nette en 2023-2024"}
  - ref: f22
    enonce: "En 2025, la charge de la dette de l'ensemble des administrations publiques atteint 65,7 milliards d'euros, soit 2,2 points de PIB (Cour des comptes, juin 2026) (Q43)."
    type: fait
    sources:
      - {source: s11, extrait: "65,7 Md€ (2,2 points de PIB), soit une"}
  - ref: f23
    enonce: "La prévision de charge de la dette pour 2026 atteint 77,4 milliards d'euros dans la loi de finances pour 2026 (Cour des comptes, juin 2026) (Q43)."
    type: fait
    sources:
      - {source: s11, extrait: "porter celle-ci à 77,4 Md€"}
