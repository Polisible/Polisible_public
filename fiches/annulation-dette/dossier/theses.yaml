  - A50
  repond_a:
  - T17
  - T33
  examen:
    pertinence:
      valeur: oui
      justification: A4 et A50 répondent à la question du remboursement intégral quand le créancier est la banque
        centrale (F24).
    appui:
      valeur: partiel
      justification: 'Présupposés établis : achat sur le marché secondaire (F24, Vrai), fin des réinvestissements
        (F48, Vrai), stock en baisse (F31, Plutôt vrai) ; l''atteinte à la signature est un effet sur les prêteurs
        qu''aucune estimation n''établit (F26, réponse à R14).'
    raisonnement:
      valeur: valide
      justification: De la priorité donnée au respect des conditions du titre, la conclusion découle ; A50 présente
        lui-même l'effet sur le marché comme une estimation (F48, F31).
    portee:
      texte: établit que ces titres ont été acquis sur le marché et sont remboursés à échéance comme les autres
