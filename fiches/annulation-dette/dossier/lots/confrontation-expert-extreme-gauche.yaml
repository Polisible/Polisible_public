- id: A17
  auteur: expert-extreme-gauche
  question: Q45
  position: contre
  enonce: 'Un État ne doit pas rembourser une dette construite par des cadeaux fiscaux et des aides aux plus riches
    et aux grandes entreprises : elle est illégitime. Avant toute décision, un audit citoyen doit établir qui a
    prêté, à quel taux, quelle part est déjà remboursée, et un moratoire suspend les paiements.'
  raisonnement: Si la dette résulte de choix de politique qui ont profité aux créanciers et aux entreprises plutôt
    qu'à la population, l'obligation de la rembourser intégralement ne va pas de soi. Le critère n'est pas l'identité
    du créancier mais la légitimité de la dette, que l'audit doit établir ; ce critère conduit à ne pas rembourser
    les dettes illégitimes, banque centrale ou non.
  porte_par:
  - qui: NPA (tract sur la dette)
    parti: NPA
    source: S37
  repond_a: null
  statut: ouvert
  affirmations:
  - id: F43
    enonce: Une dette construite par des cadeaux fiscaux aux plus riches et aux grandes entreprises est illégitime
      et n'a pas à être payée.
    type: valeur
    verdict: null
    explication: 'Affirmation de valeur, sans verdict : position du NPA (tract de fin 2011) selon laquelle une dette
      issue d''allègements accordés aux plus riches et aux grandes entreprises est illégitime.'
    sources:
    - source: S37
      extrait: n’a pas à être payée
      statut_source: conforme
- id: A18
  auteur: expert-extreme-gauche
  question: Q47
  position: nuance
  enonce: Les marges budgétaires se trouvent d'abord dans les recettes tirées des profits et dans l'arrêt des aides
    aux entreprises, non dans les économies sur les budgets utiles à la population. Lutte ouvrière dit que la dette
    est celle de la bourgeoisie et que c'est à elle de la payer, sans proposer d'annulation d'une part précise.
  raisonnement: Si la dette a été creusée par des aides aux entreprises (270 milliards d'euros par an de aides et
    exonérations selon Lutte ouvrière), alors dégager des marges en supprimant ces aides et en taxant les profits
    est préférable aux économies sur les services publics, que cette position refuse. Elle ne retient pas l'annulation
    comme voie principale.
  porte_par:
  - qui: Lutte ouvrière, campagne de Nathalie Arthaud
    parti: LO
    source: S35
  repond_a: null
  statut: ouvert
  affirmations:
  - id: F42
    enonce: Les aides publiques et exonérations versées chaque année aux entreprises privées atteignent 270 milliards
      d'euros (chiffre cité par Lutte ouvrière, en 2026).
    type: fait
    verdict: Invérifiable
    explication: 'La brochure de Lutte ouvrière (juin 2026) cite bien 270 milliards, sans origine ni méthode. Les
      estimations publiques connues dépendent du périmètre retenu : la commission d''enquête du Sénat (juillet 2025)
      retient 211 milliards d''euros pour 2023, présentés comme un plancher, et le Haut-commissariat à la stratégie
      et au plan 111,9 milliards (selon Public Sénat, 15 septembre 2025). Aucune source officielle ouverte ne donne
      270 milliards.'
    sources:
    - source: S35
      extrait: 270 milliards d’aides publiques et d’exonérations diverses versés chaque année
      statut_source: conforme
- id: A19
  auteur: expert-extreme-gauche
  question: Q47
  position: pour
  enonce: 'L''annulation de la dette publique est préférable à l''austérité : elle libère l''argent des intérêts
    pour des investissements et des emplois utiles à la population, et met fin au pouvoir des marchés. Elle doit
    toutefois porter sur les dettes illégitimes, pas sur la seule part de la banque centrale.'
  raisonnement: Si les intérêts payés aux créanciers privés absorbent des sommes qui financeraient des emplois publics
    (le tract NPA les chiffre à l'équivalent d'un million d'emplois en 2011), alors l'annulation dégage plus de
    marges que des économies qui frappent la population. La part détenue par la banque centrale étant reversée à
    l'État, annuler seulement celle-ci est jugé une diversion.
  porte_par:
  - qui: NPA (tract sur la dette) ; Tendance CLAIRE (courant du NPA)
    parti: NPA
    source: S37
  repond_a: null
  statut: ouvert
  affirmations:
