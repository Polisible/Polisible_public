- id: S10
  titre: Sur les enjeux associés à la structure de détention de la dette de l'État (rapport d'information)
  auteur: 'Sénat, commission des finances (rapporteur : Albéric de Montgolfier)'
  date: '2025'
  adresse: https://www.senat.fr/rap/r24-902/r24-902_mono.html
  niveau: 1
  ajoutee_par: bibliothecaire
  statut: conforme
  note_verif: 'Bon document : rapport d''information de la commission des finances du Sénat, rapporteur Albéric
    de Montgolfier, examiné et déposé le 24 septembre 2025 (date précisable : 2025-09-24). F16 : l''extrait figure
    mot pour mot, au conditionnel (« détiendrait »), dans la partie qui commente la structure de détention au premier
    trimestre 2025 ; même sens. F17 : le chiffre de 24,4 % figure dans le tableau « Autres français (dont la Banque
    de France pour le compte de la BCE) », titres de la dette négociable de l''État au premier trimestre 2025 en
    valeur de marché ; même périmètre.'
- id: S11
  titre: La situation et les perspectives des finances publiques (synthèse du rapport)
  auteur: Cour des comptes
  date: 2026-06
  adresse: https://www.ccomptes.fr/sites/default/files/2026-06/20260625-synthese-RSPFP-2026.pdf
  niveau: 1
  ajoutee_par: bibliothecaire
  statut: conforme
  note_verif: 'Bon document : synthèse du rapport de la Cour des comptes sur la situation et les perspectives des
    finances publiques, juin 2026. F22 : l''extrait figure et dit la même chose (charge de la dette de l''ensemble
    des administrations publiques en 2025, 65,7 Md€, 2,2 points de PIB, plus de 9 % par rapport à 2024). F23 : le
    chiffre de 77,4 Md€ (2,5 points de PIB, +11,7 Md€) figure comme prévision de charge de la dette des administrations
    publiques pour 2026, mais la synthèse ne l''attribue pas explicitement à la loi de finances pour 2026 (la mention
    de la LFI promulguée le 19 février porte sur la dépense hors charge de la dette, 1 735 Md€) : écart de périmètre
    sur la mention « dans la loi de finances pour 2026 ».'
