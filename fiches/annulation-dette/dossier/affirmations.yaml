      depuis 2008.
  declaration: false
  auteur: expert-centre
  passage: 1
  verdict: Plutôt vrai
  explication: La dépêche AFP reprise par MoneyVox le 24 août 2026 donne bien 4,11 % le lundi et plus de 4,14 %
