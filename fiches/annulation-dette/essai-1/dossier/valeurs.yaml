- id: V3
  question: Q1
  auteur: expert-extreme-droite
  enonce: La famille met en avant la souveraineté nationale et le rejet d'une dette effacée au détriment de la crédibilité
    financière de l'État ; aucun texte consulté ne tranche la question de la légalité elle-même.
