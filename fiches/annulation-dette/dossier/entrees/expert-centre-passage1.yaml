incertitudes:
  - "Les appartenances partisanes de Roland Lescure (Renaissance) et de Gabriel Attal (Renaissance) sont de connaissance générale ; je ne les ai pas établies par une source ouverte. Celle d'Édouard Philippe (Horizons) vient d'un site secondaire (ÉlyséeScope), non cité."
  - "Les déclarations de Lescure et de Philippe sont rapportées par la presse (AFP, Selectra, niveau 4), pas par un texte de leur parti ; leur formulation exacte est à vérifier."
  - "Je n'ai retrouvé aucune position du MoDem ni de l'UDI sur le sujet (recherche web limitée) ; François Bayrou a annoncé ne pas être candidat en 2027."
  - "Sébastien Lecornu, Premier ministre, a déclaré que l'opération détruirait la confiance (Euronews, 11 septembre 2026, source s3 ouverte) ; je n'ai pas pu établir son rattachement partisan, donc je ne l'ai pas utilisé dans porte_par."
  - "Q43 : je n'ai trouvé aucun Centre publiquement positionné sur le solde net des intérêts ; l'effet net dépend de la différence entre gel et annulation, et de la recapitalisation éventuelle de la Banque de France. Le raisonnement de a6 sur ce point est celui que l'on déduit des faits, non une position attribuée."
  - "L'affirmation f4 (contraire aux traités) est une interprétation juridique ; la Cour de justice ne s'est pas prononcée sur cette opération précise."
  - "Le montant détenu par la Banque de France varie selon les sources (environ 500 à 635 milliards d'euros) ; je n'ai pas retenu de chiffre."
