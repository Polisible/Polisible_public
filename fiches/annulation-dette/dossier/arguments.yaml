- id: A41
  question: Q42
  position: oui
  enonce: 'Le raisonnement de A22 ne suit pas : le taux ne rémunère pas seulement le risque sur la part annulée,
    il reflète aussi la confiance des prêteurs dans le respect des règles. Une opération juridiquement contestée
    peut donc peser sur les taux même si les créanciers privés sont payés.'
