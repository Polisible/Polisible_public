- id: F21
  enonce: La Banque de France, contributrice nette au partage du revenu monétaire entre 2015 et 2022, est devenue
    bénéficiaire nette en 2023-2024 (Q43).
  type: fait
  sources:
  - source: S9
    extrait: La Banque de France, contributrice nette au titre du partage du revenu monétaire entre 2015 et 2022,
      est devenue bénéficiaire nette en 2023-2024
  declaration: false
  auteur: bibliothecaire
  passage: 1
  verdict: Vrai
  explication: Le Bulletin de la Banque de France n° 260/6 (septembre-octobre 2025) indique, d'après les données
    des banques centrales nationales, que la Banque de France a été contributrice nette au partage du revenu monétaire
    de 2015 à 2022, puis bénéficiaire nette en 2023-2024.
  statut: verifiee
- id: F22
  enonce: En 2025, la charge de la dette de l'ensemble des administrations publiques atteint 65,7 milliards d'euros,
    soit 2,2 points de PIB (Cour des comptes, juin 2026) (Q43).
  type: fait
  sources:
  - source: S11
    extrait: 65,7 Md€ (2,2 points de PIB), soit une
  declaration: false
  auteur: bibliothecaire
  passage: 1
  verdict: Vrai
  explication: La synthèse du rapport de la Cour des comptes sur la situation et les perspectives des finances publiques
    (juin 2026) chiffre la charge de la dette de l'ensemble des administrations publiques à 65,7 Md€ en 2025, soit
    2,2 points de PIB, en hausse de plus de 9 % par rapport à 2024.
  statut: verifiee
- id: F23
  enonce: La prévision de charge de la dette pour 2026 atteint 77,4 milliards d'euros dans la loi de finances pour
    2026 (Cour des comptes, juin 2026) (Q43).
  type: fait
  sources:
  - source: S11
    extrait: porter celle-ci à 77,4 Md€
  declaration: false
  auteur: bibliothecaire
  passage: 1
  verdict: Trompeur
  explication: Le chiffre de 77,4 Md€ (2,5 points de PIB, +11,7 Md€) figure bien dans la synthèse de la Cour des
    comptes de juin 2026, mais comme prévision de charge de la dette de l'ensemble des administrations publiques
    pour 2026 (« devrait »), sans être attribué à la loi de finances pour 2026. La mention de la LFI promulguée
    le 19 février 2026, dans la même page, porte sur la dépense publique (1 735 Md€), pas sur la charge de la dette
    ; l'énoncé doit dire « selon la Cour des comptes (juin 2026), pour l'ensemble des administrations publiques
    ».
  statut: verifiee
