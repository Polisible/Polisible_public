  enonce: Le texte de 2021 propose que la BCE efface ses créances sur les États (ou les convertisse en dettes perpétuelles
    sans intérêt) en échange de l'engagement des États d'investir les mêmes montants dans la reconstruction écologique
    et sociale.
  sources:
