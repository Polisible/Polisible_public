  arguments:
  - id: A3
    auteur: centre
    question: Q44
    position: oui
    enonce: L'indépendance de la BCE repose sur l'interdiction faite aux gouvernements de lui donner des instructions
      ; lui imposer d'effacer ses actifs serait une instruction. La crédibilité de l'euro repose sur le respect
      des règles communes.
    raisonnement: Le traité interdit à la BCE et aux banques centrales nationales de solliciter ou d'accepter des
      instructions des gouvernements (F3) et oblige chaque État à rendre ses lois compatibles avec les traités (F4).
      Un État qui déciderait seul d'effacer des titres de l'Eurosystème, sans accord du conseil des gouverneurs
      (F5), afficherait que l'indépendance peut être levée par un gouvernement. Une monnaie commune n'a de valeur
      que si chaque membre applique les mêmes règles ; l'opération, jugée contraire aux traités (F27), reviendrait
      à n'en plus respecter les règles, avec un risque de défiance envers la signature des États et la monnaie.
    porte_par: '**Roland Lescure** (ministre de l''Économie, RE), 24 août 2026 [S16, S49]'
    repond_a: null
    affirmations:
    - F3 [fait, Vrai] Le traité dispose que ni la BCE, ni une banque centrale nationale, ni un membre de leurs organes
      de décision ne peuvent solliciter ni accepter d'instructions des gouvernements (Q41, Q44). (sources S1)
    - F4 [fait, Vrai] Le traité prévoit que chaque État membre veille à la compatibilité de sa législation nationale,
      y compris les statuts de sa banque centrale, avec les traités et les statuts du SEBC (Q41, Q44). (sources
      S1)
    - F5 [fait, Vrai] Le conseil des gouverneurs de la BCE arrête les orientations et prend les décisions nécessaires
      aux missions du SEBC (qui décide, Q41). (sources S1)
    - 'F27 [fait, Invérifiable] L''annulation ou la conversion en dette perpétuelle à taux nul de titres achetés
      par l''Eurosystème est contraire aux traités européens. — Aucun texte ne mentionne l''annulation ou la conversion
      de titres déjà détenus (F45) et aucune décision de la CJUE n''a tranché ce cas. La contrariété aux traités
      est affirmée par Roland Lescure (AFP, 24 août 2026) et par Christine Lagarde (F11, F13, F14) ; les signataires
      de la tribune de 2021 soutiennent le contraire (F57) : c''est une interprétation juridique disputée, pas un
      fait établi. (sources S16)'
  - id: A25
    auteur: gauche-radicale
    question: Q44
    position: non
    enonce: Une décision de gel prise par le conseil des gouverneurs lui-même n'atteint ni l'indépendance de la
      BCE ni la crédibilité de l'euro. L'indépendance interdit les instructions des gouvernements, pas une décision
      de la banque sur son propre bilan.
    raisonnement: 'Le traité définit l''indépendance comme l''interdiction de solliciter ou accepter des instructions
      des gouvernements (F3), et réserve la décision au conseil des gouverneurs (F5). Si ce conseil décide, aucune
      instruction n''est donnée. Quant à la crédibilité, les titres détenus ne seront de toute façon pas remboursés
      (F53) : constater cette réalité ne change pas le bilan réel de la banque centrale.'
    porte_par: '**Jean-Luc Mélenchon** (ancien candidat à l''élection présidentielle de 2022, LFI), 6 juin 2022
      [S40, S19]; **Jean-Luc Mélenchon** (candidat à l''élection présidentielle de 2027, LFI), 25 août 2026 [S19]'
    repond_a: null
    affirmations:
    - F3 [fait, Vrai] Le traité dispose que ni la BCE, ni une banque centrale nationale, ni un membre de leurs organes
      de décision ne peuvent solliciter ni accepter d'instructions des gouvernements (Q41, Q44). (sources S1)
    - F5 [fait, Vrai] Le conseil des gouverneurs de la BCE arrête les orientations et prend les décisions nécessaires
      aux missions du SEBC (qui décide, Q41). (sources S1)
    - F53 [valeur, sans verdict] Une dette publique inscrite au bilan de la banque centrale peut être constatée
      comme non remboursable. (sources S40)
  - id: A33
    auteur: sociaux-democrates
    question: Q44
    position: non
    enonce: La BCE affirme pouvoir remplir son mandat malgré des pertes ; aucune institution ne chiffre l'effet
      de fonds propres durablement négatifs. Si le conseil des gouverneurs décide lui-même l'effacement, aucun gouvernement
      ne donne d'instruction.
    raisonnement: Le risque pour la crédibilité vient de l'idée qu'une perte comptable empêcherait la banque centrale
      d'agir. Si elle peut fonctionner avec des fonds propres négatifs (F58) et si l'effacement est décidé par son
      propre conseil des gouverneurs sans instruction d'un gouvernement (F3, F5), ni sa capacité d'action ni son
      indépendance ne sont atteintes. Position de 2021, avant la proposition de 2026 ; elle porte sur un effacement
      décidé par la BCE, pas imposé par un État.
    porte_par: '**Aurore Lalucq** (députée européenne, PP), 5 février 2021 [S43, S53]'
    repond_a: null
    affirmations:
    - 'F58 [estimation, Débat entre experts] Une banque centrale peut fonctionner avec des fonds propres négatifs
      sans que sa capacité d''action en soit affectée. — Les signataires de la tribune de 2021 l''affirment sans
      démonstration. La BCE écrit, après ses pertes de 2024, qu''elle peut remplir son mandat « regardless of any
      losses » (communiqué du 20 février 2025), tout en soulignant que sa solidité repose sur 59 milliards de capital
      et de comptes de réévaluation : elle ne dit pas que des fonds propres durablement négatifs seraient sans effet.
      Aucune estimation chiffrée d''institution sur ce point n''est au dossier. (sources S43, S48)'
    - F3 [fait, Vrai] Le traité dispose que ni la BCE, ni une banque centrale nationale, ni un membre de leurs organes
      de décision ne peuvent solliciter ni accepter d'instructions des gouvernements (Q41, Q44). (sources S1)
    - F5 [fait, Vrai] Le conseil des gouverneurs de la BCE arrête les orientations et prend les décisions nécessaires
      aux missions du SEBC (qui décide, Q41). (sources S1)
  - id: A40
    auteur: centre
    question: Q44
    position: oui
    enonce: Une banque centrale peut fonctionner avec des fonds propres négatifs, mais cela ne répond qu'à sa solvabilité.
      La crédibilité de l'euro dépend aussi de la perception d'un financement monétaire des États.
    raisonnement: 'A33 conclut que la capacité d''action et l''indépendance sont préservées en s''appuyant sur F58,
      qualifiée par le vérificateur de « Débat entre experts » : la BCE y dit pouvoir remplir son mandat malgré
      des pertes, sans dire que des fonds propres durablement négatifs seraient sans effet. Surtout, la crédibilité
      tient à l''interdiction du financement monétaire (F9) : un effacement au profit d''États peut être lu comme
      un contournement, que la solvabilité de la BCE ne dissipe pas. A33 le reconnaît en limitant son argument à
      un effacement décidé par la BCE elle-même.'
    porte_par: '**Roland Lescure** (ministre de l''Économie, RE), 24 août 2026 [S16, S49]'
    repond_a: A33
    affirmations:
    - 'F58 [estimation, Débat entre experts] Une banque centrale peut fonctionner avec des fonds propres négatifs
      sans que sa capacité d''action en soit affectée. — Les signataires de la tribune de 2021 l''affirment sans
      démonstration. La BCE écrit, après ses pertes de 2024, qu''elle peut remplir son mandat « regardless of any
      losses » (communiqué du 20 février 2025), tout en soulignant que sa solidité repose sur 59 milliards de capital
      et de comptes de réévaluation : elle ne dit pas que des fonds propres durablement négatifs seraient sans effet.
      Aucune estimation chiffrée d''institution sur ce point n''est au dossier. (sources S43, S48)'
    - F9 [fait, Vrai] Dans l'arrêt Weiss (C-493/17, 11 décembre 2018), la Cour rappelle que le SEBC doit concilier
      ses interventions avec l'interdiction du financement monétaire de l'article 123 TFUE (Q41). (sources S3)
  - id: A45
    auteur: gauche-radicale
    question: Q44
    position: non
    enonce: Une demande d'un gouvernement ou d'un parlement n'est pas une instruction tant que la BCE la décide
      librement. L'indépendance interdit d'accepter des instructions, pas d'être sollicitée.
    raisonnement: F3 interdit à la BCE de solliciter ou d'accepter des instructions ; elle n'interdit pas qu'un
      gouvernement formule une demande que le conseil des gouverneurs (F5) reste libre de refuser. F4 porte sur
      la législation nationale et les statuts des banques centrales. L'atteinte à l'indépendance suppose donc que
      la BCE accepte une instruction.
    porte_par: '**Jean-Luc Mélenchon** (député, LFI), 11 mai 2020 [S39, S19]'
    repond_a: A3
    affirmations:
    - F3 [fait, Vrai] Le traité dispose que ni la BCE, ni une banque centrale nationale, ni un membre de leurs organes
      de décision ne peuvent solliciter ni accepter d'instructions des gouvernements (Q41, Q44). (sources S1)
    - F4 [fait, Vrai] Le traité prévoit que chaque État membre veille à la compatibilité de sa législation nationale,
      y compris les statuts de sa banque centrale, avec les traités et les statuts du SEBC (Q41, Q44). (sources
      S1)
    - F5 [fait, Vrai] Le conseil des gouverneurs de la BCE arrête les orientations et prend les décisions nécessaires
      aux missions du SEBC (qui décide, Q41). (sources S1)
  - id: A48
    auteur: sociaux-democrates
    question: Q44
    position: nuance
    enonce: L'atteinte à la crédibilité de l'euro vaut pour une décision imposée par un gouvernement. Elle ne s'applique
      pas à un effacement arrêté par le conseil des gouverneurs lui-même.
    raisonnement: 'F3 interdit les instructions des gouvernements ; si le conseil décide (F5), aucune instruction
      n''est donnée. L''atteinte à la crédibilité suppose en outre que l''opération soit contraire aux traités (F27),
      ce qui est invérifiable : la compatibilité est disputée.'
    porte_par: '**Aurore Lalucq** (députée européenne, PP), 5 février 2021 [S43, S53]'
    repond_a: A3
    affirmations:
    - F3 [fait, Vrai] Le traité dispose que ni la BCE, ni une banque centrale nationale, ni un membre de leurs organes
      de décision ne peuvent solliciter ni accepter d'instructions des gouvernements (Q41, Q44). (sources S1)
    - F5 [fait, Vrai] Le conseil des gouverneurs de la BCE arrête les orientations et prend les décisions nécessaires
      aux missions du SEBC (qui décide, Q41). (sources S1)
    - 'F27 [fait, Invérifiable] L''annulation ou la conversion en dette perpétuelle à taux nul de titres achetés
      par l''Eurosystème est contraire aux traités européens. — Aucun texte ne mentionne l''annulation ou la conversion
      de titres déjà détenus (F45) et aucune décision de la CJUE n''a tranché ce cas. La contrariété aux traités
      est affirmée par Roland Lescure (AFP, 24 août 2026) et par Christine Lagarde (F11, F13, F14) ; les signataires
      de la tribune de 2021 soutiennent le contraire (F57) : c''est une interprétation juridique disputée, pas un
      fait établi. (sources S16)'
  - id: A52
    auteur: centre
    question: Q44
    position: nuance
    enonce: Une demande politique que la BCE serait libre de refuser n'est pas une instruction. Si l'effacement
      passe par une loi nationale visant les titres de la Banque de France, l'État impose, et le traité interdit
      à une banque centrale nationale d'accepter des instructions de son gouvernement.
    raisonnement: 'A45 distingue demande et instruction (F3) ; la distinction vaut tant que le conseil des gouverneurs
      reste libre (F5). Elle ne vaut pas pour une loi : F4 oblige chaque État à rendre sa législation compatible
      avec les statuts de sa banque centrale et du SEBC, de sorte qu''une loi qui modifierait le bilan de la Banque
      de France relèverait de ce contrôle de compatibilité. A45 ne dit pas quelle voie suit la proposition ; l''atteinte
      à l''indépendance dépend donc de la voie choisie, et non de la seule existence d''une demande.'
    porte_par: '**Roland Lescure** (ministre de l''Économie, RE), 24 août 2026 [S16, S49]'
    repond_a: A45
    affirmations:
    - F3 [fait, Vrai] Le traité dispose que ni la BCE, ni une banque centrale nationale, ni un membre de leurs organes
      de décision ne peuvent solliciter ni accepter d'instructions des gouvernements (Q41, Q44). (sources S1)
    - F4 [fait, Vrai] Le traité prévoit que chaque État membre veille à la compatibilité de sa législation nationale,
      y compris les statuts de sa banque centrale, avec les traités et les statuts du SEBC (Q41, Q44). (sources
      S1)
    - F5 [fait, Vrai] Le conseil des gouverneurs de la BCE arrête les orientations et prend les décisions nécessaires
      aux missions du SEBC (qui décide, Q41). (sources S1)
  - id: A53
    auteur: centre
    question: Q44
    position: oui
    enonce: La crédibilité d'une monnaie dépend de ce que les marchés croient. Une légalité contestée suffit à créer
      un doute tant qu'aucun juge n'a tranché.
    raisonnement: 'F27 est invérifiable : aucune décision de la CJUE n''a tranché, et une telle décision n''interviendrait
      qu''après l''opération. Pour la crédibilité, ce qui compte est la perception de ceux qui détiennent des euros
      ou des titres, pas le verdict final d''un juge. Entre l''annonce et l''arrêt, le doute porte sur le respect
      de l''interdiction du financement monétaire (F9), qui fonde la confiance dans la monnaie commune. A48 a raison
      de dire que l''atteinte n''est pas établie ; elle n''est pas non plus écartée.'
    porte_par: '**Roland Lescure** (ministre de l''Économie, RE), 24 août 2026 [S16, S49]'
    repond_a: A48
    affirmations:
    - 'F27 [fait, Invérifiable] L''annulation ou la conversion en dette perpétuelle à taux nul de titres achetés
      par l''Eurosystème est contraire aux traités européens. — Aucun texte ne mentionne l''annulation ou la conversion
      de titres déjà détenus (F45) et aucune décision de la CJUE n''a tranché ce cas. La contrariété aux traités
      est affirmée par Roland Lescure (AFP, 24 août 2026) et par Christine Lagarde (F11, F13, F14) ; les signataires
      de la tribune de 2021 soutiennent le contraire (F57) : c''est une interprétation juridique disputée, pas un
      fait établi. (sources S16)'
    - F9 [fait, Vrai] Dans l'arrêt Weiss (C-493/17, 11 décembre 2018), la Cour rappelle que le SEBC doit concilier
      ses interventions avec l'interdiction du financement monétaire de l'article 123 TFUE (Q41). (sources S3)
  valeurs:
  - V12 Priorité à la maîtrise démocratique de la politique monétaire plutôt qu'à l'indépendance de la BCE telle
    que fixée par les traités et les statuts. — **Jean-Luc Mélenchon** (député, LFI), 11 mai 2020 [S39, S19]
