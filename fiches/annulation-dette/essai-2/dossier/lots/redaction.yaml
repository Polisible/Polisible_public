      sources:
      - source: S1
        extrait: l'acquisition directe, auprès d'eux, par la Banque centrale européenne ou les banques centrales
          nationales, des instruments de leur dette est également interdite
        statut_source: conforme
    - id: F2
      enonce: Le même article interdit à la BCE et aux banques centrales nationales d'accorder des découverts ou
        tout autre crédit aux administrations centrales et aux autres autorités publiques.
      type: fait
      verdict: Vrai
      explication: Le même paragraphe interdit à la BCE et aux banques centrales nationales d'accorder des découverts
        ou tout autre type de crédit aux administrations centrales, aux autres autorités publiques et à d'autres
        entités publiques de l'Union et des États membres. Le paragraphe 2 exclut de ce champ les établissements
        publics de crédit.
      sources:
      - source: S1
        extrait: d’accorder des découverts ou tout autre type de crédit aux institutions, organes ou organismes
          de l'Union, aux administrations centrales
        statut_source: conforme
    - id: F8
      enonce: Le marché secondaire est le marché où sont échangés des instruments financiers déjà en circulation,
        par opposition au marché primaire où ils sont émis.
      type: fait
      verdict: Vrai
      explication: Le glossaire de la Banque nationale de Belgique définit le marché secondaire comme le marché
        des instruments financiers en circulation et, dans une autre entrée (lettre P), le marché primaire comme
        le marché où de nouveaux emprunts sont émis. La seconde moitié de l'énoncé s'appuie sur cette entrée, qui
        n'est pas la source citée (S6).
      sources:
      - source: S6
        extrait: Market where transactions are carried out concerning financial instruments in circulation.
        statut_source: conforme
    - id: F13
      enonce: Les titres de dette française détenus par les banques centrales de l'Eurosystème ont été acquis sur
        le marché secondaire (auprès d'institutions financières), non auprès de l'État.
      type: fait
      verdict: Vrai
      explication: 'Même contenu que F11 (doublon) : la FAQ de la BCE sur le PSPP indique qu''aucun achat n''a eu
        lieu sur le marché primaire, en raison de l''article 123 du TFUE, qui interdit l''achat direct aux États
        pour tous les programmes.'
      sources:
      - source: S13
        extrait: Ces opérations ont eu lieu sur le marché secondaire, c’est-à-dire auprès d’institutions financières,
          puisque les traités de l’Union européenne interdisent à la BCE de financer directement les États.
        statut_source: conforme
    - id: F4
      enonce: Dans l'arrêt C-62/14 du 16 juin 2015, la Cour (grande chambre) dit pour droit que les articles 119,
        123 § 1 et 127 TFUE autorisent le SEBC à adopter un programme d'achat d'obligations souveraines sur les
        marchés secondaires, tel que celui annoncé en septembre 2012 (programme OMT).
      type: fait
      verdict: Vrai
      explication: Le dispositif de l'arrêt C-62/14 du 16 juin 2015 (grande chambre) dit pour droit que les articles
        119, 123 § 1 et 127 §§ 1 et 2 TFUE, avec les articles 17 à 24 des statuts du SEBC, autorisent le SEBC à
        adopter un tel programme d'achat sur les marchés secondaires. Le programme visé est celui annoncé dans le
        communiqué cité au procès-verbal de la réunion des 5 et 6 septembre 2012 (opérations monétaires sur titres,
        OMT).
      sources:
      - source: S3
        extrait: ils autorisent le Système européen de banques centrales (SEBC) à adopter un programme d’achat d’obligations
          souveraines sur les marchés secondaires
        statut_source: conforme
  - id: A6
    auteur: expert-gauche-radicale
    question: Q1
    position: nuance
    enonce: 'Une annulation décidée seule par la France ne serait pas possible : la décision relèverait du Système
      européen de banques centrales. La voie défendue est donc européenne : obtenir que la BCE congèle ces dettes
      et, à terme, réviser les traités et les statuts de la BCE.'
    raisonnement: Les banques centrales nationales ne peuvent recevoir d'instructions d'un gouvernement (F3) et
      la Banque de France agit au sein du SEBC (F9). Un gouvernement ne peut donc pas imposer l'effacement ; il
      peut seulement l'exiger politiquement de la BCE et œuvrer à modifier le cadre européen. C'est la formulation
      de la résolution de 2020 (inviter le gouvernement à exiger de l'UE que la BCE agisse) et celle de la déclaration
      d'août 2026 (f2, où le sujet est la BCE).
    porte_par:
    - qui: Groupe La France insoumise (proposition de résolution n° 2914, 11 mai 2020)
      source: S16
    - qui: Jean-Luc Mélenchon (discours du 23 août 2026)
      source: S13
    repond_a: null
    statut: ouvert
    affirmations:
    - id: F3
      enonce: L'article 130 du TFUE interdit à la BCE et aux banques centrales nationales de solliciter ou d'accepter
        des instructions des gouvernements des États membres.
      type: fait
      verdict: Vrai
      explication: L'article 130 du TFUE dispose que ni la BCE, ni une banque centrale nationale, ni un membre de
        leurs organes de décision ne peuvent solliciter ni accepter des instructions des gouvernements des États
        membres, entre autres.
      sources:
      - source: S2
        extrait: ni la Banque centrale européenne, ni une banque centrale nationale, ni un membre quelconque de
          leurs organes de décision ne peuvent solliciter ni accepter des instructions des institutions, organes
          ou organismes de l'Union, des gouvernements des États membres ou de tout autre organisme.
        statut_source: conforme
    - id: F9
      enonce: Le SEBC comprend la BCE et les banques centrales de tous les États membres ; l'Eurosystème ne comprend
        que la BCE et les banques centrales des États ayant adopté l'euro.
      type: fait
      verdict: Vrai
      explication: Le glossaire de la Banque nationale de Belgique définit le SEBC comme la BCE et les banques centrales
        nationales de tous les États membres de l'Union, soit l'Eurosystème plus les banques centrales des États
        qui n'ont pas adopté l'euro. L'énoncé sur l'Eurosystème découle de cette définition.
      sources:
      - source: S7
        extrait: it includes, in addition to the members of the Eurosystem, the NCBs of those Member States that
          have not yet adopted the euro.
        statut_source: conforme
    - id: F14
      enonce: Le 23 août 2026, à la clôture des universités d'été de LFI, Jean-Luc Mélenchon a déclaré que la BCE
        peut et doit mettre au congélateur les dettes des États.
      type: fait
      verdict: Vrai
      explication: Public Sénat (25 août 2026) rapporte cette phrase, prononcée « dimanche » (23 août 2026) lors
        du discours de clôture des universités d'été de LFI à Châteauneuf-sur-Isère. L'enregistrement du discours
        n'a pas été consulté ; la presse suffit ici pour rapporter une déclaration.
      sources:
      - source: S13
        extrait: « Oui, la Banque centrale européenne peut et doit mettre au congélateur les dettes des États, en
          commençant par celles de la période Covid. »
        statut_source: conforme
  - id: A7
    auteur: expert-centre
    question: Q1
    position: contre
    enonce: L'arrêt C-493/17 admet de conserver des titres jusqu'à leur échéance parce que l'État les rembourse
      alors. Cela ne justifie pas de les garder indéfiniment à taux nul, ni de les annuler.
    raisonnement: 'A5 déduit de la validité des achats secondaires que renoncer à vendre ou convertir les titres
      en perpétuel est permis. Or la Cour a validé la conservation jusqu''à l''échéance en relevant qu''elle n''implique
      aucune renonciation au paiement de la dette (f1), et a examiné si le programme laisse subsister l''incitation
      à une politique budgétaire saine (f2). Un titre perpétuel à taux nul ou effacé supprime justement le paiement
      : la raison pour laquelle la Cour a admis la conservation ne vaut plus. L''argument de A5 n''est donc pas
      couvert par la jurisprudence citée (F4) ; au mieux la question reste ouverte, aucune décision de la Cour ne
      traitant d''une annulation ou d''une conversion en perpétuel.'
    porte_par:
    - qui: Cour de justice de l'UE, arrêt C-493/17 du 11 décembre 2018 (points 144 et 146), dont l'argument tire
        sa conséquence
      source: S17
    repond_a: A5
    statut: ouvert
    affirmations:
    - id: F15
      enonce: Conserver des obligations jusqu'à leur échéance n'implique aucune renonciation au paiement de sa dette
        par l'État émetteur une fois le terme échu (arrêt C-493/17, point 146).
      type: fait
      verdict: Vrai
      explication: 'Au point 146, la Cour rappelle (en citant l''arrêt Gauweiler, C-62/14, point 118) que la conservation
        jusqu''à l''échéance n''implique aucune renonciation au paiement par l''État émetteur. Précision de périmètre
        : la Cour vise la conservation par le SEBC (Système européen de banques centrales) des obligations acquises
        dans le cadre du PSPP, pas tout détenteur.'
      sources:
      - source: S17
        extrait: une telle pratique n’est nullement exclue par l’article 18, paragraphe 1, du protocole sur le SEBC
          et la BCE et qu’elle n’implique aucune renonciation au paiement, par l’État membre émetteur, de sa dette
          une fois le terme de l’obligation échue
        statut_source: conforme
    - id: F16
      enonce: Le programme d'achats PSPP (décision 2015/774) ne soustrait pas les États membres concernés à l'incitation
        à conduire une politique budgétaire saine (arrêt C-493/17, point 144).
      type: fait
      verdict: Vrai
      explication: Le point 144 de l'arrêt du 11 décembre 2018 conclut que la décision 2015/774 n'a pas pour effet
        de soustraire les États membres concernés à l'incitation à conduire une politique budgétaire saine. C'est
        l'appréciation juridique de la Cour sur ce programme, fondée notamment sur le risque d'exclusion ou de revente
        des obligations d'un État dont la notation se dégrade (point 143).
      sources:
      - source: S17
        extrait: la décision 2015/774 n’a pas pour effet de soustraire les États membres concernés à l’incitation
          à conduire une politique budgétaire saine
        statut_source: conforme
  valeurs:
  - id: V1
    question: Q1
    auteur: expert-centre
    enonce: Le centre place en priorité la crédibilité de la signature de la France, le respect des traités et l'indépendance
      de la banque centrale, plutôt que la souveraineté budgétaire nationale contre le cadre européen.
    passage: 1
  - id: V2
    question: Q1
    auteur: expert-droite
    enonce: 'Ma famille met en priorité la discipline budgétaire et la crédibilité de la signature de la France
      : le respect des traités et de l''indépendance de la banque centrale est vu comme une garantie, non comme
      un obstacle à contourner.'
    passage: 1
  - id: V3
    question: Q1
    auteur: expert-gauche-radicale
    enonce: Pour la gauche radicale, les verrous des traités sont un choix institutionnel modifiable, non une loi
      de l'économie ; elle met en priorité la capacité des États à décider de leurs dépenses sans dépendre des marchés
      financiers.
    passage: 1
  - id: V4
    question: Q1
    auteur: expert-droite
    enonce: Ma famille met en priorité le respect strict des règles européennes qui séparent la banque centrale
      du financement de l'État, et la crédibilité de la signature de la France auprès de ses créanciers, y compris
      si une lecture littérale du texte laisse une marge.
    passage: 2
