reponses:
- question: Q41
  certitude: Invérifiable
  texte: 'En l''état du droit, aucun texte ni aucun arrêt ne tranche ce cas (F27, F45). L''article 123 interdit le crédit
    et l''achat direct aux États (F1, F2) sans mentionner l''annulation ou la conversion de titres déjà détenus (F45, F57),
    et la Cour n''a jugé que les achats sur le marché (F8, F9, F10). La présidente de la BCE la déclare contraire aux traités
    (F13, F14), sans décision de la Cour (F27). Pour le non, T1 (RE), la plus solide (F9), ne tient pas : elle étend l''interdiction
    à un cas qu''aucune source ne vise (F27) ; T2 (PCF) aussi. Pour le oui, T3 (LFI, PP) ne tient pas : elle prend le silence
    du texte (F45, F57) pour une permission.'
- question: Q42
  certitude: Pas d'estimation fiable
  texte: 'Aucune institution n''a estimé l''effet de l''opération sur les taux auxquels la France emprunte : les deux affirmations
    du dossier, en sens contraires, sont sans estimation fiable (F26, F47). T6 (PP), nuancée, tient en partie : une décision
    du conseil des gouverneurs par contrat n''est pas une rupture unilatérale (F3, F5, F60), mais personne n''estime si elle
    change l''effet sur les taux (F26), et un doute sur le financement monétaire subsiste (F9). Pour le oui, T4 (HOR, RE)
    ne tient pas : la prime de risque qu''elle annonce ne repose que sur F26. Pour le non, T5 (LFI) ne tient pas pour la même
    raison (F47), et limiter l''opération à l''Eurosystème (F46) n''écarte pas ce doute (F9).'
- question: Q43
  certitude: Pas d'estimation fiable
  texte: 'Aucune source ne chiffre l''effet net de l''opération sur la charge d''intérêts, faute d''isoler la part des intérêts
    sur titres de l''État dans le résultat de la Banque de France (F41, F49). Sont établis les versements variables de la
    Banque de France à l''État (F18, F19, F20, F21) et la fin des réinvestissements du PEPP (F48). Les thèses nuancées tiennent
    en partie : T8 (LFI) et T31 (RN) concluent à un gain net inférieur au gain brut, plausible mais non chiffré (F41). Pour
    le non, T7 (HOR) ne tient pas : un gain net inconnu n''exclut pas une baisse durable (F41, F49). Pour le oui, T9 (PCF)
    ne tient pas : elle suppose une marge nette qu''aucune source n''établit (F49).'
- question: Q44
  certitude: Pas d'estimation fiable
  texte: 'La question a deux volets ; la certitude indiquée ne vaut que pour la crédibilité de l''euro, dont l''effet n''est
    estimé par aucune institution (F27), l''effet de pertes durables d''une banque centrale étant débattu (F58, F61). L''indépendance
    relève du traité : une loi nationale imposant l''opération serait une instruction interdite, une décision libre du conseil
    des gouverneurs non (F3, F4, F5) ; aucune source n''établit la voie que suivrait la proposition (T10, T12, T13). T14 (RE,
    nuancée) tient sur cette distinction (F3, F4, F5). T10 (RE, oui), T12 (LFI, non) et T13 (PP, non) tiennent en partie,
    chacune supposant une voie non établie (F3, F5). T11 (RE, oui) et T32 (PP, nuancée) ne tiennent pas, faute d''estimation
    (F27).'
- question: Q45
  certitude: null
  texte: 'Question de valeur : la commission ne répond pas (T15, T17). Rembourser intégralement (T15, HOR) traite ces titres
    comme les autres, remboursés à échéance (F48, F31) ; l''atteinte invoquée à la signature n''est pas estimée (F26). T16
    (LR) ne tient pas : la perte de confiance supposée n''est pas estimée (F26). Ne pas rembourser la banque centrale (T17,
    PCF, PP) suppose qu''aucun créancier privé n''est lésé : c''est établi, les vendeurs ont été payés (F24, F44). T33 (NPA)
    part du même fait, mais son critère de légitimité repose sur un présupposé non établi (F43). La marge dégagée n''est pas
    chiffrée (T18, F41). T19 (NPA) ne tient pas : l''origine de la dette dans des cadeaux fiscaux n''est pas établie (F43).'
- question: Q46
  certitude: null
  texte: 'Question de valeur : la commission ne répond pas (T21, T23). Choisir la décision nationale (T23, RN) s''appuie sur
    des propositions vérifiées, primauté du droit national (F40) et règle d''or plafonnant le déficit (F39), muettes sur les
    titres de l''Eurosystème (T23). Choisir les règles européennes s''appuie sur un présupposé établi : la décision appartient
    au conseil des gouverneurs, qui n''accepte pas d''instructions (T21, PP ; F3, F5). Ne sont pas établis le partage du risque
    des titres français entre membres (T20, RE ; objection O1) ni la nécessité de réviser les traités pour annuler (T34, PCF
    ; F45, F27). T22 (LE) et T35 (LFI) tiennent comme priorités : réviser les règles (F33), ou les soumettre au contrôle démocratique
    (F56).'
- question: Q47
  certitude: null
  texte: 'Question de valeur : la commission ne répond pas (T24, T28). Préférer l''annulation suppose une marge nette non
    chiffrée (F41, F49) : T27 (LFI) ne tient pas, son « coût nul » reposant sur F47. T26 (NPA), visant les dettes jugées illégitimes,
    ne tient pas : l''effet supposé sur les intérêts n''est pas établi (F26). Pour les économies, T24 (HOR, RE) tient en partie,
