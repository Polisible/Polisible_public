  question_posee: Votre thèse T26 repose sur le montant des intérêts versés aux créanciers privés et leur équivalent
    en emplois, qu'aucune affirmation du dossier n'établit (seul F20 est vérifié). Avez-vous une source officielle
    datée ? Quel effet attendez-vous sur les conditions d'emprunt (F26) ?
  id: R22
  statut: posee
- these: T30
