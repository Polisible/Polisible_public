  note_verif: 'Version consolidée 2016 du TFUE avec ses protocoles, en français sur EUR-Lex. F1 : extrait présent
    à l''article 123, paragraphe 1, même sens. F2 : extrait présent dans la même phrase de l''article 123, paragraphe
