      et l'interdiction du financement direct (F51, F1, F2) ; T21 garde A35, T34 reçoit A29.
  - critere: raisonnement
    avis: conteste
    justification: A29 passe de F1 et F2 (interdiction du financement direct) à la nécessité de réviser les règles
      pour annuler, inférence identique à celle de A21 qui vaut à T2 une lacune « conclusion plus large que les
      prémisses » (F45, F27 Invérifiable). La justification du rapporteur ne vise que A35 (F3, F5). La lacune ne
      touche qu'une partie de la conclusion de T21 (la révision), le niveau européen découlant de F3 et F5.
    proposition: 'raisonnement : lacune, essentielle: false — Le niveau européen de la décision découle de F3 et
