- source:
    id: S37
    titre: 'Dette publique : tract « Cette dette n''est pas la nôtre, nous n''avons pas à la payer ! »'
    auteur: NPA (Nouveau Parti anticapitaliste)
    date: '2011-12-01'
    adresse: https://npa-lanticapitaliste.org/sites/default/files/4PDette.pdf
    niveau: 3
    statut: a-verifier
    demande: null
  a_controler:
  - affirmation: F43
    enonce: Une dette construite par des cadeaux fiscaux aux plus riches et aux grandes entreprises est illégitime
      et n'a pas à être payée.
    type: valeur
    declaration: false
    extrait_annonce: n’a pas à être payée
