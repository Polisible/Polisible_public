  question: Q47
  position: nuance
  enonce: "L'effacement ne se substitue aux autres leviers que s'il est conditionné : les États s'engagent à investir les montants effacés dans la reconstruction écologique et sociale. La marge nette qu'il dégagerait n'est pas chiffrée."
