      l''interdiction du financement direct (F1, F2) et la propriété commune (F51), d''où une révision des traités
      (F56). L''énoncé fusionne « accord » et « révision des règles ».'
    proposition: Deux thèses (A35 ; A29), ou un énoncé limité au raisonnement commun (la décision n'appartient pas
