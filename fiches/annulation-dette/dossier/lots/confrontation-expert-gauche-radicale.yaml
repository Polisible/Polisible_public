  auteur: ecologistes
  question: Q41
  position: nuance
  enonce: Le traité interdit le crédit et l'achat direct de dette auprès des États, mais pas les achats sur le marché
    secondaire, que le SEBC pratique depuis 2015. La Cour de justice a jugé le programme d'achats de 2015 (PSPP)
    compatible avec le traité sous conditions (arrêt Weiss) ; elle ne s'est pas prononcée sur le programme d'urgence
    pandémique (PEPP) de 2020. La question juridique réelle est de savoir si une conversion ou une annulation de
    titres déjà détenus relève de l'interdiction du financement monétaire, et c'est une question de décision de
    l'Eurosystème.
  raisonnement: 'L''article 123 vise deux opérations précises : le crédit direct aux États et l''acquisition directe
    de leur dette (F1, F2). Les titres détenus par l''Eurosystème ont été acquis sur les marchés secondaires dans
    un programme que la Cour a jugé compatible avec le traité sous garanties (F8, F9, F10). Un texte qui n''évoque
    pas le traitement ultérieur de ces titres ne tranche pas l''annulation ; l''affirmer interdite comme certaine
    est une interprétation, et le conseil des gouverneurs de la BCE reste l''organe qui décide (F5). Cette lecture
    concerne l''annulation ou la conversion décidée par la BCE elle-même, pas une décision unilatérale de l''État.'
  porte_par: Jérôme Gleizes, conseiller EELV de Paris (2023), chronique Politis du 14 septembre 2026 (Les Écologistes,
    S23)
  repond_a: null
  affirmations:
  - F1 [fait, Vrai] Le traité interdit à la BCE et aux banques centrales nationales d'accorder des découverts ou
    crédits aux administrations publiques (Q41). (sources S1)
  - F2 [fait, Vrai] Le traité interdit l'acquisition directe, auprès des États, de leurs titres de dette par la
    BCE ou les banques centrales nationales (Q41). (sources S1)
  - F5 [fait, Vrai] Le conseil des gouverneurs de la BCE arrête les orientations et prend les décisions nécessaires
    aux missions du SEBC (qui décide, Q41). (sources S1)
  - F8 [fait, Vrai] Dans l'arrêt Gauweiler (C-62/14, 16 juin 2015), la Cour dit pour droit que le SEBC est autorisé
    à adopter un programme d'achat d'obligations souveraines sur les marchés secondaires (Q41). (sources S2)
  - F9 [fait, Vrai] Dans l'arrêt Weiss (C-493/17, 11 décembre 2018), la Cour rappelle que le SEBC doit concilier
    ses interventions avec l'interdiction du financement monétaire de l'article 123 TFUE (Q41). (sources S3)
  - F10 [fait, Vrai] Dans l'arrêt Weiss (C-493/17), la Cour dit pour droit que l'examen des questions n'a révélé
    aucun élément affectant la validité de la décision (UE) 2015/774 de la BCE (Q41). (sources S3)
