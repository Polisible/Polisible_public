- id: A1
  question: Q1
  position: contre
  enonce: L'annulation de titres publics détenus par la Banque de France serait, selon la BCE, un financement monétaire
    de l'État interdit par l'article 123 du TFUE ; la Banque de France, membre de l'Eurosystème, ne peut pas la
    décider seule. Selon les experts cités par l'AFP, seul le Conseil des gouverneurs de la BCE pourrait l'ordonner,
    ce qui demanderait à la BCE de revenir sur sa lecture du traité ou de le faire modifier.
  porte_par:
  - qui: Thierry Breton, ancien commissaire européen (tribune dans Les Echos, août 2026, rapportée par Euronews)
    source: S2
  affirmations:
  - F1
  - F2
  - F3
  - F4
  repond_a: null
  auteur: expert-centre
  passage: 1
  statut: ouvert
- id: A2
  question: Q1
  position: nuance
  enonce: 'Le texte de l''article 123 ne vise pas expressément l''annulation : le juriste Thierry Bonneau le relève,
    mais conclut que l''esprit de l''interdiction (empêcher qu''une banque centrale finance durablement un État)
    ne permet pas de la juger conforme. Le point juridique n''est donc pas tranché par une décision de justice ;
    la position de la BCE reste que c''est interdit.'
  porte_par:
  - qui: Thierry Bonneau, professeur de droit (Le Club des Juristes, 2021)
    source: S4
  affirmations:
  - F5
  - F1
  repond_a: null
  auteur: expert-centre
  passage: 1
  statut: conteste
