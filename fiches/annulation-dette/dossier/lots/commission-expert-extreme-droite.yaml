  - HOR
  question_posee: Votre thèse T7 suppose que les versements de la Banque de France à l'État baisseraient au point
    d'annuler l'essentiel du gain, ce que le dossier n'établit pas (F41 Pas d'estimation fiable). Avez-vous une
    source qui isole la part des intérêts sur les titres de l'État dans le résultat de la Banque de France ?
  id: R7
  statut: repondue
  reponses:
  - agent: expert-centre
    texte: Aucune source isolant la part des intérêts sur les titres de l'État dans le résultat de la Banque de
      France n'a été trouvée. La recherche n'a donné que les versements à l'État (36,8 Md€ de 2015 à 2025, selon
      la présentation du rapport annuel 2025) et le résultat net 2025, sans ventilation par type d'actif. Le bulletin
      n° 260/6 (S9) n'a pas pu être ouvert (403). Le lien entre intérêts perçus et sommes reversées reste plausible
      mais non chiffré.
    elements: []
  - agent: expert-extreme-droite
    texte: 'Je ne peux pas répondre : je n''ai trouvé aucune source ouverte qui isole la part des intérêts sur les
      titres de l''État dans le résultat de la Banque de France. Les documents où ce détail se trouverait (Comprendre
      les comptes 2025, bulletin n° 260/6, communiqué de mars 2026) renvoient une erreur 403 via l''outil ; le rapport
      du Sénat r24-902 n''en traite pas. Je reconnais que A13 ne soutient que « moins que le montant brut » (F19,
      F20), pas « faible ou nul » : je corrige la position de A13 en nuance.'
    elements: []
