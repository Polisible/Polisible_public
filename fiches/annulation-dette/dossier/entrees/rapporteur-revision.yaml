  partis: [PCF]
  question_posee: "Votre thèse T34 suppose qu'annuler des titres déjà détenus exige de réviser les traités, donc que l'interdiction du financement direct (F1, F2) vise ce cas, ce que le dossier n'établit pas (F45, F27 Invérifiable). Avez-vous une source (décision de la Cour, avis juridique d'une institution) qui traite ce cas précis ? (même question que R2)"
