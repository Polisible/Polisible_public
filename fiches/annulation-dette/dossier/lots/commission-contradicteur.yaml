      (F1, F2) vise l''annulation de titres déjà détenus, ce que le dossier n''établit pas (F45, F27).'
    decision_rapporteur: acceptee
    motif_rapporteur: 'La lacune (révision des traités tirée de F1, F2, comme T2) est appliquée à T34 (A29), « essentielle:
      false » ; T21 réduite à A35 n''a pas cette lacune.'
