- id: A5
  auteur: expert-gauche-radicale
  question: Q1
  position: pour
  enonce: Les traités interdisent d'acheter la dette à l'État ou de lui prêter, pas de conserver ou de transformer
    des titres déjà achetés sur le marché secondaire. Garder indéfiniment ces titres, à taux nul, ne serait ni un
    achat direct ni un crédit nouveau.
  raisonnement: L'article 123 vise l'acquisition directe auprès de l'émetteur et les crédits (F1, F2). Les titres
    en cause ont été achetés sur le marché secondaire (f1, F8), pratique que la Cour de justice a jugée compatible
    avec l'article 123 (F4). Le texte n'interdit donc pas, tel qu'il est écrit, de renoncer à les revendre ou de
    les convertir en titres perpétuels à taux nul ; la proposition de 2020 en conclut qu'aucune modification des
    traités n'est nécessaire.
  porte_par:
  - qui: Groupe La France insoumise (proposition de résolution n° 2914, 11 mai 2020)
    source: S16
  repond_a: null
  statut: ouvert
