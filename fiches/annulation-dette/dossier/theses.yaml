    avis: conteste
    justification: 'L''énoncé attribue à tous les porteurs que la dette « relève d''une décision européenne, non
      nationale seule » : c''est la conclusion de A11 (F4, F5, F33). A28 ne dit pas cela ; il conclut que la politique
      de la dette relève « du contrôle démocratique plutôt que de règles fixées par des institutions indépendantes
      », par un autre chemin (F1, F2, F56 : les traités comme carcan).'
    proposition: Deux thèses (A11 ; A28), ou un énoncé limité au point commun (exiger un changement des règles européennes
      plutôt qu'une décision unilatérale), chaque raisonnement étant restitué.
