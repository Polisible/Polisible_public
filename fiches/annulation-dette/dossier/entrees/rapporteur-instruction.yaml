      justification: "Les versements de la Banque de France sont établis (F18, F19, F20, Vrai) ; le présupposé d'une croissance obtenue par la baisse du coût du travail n'est porté par aucune affirmation."
    raisonnement:
      valeur: valide
      justification: "La conclusion « gain net inférieur au gain brut » découle de F19 et F20, et le choix des leviers suit d'une priorité ; la thèse ne prétend pas que le gain net soit nul."
    portee:
      texte: "établit que le gain net de l'annulation serait inférieur au gain brut (F19, F20) ; ne prouve pas que les leviers retenus dégageraient davantage de marges."
