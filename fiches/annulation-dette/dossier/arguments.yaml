  question: Q41
  position: oui
  enonce: 'Aucune disposition des traités ne mentionne l''annulation : l''article 123 interdit le crédit et l''achat
    direct de titres aux États, non l''abandon d''une créance déjà inscrite au bilan. La décision relèverait du
    conseil des gouverneurs de la BCE.'
