  - id: A33
    auteur: expert-sociaux-democrates
    question: Q44
    position: contre
    enonce: La BCE affirme pouvoir remplir son mandat malgré des pertes (F58) ; des fonds propres durablement négatifs
      ne sont pas chiffrés par une institution. Si l'effacement est décidé par le conseil des gouverneurs lui-même,
      aucune instruction d'un gouvernement n'est donnée (F3, F5) ; l'argument ne vaut pas pour un effacement imposé
      par un État.
    raisonnement: Le risque pour la crédibilité vient de l'idée qu'une perte comptable empêcherait la banque centrale
      d'agir. Si elle peut fonctionner avec des fonds propres négatifs (F58) et si l'effacement est décidé par son
      propre conseil des gouverneurs sans instruction d'un gouvernement (F3, F5), ni sa capacité d'action ni son
      indépendance ne sont atteintes. Position de 2021, avant la proposition de 2026 ; elle porte sur un effacement
      décidé par la BCE, pas imposé par un État.
    porte_par:
    - qui: Aurore Lalucq, députée européenne (tribune collective, février 2021)
      parti: Place publique
      source: S43
    repond_a: null
    statut: conteste
    affirmations:
    - id: F58
      enonce: Une banque centrale peut fonctionner avec des fonds propres négatifs sans que sa capacité d'action
        en soit affectée.
      type: estimation
      verdict: Débat entre experts
      explication: 'Les signataires de la tribune de 2021 l''affirment sans démonstration. La BCE écrit, après ses
        pertes de 2024, qu''elle peut remplir son mandat « regardless of any losses » (communiqué du 20 février
        2025), tout en soulignant que sa solidité repose sur 59 milliards de capital et de comptes de réévaluation
        : elle ne dit pas que des fonds propres durablement négatifs seraient sans effet. Aucune estimation chiffrée
        d''institution sur ce point n''est au dossier.'
      sources:
