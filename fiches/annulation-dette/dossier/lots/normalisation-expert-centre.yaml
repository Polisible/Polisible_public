- id: V2
  question: Q46
  enonce: Elle met en priorité le respect des règles communes de la zone euro, vues comme une protection pour tous
    les États membres plutôt que comme une contrainte.
  porte_par: []
  a_normaliser:
  - 'valeur sans porteur : attribuer (parti, source) ou retirer ; commencer par « Priorité à »'
- id: V3
  question: Q47
  enonce: Elle préfère les leviers durables (économies, compétitivité, croissance) à une opération comptable qu'elle
    juge sans marge réelle ni sécurité juridique.
  porte_par: []
