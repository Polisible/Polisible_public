consigne: 'Mets tes éléments au format de docs/format-fiche.md (§ 3, 5, 10) par des `corrections` : position oui/non/nuance
  par rapport à la question ; porte_par complet (personne, fonction au moment de la déclaration, parti en sigle,
  date, source, appartenance si la source ne l''établit pas) ; valeurs : « Priorité à… » + porte_par, sinon retirer.
  Mets normalise: true dans chaque correction.'
questions:
  Q41: Les traités européens permettent-ils d'annuler, ou de convertir en dette perpétuelle à taux nul, la dette
    française détenue par la Banque de France pour l'Eurosystème ?
  Q42: Annuler ou geler cette dette ferait-il monter les taux auxquels la France emprunte ?
  Q43: L'opération réduirait-elle durablement la charge d'intérêts de l'État, compte tenu des intérêts que la Banque
    de France reverse à l'État ?
  Q44: Annuler ou geler cette dette affaiblirait-il la crédibilité de l'euro ou l'indépendance de la BCE ?
  Q45: Un État doit-il rembourser intégralement sa dette, y compris quand le créancier est sa propre banque centrale
    ?
  Q46: Les décisions sur la dette publique doivent-elles relever de la seule décision nationale plutôt que des règles
    européennes ?
  Q47: Pour dégager des marges budgétaires, l'annulation d'une partie de la dette est-elle préférable aux économies,
    à la hausse des recettes ou à la recherche de croissance ?
arguments:
- id: A9
  question: Q41
  position: nuance
  enonce: Le traité interdit le crédit et l'achat direct de dette auprès des États, mais pas les achats sur le marché
    secondaire, que le SEBC pratique depuis 2015. La Cour de justice a jugé le programme d'achats de 2015 (PSPP)
    compatible avec le traité sous conditions (arrêt Weiss) ; elle ne s'est pas prononcée sur le programme d'urgence
    pandémique (PEPP) de 2020. La question juridique réelle est de savoir si une conversion ou une annulation de
    titres déjà détenus relève de l'interdiction du financement monétaire, et c'est une question de décision de
    l'Eurosystème.
  raisonnement: 'L''article 123 vise deux opérations précises : le crédit direct aux États et l''acquisition directe
    de leur dette (F1, F2). Les titres détenus par l''Eurosystème ont été acquis sur les marchés secondaires dans
    un programme que la Cour a jugé compatible avec le traité sous garanties (F8, F9, F10). Un texte qui n''évoque
    pas le traitement ultérieur de ces titres ne tranche pas l''annulation ; l''affirmer interdite comme certaine
    est une interprétation, et le conseil des gouverneurs de la BCE reste l''organe qui décide (F5). Cette lecture
    concerne l''annulation ou la conversion décidée par la BCE elle-même, pas une décision unilatérale de l''État.'
  porte_par:
  - parti: LE
    source: S23
    personne_ou_groupe_ancien: Jérôme Gleizes, conseiller EELV de Paris (2023), chronique Politis du 14 septembre
      2026
  a_normaliser:
  - porteur à reformater (personne, fonction, date)
- id: A10
  question: Q45
  position: non
  enonce: 'Un État n''a pas à rembourser intégralement une dette détenue par sa banque centrale : elle n''est pas
    due à un créancier extérieur à la sphère publique, et la marge dégagée peut financer les investissements de
    la transition écologique. Le remboursement intégral n''est pas une obligation de principe mais un choix de politique
    économique.'
  raisonnement: Les titres publics détenus par l'Eurosystème (environ 640 milliards d'euros pour la France en 2026,
    F31) sont le résultat d'achats de politique monétaire, non d'un prêt consenti par un épargnant ou un investisseur
    privé. Les intérêts versés à la banque centrale reviennent en partie à l'État (F7, F20). Comme l'Europe a besoin
    de 800 milliards d'euros d'investissements supplémentaires par an (F32), maintenir cette dette au bilan pour
    la rembourser prive l'investissement climatique d'une marge qui existe. Le parti a déjà proposé en 2020 de lier
    annulation de dette auprès de la BCE et financement de la reconstruction écologique (F34).
  porte_par:
  - parti: LE
    source: S23
    personne_ou_groupe_ancien: Jérôme Gleizes, conseiller EELV de Paris (2023), chronique Politis du 14 septembre
      2026
  - parti: LE
    source: S24
    personne_ou_groupe_ancien: Les Verts (EELV), plan de reconstruction écologique de juin 2020, porte-parole Eva
      Sas
  a_normaliser:
  - position à confirmer (ancienne échelle pour/contre)
  - porteur à reformater (personne, fonction, date)
  - porteur à reformater (personne, fonction, date)
- id: A11
  question: Q46
  position: nuance
  enonce: 'Ni la seule décision nationale ni les règles européennes actuelles : la dette détenue par l''Eurosystème
    relève d''une décision européenne, qui doit passer sous contrôle démocratique et se fixer pour objectif la transition
    écologique. Les règles doivent être révisées par traité plutôt que contournées par un État seul.'
  raisonnement: 'Les titres en cause sont détenus au sein de l''Eurosystème, dont le conseil des gouverneurs décide
    (F5), et les banques centrales nationales doivent respecter les statuts du SEBC (F4) : un État ne peut pas décider
    seul. Mais ces règles fixent l''objectif de politique budgétaire à des organes que le parti juge insuffisamment
    démocratiques, alors que les besoins d''investissement sont européens (F32). La réponse du parti est donc une
    révision des traités avec des objectifs écologiques et sociaux (F33), pas un repli national.'
  porte_par:
  - parti: LE
    source: S26
    personne_ou_groupe_ancien: Les Écologistes, programme adopté en juillet 2026 (commission Économie, social et
      services publics, 26 octobre 2026)
  - parti: LE
    source: S23
    personne_ou_groupe_ancien: Jérôme Gleizes, conseiller EELV de Paris (2023), chronique Politis du 14 septembre
      2026
  a_normaliser:
  - porteur à reformater (personne, fonction, date)
  - porteur à reformater (personne, fonction, date)
- id: A12
  question: Q47
  position: nuance
  enonce: L'annulation n'est pas présentée comme une alternative aux recettes et à l'investissement, mais comme
    un levier à combiner avec eux. Le parti a financé son plan de 2020 par l'annulation de dette auprès de la BCE
    et par une fiscalité plus juste, et son plan de 2025 repose sur des recettes fiscales et un rythme de réduction
    du déficit plus progressif.
  raisonnement: 'Le parti ne classe pas les leviers : en 2020 il associait annulation de la dette auprès de la BCE
    et rétablissement de l''ISF (F34) ; en 2025 il proposait 28,5 milliards d''euros de recettes fiscales (F35)
    et un retour à 3,7 % de déficit en 2030, plus lent que celui du gouvernement (F36). Le critère est l''usage
    de la dette et de la marge dégagée : « bonne » dette quand elle finance le climat et la justice sociale, « mauvaise
    » dette sinon, selon la formule de sa secrétaire nationale.'
  porte_par:
  - parti: LE
    source: S24
    personne_ou_groupe_ancien: Les Verts (EELV), plan de reconstruction écologique de juin 2020
  - parti: LE
    source: S25
    personne_ou_groupe_ancien: Les Écologistes, plan de sortie de crise présenté le 4 septembre 2025
  - parti: LE
    source: S27
    personne_ou_groupe_ancien: Marine Tondelier, secrétaire nationale, déclaration du 20 juin 2024
  a_normaliser:
  - porteur à reformater (personne, fonction, date)
  - porteur à reformater (personne, fonction, date)
  - porteur à reformater (personne, fonction, date)
valeurs:
- id: V6
  question: Q45
  enonce: Les Écologistes mettent en priorité la capacité de la puissance publique à financer la bifurcation écologique
    et la justice sociale ; ils jugent que le principe de remboursement intégral s'efface quand le créancier est
    l'institution monétaire publique.
  porte_par: []
  a_normaliser:
  - 'valeur sans porteur : attribuer (parti, source) ou retirer ; commencer par « Priorité à »'
- id: V7
  question: Q46
  enonce: Ils mettent en priorité la souveraineté démocratique face aux marchés financiers, exercée à l'échelle
    européenne plutôt que nationale seule, avec des règles révisées pour intégrer les limites planétaires.
  porte_par: []
  a_normaliser:
  - 'valeur sans porteur : attribuer (parti, source) ou retirer ; commencer par « Priorité à »'
- id: V8
  question: Q47
  enonce: 'Ils refusent d''opposer les leviers : justice fiscale, investissement climatique et marges dégagées sur
    la dette sont jugés complémentaires, l''usage de l''argent comptant plus que le levier choisi.'
  porte_par: []
  a_normaliser:
  - 'valeur sans porteur : attribuer (parti, source) ou retirer ; commencer par « Priorité à »'
