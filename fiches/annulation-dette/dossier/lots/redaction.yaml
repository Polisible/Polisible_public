    auteur: expert-extreme-gauche
    question: Q47
    position: nuance
    enonce: 'Les marges budgétaires se trouvent d''abord dans les recettes tirées des profits et dans l''arrêt des
      aides aux entreprises, non dans les économies sur les budgets utiles à la population. Lutte ouvrière dit que
      la dette est celle de la bourgeoisie et que c''est à elle de la payer, sans proposer d''annulation d''une
      part précise. Le montant des aides qu''elle cite (270 milliards d''euros) n''est établi par aucune source
      officielle : les estimations publiques connues vont de 111,9 à 211 milliards selon le périmètre.'
    raisonnement: Si la dette a été creusée par des aides aux entreprises (270 milliards d'euros par an de aides
      et exonérations selon Lutte ouvrière), alors dégager des marges en supprimant ces aides et en taxant les profits
      est préférable aux économies sur les services publics, que cette position refuse. Elle ne retient pas l'annulation
      comme voie principale.
