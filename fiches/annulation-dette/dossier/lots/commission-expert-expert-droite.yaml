  id: R21
  statut: posee
tes_theses:
- id: T16
  question: Q45
  position: oui
  enonce: Un État doit rembourser sa dette, y compris envers la banque centrale, car il engage ses contribuables.
    Renoncer à une dette ferait perdre la confiance qui permet d'emprunter.
  arguments:
  - A7
  repond_a: []
  examen:
    pertinence:
      valeur: oui
      justification: A7 répond à la question du remboursement, banque centrale comprise (F28).
    appui:
      valeur: faible
      justification: La thèse ne contient que F28 (valeur, sans verdict) ; son présupposé factuel, la perte de confiance
        des prêteurs, n'est porté par aucune affirmation vérifiée (cf. F26, Pas d'estimation fiable).
    raisonnement:
      valeur: valide
      justification: La conclusion découle de la priorité affirmée (F28) ; la position date de décembre 2020 et
        ne vise pas la proposition d'août 2026, ce que A7 indique.
    portee:
      texte: établit la priorité donnée à la parole de l'État (F28) ; ne prouve pas qu'une annulation limitée à
        la banque centrale ferait perdre la confiance des prêteurs.
    objections:
      valeur: répondues
      justification: Aucune thèse ne répond à A7 (F28).
    conclusion: ne tient pas
  portee_par:
  - LR
- id: T25
  question: Q47
  position: non
  enonce: Pour dégager des marges, la voie préférable est de réduire la dépense publique et de viser un excédent
    primaire, rendu contraignant par une règle d'or. L'annulation ne traiterait pas la cause du déficit.
  arguments:
  - A8
  - A14
  repond_a: []
  examen:
    pertinence:
      valeur: oui
      justification: A8 et A14 comparent l'annulation aux économies (F30, F37), objet de Q47.
    appui:
      valeur: solide
      justification: 'Les présupposés factuels sont vérifiés : F22, F29, F30, F37, F38, F39 (Vrai), qui décrivent
        les plans et la charge de la dette.'
    raisonnement:
      valeur: lacune
      essentielle: false
      justification: Pour A8, la position sur l'annulation est déduite du silence du plan (F29, F30), ce que l'argument
        reconnaît ; A14 l'énonce explicitement (F37, F39).
    portee:
      texte: établit que les plans présentés en octobre 2026 font reposer l'effort sur les économies (F30, F37)
        ; ne prouve pas que tous les partis qui portent la thèse aient écarté l'annulation, ni que les économies
        prévues seraient obtenues (F38).
    objections:
      valeur: répondues
      justification: Aucune thèse ne répond à A8 ou A14 (F37).
    conclusion: tient en partie
  portee_par:
  - LR
  - RN
questions:
- Q41 (fait) Les traités européens permettent-ils d'annuler, ou de convertir en dette perpétuelle à taux nul, la
  dette française détenue par la Banque de France pour l'Eurosystème ?
- Q42 (estimation) Annuler ou geler cette dette ferait-il monter les taux auxquels la France emprunte ?
- Q43 (estimation) L'opération réduirait-elle durablement la charge d'intérêts de l'État, compte tenu des intérêts
  que la Banque de France reverse à l'État ?
- Q44 (estimation) Annuler ou geler cette dette affaiblirait-il la crédibilité de l'euro ou l'indépendance de la
  BCE ?
- Q45 (valeur) Un État doit-il rembourser intégralement sa dette, y compris quand le créancier est sa propre banque
  centrale ?
- Q46 (valeur) Les décisions sur la dette publique doivent-elles relever de la seule décision nationale plutôt que
  des règles européennes ?
- Q47 (valeur) Pour dégager des marges budgétaires, l'annulation d'une partie de la dette est-elle préférable aux
  économies, à la hausse des recettes ou à la recherche de croissance ?
