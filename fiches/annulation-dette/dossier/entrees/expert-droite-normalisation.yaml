agent: expert-droite
phase: 6
corrections:
  - vise: A7
    action: corriger
    normalise: true
    position: oui
    enonce: "Un État doit rembourser sa dette, y compris quand le créancier est la banque centrale : l'État engage son peuple, et renoncer à une dette ferait perdre la confiance qui permet d'emprunter."
    raisonnement: "Une dette est un engagement pris au nom des contribuables. Si l'État peut s'en délier, aucun engagement futur n'est crédible. Une dette lourde appelle une redéfinition des priorités de dépense, non sa disparition ; cette position date de décembre 2020 et ne porte pas sur la proposition d'août 2026."
    porte_par:
      - {personne: "Jean-François Husson", fonction: "sénateur, rapporteur de la commission des finances du Sénat", parti: LR, date: "2020-12-28", source: S21}
  - vise: A8
    action: corriger
    normalise: true
    position: non
    enonce: "Pour dégager des marges budgétaires, la voie retenue est de réduire la dépense publique et de viser un excédent primaire, plutôt que de toucher au stock de dette."
    raisonnement: "Le plan présenté le 12 octobre 2026 finance l'effort par des économies sur l'État et les dépenses sociales (F30), avec un déficit sous 3 % en 2031. Les marges viennent de la dépense maîtrisée. Le plan ne mentionne pas l'annulation : l'argument en est une lecture par le choix des moyens."
    porte_par:
      - {personne: "Bruno Retailleau", fonction: "candidat à l'élection présidentielle de 2027", parti: LR, date: "2026-10-12", source: S22}
  - {vise: A41, action: retirer, normalise: true}
  - {vise: A42, action: retirer, normalise: true}
