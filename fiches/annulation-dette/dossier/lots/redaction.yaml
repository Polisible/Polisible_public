  arguments:
  - id: A13
    auteur: extreme-droite
    question: Q43
    position: non
    enonce: Annuler ou geler cette dette réduirait la charge d'intérêts de l'État de moins que son montant brut,
      car une part des intérêts revient à l'État par l'impôt et le dividende de la Banque de France. Aucune source
      du dossier ne chiffre ce recul.
    raisonnement: 'L''État est à la fois débiteur (intérêts payés) et bénéficiaire du résultat de la Banque de France
      (dividende, impôt sur les bénéfices). Si les intérêts disparaissent, le résultat de la Banque de France baisse
      d''autant, donc ses versements à l''État aussi : sur l''ensemble État plus Banque de France, le gain serait
      faible ou nul. La Banque de France verse déjà à l''État des montants importants (36,8 Md€ depuis 2015), qui
      seraient réduits.'
    porte_par: '**Jordan Bardella** (président du Rassemblement national, RN), 23 août 2026 [S29]'
    repond_a: null
    affirmations:
    - 'F41 [estimation, Pas d''estimation fiable] Les intérêts que l''État paie à la Banque de France sur les titres
      qu''elle détient contribuent à son résultat, dont une part revient à l''État (dividende et impôt). — La seule
      source (site de niveau 4, analyse assistée par IA, 24 août 2026) est non conforme : elle rapporte un argument
      de Jordan Bardella sans établir le mécanisme ni mentionner l''impôt. Les documents de la Banque de France
      au dossier (F19, F20, F21) établissent que la Banque verse un impôt et des dividendes à l''État et que son
      revenu monétaire est partagé dans l''Eurosystème, mais aucune source rattachée n''isole la part due aux intérêts
      sur les titres de l''État. (sources S29)'
    - F19 [fait, Vrai] Pour l'exercice 2025, la Banque de France verse un impôt sur les bénéfices de 1,5 milliard
      d'euros avant d'atteindre un résultat net de 8,1 milliards (Q43). (sources S7)
    - 'F20 [fait, Vrai] La Banque de France est un contributeur au budget de l''État : 36,8 milliards d''euros versés
      depuis 2015 (Q43). (sources S7)'
  - id: A23
    auteur: gauche-radicale
    question: Q43
    position: nuance
    enonce: L'opération allège d'abord le stock de dette et le besoin de refinancement sur les marchés. L'économie
      annuelle d'intérêts est moindre, car la Banque de France reverse une partie de ses bénéfices à l'État.
    raisonnement: 'Les intérêts versés à la Banque de France reviennent en partie à l''État par ses bénéfices (F18,
      F19, F20), flux variable (F21) : l''économie nette d''intérêts est donc moindre que l''économie brute. Mais
      l''Eurosystème ne réinvestit plus les titres arrivés à échéance (F48) ; sans conversion, l''État devrait remplacer
      ces titres par de la dette de marché au taux du moment, alors que la charge de la dette est déjà de 65,7 milliards
      en 2025 (F22). Le gel en dette perpétuelle vise à soulager les États de cette charge (F50).'
    porte_par: '**Jean-Luc Mélenchon** (député, LFI), 11 mai 2020 [S39, S19]; **Jean-Luc Mélenchon** (candidat à
      l''élection présidentielle de 2027, LFI), 25 août 2026 [S19]'
    repond_a: null
    affirmations:
    - F48 [fait, Vrai] Les réinvestissements des titres arrivant à échéance au titre du programme d'achats d'urgence
      pandémique (PEPP) de l'Eurosystème ont pris fin à la fin de 2024. (sources S42)
    - F50 [fait, Vrai] Le gel en dette perpétuelle de titres détenus par la banque centrale a pour objectif de soulager
      les États de la charge de la dette. (sources S39)
    - F18 [fait, Vrai] Le 24 mars 2026, la Banque de France annonce un bénéfice net de 8,1 milliards d'euros pour
      l'exercice 2025 (Q43). (sources S8)
    - F19 [fait, Vrai] Pour l'exercice 2025, la Banque de France verse un impôt sur les bénéfices de 1,5 milliard
      d'euros avant d'atteindre un résultat net de 8,1 milliards (Q43). (sources S7)
    - 'F20 [fait, Vrai] La Banque de France est un contributeur au budget de l''État : 36,8 milliards d''euros versés
      depuis 2015 (Q43). (sources S7)'
    - F21 [fait, Vrai] La Banque de France, contributrice nette au partage du revenu monétaire entre 2015 et 2022,
      est devenue bénéficiaire nette en 2023-2024 (Q43). (sources S9)
    - F22 [fait, Vrai] En 2025, la charge de la dette de l'ensemble des administrations publiques atteint 65,7 milliards
      d'euros, soit 2,2 points de PIB (Cour des comptes, juin 2026) (Q43). (sources S11)
  - id: A24
    auteur: gauche-radicale
    question: Q43
    position: oui
    enonce: L'annulation de la part détenue par la banque centrale dégagerait immédiatement des marges financières,
      sans montant chiffré. Le gain net pour l'État dépend des reversements de la Banque de France, qui varient
      d'une année à l'autre.
    raisonnement: La charge d'intérêts de la dette publique est élevée (F22) et la part détenue par la banque centrale
      est ancienne et sans remboursement attendu. L'annuler ou la geler en dette perpétuelle supprime le service
      et le principal de ces titres, d'où des marges financières immédiates (F49).
    porte_par: '**Fabien Roussel** (député, PCF), 22 mars 2021 [S41, S52]'
    repond_a: null
    affirmations:
    - F49 [estimation, Pas d'estimation fiable] L'annulation de la part de la dette détenue par la banque centrale
      dégagerait immédiatement des marges financières importantes pour l'État. — La seule source est l'intervention
      de Fabien Roussel à l'Assemblée nationale (22 mars 2021), sans chiffrage ni méthode. Aucune estimation d'institution
      sur les marges que dégagerait l'annulation n'est au dossier. (sources S41)
    - F22 [fait, Vrai] En 2025, la charge de la dette de l'ensemble des administrations publiques atteint 65,7 milliards
      d'euros, soit 2,2 points de PIB (Cour des comptes, juin 2026) (Q43). (sources S11)
