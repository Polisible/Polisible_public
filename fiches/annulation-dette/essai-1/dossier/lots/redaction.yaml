  - id: A16
    auteur: expert-ecologistes
    question: Q1
    position: nuance
    enonce: 'La conclusion de A2 repose sur une lecture de l''article 123 que la Cour de justice a écartée : Thierry
      Bonneau juge l''annulation prohibée parce qu''il estime que les achats sur le marché secondaire méconnaissent
      déjà l''article 123, contrairement à l''arrêt Weiss. Pour qui suit la jurisprudence de la Cour, le texte n''interdit
      pas l''annulation et l''esprit invoqué est contesté, mais cette lecture n''est pas celle de la BCE.'
    porte_par:
    - qui: Jérôme Gleizes, économiste, chronique dans Politis (14 septembre 2026), à titre personnel
      source: S7
    repond_a: A2
    statut: ouvert
    affirmations:
    - id: F37
      enonce: Dans son analyse de 2021, Thierry Bonneau écrit que l'article 123 du TFUE a une portée plus large
        que celle admise par la jurisprudence de la Cour de justice de l'Union européenne, et renvoie en sens contraire
        à l'arrêt Weiss du 11 décembre 2018.
      type: fait
      verdict: Vrai
      explication: 'Le texte de Thierry Bonneau (Club des Juristes, 11 février 2021) contient l''extrait : l''article
        123 « n''a donc pas une portée aussi limitée que celle admise par la jurisprudence ». La phrase précédente
        renvoie « contra » à « CJUE, 11 décembre 2018, point 101 et s. », arrêt que l''auteur identifie plus haut
        comme l''affaire C-493/17, Weiss. La conclusion porte sur les achats de la BCE sur le marché secondaire,
        analysés par l''auteur comme des opérations de crédit.'
      sources:
      - source: S4
        extrait: L’article 123 du Traité n’a donc pas une portée aussi limitée que celle admise par la jurisprudence.
        statut_source: conforme
    - id: F38
      enonce: Jérôme Gleizes écrit, dans Politis le 14 septembre 2026, que rien n'empêche la BCE de racheter une
        créance déjà émise sur le marché secondaire, ce qu'il rapproche du programme d'achats d'actifs (QE) pratiqué
        depuis 2015.
      type: fait
      verdict: Vrai
      explication: 'La chronique de Jérôme Gleizes (Politis, 14 septembre 2026) contient l''extrait exact. L''auteur
        ajoute aussitôt : « c''est le Quantitative Easing (QE), pratiqué massivement depuis 2015 ». L''énoncé rapporte
        fidèlement ce que l''auteur écrit.'
      sources:
      - source: S7
        extrait: Mais rien ne l’empêche de racheter la créance, une fois émise sur le marché secondaire, à qui l’a
          achetée en premier
        statut_source: conforme
    - id: F7
      enonce: L'article 123 du TFUE interdit les crédits consentis aux États et l'acquisition directe de leurs titres
        de dette par la BCE et les banques centrales nationales ; il n'interdit pas, dans son texte, les achats
        sur le marché secondaire.
      type: fait
      verdict: Vrai
      explication: Le texte de l'article 123 (S8, S16) interdit les crédits et « l'acquisition directe » ; il ne
        vise pas le marché secondaire, ce que relève aussi Thierry Bonneau (S4). La jurisprudence de la CJUE (Weiss,
        S14) encadre toutefois ces achats, d'où l'importance de garder « dans son texte ».
      sources:
      - source: S4
        extrait: l’article 123 du TFUE interdit seulement les crédits consentis aux États et l’acquisition directe,
          auprès d’eux, des instruments de leur dette.
        statut_source: conforme
