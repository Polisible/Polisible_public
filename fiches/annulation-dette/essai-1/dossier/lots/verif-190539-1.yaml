- id: F30
  enonce: L'article 123 §1 du TFUE interdit à la BCE et aux banques centrales nationales d'accorder des découverts
    ou tout autre crédit aux administrations centrales, et interdit aussi l'acquisition directe de leurs titres
    de dette auprès d'elles.
  type: fait
  sources:
  - source: S16
    niveau: 1
    statut: conforme
    note_verif: 'Bon document (TFUE, article 123, JO C 202 du 7.6.2016). F25 : extrait présent mot pour mot, et
      le texte de l''article (court, lu en entier par recherche) ne contient aucune mention de l''annulation, ce
      qui appuie la seconde partie. F30 : extrait présent mot pour mot dans le paragraphe 1, qui contient aussi
      l''interdiction d''acquisition directe, même périmètre.'
    extrait: Il est interdit à la Banque centrale européenne et aux banques centrales des États membres, ci-après
      dénommées "banques centrales nationales", d'accorder des découverts ou tout autre type de crédit aux institutions,
      organes ou organismes de l'Union, aux administrations centrales
- id: F31
  enonce: En juin 2020, Fabio Panetta, membre du directoire de la BCE, a déclaré qu'acheter des obligations souveraines
    et décider de ne pas en demander le remboursement serait du financement monétaire.
  type: fait
  sources:
  - source: S18
    niveau: 1
    statut: conforme
    note_verif: 'Bon document (« Entretien avec Le Monde », site de la BCE, daté du 16 juin 2020 dans les métadonnées).
      F31 : extrait présent mot pour mot, en réponse à une question sur l''annulation des dettes détenues par la
      BCE, même sens ; le nom de Fabio Panetta n''a pas été recherché dans la page, il est repris du titre annoncé.'
    extrait: Si nous achetions des obligations souveraines et décidions de ne pas demander leur remboursement, ce
      serait du financement monétaire.
- id: F32
  enonce: Dans une lettre de 2021, la BCE a écrit que l'annulation de dettes publiques par la BCE n'est pas compatible
    avec les traités, car elle enfreindrait l'interdiction du financement monétaire de l'article 123.
  type: fait
  sources:
  - source: S1
    niveau: 1
    statut: conforme
    note_verif: 'Bon document : lettre de Christine Lagarde à Manon Aubry, datée du 5 février 2021 (L/CL/21/22).
      F1, F22, F32 : extrait présent mot pour mot, même sens (incompatibilité avec les traités au titre de l''article
      123 TFUE).'
    extrait: l'annulation de dettes publiques par la BCE n'est pas compatible avec les traités, car elle enfreindrait
      l'interdiction du financement monétaire énoncée à l'article 123 du traité sur le fonctionnement de l'Union
      européenne.
- id: F33
  enonce: Une tribune de septembre 2020, signée notamment par les eurodéputés S&D Aurore Lalucq et Raphaël Glucksmann,
    affirme que l'annulation de la dette détenue par la BCE est possible en vertu des traités européens.
  type: fait
  sources:
  - source: S19
    niveau: 3
    statut: conforme
    note_verif: 'Bon document (tribune du JDD, signataires dont Aurore Lalucq et Raphaël Glucksmann, eurodéputés
      S&D) ; la date de septembre 2020 n''apparaît pas dans les métadonnées et n''a pas été confirmée. F33 : extrait
      présent mot pour mot, même sens (annulation de la dette détenue par la BCE présentée comme possible en vertu
      des traités) ; la liste des signataires inclut aussi des eurodéputés écologistes, d''où le « notamment » justifié.'
    extrait: Cette solution est non seulement possible en vertu des traités européens mais, surtout, c’est la seule
      qui nous permette de sortir de cette crise sans risquer d’en déclencher une nouvelle.
