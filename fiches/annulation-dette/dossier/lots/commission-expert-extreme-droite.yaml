  id: R32
  statut: posee
tes_theses:
- id: T31
  question: Q43
  position: nuance
  enonce: Annuler ou geler cette dette réduirait la charge d'intérêts de l'État de moins que son montant brut, car
    une part des intérêts revient à l'État par l'impôt et le dividende de la Banque de France. Aucune source ne
    chiffre ce recul.
  arguments:
  - A13
  repond_a: []
  examen:
    pertinence:
      valeur: oui
      justification: A13 porte sur la charge d'intérêts compte tenu des reversements de la Banque de France (F19,
        F20), objet de Q43.
    appui:
      valeur: partiel
      justification: Les versements à l'État sont établis (F19, F20, Vrai) ; leur dépendance aux intérêts perçus
        repose sur F41 (Pas d'estimation fiable), rendue plausible par la résolution de l'objection O1 (S9) et non
        chiffrée selon la réponse à R7 ; l'énoncé ne chiffre rien, F41 ne porte donc pas seul la thèse.
    raisonnement:
      valeur: lacune
      essentielle: false
      justification: Le raisonnement de A13 affirme encore que le résultat baisse « d'autant » et que le gain serait
        « faible ou nul », plus que ne portent F19, F20 et F41 et que l'effet « à due concurrence » écarté par O1
        ; la conclusion de l'énoncé, limitée à « moins que le montant brut », n'en dépend pas.
    portee:
      texte: établit que la Banque de France verse impôt et dividendes à l'État (F19, F20) et rend plausible que
        ces versements dépendent en partie des intérêts perçus (F41) ; ne prouve pas l'ampleur du recul, ni que
        le gain serait faible ou nul.
    objections:
      valeur: répondues
      justification: Aucun argument d'une autre thèse ne vise le raisonnement de A13 ; l'objection O1 du vérificateur
        sur F41 est résolue sans changer son verdict.
    conclusion: tient en partie
  portee_par:
  - RN
- id: T23
  question: Q46
  position: oui
  enonce: Les choix budgétaires doivent relever des Français, par la primauté du droit national et une règle d'or
    adoptée par référendum. La règle proposée plafonne le déficit et n'autorise pas à ne pas honorer la dette.
  arguments:
  - A15
  repond_a: []
  examen:
    pertinence:
      valeur: oui
      justification: A15 porte sur le niveau de décision, national ou européen (F39, F40), objet de Q46.
    appui:
      valeur: solide
      justification: 'Les présupposés factuels sont vérifiés : F39 (Vrai) et F40 (Plutôt vrai, la formule de l''AFP
        étant proche du texte de la proposition).'
    raisonnement:
      valeur: valide
      justification: De la priorité donnée à la décision nationale (F40) et à la discipline budgétaire (F39), la
        conclusion découle, sans en tirer plus.
    portee:
      texte: établit que la règle d'or par référendum et la primauté de la Constitution sont proposées (F39, F40)
        ; ne prouve pas que ces propositions s'appliqueraient à des titres détenus par l'Eurosystème.
    objections:
      valeur: répondues
      justification: Aucun argument d'une autre thèse ne vise le raisonnement de A15 (F39).
    conclusion: tient
  portee_par:
  - RN
  contre_examen:
  - critere: conclusion
    avis: confirme
    justification: 'Examen confirmé : présupposés vérifiés (F39 Vrai, F40 Plutôt vrai), conclusion limitée à ce
      qu''ils portent ; la portée signale que les propositions ne visent pas les titres de l''Eurosystème.'
    proposition: null
